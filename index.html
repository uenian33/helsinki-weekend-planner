Casa Largo, Dagmar, Eka, Emo, O´Malleys, Rodolfo\n\n25.-29.8.2026\n\n16.00-21.00\n\nVapaa pääsy, pintxot 3,60€/kpl","c":"Participate","cs":["festivals","food"],"img":"https://api.hel.fi/linkedevents/media/images/pintxotausta2026_NHoEh7B.jpeg","u":"http://www.pintxo.fi/","ue":"http://www.pintxo.fi/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agptcxmope","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp5x32vvu","t":"Viapori Jazz: Saariston lintuja, valokuvanäyttely","te":"Viapori Jazz: Birds of the Archipelago","v":"Myllysali","ve":"Myllysali hall","a":"Suomenlinna B 17","la":60.14463,"ln":24.98378,"s":720,"e":1200,"d":"A visit to Viapori Jazz is also a small journey into the birdlife of the Baltic Sea archipelago.\n\nOn the islets west of the Suomenlinna ferry route, you may spot common eiders, tufted ducks, mergansers, and five different species of gulls. The area is also home to rarer birds, including the common shelduck, little gull, red-necked phalarope, and Steller's eider.\n\nTogether with the John Nurminen Foundation, Viapori Jazz invites you to pause for a moment to admire the beauty of the Baltic Sea's birdlife while reflecting on the fragile and vulnerable environment these birds call home.\n\nThroughout the festival, you are warmly invited to visit Birds of the Archipelago, a stunning photography exhibition by archipelago photographer Raimo Sundelin. \n\nThe exhibition is located in the Korppukuivaamo Passage leading to Tenalji von Fersen. \n\nKorppukuivaamo Passage, Suomenlinna\n\n25.-29.8.2026\n\nTue 25.8. at 16.00-19.00\n\nWed 26.8. at 18.00-19.00\n\nThu 27.8. at 17.00-19.00\n\nFri 28.8. at 17.30-18.30\n\nSat 29.8. at 15.00-16.00 & 19.00-20.00\n\nFree admission, no concert ticket is required","df":"Matkasi Viapori Jazziin on myös pieni linturetki Itämeren luontoon. \n\nSuomenlinnan lauttareitin länsipuolisilla luodoilla voit nähdä haahkoja, sotkia, koskeloita ja viisi lajia lokkeja. Myös ristisorsa, pikkukajava, isovesipääsky ja allihaahka kuuluvat jazzvierailusi linnustoon.\n\nJohn Nurmisen Säätiö ja Viapori Jazz haluavat yhdessä pysäyttää sinut hetkeksi ihastelemaan Itämeren linnuston kauneutta ja samalla voit pohtia sen haavoittuvuutta.\n\nPääset näkemään koko festivaalin ajan ja ilman pääsylippua saaristovalokuvaaja Raimo Sundelinin Saariston lintuja -näyttelyyn Tenalji von Ferseniin johtavassa Korppukuivaamon käytävässä.\n\nKorppukuivaamon käytävä\n\n25.-29.8.2026\n\n25.8. ti 16.00-19.00\n\n26.8. ke 18.00-19.00\n\n27.8. to 17.00-19.00\n\n28.8. pe 17.30-18.30\n\n29.8. la klo 15.00-16.00 ja 19.00-20.00\n\nVapaa pääsy","c":"Visual arts","cs":["nature","photography exhibitions","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Saariston_linnut__edit_merimetso_4.jpg","u":"https://viaporijazz.fi/","ue":"https://viaporijazz.fi/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp5x32vvu","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:69659","t":"Laura Laurila: Vihreä Kaupunki","te":"Laura Laurila: Vihreä Kaupunki","v":"Malmitalo","ve":"Cultural Centre Malmitalo","a":"Ala-Malmin tori 1","la":60.25051,"ln":25.01497,"s":720,"e":1200,"d":"Näyttelyn avajaiset järjestetään Malmitalolla ti 25.8. klo 17–19. Tervetuloa!\n\nLaura Laurilan näyttely Vihreä kaupunki käsittelee kaupunkiluontoa ja rakentamista poimien tarkasteluun havaintoja asuinympäristöstä. Laurilaa kiinnostaa kuinka rakennettu ympäristö kommunikoi viheralueiden kanssa. Näyttelyn nimiteos kuvaa maisemaa Töölönlahden puistosta, jossa kaupunkilaisia ilahduttavat kesäisin runsaat niittykukkaistutukset. Laurila löytää kauneutta myös arkisista paikoista ja näkymistä, ränsistyvistä rakennuksista ja rikkakasveista. Kaupunkiluonto ei ole vain esteettinen lisä rakennusten välissä – se on elintärkeä osa ekosysteemiä, joka puhdistaa ilmaa, vähentää melua ja lisää elämänlaatua. Teoksillaan Laurila haluaa herättää kysymyksen kuinka voisimme ottaa paremmin huomioon luonnon monimuotoisuuden ja säästää arvokkaita virkistysalueita rakennusprosesseissa.\n\nLaurila maalaa akryylimusteilla ja -maaleilla kankaalle maisemamaalauksen perinteeseen pohjautuvia teoksia, jotka tavoittelevat jotain ajatusta tai tunnetta, joka hänelle syntyi maiseman äärellä. Akryylimusteiden värikylläisyys ja läpikuultavuus mahdollistaa erilaisten pintojen luomisen ja akvarellimaisen työskentelyn. Laurila on kiinnostunut kolorismista ja väri-ilmaisusta. Laurilan teokset kuvaavat jonkin paikan lisäksi usein tiettyä vuoden- tai vuorokaudenaikaa.\n\nLaura Laurila (s. 1980) asuu ja työskentelee Tampereella.","df":"Näyttelyn avajaiset järjestetään Malmitalolla ti 25.8. klo 17–19. Tervetuloa!\n\nLaura Laurilan näyttely Vihreä kaupunki käsittelee kaupunkiluontoa ja rakentamista poimien tarkasteluun havaintoja asuinympäristöstä. Laurilaa kiinnostaa kuinka rakennettu ympäristö kommunikoi viheralueiden kanssa. Näyttelyn nimiteos kuvaa maisemaa Töölönlahden puistosta, jossa kaupunkilaisia ilahduttavat kesäisin runsaat niittykukkaistutukset. Laurila löytää kauneutta myös arkisista paikoista ja näkymistä, ränsistyvistä rakennuksista ja rikkakasveista. Kaupunkiluonto ei ole vain esteettinen lisä rakennusten välissä – se on elintärkeä osa ekosysteemiä, joka puhdistaa ilmaa, vähentää melua ja lisää elämänlaatua. Teoksillaan Laurila haluaa herättää kysymyksen kuinka voisimme ottaa paremmin huomioon luonnon monimuotoisuuden ja säästää arvokkaita virkistysalueita rakennusprosesseissa.\n\nLaurila maalaa akryylimusteilla ja -maaleilla kankaalle maisemamaalauksen perinteeseen pohjautuvia teoksia, jotka tavoittelevat jotain ajatusta tai tunnetta, joka hänelle syntyi maiseman äärellä. Akryylimusteiden värikylläisyys ja läpikuultavuus mahdollistaa erilaisten pintojen luomisen ja akvarellimaisen työskentelyn. Laurila on kiinnostunut kolorismista ja väri-ilmaisusta. Laurilan teokset kuvaavat jonkin paikan lisäksi usein tiettyä vuoden- tai vuorokaudenaikaa.\n\nLaura Laurila (s. 1980) asuu ja työskentelee Tampereella.","c":"Visual arts","cs":["Malmitalo","Näyttelyt","Suomi","Ruotsi","Englanti","Kaupunkiuudistusalueet"],"img":"http://www.malmitalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_796316.jpg","u":"http://www.malmitalo.fi/fi/tapahtumat/event/22B49B968125BD1BFC7CF8E062E62AC3/Laura_Laurila_Vihrea_Kaupunki","ue":"http://www.malmitalo.fi/en/events/event/22B49B968125BD1BFC7CF8E062E62AC3/Laura_Laurila_Vihrea_Kaupunki","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:69659","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agqd4adp3i","t":"Hong Liu-Sertti: Kalevalan uudelleentulkinta","te":"Hong Liu-Sertti: Reinterpreting Kalevala","v":"Galleria Kookos","ve":"Galleria Kookos","a":"Pohjoinen Rautatiekatu 17","la":60.1706,"ln":24.92979,"s":720,"e":1200,"d":"This exhibition continues the body of work presented in Hyvinkää in 2025, returning to the Finnish national epic Kalevala from a contemporary artistic perspective. \n\nRather than directly illustrating the stories of the epic, the works reinterpret its myths, characters, and cultural memory through images, materials, and personal experience.\n\n“Reinterpreting Kalevala” is both a way of looking again at a classical text and a reflection on identity, memory, and tradition. \n\nIn Helsinki, the works encounter a new context and contemporary cultural experience, inviting viewers to rediscover the Kalevala and consider its meanings today.\n\nGalleria Kookos, Studio\n26.8.–5.9.2026\nTue-Fri 13.00-18.00\n\nSat 13.00-17.00\nFree entry","df":"Näyttely jatkaa Hyvinkäällä vuonna 2025 esillä olleiden teosten kokonaisuutta ja palaa Kalevalaan nykytaiteen näkökulmasta. \n\nTeokset eivät toisinna eepoksen tarinoita sellaisinaan, vaan tulkitsevat uudelleen sen myyttejä, henkilöhahmoja ja kulttuurista muistia kuvien, materiaalien ja henkilökohtaisten kokemusten kautta.\n\n”Uudelleentulkinta” tarkoittaa sekä klassisen tekstin uudelleen tarkastelua että identiteetin, muistin ja perinteen uudelleen pohtimista. \n\nHelsingissä teokset kohtaavat uuden ympäristön ja nykyhetken kulttuurisen kokemuksen ja kutsuvat katsojan löytämään Kalevalasta uusia, ajankohtaisia merkityksiä.\n\nGalleria Kookos, Studio\n26.8.–5.9.2026\nTi-pe 13.00-18.00\n\nLa 13.00-17.00\nVapaa pääsy","c":"Visual arts","cs":["fine arts","art","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Hong-Liu-Sertti-invitation1.jpg","u":"https://www.galleriakookos.fi/hong-liu-sertti-reinterpreting-kalevala/","ue":"https://www.galleriakookos.fi/hong-liu-sertti-reinterpreting-kalevala/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agqd4adp3i","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agqchhahf4","t":"Pihapuuhat","te":"Pihapuuhat","v":"Leikkipuisto Kannelmäki","ve":"Playground Kannelmäki","a":"Kanneltie 1a","la":60.24144,"ln":24.88022,"s":720,"e":1200,"d":"Tervetuloa leikkipuiston pihaan taiteilemaan, leikkituokioon, jumppaamaan ja tapaamaan muita perheitä. Tuokio klo 10-11 vaihtuvin teemoin.","df":"Tervetuloa leikkipuiston pihaan taiteilemaan, leikkituokioon, jumppaamaan ja tapaamaan muita perheitä. Tuokio klo 10-11 vaihtuvin teemoin.","c":"Participate","cs":["families with children","outdoor recreation","playing (children's games)","playgrounds","physical training"],"img":"https://api.hel.fi/linkedevents/media/images/ulkoilla_38516.png","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agqchhahf4","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agqchhahf4","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agqchhahf4","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agqefsvxhq","t":"Duncan Butt Juvonen ja Emilia Pennanen","te":"Duncan Butt Juvonen and Emilia Pennanen","v":"HAA Galleria","ve":"HAA Gallery","a":"Suomenlinna C 1","la":60.14882,"ln":24.98529,"s":720,"e":1200,"d":"Duncan Butt Juvonen: The Sea, The Sea (Hall 1) and Emilia Pennanen: Earthed and waterborne (Petrichor) (Hall 2)\n\nDuncan Butt Juvonen's show addresses the passage of time, death and decay, offest with brightly coloured walls and Op Art stripes. \n\nThe images in this show are glitched, obscured. The colours are sucked out, bleached out of the pictures, washed off and abraded like something washed up on the shore. The messages are incomplete, the information decayed and interrupted. A deer smokes a pipe and contemplates a body of water. \n\nIn contrast to the decay and sapped colours, the black and white Op Art stripes create queasy waves of colour in the viewer’s eye where there is no colour. \n\nEmilia Pennanen's exhibition is rooted in the experience of a place where a twin flame burns. The twin flame (or mirror self) is a myth based on a single soul divided into two separate bodies. According to the original myth, humans were made of a single body with two heads, four arms, and four legs, until Zeus split them in two; thereafter, each half wandered the earth in search of its missing counterpart. \n\nThe exhibition consists of mixed-media photographic sculptures in which the act of seeing a landscape—and the physical and emotional experience of a place—transforms into a new location, a kind of reverie or its very opposite. \n\nHAA Galleria\n\n28.8.-19.9.2026\n\nFree entry","df":"Duncan Butt Juvonen: The Sea, The Sea (Sali 1) ja Emilia Pennanen: Maastatullut ja veteensyntynyt (Petrichor) (Sali 2) \n\nDuncan Butt Juvosen näyttely käsittelee ajan kulumista, kuolemaa ja rappeutumista, ja sitä täydentävät kirkkaanväriset seinät ja puhtaat op art -raidat. \n\nNäyttelyn kuvat ovat vääristyneitä, himmeitä. Värit on imetty pois, haalistuneet kuvista, pesty pois ja hiottu kuin jokin rannalle huuhtoutunut. Viestit ovat epätäydellisiä, informaatio rappeutunutta ja keskeytynyt. Peura polttaa piippua ja katselee vesistöä. \n\nRapistumisen ja vanhentuneiden värien vastakohtana mustavalkoiset optiset taideraidat luovat katsojan silmiin pahoinvoivia väriaaltoja sinne, missä väriä ei ole. \n\nEmilia Pennasen näyttely pohjautuu kokemukseen paikasta, jonka sisällä sykkii kaksoisliekki. Kaksoisliekki (twin flame/mirror self) on myytti yhdestä sielusta, joka on jakautunut kahteen erilliseen kehoon. Alkuperäisen myytin mukaan ihmiset muodostuivat yhdestä kehosta, jolla oli kaksi päätä, neljä kättä, neljä jalkaa, kunnes Zeus jakoi heidät kahtia, jolloin kumpikin puolisko jäi vaeltamaan maapallolla etsien puuttuvaa osaansa. \n\nNäyttely muodostuu monimateriaalisista valokuvaveistoksista, jossa maiseman näkeminen, paikan fyysinen ja emotionaalinen kokeminen muuttuu uudeksi paikaksi, eräänlaiseksi haavekuvaksi – tai sen vastakohdaksi. \n\nHAA Galleria\n\n28.8.-19.9.2026\n\nVapaa pääsy","c":"Visual arts","cs":["art","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Yhdistetyt-Juvonen-Pennanen_lb4GDva.jpg","u":"https://www.helsingintaiteilijaseura.fi/nayttelytoiminta/haa-galleria","ue":"https://www.helsingintaiteilijaseura.fi/en/galleries/haa-gallery","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agqefsvxhq","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp7lf4oni","t":"SYÖ!-viikot elokuu/2026","te":"SYÖ! Weeks August 2026","v":"Helsinki","ve":"Helsinki","a":"","la":60.17083,"ln":24.9375,"s":720,"e":1200,"d":"City Magazine's legendary restaurant festival.\n\nDuring SYÖ! Weeks, restaurants across Finland serve top-quality dishes for just €12 for two weeks. Gather your friends and join in to SYÖ (eat)!\n\nHelsinki / Finland\n\n28.8.–10.9.2026\n\nFree entry, portions 12€","df":"SYÖ!-viikoilla ravintolat ympäri Suomen tarjoavat huippuannoksia vain 12 eurolla kahden viikon ajan. Kerää ystävät kasaan ja liity mukaan SYÖmään!\n\nHelsinki / Suomi\n\n28.8.–10.9.2026\n\nVapaa pääsy, annokset 12€","c":"Participate","cs":["food"],"img":"https://api.hel.fi/linkedevents/media/images/taustakuva_eCjh3yF.png","u":"https://syoviikot.fi/","ue":"https://syoviikot.fi/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp7lf4oni","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpph4lnzu","t":"Ánnámáret: Bálvvosbáiki","te":"Ánnámáret: Bálvvosbáiki","v":"Kiasma-teatteri","ve":"Kiasma-teatteri","a":"Mannerheiminaukio 2","la":60.17204,"ln":24.93675,"s":720,"e":1200,"d":"Bálvvosbáiki is an audiovisual concert in which the Sámi yoiks (luohtis) performed by Ánnámáret intertwine with Turkka Inkilä’s nuanced electronic music, Ilkka Heinonen’s gritty and partially effected jouhikko, and Marja Viitahuhta’s video art combining animation, archival footage, and material filmed in Sápmi.\n\nThe luohtis reflect how the Sámi worldview manifests in the present day, while the concert also touches on themes of colonialism and environmental awareness. Are the female deities Sáráhkka, Juhksáhkka and Uksáhkka still present? Can the power of a sieidi be experienced through yoiking? What does intergenerational sorrow feel like?\n\nThe concert is part of Kiasma's We Who Remain - Sámi Art in Focus exhibition's programme.\n\nTicket includes admission to Kiasma's exhibitions on the day of the performance.","df":"Bálvvosbáiki on audiovisuaalinen konsertti, jossa Ánnámáretin joikaamat luohtit kietoutuvat yhteen Turkka Inkilän vivahteikkaan elektronisen musiikin, Ilkka Heinosen rouhean ja osin efektoidun jouhikon ja Marja Viitahuhdan animaatioita, arkistokuvia ja Saamenmaalla kuvattua materiaalia yhdistävän videotaiteen kanssa. \n\nLuohtit havainnoivat miten saamelainen maailmankuva ilmenee tässä ajassa, konsertin koskettaessa myös kolonialismin ja ympäristötietoisuuden teemoja. Ovatko naisjumalat Sáráhkka, Juhksáhkka ja Uksáhkka yhä läsnä? Voiko seidan voiman kokea joikaamalla? Miltä ylisukupolvinen suru tuntuu?\n\nKonsertti on osa Kiasman Entiset ainoat - saamelaisen taiteen aika -näyttelyn ohjelmistoa. \n\nKonserttilippuun sisältyy pääsy Kiasman näyttelyihin esityspäivänä.","c":"Music","cs":["concerts","music","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/Annamaret.jpg","u":"https://kiasma.fi/musiikki/annamaret_balvvosbaiki/","ue":"https://kiasma.fi/en/music/annamaret-balvvosbaiki/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpph4lnzu","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp5nc5kfu","t":"Blick Théâtre: Kahina","te":"Blick Théâtre: Kahina","v":"Kolmikulma - Dianapuisto","ve":"Kolmikulma - Diana park","a":"Kolmikulma","la":60.16504,"ln":24.9434,"s":720,"e":765,"d":"Two survivors of a disaster follow a faint signal from a distant radio, when suddenly Maahinen appears. This mischievous troll guards his territory scattering clues and pranks in the path.\n\nAre humans capable of listening to the wordless beings with whom they share the world? Can they reconcile with the animal side within themselves? \n\nAn ecological fable inspired by Nordic legends, Kahina blends visual theatre, circus and puppetry. \n\nWith humour and poetry, French Blick Théâtre weaves a new mythology, where the fantasy whispers in the ear of the living.\n\nKolmikulma Park\n\n29.8.2026\n\n12.00-12.45\n\nFree entry, non-verbal","df":"Ranskalaisen Blick Théâtren visuaalista teatteria, sirkusta ja nukketeatteria yhdistävä ekologinen satu ammentaa pohjoisen legendoista ja punoo huumorin ja runouden keinoin uuden myytin, jossa metsänpeitto kuiskii elollisille suunnan eteenpäin. \n\nKolmikulma\n\n29.8.2026\n\n12.00-12.45\n\nVapaa pääsy, sanaton","c":"Theatre","cs":["street theatre","theatre (art forms)","cultural events","puppet theatres"],"img":"https://api.hel.fi/linkedevents/media/images/BraspartsStephane-Marchand-900x600_IFsQfKR.jpg","u":"https://sampofestival.fi/","ue":"https://sampofestival.fi/en/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"12:00-12:45","n":0,"nn":0,"i":"helsinki:agp5nc5kfu","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp3ptqlie","t":"Työpaja: Muotoillaan äitiä - palvelumuotoilun keinoin","te":"Työpaja: Muotoillaan äitiä - palvelumuotoilun keinoin","v":"Rikhardinkadun kirjasto","ve":"Rikhardinkatu Library","a":"Rikhardinkatu 3","la":60.16634,"ln":24.94678,"s":720,"e":840,"d":"Äidit muotoilevat elämää. Mutta nyt on äitisuhteen vuoro olla muotoilun kohteena. \n\nOsallistu Helsinki Design Week -tapahtuman aikana työpajaan osana Jonna Mannilan muotoilun maisteriohjelman opinnäytetyötä. Työpajassa tehdään pieni, kevyt harjoitus ja muotoillaan aikuisen lapsen äitisuhdetta palvelumuotoilun keinoin. \n\nOnko sinulla äiti? Oletko kenties itse aikuisten lasten äiti? Työpaja on tarkoitettu sinulle, jolla on äiti tai sinulle, jolla on jo aikuisia lapsia. Ikäraja on 18 vuotta. \n\nVoiko äidin toimittamaa palvelua muotoilemalla parantaa? Millaiseksi aikuisen lapsen ja äidin suhde muuttuisi, jos aiemmin orgaanisesti muodostunut palvelu muotoiltaisiin uudelleen, yhdessä käyttäjän kanssa? Entä miten palveluun pitäisi suhtautua, jos se päättyy ilman että itse irtisanoo sopimuksen? Mihin saa valittaa? Entäpä korvaavat äitipalvelut, keneltä niitä voisi saada? \n\nIlmoittaudu Muotoillaan äitiä -työpajaan \n\nTapahtuma on osa Metropolian palvelumuotoilun opiskelija, Taiteen maisteri Jonna Mannilan YAMK-opinnäytetyötä I´M YOUR MOTHER – Jos äiti olisi palvelu. Jonna Mannila tutkii opinnäytetyössään äitiä palvelumuotoilun viitekehyksessä. Lisätietoja muotoilun opiskelija Jonna Mannila +358 40 5603409 tai mari.mannila@metropolia.fi \n\nTapahtuma on osa Helsinki Design Week -tapahtumakokonaisuutta.","df":"Äidit muotoilevat elämää. Mutta nyt on äitisuhteen vuoro olla muotoilun kohteena. \n\nOsallistu Helsinki Design Week -tapahtuman aikana työpajaan osana Jonna Mannilan muotoilun maisteriohjelman opinnäytetyötä. Työpajassa tehdään pieni, kevyt harjoitus ja muotoillaan aikuisen lapsen äitisuhdetta palvelumuotoilun keinoin. \n\nOnko sinulla äiti? Oletko kenties itse aikuisten lasten äiti? Työpaja on tarkoitettu sinulle, jolla on äiti tai sinulle, jolla on jo aikuisia lapsia. Ikäraja on 18 vuotta. \n\nVoiko äidin toimittamaa palvelua muotoilemalla parantaa? Millaiseksi aikuisen lapsen ja äidin suhde muuttuisi, jos aiemmin orgaanisesti muodostunut palvelu muotoiltaisiin uudelleen, yhdessä käyttäjän kanssa? Entä miten palveluun pitäisi suhtautua, jos se päättyy ilman että itse irtisanoo sopimuksen? Mihin saa valittaa? Entäpä korvaavat äitipalvelut, keneltä niitä voisi saada? \n\nIlmoittaudu Muotoillaan äitiä -työpajaan \n\nTapahtuma on osa Metropolian palvelumuotoilun opiskelija, Taiteen maisteri Jonna Mannilan YAMK-opinnäytetyötä I´M YOUR MOTHER – Jos äiti olisi palvelu. Jonna Mannila tutkii opinnäytetyössään äitiä palvelumuotoilun viitekehyksessä. Lisätietoja muotoilun opiskelija Jonna Mannila +358 40 5603409 tai mari.mannila@metropolia.fi \n\nTapahtuma on osa Helsinki Design Week -tapahtumakokonaisuutta.","c":"Visual arts","cs":["Työpajat","participation","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/Lainaa_%C3%A4iti_kuva.jpg","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agp3ptqlie","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agp3ptqlie","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"12:00-14:00","n":0,"nn":0,"i":"helsinki:agp3ptqlie","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agqd3hakem","t":"Keskuspuiston eteläosan kävely","te":"Keskuspuiston eteläosan kävely","v":"Lääkärinkatu 4, Helsinki","ve":"Lääkärinkatu 4, Helsinki","a":"Lääkärinkatu 4","la":60.19159,"ln":24.91423,"s":720,"e":870,"d":"Suomen luonnon päivänä retkeillään Keskuspuistossa! Helsingin Keskuspuisto on metsäluonnon helmi ja myös puiston eteläosissa on merkittäviä luontokohteita, jonne kaupunki perustaa uusia luonnonsuojelualueita. Myös liito-orava viihtyy monipuolisilla metsäkuvioilla.\n\nKiertelemme retkellä alkusyksyisessä Keskuspuistossa oppaiden johdolla. Ovatko linnut jo lähteneet, onko sieniä noussut? Mitä muuta metsästä löytyy?\n\nRetkellä kävellään Keskuspuistoa Laaksosta pohjoiseen ja retki päättyy Maunulan majalle. Majalla voi nauttia omakustanteisesti Suomen luonnon päivän kahvit. \n\nYhdensuuntaisen retkireitin pituus lähtöpisteestä majalle on noin 3 km. Retken reitti on helppokulkuinen.\n\nAinakin toinen opas palaa lähtöpisteelle retken loputtua.\n\nRetken lähtöpaikka: Lääkärinkatu 4, Lääkärikadun ja Urheilukadun risteyksessä\n\nRetken päätepiste: Maunulan maja\n\nluontoretkikalenteri-retkeily","df":"Suomen luonnon päivänä retkeillään Keskuspuistossa! Helsingin Keskuspuisto on metsäluonnon helmi ja myös puiston eteläosissa on merkittäviä luontokohteita, jonne kaupunki perustaa uusia luonnonsuojelualueita. Myös liito-orava viihtyy monipuolisilla metsäkuvioilla.\n\nKiertelemme retkellä alkusyksyisessä Keskuspuistossa oppaiden johdolla. Ovatko linnut jo lähteneet, onko sieniä noussut? Mitä muuta metsästä löytyy?\n\nRetkellä kävellään Keskuspuistoa Laaksosta pohjoiseen ja retki päättyy Maunulan majalle. Majalla voi nauttia omakustanteisesti Suomen luonnon päivän kahvit. \n\nYhdensuuntaisen retkireitin pituus lähtöpisteestä majalle on noin 3 km. Retken reitti on helppokulkuinen.\n\nAinakin toinen opas palaa lähtöpisteelle retken loputtua.\n\nRetken lähtöpaikka: Lääkärinkatu 4, Lääkärikadun ja Urheilukadun risteyksessä\n\nRetken päätepiste: Maunulan maja\n\nluontoretkikalenteri-retkeily","c":"Dance","cs":["urban nature","well-being","guidance","outdoor recreation","Central Park of Helsinki","Finnish Nature Day"],"img":"https://api.hel.fi/linkedevents/media/images/HkiKeskuspuisto_Lainiola-29.jpg","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agqd3hakem","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agqd3hakem","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"12:00-14:30","n":0,"nn":0,"i":"helsinki:agqd3hakem","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agqc33xksi","t":"Shanghailainen dumpling pop-up","te":"Shanghai Xiaolongbao Pop-up","v":"Kulmavuorenkatu 4, Helsinki","ve":"Kulmavuorenkatu 4, Helsinki","a":"Kulmavuorenkatu 4","la":60.18855,"ln":24.96489,"s":720,"e":1200,"d":"A four-day Shanghai dumpling pop-up in Sörnäinen! Freshly made xiaolongbao, small bites and drinks. Vegan option available.\n\nThe star of the menu is xiaolongbao – Shanghai’s iconic steamed soup dumplings, freshly made on site. There are both classic pork and vegan xiaolongbao.\n\nThere will also be a few small bites, something sweet, and refreshing drinks.\n\nCome for lunch, dinner, or simply a basket of xiaolongbao!\n\nSupear, Kulmavuorenkatu 4\n27.-30.8.2026\nThu-Fri 11.00–14.00 & 17.00–20.00\nSat 12.00–20.00\nSun 12.00–18.00\n\nWalk-ins are welcome, or DM to reserve a table","df":"Neljän päivän Shanghai dumpling pop-up Sörnäisissä! Tuoreita xiaolongbao-nyyttejä, pieniä herkkuja ja juomia. \n\nMenun tähtenä on xiaolongbao – Shanghain ikoninen höyrytetty keittotäytteinen nyytti, joka valmistetaan tuoreena paikan päällä. Tarjolla on sekä klassinen possu-xiaolongbao että vegaaninen vaihtoehto.\n\nLisäksi tarjolla on muutamia pieniä annoksia, jotain makeaa sekä raikkaita juomia.\n\nTule lounaalle, illalliselle tai ihan vain nauttimaan korillinen xiaolongbao-nyyttejä!\n\nSupear, Kulmavuorenkatu 4\n27.–30.8.2026\n\nTo-pe 11.00–14.00 & 17.00–20.00\nLa 12.00–20.00\nSu 12.00–18.00\n\nHinnat keskimäärin 16.90–30 € / hlö, valinnoista riippuen.\n\nWalk-in-asiakkaat ovat tervetulleita, tai halutessasi voit varata pöydän lähettämällä viestiä Instagramissa.","c":"Participate","cs":["cultural events","food"],"img":"https://api.hel.fi/linkedevents/media/images/4_xDbyXov.jpg","u":"https://www.instagram.com/p/DcUASTMjJXa/","ue":"https://www.instagram.com/p/DcUASTMjJXa/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agqc33xksi","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"hkm:8618","t":"Oopperapyörä","te":"Opera Wheel","v":"Hakasalmen huvila","ve":"Villa Hakasalmi","a":"Mannerheimintie 13b","la":60.17466,"ln":24.93409,"s":720,"e":780,"d":"Opera Wheel is a rolling opera experience for the whole family, where familiar characters from operas travel around the squares and terraces of summery Helsinki on a cargo bike, performing excerpts from classic works. In the performance, written and directed by Siljamari Heikinheimo , popular opera tunes and a lively story offer a surprising and memorable experience for new and old fans of opera. The performers are soprano Anu Hostikka , tenor Jasper Leppänen and accordionist Niko Kumpuvaara . Produced by Greta Tuotanto.\n\nKuva: Sanne Breilin","df":"Oopperapyörä on rullaava koko perheelle suunnattu oopperaelämys, jossa eri oopperoista tutut roolihahmot kiertelevät tavarapyörällä kesäisen Helsingin toreilla ja terasseilla esittäen otteita klassikkoteoksista. Siljamari Heikinheimon käsikirjoittamassa ja ohjaamassa esityksessä suositut oopperasävelmät ja veikeä tarina tarjoavat yllättävän ja mieleenpainuvan kokemuksen oopperataiteen uusille ja vanhoille ystäville. Esiintyjinä ovat Anu Hostikka (sopraano), Jasper Leppänen (tenori) ja Niko Kumpuvaara (harmonikka). Oopperapyörän on tuottanut Greta Tuotanto.\n\nKuva: Sanne Breilin","c":"Visual arts","cs":["Culture and leisure","everyday","Helsinki residents","museums","urban history"],"img":"https://www.helsinginkaupunginmuseo.fi/app/uploads/sites/2/2026/08/artikkelikuva_825x513px_Oopperapyora_HH_syksy26.jpeg","u":"https://hakasalmenhuvila.fi/tapahtumat/oopperapyora-2026/","ue":"https://hakasalmivilla.fi/events/opera-wheel/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"12:00-13:00","n":0,"nn":0,"i":"hkm:8618","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:69207","t":"Puzzle Theatre: Bois - Puut - SAMPO Festivaali","te":"Puzzle Theatre: Bois - Woods - SAMPO Festival","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":840,"d":"Bois – Woods is an atypical, colourful puppet show, full of humour and unexpected situations.\n\nA green leaf that grows on a dead branch, pieces of wood that come together to form strange creatures, some hostile, some comical…\n\nA curious world that surprises, amazes, and inspires. A world that also makes you think and wonder.\n\nIn keeping with its artistic approach, the Canadian puppetry group Puzzle Théâtre is drawing inspiration from a whole new medium to create an atypical, colourful puppet show, full of humour and unexpected situations.\n\nDuration: 40 minutes\nLanguage: no spoken parts\nAge recommendation: 4 years old and up\n\nCreated and performed by: Csaba Raduly and Pavla Mano\nOriginal music by: Petya Nedeva\n\nTickets sold at Puppet Theatre Sampo . Basic ticket: EUR 15; support ticket: EUR 20.\n\nSAMPO Festival \n\nInternational visual theatre and puppet theatre festival SAMPO is held already for the 10th time in Helsinki and the metropolitan area. This year, the programme includes performances and workshops for children and adults from Canada, France, Italy, Slovakia, and the Ukraine.\n\nHighlights of the programme include the Transport series, whose three performances – from Estonia, Lithuania and Czechia – examine globalisation and sustainable development, as well as Golem – e fango è is mondo by Italian Teatro del Drago, awarded at the Venice Biennale.\n\nSAMPO Festival brings many","df":"Bois – Puut on epätavallinen, värikäs nukketeatteriesitys, joka on täynnä huumoria ja odottamattomia tilanteita.\n\nVihreä lehti, joka kasvaa kuolleella oksalla. Puupalat yhdistyvät ja heräävät eloon, muuttuen oudoiksi olennoiksi – osa niistä on vihamielisiä, osa ihan hassuja…\n\nTämä utelias maailma yllättää, hämmästyttää ja inspiroi. Maailma, joka saa kaikki myös ajattelemaan ja ihmettelemään.\n\nKanadalainen nukketeatteriryhmä Puzzle Théâtre ammentaa inspiraatiota kokonaan uudesta materiaalista, luoden epätavallisen, värikkään nukketeatteriesityksen, joka on täynnä huumoria ja odottamattomia tilanteita.\n\nLippuja esityksiin myy Nukketeatteri Sampo . Lipun hinta: 15 €; kannatuslippu: 20 €.\n\nTekijät ja esiintyjät: Csaba Raduly ja Pavla Mano\nAlkuperäinen musiikki: Petya Nedeva\nKesto: 40 minuuttia\nEsitys ei sisällä puhetta.\nIkäsuositus: 4-vuotiaat ja sitä vanhemmat\n\nSAMPO Festivaali \n\nVisuaalisen teatterin ja nukketeatterin kansainvälinen festivaali järjestetään jo kymmenettä kertaa Helsingissä ja pääkaupunkiseudulla. Tänä vuonna ohjelmassa on lapsille ja aikuisille suunnattuja esityksiä ja työpajoja Kanadasta, Ranskasta, Italiasta, Slovakiasta ja Ukrainasta.\n\nFestivaalin kohokohtia ovat globalisoitumista ja kestävää kehitystä käsittelevän Transport -sarjan kolme esitystä, jotka saapuvat Helsinkiin Virosta, Liettuasta ja Tšekeistä, sekä Venetsian Biennaalin palkitsema italialaisen Teat","c":"Theatre","cs":["Lastentapahtumat","Teatteri","Teatteri ja sirkus","Annantalo","Suomi","Ruotsi"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_793510.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/68584A5195A067727577294EFF82EF80/Puzzle_Theatre_Bois_Puut","ue":"http://www.annantalo.fi/en/events/event/68584A5195A067727577294EFF82EF80/Puzzle_Theatre_Bois_Woods","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"12:00-14:00","n":0,"nn":0,"i":"kulke:69207","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpyi4zm24","t":"Love & Loss -taidenäyttely","te":"Love & Loss -taidenäyttely","v":"TakeMeHome-Galleria","ve":"TakeMeHome-Gallery","a":"Kauppiaankatu 8-10","la":60.1669,"ln":24.9673,"s":720,"e":900,"d":"Love & Loss on Jonna Jokikunnaksen ja Ninni Melenderin yhteisnäyttely ja kunnianosoitus luonnolle, luopumiselle ja rakkaudelle.\n\nTervetuloa avajaisiin lauantaina 1.8. klo 16 alkaen Katajanokalle.\n\nJonna Jokikunnas on kuvataiteilija, jonka runollista realismia edustavat öljyvärimaalaukset käsittelevät elämän haurautta, katoavaisuutta ja luonnon hiljaista voimaa. Nykyinen näyttely koostuu kokonaan puulle maalatuista teoksista, joissa puun luonnollinen pinta ja muodot ovat olennainen osa ilmaisua. Jokainen teos kutsuu katsojan pysähtymään ja löytämään omat tulkintansa.\n\nNinni Melender on kokenut helsinkiläinen graafikko, AD ja kuvittaja. Ninni osallistuu Take me home Gallerian elokuun näyttelyyn Love & Loss sekä DoGGGs -miniryijysarjoilla. Niiden vaikuttavana teemana on suru ja menetys sekä oivallus, että näiden vahvojen tunteiden vastapuolena on aina rakkaus.\n\n\"Halusin kunnioittaa äitini muistoa ja näin syntyi \"Blackbird singing in the Death of Night\" -miniryijy mustarastaasta pinkillä rakkauden oksalla. Tästä kehittyi intuitiivinen sarja, jossa eri lintuhahmot taklaavat läpi suruprosessin\".","df":"Love & Loss on Jonna Jokikunnaksen ja Ninni Melenderin yhteisnäyttely ja kunnianosoitus luonnolle, luopumiselle ja rakkaudelle.\n\nTervetuloa avajaisiin lauantaina 1.8. klo 16 alkaen Katajanokalle.\n\nJonna Jokikunnas on kuvataiteilija, jonka runollista realismia edustavat öljyvärimaalaukset käsittelevät elämän haurautta, katoavaisuutta ja luonnon hiljaista voimaa. Nykyinen näyttely koostuu kokonaan puulle maalatuista teoksista, joissa puun luonnollinen pinta ja muodot ovat olennainen osa ilmaisua. Jokainen teos kutsuu katsojan pysähtymään ja löytämään omat tulkintansa.\n\nNinni Melender on kokenut helsinkiläinen graafikko, AD ja kuvittaja. Ninni osallistuu Take me home Gallerian elokuun näyttelyyn Love & Loss sekä DoGGGs -miniryijysarjoilla. Niiden vaikuttavana teemana on suru ja menetys sekä oivallus, että näiden vahvojen tunteiden vastapuolena on aina rakkaus.\n\n\"Halusin kunnioittaa äitini muistoa ja näin syntyi \"Blackbird singing in the Death of Night\" -miniryijy mustarastaasta pinkillä rakkauden oksalla. Tästä kehittyi intuitiivinen sarja, jossa eri lintuhahmot taklaavat läpi suruprosessin\".","c":"Visual arts","cs":["fine arts","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/LoveLoss_some_poster_with_opening.jpg","u":"https://www.instagram.com/takemehomegalleria/","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agpyi4zm24","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"12:00-15:00","n":0,"nn":0,"i":"helsinki:agpyi4zm24","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpeafmwli","t":"Opastettu yleisökierros Suomenlinnassa","te":"Opastettu yleisökierros Suomenlinnassa","v":"Suomenlinnan merilinnoitus","ve":"Suomenlinna Sea Fortress","a":"Suomenlinna","la":60.14882,"ln":24.98479,"s":720,"e":780,"d":"Suomenlinnassa toteutettavalla kävelykierroksella kuullaan linnoituksen mielenkiintoisesta historiasta ja nykypäivästä.\n\nVuonna 1748 käynnistyivät pikkuruisen Helsingin kaupungin edustalla työt, joista alkoi Viaporin historia. Kuudelle saarelle rakennettu bastionilinnoitus palveli Ruotsin Saaristolaivaston tukikohtana, jonka tarpeisiin rakennettiin myös suuri kuivatelakka. Ruotsin ajan lopulla alkuvuosien karusta rakennustyömaasta oli jo kuoriutunut yksi tuolloisen Suomen alueen suurimpia ja vilkkaimpia asutuskeskittymiä.\n\nLinnoituksen venäläinen kausi käynnistyi Suomen sodan aikana, aikalaisia kummastuttaneen ja kauan keskustelua ja kysymyksiä herättäneen linnoituksen antautumisen myötä vuonna 1808. Venäläinen kausi kesti 110 vuotta, ja jätti perinnöksi mm. lukuisia kasarmirakennuksia sekä linnoitussaarten lounaispuolelle rakennetut vallit pattereineen - kauppiaskorttelin marketenttien kuuluisia sukuja ja Krimin sodan kokemuksia ja tarinoita unohtamatta.\n\nLinnoituksen suomalainen kausi puolestaan käynnistyi keväällä 1918 Suomen sisällissodan tummassa varjossa. Sittemmin linnoitussaarista muodostui elävä varuskuntayhteisö ja ainutlaatuinen kulttuuriperintökohde. \n\nOpastettuja kierroksia järjestetään suomeksi:\n\n2.6. - 31.8. päivittäin klo 12.00 (EI juhannuksena)\n\n22.6. - 9.8. päivittäin klo 14.00 Suomenlinnan Salaisuudet -kierros\n\nKierrokset alkavat Suomenlinna Museolta ja kestä","df":"Suomenlinnassa toteutettavalla kävelykierroksella kuullaan linnoituksen mielenkiintoisesta historiasta ja nykypäivästä.\n\nVuonna 1748 käynnistyivät pikkuruisen Helsingin kaupungin edustalla työt, joista alkoi Viaporin historia. Kuudelle saarelle rakennettu bastionilinnoitus palveli Ruotsin Saaristolaivaston tukikohtana, jonka tarpeisiin rakennettiin myös suuri kuivatelakka. Ruotsin ajan lopulla alkuvuosien karusta rakennustyömaasta oli jo kuoriutunut yksi tuolloisen Suomen alueen suurimpia ja vilkkaimpia asutuskeskittymiä.\n\nLinnoituksen venäläinen kausi käynnistyi Suomen sodan aikana, aikalaisia kummastuttaneen ja kauan keskustelua ja kysymyksiä herättäneen linnoituksen antautumisen myötä vuonna 1808. Venäläinen kausi kesti 110 vuotta, ja jätti perinnöksi mm. lukuisia kasarmirakennuksia sekä linnoitussaarten lounaispuolelle rakennetut vallit pattereineen - kauppiaskorttelin marketenttien kuuluisia sukuja ja Krimin sodan kokemuksia ja tarinoita unohtamatta.\n\nLinnoituksen suomalainen kausi puolestaan käynnistyi keväällä 1918 Suomen sisällissodan tummassa varjossa. Sittemmin linnoitussaarista muodostui elävä varuskuntayhteisö ja ainutlaatuinen kulttuuriperintökohde. \n\nOpastettuja kierroksia järjestetään suomeksi:\n\n2.6. - 31.8. päivittäin klo 12.00 (EI juhannuksena)\n\n22.6. - 9.8. päivittäin klo 14.00 Suomenlinnan Salaisuudet -kierros\n\nKierrokset alkavat Suomenlinna Museolta ja kestä","c":"Dance","cs":["guidance","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/suomenlinna-kustaanmiekka-kuninkaanportti-nahtavyydet.jpg","u":"https://suomenlinna.johku.com/fi_FI/liput/opastettu-yleisokierros-suomeksi","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agpeafmwli","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"12:00-13:00","n":0,"nn":0,"i":"helsinki:agpeafmwli","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpjprar4q","t":"Piirustuspaja Alvar Aallon ateljeessa","te":"Drawing Workshop at Studio Aalto","v":"Alvar Aallon ateljee","ve":"Studio Aalto","a":"Tiilimäki 20","la":60.19823,"ln":24.86952,"s":720,"e":810,"d":"Come and get to know the Aaltos’ in depth by attending a drawing workshop! In the drawing workshop organised by the Alvar Aalto Foundation, you can unleash your creativity and get inspired by pioneers of modernism: Alvar, Aino, and Elissa Aalto.\n\nNo previous sketching experience is required—everyone is welcome!\n\nThe workshop begins with an introduction of the Aaltos’s design philosophy and their relationship to different materials. Participants are also given the opportunity to take a look at some of their sketches. After that, it’s time to draw: you can either design your own “future classic” or sketch the surrounding space.\n\nAll necessary tools are provided, but you’re welcome to bring your favourite sketching materials along. However, it is best to leave inks and charcoals at home to protect the light-coloured surfaces of the studio.\n\nStudio Aalto\n\n4.7.2026 klo 12-13.30\n\n11.7.2026 klo 12-13.30\n\n18.7.2026 klo 12-13.30\n\n1.8.2026 klo 12-13.30\n\n8.8.2026 klo 12-13.30\n\n15.8.2026 klo 12-13.30\n\n22.8.2026 klo 12-13.30\n\n29.8.2026 klo 12-13.30\n\n5.9.2026 klo 12-13.30\n\nAdmission fee 10-32€\n\nHeld in English","df":"Tule inspiroitumaan Aaltojen viivasta! Alvar Aalto -säätiön järjestämässä piirustuspajassa voit päästää luovuutesi valloilleen modernismin pioneerien Alvar, Aino ja Elissa Aallon innoittamana.\n\nEt tarvitse aikaisempaa kokemusta luonnostelusta, kaikki ovat tervetulleita! Työpajan aluksi opas kertoo Aaltojen suunnittelufilosofiasta, heidän suhteestaan eri materiaaleihin, sekä esittelee Aaltojen tekemiä luonnoksia. Paja jatkuu piirustusosuudella, jonka aikana voit joko suunnitella oman muotoiluklassikkosi, tai skissailla ympäröivää tilaa tai yksityiskohtia.\n\nTalo tarjoaa työvälineet, mutta voit myös ottaa omia mieleisiä luonnosvälineitä mukaan. Musteet ja hiilet kannattaa kuitenkin jättää kotiin ateljeen vaaleiden pintojen suojelemiseksi. \n\nAlvar Aallon ateljee\n\n4.7.2026 klo 12-13.30\n\n11.7.2026 klo 12-13.30\n\n18.7.2026 klo 12-13.30\n\n1.8.2026 klo 12-13.30\n\n8.8.2026 klo 12-13.30\n\n15.8.2026 klo 12-13.30\n\n22.8.2026 klo 12-13.30\n\n29.8.2026 klo 12-13.30\n\n5.9.2026 klo 12-13.30\n\nSisäänpääsymaksu 10-32€\n\nTapahtuma on englanniksi","c":"Visual arts","cs":["participation","drawings (works of art)","cultural events","architecture"],"img":"https://api.hel.fi/linkedevents/media/images/Piirustuspaja_Tiillim%C3%A4ki_lamput_neli%C3%B6.jpg","u":"https://shop.alvaraalto.fi/en_US/guided-tours/drawing-workshop-at-studio-aalto","ue":"https://shop.alvaraalto.fi/en_US/guided-tours/drawing-workshop-at-studio-aalto","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"12:00-13:30","n":0,"nn":0,"i":"helsinki:agpjprar4q","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpjp4hnpm","t":"Opastettu kierros Kulttuuritalolla englanniksi","te":"Guided tour at the House of Culture in English","v":"Kulttuuritalo","ve":"House of Culture","a":"Sturenkatu 4","la":60.18818,"ln":24.94439,"s":720,"e":780,"d":"The House of Culture is considered the culmination of Alvar Aalto’s red brick architecture, featuring free-flowing brick surfaces and monumental spaces. During the guided tour, an expert guide from the Alvar Aalto Foundation introduces the history, materials, and design process of the building.\n\nOriginally, the House of Culture was a political project. It was constructed by the Finnish Communist Party together with other socialist organizations, and its political nature explains why it was largely built by volunteers.\n\nIn addition to being eon tapahtuma-alustalla. Lippu maksetaan verkkokaupassa etukäteen ja ilmoittautuminen on sitova.\n\nVaraa paikkasi: https://admuseo.timeworks.fi/guidance/fi/reserve-event/6 \n\nOpastus on suomeksi, mutta kierroksia järjestetään suomen lisäksi myös englanniksi ja venäjäksi.","c":"Visual arts","cs":["Design","walking tours","cultural events","architecture"],"img":"https://api.hel.fi/linkedevents/media/images/Aalto_arkkitehtuurikavely_finlandia_Mbr08Th.jpeg","u":"https://admuseo.fi/arkkitehtuuri-kavelykierrokset-helsinki/","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agpapiymge","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"13:00-14:30","n":0,"nn":0,"i":"helsinki:agpapiymge","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"espoo_le:agpptfi4e4","t":"Taide kuuluu kaikille -grafiikkatyöpaja","te":"Art for All - Printmaking Workshop","v":"Tapiolan kirjasto","ve":"Tapiola Library","a":"Espoon kulttuurikeskus, Kulttuuriaukio 2","la":60.17809,"ln":24.80465,"s":780,"e":900,"d":"Come try gel plate printing at an open workshop on Espoo Day at Tapiola Library! No previous experience is needed, and guidance is available in Finnish, Swedish, and English. In the workshop, you create unique prints using a gel plate and natural plants on recycled book pages with water-based paints. The works dry quickly, and you can take your finished piece with you right away as a small artwork or card. The workshop is organized by the Luovat Lyylit group.","df":"Tule kokeilemaan grafiikan painamista geelilevyllä! \n\nAvoimessa grafiikkatyöpajassa osallistujat pääsevät tekemään taidetta matalan kynnyksen geelipainotekniikalla. Aiempaan kokemusta ei tarvita, tekniikka soveltuu kaiken ikäisille ja ohjaajat neuvovat suomeksi, ruotsiksi ja englanniksi. Tapahtuma järjestetään Espoo-päivänä Tapiolan kirjastossa.\n\nGrafiikkavedokset tehdään geelilevyn ja luonnonkasvien avulla kirjastosta ja kierrätyskeskuksesta kerättyjen poistokirjojen sivuille. Jokainen vedos on yksilöllinen monotypia. Väreinä käytetään vesiliukoisia maaleja. Työt kuivuvat nopeasti ja valmiin vedoksen saa heti mukaansa. Vedokset voidaan liimata kierrätyskartongille pieneksi tauluksi tai tehdä niistä taidekortteja.\n\nTyöpajan järjestää työryhmä Luovat Lyylit, johon kuuluvat luovan alan yrittäjät Heli Alén, Pirre Toikkanen ja Annakaisa Kilpinen.","c":"Dance","cs":["Tapiola","guidance","fine arts","libraries","craft skills"],"img":"https://tapahtumasyotto.espoo.fi/media/images/be855d62-b826-40e7-8c4c-8010a7a25f4c.jpg","u":"https://www.tuunaajamutsi.fi/","ue":"https://www.tuunaajamutsi.fi/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"13:00-15:00","n":0,"nn":0,"i":"espoo_le:agpptfi4e4","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp5m6lroy","t":"Teatro del Drago: Golem - e fango e il mondo","te":"Teatro del Drago: Golem - e fango e il mondo","v":"Nukketeatteri Sampo","ve":"Puppet Theatre Sampo","a":"Erottajankatu 7","la":60.16503,"ln":24.94418,"s":780,"e":840,"d":"Winner of Venice Biennale! A visual, poetic multimedia performance by Italian Teatro del Drago is about “mud” as material and as a metaphor, through the figure of Golem.\n\nPuppet Theatre Sampo\n\n28.-29.8.2026\n\nPerformances:\n\n28.8. at 20.00-21.00\n\n29.8. at 13.00-14.00\n\nTickets 25/20€, age recommendation 12+\n\nNon-verbal","df":"Venetsian Biennaalin voittaja! \n\nItalialaisen Teatro del Dragon monitaiteinen, visuaalinen ja runollinen esitys “mudasta” materiaalina ja emotionaalisena metaforana, Golemin hahmon kautta. \n\nNukketeatteri Sampo\n\n28.-29.8.2026\n\nEsitykset:\n\n28.8. klo 20.00-21.00\n\n29.8. klo 13.00-14.00\n\nLiput 25/20€, ikäsuositus 12+\n\nSanaton esitys","c":"Theatre","cs":["theatre (art forms)","cultural events","puppet theatres"],"img":"https://api.hel.fi/linkedevents/media/images/Teatro_del_Drago_Golem_e_fango_%C3%A8_il_mondo-2_photo_Andrea_Avezza%C3%B9_kopio_SggzXfE.jpg","u":"https://sampofestival.fi/","ue":"https://sampofes op":1,"ex":0,"rr":0,"tl":"13:00-14:30","n":0,"nn":0,"i":"helsinki:agplb7a54q","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agowz6ruhq","t":"Merellinen Helsinki: Wine Tasting Vallisaaressa","te":"Wine Tasting in Vallisaari","v":"Vallisaari","ve":"Vallisaari","a":"Vallisaari","la":60.13797,"ln":25.00193,"s":780,"e":1140,"d":"20 minutes from Market Square\n⛵️ On a sea-view terrace\n5 wines + tapas buffet 🍷🍷🍷🍷🍷\nPerfect for complete beginners and near-professionals alike\n\nThis summer too, forget the plane tickets — Iisi brings the flavours of Italy, France, Spain, and beyond to the most beautiful island in Helsinki.\n\nEvery tasting is a mini holiday:\n✨ Unique wines and stories straight from the producers\n🎶 Evening celebrations + sunset on the terrace\n\n🌿 Wine tastes best in good company and in a beautiful place\n🎟️ Limited number of seats — book early! (Seriously.)\n\nNo experience needed! At every tasting, our sommelier gives a short introduction to each wine and then moves from table to table for personal conversations. Whether it’s your first tasting or you’re almost a sommelier, this experience gives you exactly what you’re looking for.\n\nPartner: The tastings are organized in collaboration with Potio Oy / Kaubba.com — years of stories, producers, grape varieties, and regional secrets poured straight into your glass.\n\nSee you on the island! – Chief Iisi 🍷","df":"20 minuutia Kauppatorilta \n⛵️ Merinäkymäterassilla \n5 viiniä + tapas-buffet 🍷🍷🍷🍷🍷 \nSopii täydellisesti niin aloittelijoille kuin lähes ammattilaisillekin\n\nTänäkin kesänä unohda lentoliput – Iisi tuo Italian, Ranskan, Espanjan ja muiden maiden maut Helsingin kauneimmalle saarelle.\n\nJokainen maistelu on miniloma: \n✨ Ainutlaatuisia viinejä & tarinoita suoraan tuottajilta \n🎶 Illalla juhlat + auringonlasku terassilla \n\n🌿 Viini maistuu parhaalta hyvässä seurassa ja kauniissa paikassa \n🎟️ Rajallinen määrä paikkoja – varaa ajoissa!(oikeasti)\n\nKokemusta ei tarvita! Joka maistelussa sommelierimme esittelee jokaisen viinin lyhyesti ja kiertää sitten pöydästä pöytään henkilökohtaisesti juttelemassa. Olitpa ensikertalainen tai melkein sommelier – tämä kokemus antaa juuri sen mitä haluat.\n\nKumppani: Maistelut järjestetään yhteistyössä Potio Oy / Kaubba.com kanssa – vuosien tarinoita, tuottajia, rypäleitä ja alueellisia salaisuuksia suoraan lasiisi.\n\nNähdään saaressa! – Chief Iisi 🍷","c":"Music","cs":["music","cultural events","food"],"img":"https://api.hel.fi/linkedevents/media/images/DB730250-42E0-45D4-9E7F-0D92D321ACD1.jpg","u":"https://www.iisivallisaari.fi/","ue":"https://www.iisivallisaari.fi/en/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"13:00-19:00","n":0,"nn":0,"i":"helsinki:agowz6ruhq","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:68346","t":"Metsän suojassa - Pyöreän pöydän keskustelu utopiatulevaisuudesta | Suomen luonnon päivä","te":"Metsän suojassa - In the Shelter of the Forest - Roundtable discussion on a utopian future | Finnish Nature Day","v":"Kanneltalo","ve":"Cultural Centre Kanneltalo","a":"Klaneettitie 5","la":60.23885,"ln":24.8762,"s":780,"e":900,"d":"The roundtable discussion on Finnish Nature Day, 29 August 2026, is one of the main events marking the culmination of the Metsäkissa2044 project.\n\nModerator: Jaana Kanninen\nParticipants: Anni Kytömäki, Elisa Aaltola, Ilari Sääksjärvi, Jukka Ilmonen, Juha-Pekka Väisänen, Matti Aikio\n\nThe In the Shelter of the Forest exhibition provides a mystical setting for discussion, serving as a reminder of the forest’s many values. Leading figures from the worlds of science and the arts in Finland have been invited to take part in the discussion. Among those who have agreed to take part is the much-loved author Anni Kytömäki , in whose works nature and all its living creatures play a central role. Another participant, familiar from ethical discussions, is Elisa Aaltola , executive director of Eläinoikeusakatemia and animal philosopher, known for her profound insights.\n\nProfessor of Biodiversity Research Ilari Sääksjärvi from the University of Turku is the vice-chair of the Finnish Nature Panel and an award-winning social influencer. The panellists also include the leader of the Metsäkissa2044 project, Jukka Ilmonen , who describes himself as a Jack of all trades and whose worldview is bold, even radical. More participants will join the fold as we head into August.\n\nEach participant begins by presenting their own manifesto, setting out their vision of a better future – their own utopia. Memb","df":"Pyöreän pöydän keskustelu Suomen luonnon päivänä 29.8.2026 on yksi Metsäkissa2044-hankkeen loppuhuipennuksen päätapahtumista.\n\nVetäjä: Jaana Kanninen\nOsallistujat: Anni Kytömäki, Elisa Aaltola, Ilari Sääksjärvi, Jukka Ilmonen, Juha-Pekka Väisänen, Matti Aikio\n\nMetsän suojassa -näyttely luo keskustelulle mystisen, metsän monista arvoista muistuttavan ympäristön. Keskusteluun on kutsuttu tieteen ja taiteen huippunimiä Suomesta. Mukaan ovat lupautuneet ainakin rakastettu kirjailija Anni Kytömäki , jonka teoksissa luonto ja sen kaikki eliöt ovat keskeisellä sijalla. Toinen eettisestä keskustelusta tuttu nimi on Eläinoikeusakatemian toiminnanjohtaja ja eläinfilosofi Elisa Aaltola , joka tunnetaan syvällisistä ajatuksistaan.\n\nTurun yliopiston biodiversiteettitutkimuksen professori Ilari Sääksjärvi on Suomen Luontopaneelin varapuheenjohtaja ja palkittu yhteiskunnallinen vaikuttaja. Lisäksi keskustelijoiden joukossa on Metsäkissa2044 -hankkeen vetäjä, ”jokamiesjantuseksi” itsenään tituleeraava Jukka Ilmonen , jonka maailmankuva on räväkkä, radikaalikin. Joukko täydentyy vielä kohti elokuuta mentäessä.\n\nJokainen osanottaja ilmaisee aluksi oman manifestinsa, josta käy ilmi, miten he hahmottavat hyvän tulevaisuuden, oman utopiansa. Myös Metsäkissa2044-ryhmän jäsen, käsitetaiteilija Juha-Pekka Väisänen osallistuu keskusteluun omalla manifestillaan, joka videoidaan suolta. Tästä alkaa syväl","c":"Literature","cs":["Kanneltalo","Näyttelyt","Muut tapahtumat","Suomi","Ruotsi","Englanti"],"img":"http://www.kanneltalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_787749.jpg","u":"http://www.kanneltalo.fi/fi/tapahtumat/event/3EA7FF161BEC4E7C7B667EC2E4E066E3/Metsan_suojassa","ue":"http://www.kanneltalo.fi/en/events/event/3EA7FF161BEC4E7C7B667EC2E4E066E3/Metsan_suojassa_In_the_Shelter_of_the_Forest","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"13:00-15:00","n":0,"nn":0,"i":"kulke:68346","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"lippupiste:20985507","t":"& Julia","te":"& Julia","v":"Helsingin Kaupunginteatteri","ve":"Helsinki City Theatre","a":"Eläintarhantie 5","la":60.18167,"ln":24.94272,"s":780,"e":900,"d":"David West Read - Max Martin\n & JULIA","df":"Jos pidit Moulin Rouge! Musikaalista, tulet rakastamaan & Juliaa!\n\nUnohda surulliset loput ja Romeonsa perään itkevä Julia – vuoden räiskyvin musikaali & Julia on jotain ihan muuta!\n\nMitä tapahtuisi, jos Julia ottaisikin elämänsä omiin käsiinsä? Alkaa hullutteleva ja häikäisevä seikkailu, jonka aikana tulee selväksi, että elämää on Romeon jälkeenkin! Tai oikeastaan, silloinhan se vasta alkaa...\n\nTämä Shakespearen tunnetuin rakkaustarina tarjoillaan nyt täysin uudella twistillä ja tunnetuimpien 90- ja 2000-luvun alun hittien soidessa - mikä voisi olla parempaa?\n\nLontoon ja Broadwayn hurmanneen & Julia-musikaalin on kirjoittanut Emmy-palkitun komediasarjan Schitt’s Creek kirjoittaja David West Read ja musiikin on säveltänyt ruotsalainen popsuuruus Max Martin. Musikaalissa kuullaan 90-luvun ja 2000-luvun alun suurimmat hitit, joita ovat tehneet tunnetuiksi mm. Britney Spears, Bon Jovi, Backstreet Boys ja Katy Perry. Tästä musikaalista poistut onnellisena, täynnä energiaa ja korvamato tai pari mukanasi.\n\n& Juliassa traagista on vain jättää se näkemättä.\n\nEsitysoikeuksien valvoja: MTI\nTeksti: David West Read\nTeksti: Max Martin\nSävellys: Max Marti aarikierrokselle Harakan saarella lauantaisin! Työvuorossa oleva opas kierrättää yleisöä saarella. Opas kertoo Harakan saaren luonnosta, luontokeskuksen toiminnasta ja antaa vinkkejä saarella retkeilyyn ja saariluonnon tarkkailuun.\n\nMaksuton opastus kestää tunnin, eikä opastukselle tarvitse ilmoittautua. Opastus alkaa luontotalon edustalta kun klo 13 lähtevä yhteysvene on saapunut saarelle.\n\nYhteysveneen aikataulut ja hinnat: https://www.merenkavijat.fi/yhteysveneen-aikataulu-ja… \n\nYhteysvene liikennöi Ullanlinnanlaiturista, kahvila Ursulan vierestä (Ehrenströmintie 3). Nosta laiturin valkoinen puuviitta pystyyn kuljettajalle merkiksi viimeistään 5 minuuttia ennen aikataulun mukaista lähtöaikaa. Maksamalla matkan MobilePaylla (17371) joudutat yhteysveneen lähtöä. \n\nKatso kaikki luontokeskuksen järjestämät tapahtumat verkkosivulta: www.hel.fi/harakka \n\ntapahtumat-harakka","c":"Dance","cs":["nature centres","nature","archipelagoes","islands","well-being","guidance"],"img":"https://api.hel.fi/linkedevents/media/images/harakan_saarikierros_touko-hein%C3%A4.JPG","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agos5bwhke","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agos5bwhke","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"13:00-14:00","n":0,"nn":0,"i":"helsinki:agos5bwhke","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpie66cgu","t":"Opastettu yleisökierros ruotsiksi kesäkaudella 2026","te":"Guided Walking Tour in Swedish 2026","v":"Suomenlinna-museo","ve":"Suomenlinna Museum","a":"Suomenlinna C 74","la":60.14521,"ln":24.98776,"s":780,"e":840,"d":"The best way to get to know the fascinating story behind the World Heritage Site of UNESCO, Suomenlinna fortress, is to join a guided tour.\n\nThe tour introduces you to the famous fortress and offers interesting perspectives on the history of Finland and Northern Europe.\n\nThe construction works of one of the biggest Nordic fortresses, Suomenlinna, begun in 1748.\n\nDuring the guided walking tour an authorized Suomenlinna-guide tells about the 270 years of eventful history of Suomenlinna under the rule of three different states as well as the life on the islands today. The guide will take you to the most important sights of the fortress, such as the Great Courtyard and the Dry Dock, which in its days was among the largest in the world.\n\nDeparture: Suomenlinna Museum\n\n1.6. - 31.8.2026\n\nDaily 13.00-14.00, not during Midsummer 19.-21.6. Tickets 6-16 €, guidance in Swedish","df":"Linnoitusalueella toteutettavalla kävelykierroksella kuullaan linnoituksen mielenkiintoisesta historiasta ja nykypäivästä. \n\nSuomenlinnan opastettu kierros on paras tapa tutustua linnoitukseen. \n\nOpastuskierros Suomenlinnassa on kävelyretki upeissa puitteissa ja samalla tiivis katsaus Suomenlinnan ja koko Suomen historiaan. Kierroksella tutustutaan päänähtävyyksiin kuten Susisaaren suureen linnanpihaan ja aikoinaan maailman suurimpaan kuivatelakkaan.\n\nOpastus sisältää myös ilmaisen sisäänpääsyn Ehrensvärd-museoon museon aukioloaikana.\n\nLähtöpaikka: Suomenlinna-museo\n\n1.6. - 31.8.2026\n\nPäivittäin 13.00-14.00, ei juhannuksena 19.-21.6. Liput 6-16€, opastus on ruotsinkielinen","c":"Dance","cs":["history","guidance","walking tours","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/_MG_0738_6PxlosO.jpg","u":"https://suomenlinna.johku.com/fi_FI/opastettu-yleisokierros-ruotsiksi","ue":"https://suomenlinna.johku.com/sv_SE/opastettu-yleisokierros-ruotsiksi","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"13:00-14:00","n":0,"nn":0,"i":"helsinki:agpie66cgu","qe":"","qf":"","qz":"","vp":0},{"src":"hf","eid":"hf25492.0","t":"Zonzo Compagnie: Thelonious","te":"Zonzo Compagnie: Thelonious","v":"Suomen kansallisooppera, Alminsali","ve":"Finnish National Opera, Almi Hall","a":"Suomen Kansallisooppera ja -baletti, Helsinginkatu, Helsinki, Suomi","la":60.18158,"ln":24.92962,"s":810,"e":900,"d":"The pioneering Belgian ensemble Zonzo Compagnie delights with a new production for the whole family, centered on jazz legend Thelonious Monk. A maverick genius based in New York, Monk composed music filled with unexpected harmonies and thrilling rhythms. \n\nWinner of the YAMaward for the best performance for young audiences, the production features the adventurous jazz trio De Beren Gieren, who guide the audience into Monk’s unique world through music and theatre. Nele Fack’s impressive video scenography sweeps viewers into the experimental life of the jazz hero, revealing ever-new facets of this fascinating musician. Benjamin Vandewalle’s lively direction draws both the musicians and the audience into a joyful choreography. \n\nSo, hop on the bebop train and dive into the depths of jazz with all your senses! Wherever this musical journey takes you, it is guaranteed to be a wild ride. \n\nThe performance is suitable for the whole family, with a target audience of children aged 6 and up. \n\nDirection: Benjamin Vandewalle \n\nDrums: Simon Raman\n\nPiano: Fulco Ottervanger \n\nDouble Bass: Lieven Van Pée \n\nVideo: Nele Fack (Studio Sandy) \n\nCostumes: Johanna Trudzinski \n\nTechnician: Pat Caers \n\nProduction: Zonzo Compagnie, in collaboration with HA Concerts, Krokusfestival, KAAP & De Grote Post \n\nSupported by: Flanders & the Creative Europe Programme of the European Union","df":"Uraauurtava belgialainen Zonzo Compagnie ilahduttaa uudella koko perheen teoksella, jonka keskiössä on jazz-legenda Thelonious Monk. New Yorkissa vaikuttanut Monk oli itsepäinen nero, joka sävelsi musiikkia täynnä yllättäviä harmonioita ja jännittäviä rytmejä. \n\nParhaiden nuorille suunnattujen esitysten YAMaward-palkinnon saaneessa teoksessa seikkailunhaluinen De Beren Gieren -jazztrio kuljettaa yleisön soittaen ja näytellen Monkin ainutlaatuiseen maailmaan. Nele Fackin vaikuttava videolavastus tempaa katsojat mukaan jazz-sankarin kokeilunhaluiseen elämään ja paljastaa yhä uusia puolia kiehtovasta muusikosta. Benjamin Vandewallen eläväinen ohjaus houkuttelee niin muusikot kuin yleisönkin mukaan riemastuttavaan koreografiaan. \n\nHyppää siis bebop-junan kyytiin, niin pääset sukeltamaan jazzin syövereihin kaikilla aisteilla! Mihin tahansa tämä musiikillinen retki viekään, matka on taatusti vauhdikas. \n\nTeos sopii koko perheelle, ja sen kohderyhmää ovat erityisesti yli 6-vuotiaat. \n\n” Thelonious ei keskity faktoihin, vaan musiikkiin. Kun tähän lisätään video ja muusikoiden tempaukset, yleisö on täysin lumoutunut – jokainen kappale on uusi kohokohta.” – De Standaard \n\nOhjaus: Benjamin Vandewalle \n\nRummut: Simon Raman \n\nPiano: Fulco Ottervanger \n\nKontrabasso: Lieven Van Pée \n\nVideo: Nele Fack (Studio Sandy) \n\nPuvustus: Johanna Trudzinski \n\nTekniikka: Pat Caers \n\nTuotanto: Zonzo Compag","c":"Participate","cs":["Helsinki Festival"],"img":"https://helsinkifestival.fi/app/uploads/sites/8/2026/03/KAYTA-TATA-Thelonious-c-Charlotte-Boeyden-480x270.jpg?ver=696274c7","u":"https://helsinkifestival.fi/event/zonzo-compagnie-thelonious/","ue":"https://helsinkifestival.fi/en/event/zonzo-compagnie-thelonious-2/","price":"","r":2,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":1,"tl":"13:30-15:00","n":0,"nn":0,"i":"hf25492.0","qe":"","qf":"","qz":"","vp":0},{"src":"cur","eid":"cur0","t":"MustikkaFest","te":"MustikkaFest","v":"Mustikkamaa","ve":"Mustikkamaa","a":"Mustikkamaanpolku 10","la":60.18012,"ln":24.98559,"s":840,"e":1200,"d":"","df":"","c":"Participate","cs":["out","free"],"img":"https://api.hel.fi/linkedevents/media/images/lyyti_ig.png","u":"","ue":"","price":"free","r":3,"io":"out","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":1,"tl":"14:00-20:00","n":0,"nn":0,"i":"cur0","qe":"Katve 15:00 · Sound Sisters 15:30 · Duo Henriksson/Virtanen 16:00 · Kaarlo Soudunsaari 17:00 · Freeta Freeta 18:00 · Lyyti 19:00, with workshops running alongside.","qf":"Katve 15:00 · Sound Sisters 15:30 · Duo Henriksson/Virtanen 16:00 · Kaarlo Soudunsaari 17:00 · Free ntares — livemusiikkia, tanssia ja ruokaa Biergartenissa.","qz":"Jaranas del Norte、Uña de Gato、Hola Helsinki、Radio Silencio、Duo Cantares——啤酒花园里的拉美现场、舞蹈和食物。","vp":0},{"src":"hf","eid":"hf25200.1","t":"Rajaton & Club For Five","te":"Rajaton & Club For Five","v":"Huvila","ve":"Huvila","a":"Eläintarhantie 8, 00530 Helsinki, Suomi","la":60.18043,"ln":24.94248,"s":840,"e":930,"d":"Two a cappella giants in one evening! Huvila is proud to present a tent full of dazzling vocal brilliance as Finland’s leading vocal groups, Club For Five and Rajaton, come together for their only joint concert in Helsinki this year. In addition to beloved favourites from both virtuoso ensembles, the programme includes new songs and arrangements from each group, as well as special jointly arranged pieces for this unique 11-member super-ensemble. The evening also promises room for late-summer surprises. \n\nThe internationally acclaimed six-member Rajaton is known for its multifaceted sound world, where classical, jazz, folk and even rock merge seamlessly. \n\nClub For Five captivates its audience with a bold and playful touch, blending deep artistry, humour and Nordic musical tradition. \n\nThis specially tailored concert for Huvila, complete with an intermission, reveals a soundscape where the human voice makes the impossible possible. This long-awaited night, requested by Helsinki Festival audiences for years, will be overflowing with harmony, energy and charisma. \n\nAge limit: 18","df":"Kaksi a cappella -suuruutta samassa illassa! Huvila saa kunnian tarjoilla teltan täydeltä häikäisevää vokaalitaituruutta, kun Suomen eturivin lauluyhtyeet Club For Five ja Rajaton kokoontuvat ainoalle Helsingin yhteiskeikalleen tänä vuonna. Virtuoottisten lauluyhtyeiden omien, rakastettujen kappaleiden lisäksi luvassa on molemmilta kokoonpanoilta uusia lauluja ja sovituksia sekä 11-henkisen huippukokoonpanon yhteisiä kappaleita. Ilta luo kihelmöivän mahdollisuuden myös loppukesään sopiville yllätysnumeroille. \n\nMaailmallakin menestystä niittänyt, vuonna 1997 perustettu Rajaton tunnetaan taidokkaasta ja moni-ilmeisestä äänimaailmastaan, joka yhdistelee ennakkoluulottomasti ja ainutlaatuisesti eri musiikkityylejä. \n\nClub For Five lumoaa yleisönsä rohkealla ja leikittelevällä otteellaan, jossa yhdistyvät syvä taituruus, huumori ja pohjoismainen musiikkiperinne. \n\nHuvilaan räätälöity, väliajallinen konsertti esittelee yleisölle sävelmaailman, jossa ihmisääni tekee mahdottomasta mahdollista. Juhlaviikkoyleisön hartaasti toivomasta illasta ei harmoniaa, energiaa saati karismaa puutu. \n\nLisätiedot: \n Ovet: 13.00\n\nRajaton & Club for Five: 14.00, konsertissa on väliaika\n\nKonsertti päättyy n. klo 16.30\n\nOvet: 17.30\n\nRajaton & Club for Five: 19.00, konsertissa on väliaika\n\nKonsertti päättyy n. klo 22.00\n\nIstuva katsomo, ei numeroituja paikkoja. \n\nHuvilan ikäraja on 18 vuotta.","c":"Participate","cs":["Helsinki Festival"],"img":"https://helsinkifestival.fi/app/uploads/sites/8/2025/12/HJV_rajaton_club_1920x1080-480x270.png?ver=e642bfe2","u":"https://helsinkifestival.fi/event/rajaton-club-for-five-3/","ue":"https://helsinkifestival.fi/en/event/rajaton-club-for-five/","price":"","r":2,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":1,"tl":"14:00-15:30","n":0,"nn":0,"i":"hf25200.1","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agqbj7idqe","t":"Eat, Sip and Paint: Kierrätyslasin maalaustyöpaja","te":"Upcycled Glass Painting Workshop","v":"Daruma Kitchen","ve":"Daruma Kitchen","a":"Verkkoneula 6","la":60.19176,"ln":24.98055,"s":840,"e":1020,"d":"Eat, Sip and Paint: Upcycled Glass Painting Workshop\n\nLooking for a creative workshop in Helsinki that combines art, good food, and a relaxed atmosphere?\n\nJoin us at Daruma Kitchen for a guided glass painting workshop, where you can enjoy a drink, unwind after work, and create something unique to take home.\n\nThe workshop is beginner-friendly and guided step by step by Theresa from Echoes Glow, focuse n\nPaikka: Maunula-talon aukio ja sen ympäristö\n\nVapaa ohjelma klo 14–19: \nSaunabaarin paitapaino, vapaa vilttikirppis, partiolaisten lippukunta Vuokkojen retkeilykirppis, Maunula-Seuran makkarateltta, somalialaisia sambusa-leivonnaisia ja muita herkkuja, MAYK:n luokka 9K pitää kahvilaa aulassa.\n\nSaunabaarin kangaspainantapiste kello 15–18: \n\nTervetuloa painattamaan kangasmaaleilla kankaalle kuvioita. Tuo oma kankaasi, esim. kangaskassi tai t-paita tai osallistu pisteellä tehtävään yhteisöviiriin, joka tulee esille Stadin yhteisötalo Saunabaarin tiloihin.\n\nVilttikirppis kello 14–19: \n\nTervetuloa myymään, ostamaan ja fiilistelemään talon edustan nurmikenttien kirppikselle.\n\nVapaa pääsy, ei ennakkoilmoittautumista. Kirppispaikat sijaitsevat mm. kirjaston lasiseinän vastapäätä nurmikentällä. Voimakkaan sateen sattuessa kirppis peruuntuu.\n\nTulemalla myyjäksi sitoudut näihin ehtoihin:\n• Tuo paikalle oma kangas, pieni pöytä tai rekki, jonka päälle asettelet tuotteesi.\nJätäthän tilaa myös muille – tuo paikalle harkittu määrä sesongin mukaista tavaraa.\n• Tässä tapahtumassa myydään vain omaa käytettyä tavaraa.\n• Tulemalla paikalle sitoudut siivoamaan jälkesi! Maunula-talo ei vastaa mahdollisesti jäljelle jäänei","c":"Theatre","cs":["Työpajat","outdoor games","music","outdoor recreation","playing (children's games)","plays and games"],"img":"https://api.hel.fi/linkedevents/media/images/Julisteet_syksy_2026.jpg","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agpo5amfae","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agpo5amfae","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"14:00-20:00","n":0,"nn":0,"i":"helsinki:agpo5amfae","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:69300","t":"Stoan Suomen luonnon päivä: Pekko Käppi, Riikka Kaihovaara ja Sanja Hakala","te":"Finnish Nature Day: Pekko Käppi, Riikka Kaihovaara ja Sanja Hakala","v":"Stoa","ve":"Cultural Centre Stoa","a":"Turunlinnantie 1","la":60.2121,"ln":25.07989,"s":840,"e":960,"d":"On Finnish Nature Day, the forest beckons! Join us for a walk to Hallainvuori and a concert by Pekko Käppi.\n\nAt the concert venue, Scouts serve a cup of forest-style coffee to the first 50 people.\n\n14.00 | A walk with journalist Riikka Kaihovaara. \nDeparture point: Playground Hallainvuori, Myllärintie 6. \n Sign up for the walk with Riikka Kaihovaara via this link .\n\n14.00 | A walk for children and adults, led by biologist and non-fiction writer Sanja Hakala, to learn about bugs. \nDeparture point: The intersection of Viilarintie and Holkkitie in Roihupelto. The nearest tram stop (Raide-Jokeri line 15) is Kauppamyllyntie.\n Sign up for Sanja Hakala’s bug excursion here. \n\n15.00 | Forest concert by jouhikko bowed lyre artist Pekko Käppi \nBring something to sit on. You are welcome to attend the concert even if you do not take part in the guided walks. No registration required. Attendees are guided to the concert venue from The intersection of Viilarintie and Holkkitie in Roihupelto. The nearest tram stop (Raide-Jokeri line 15) is Kauppamyllyntie.\n\nPekko Käppi is a versatile musician who specialises in the old Finnish song tradition and plays the Finnish-Karelian jouhikko bowed lyre. Käppi is best known as a pioneer of the revival of the jouhikko, but also as a researcher, teacher, producer and composer. He has composed music for films, theatre, installations and recordings. Käppi’s ","df":"Suomen luonnon päivänä metsä kutsuu! Liity mukaan kävelylle Hallainvuoreen ja Pekko Käpin konserttiin.\n\nKonserttipaikalla Myllypuron Mustarastaat -partiolippukunta tarjoaa metsäkahvit 50:lle ensimmäiselle.\n\nklo 14 | kävely toimittaja Riikka Kaihovaaran seurassa. \nLähtö: Leikkipaikka Hallainvuori, Myllärintie 6.\n Ilmoittaudu kävelylle Riikka Kaihovaaran seurassa tästä linkistä .\n\nklo 14 | kävely lapsille ja aikuisille biologi ja tietokirjailija Sanja Hakalan seurassa ötököihin tutustuen. \nLähtö: Viilarintien ja Holkkitien risteys Roihupellossa. Lähin raitiovaunupysäkki (Raidejokeri linja 15) Kauppamyllyntie. \n Ilmoittaudu Sanja Hakalan ötökkätutkimusmatkalle tästä. \n\nklo 15 | Metsäkonsertissa jouhikkotaiteilija Pekko Käppi \nOta mukaan istuinalusta. Konserttiin voi tulla, vaikka ei osallistuisi ohjelmallisille kävelyille. Ei ilmoittautumista. Opastus konserttipaikalle Viilarintien ja Holkkitien risteyksestä klo 14.45. Lähin raitiovaunupysäkki Kauppamyllyntie.\n\nPekko Käppi on monipuolinen musiikintekijä, joka on erikoistunut vanhaan suomalaiseen lauluperinteeseen ja soittaa suomalais-karjalaista jouhikkoa. Käppi tunnetaan erityisesti jouhikon soiton uuden tulemisen pioneerina, mutta myös tutkijana, opettajana, tuottajana ja säveltäjänä. Käpin musiikissa yhdistyvät kansanperinne, tarinat, blues-sävyt sekä voimakas ja vangitseva lavakarisma.\n\nRiikka Kaihovaara on suomalainen dokumen","c":"Music","cs":["Musiikki","Stoa","Muut tapahtumat","Suomi","Ruotsi","Englanti"],"img":"http://www.stoa.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_793723.jpg","u":"http://www.stoa.fi/fi/tapahtumat/event/8B98D98603660D2FD7CEE575BB858041/Stoan_Suomen_luonnon_paiva_Pekko_Kappi_Riikka_Kaihovaara_ja_Sanja_Hakala","ue":"http://www.stoa.fi/en/events/event/8B98D98603660D2FD7CEE575BB858041/Finnish_Nature_Day_Pekko_Kappi_Riikka_Kaihovaara_ja_Sanja_Hakala","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"14:00-16:00","n":0,"nn":0,"i":"kulke:69300","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp5namjua","t":"Eesti Noorsooteater: Transport: Frontline","te":"Eesti Noorsooteater: Transport: Frontline","v":"Nukketeatteri Sampo","ve":"Puppet Theatre Sampo","a":"Erottajankatu 7","la":60.16503,"ln":24.94418,"s":840,"e":885,"d":"Transport: Frontline places the viewer in the heart of a war zone and humanitarian crisis, where— through the lens of a war photographer—they become a witness to unfolding events. \n\nHer camera does more than document—it frames a moral landscape where every image captured carries the weight of choice and consequence.\n\nLike war photography, the performance questions the limits of representation: when does an image open a space for empathy, and when does it slip into the aestheticization of suffering.\n\nThe performance invites reflection on the role of the individual in a world shaped by moral dilemmas and urges active confrontation with the systems of violence we help create—or sustain through silence.\n\nAt a time when the line between testimony and sensationalism is increasingly blurred, Transport: Frontline offers a space for reflection on responsibility, solidarity, and the power of the gaze.\n\nTransport is not merely an artistic experience, but a call for change, raising essential ethical questions and challenging us to reconsider the role and responsibility in times of global crisis.\n\nPuppet Theatre Sampo\n\n28.-30.8.2026\n\nPerformances:\n\n28.8. at 18.00-18.45\n\n29.8. & 30.8. at 14.00-14.45\n\nTickets 25€, age recommendation 15+\n\nPerformed in English, surtitles in Finnish","df":"Transport: Frontline asettaa katsojan keskelle sotavyöhykettä ja humanitaarista kriisiä, jossa – sotakuvaajan näkökulman kautta – hänestä tulee todistaja tapahtumien etenemiselle. \n\nHänen kameransa tekee muutakin kuin dokumentoi: se kehystää moraalisen maiseman, jossa jokainen tallennettu kuva kantaa valinnan ja seurausten painoa.\n\nKuten sotajournalismi, esitys kyseenalaistaa representaation rajat: milloin kuva avaa tilan empatialle ja milloin se lipsahtaa kärsimyksen estetisoimiseksi?\n\nEsitys kutsuu pohtimaan yksilön roolia moraalisten dilemmojen muovaamassa maailmassa ja rohkaisee aktiiviseen kohtaamiseen väkivallan järjestelmien kanssa, joita joko luodaan – tai ylläpidetään hiljaisuudella. \n\nAikana, jolloin raja todistamisen ja sensaationhakuisuuden välillä hämärtyy, Transport: Frontline tarjoaa tilan pohdinnalle vastuusta, solidaarisuudesta ja katseen voimasta.\n\nTransport ei ole pelkkä taiteellinen kokemus, vaan kutsu muutokseen. Se nostaa esiin olennaisia eettisiä kysymyksiä ja haastaa tarkastelemaan uudelleen roolia ja vastuuta globaalien kriisien aikana.\n\nNukketeatteri Sampo\n\n28.-30.8.2026\n\nEsitykset:\n\n28.8. klo 18.00-18.45\n\n29.8. & 30.8. klo 14.00-14.45\n\nLiput 25€, ikäsuositus 15+\n\nEsitetään englanniksi, tekstitys suomeksi","c":"Theatre","cs":["theatre (art forms)","cultural events","puppet theatres"],"img":"https://api.hel.fi/linkedevents/media/images/Transport_Frontline_Photo_OskarSuurorg_DSC02963.jpg","u":"https://sampofestival.fi/","ue":"https://sampofestival.fi/en/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"14:00-14:45","n":0,"nn":0,"i":"helsinki:agp5namjua","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp5mu7re4","t":"Stoan Suomen luonnon päivä: Pekko Käppi, Riikka Kaihovaara ja Sanja Hakala","te":"Stoan Suomen luonnon päivä: Pekko Käppi, Riikka Kaihovaara ja Sanja Hakala","v":"Itäkeskuksen kirjasto","ve":"Itäkeskus Library","a":"Turunlinnantie 1","la":60.21196,"ln":25.08022,"s":840,"e":960,"d":"Suomen luonnon päivänä metsä kutsuu! Liity mukaan kävelylle Karhukallion metsään Pekko Käpin konserttiin.\n\nKonserttipaikalla partiolaiset tarjoavat metsäkahvit 50:lle ensimmäiselle.\n\nklo 14 Riikka Kaihovaara johdattelee kirjalliselle retkelle Hallainvuoren ja Karhukallion metsiin. Lähtö: Leikkipaikka Hallainvuori, Myllärintie 6.\nIlmoittautuminen: https://ilmonet.fi/course/H265474 \n\nklo 14 Biologi ja tietokirjailija Sanja Hakala johdattaa lapset ja aikuiset Karhukallion ötököiden maailmaan. - TÄYNNÄ\n\nklo 15 Metsäkonsertissa jouhikkotaiteilija Pekko Käppi \nOta mukaan istuinalusta. Konserttiin voi tulla vaikka ei osallistuisi ohjelmallisille kävelyille. Opastus konserttipaikalle Viilarintien ja Holkkitien risteyksestä klo 14.45. Lähin raitiovaunupysäkki Kauppamyllyntie.\n\n***\n\nPekko Käppi on monipuolinen musiikintekijä, joka on erikoistunut vanhaan suomalaiseen lauluperintees
