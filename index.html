<style>
/* ============================================================
   TOKENS — Festarri M3 language, extended with a rank scale.
   Light is the Festarri canvas; dark is the Art Night purple.
   ============================================================ */
:root{
  --corner-xs:4px;--corner-s:6px;--corner-m:10px;--corner-l:12px;
  --corner-l-inc:14px;--corner-xl:18px;--corner-xl-inc:22px;--corner-full:999px;
  --ease-emphasized:cubic-bezier(.2,0,0,1);
  --ease-emph-decel:cubic-bezier(.05,.7,.1,1);
  --ease-emph-accel:cubic-bezier(.3,0,.8,.15);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --dur-short2:100ms;--dur-short3:150ms;--dur-short4:200ms;
  --dur-med1:250ms;--dur-med2:300ms;--dur-med4:400ms;--dur-long1:450ms;--dur-long2:500ms;
  --font:"Roboto Flex","Roboto","Helvetica Neue",Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --elev-1:0 1px 2px rgba(28,29,33,.07),0 1px 3px 1px rgba(28,29,33,.05);
  --elev-2:0 2px 6px 2px rgba(28,29,33,.09),0 1px 2px rgba(28,29,33,.10);
  --elev-3:0 -4px 24px 4px rgba(28,29,33,.14),0 2px 4px rgba(28,29,33,.10);
  --tl-h:118px;

  /* Black, white and grey carry the interface. The five given colours --
     #C4AFD4, #F6C9DE, #F2A8C4, #C7DFF9, #A9C9F7 -- are accents, spent in five
     places only: the primary action, the rank a session was given, the badge
     that says something is on right now, the in-plan state, and a warning.
     Everything else, including the hundred and fifty ordinary sessions at rank
     zero, is neutral grey.

     All five are pastels, which decides how they may be used: against white
     they reach 1.37 to 2.01, so not one of them can ever be text or an outline.
     They are grounds, and the ink on them is always #1C1D21, which clears 8.36
     to 12.31 on every one. That is also why the primary action is dark text on
     pink rather than white text on it. */
  --primary:#F2A8C4;--on-primary:#1C1D21;
  --primary-container:#C7DFF9;--on-primary-container:#1C1D21;
  --surface:#FFFFFF;--on-surface:#1C1D21;
  --surface-container-low:#FAFAFB;--surface-container:#F3F4F6;
  --surface-container-high:#ECEDEF;--surface-container-highest:#E4E5E8;
  --on-surface-variant:#65686F;
  --outline:#8E9099;--outline-variant:#E4E5E8;
  --inverse-surface:#1C1D21;--inverse-on-surface:#F3F4F6;--inverse-primary:#F2A8C4;
  --scrim:#1C1D21;
  --glass:rgba(255,255,255,.92);
  --accent-soft:#F2A8C4;
  --c-visual-bg:#ECEDEF;--c-visual-ink:#4A4C53;
  --c-music-bg:#ECEDEF;--c-music-ink:#4A4C53;
  --c-dance-bg:#ECEDEF;--c-dance-ink:#4A4C53;
  --c-part-bg:#ECEDEF;--c-part-ink:#4A4C53;
  --c-lit-bg:#ECEDEF;--c-lit-ink:#4A4C53;
  --c-theatre-bg:#ECEDEF;--c-theatre-ink:#4A4C53;
  --c-film-bg:#ECEDEF;--c-film-ink:#4A4C53;
  --r3:#1C1D21;--r3-bg:#F2A8C4;
  --r2:#1C1D21;--r2-bg:#A9C9F7;
  --r1:#1C1D21;--r1-bg:#C4AFD4;
  --r0:#4A4C53;--r0-bg:#E4E5E8;
  --warn-bg:#F2A8C4;--warn-ink:#1C1D21;
  --tiles:none;--map-tint:rgba(28,29,33,0);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#F2A8C4;--on-primary:#1C1D21;
  --primary-container:#2A2C31;--on-primary-container:#E7E8EC;
  --surface:#16171A;--on-surface:#E7E8EC;
  --surface-container-low:#1B1C20;--surface-container:#212327;
  --surface-container-high:#282A2F;--surface-container-highest:#2F3138;
  --on-surface-variant:#A2A5AD;
  --outline:#8E9099;--outline-variant:#31333A;
  --inverse-surface:#E7E8EC;--inverse-on-surface:#212327;--inverse-primary:#F2A8C4;
  --scrim:#000000;--glass:rgba(22,23,26,.88);
  --accent-soft:#F2A8C4;
  --c-visual-bg:#282A2F;--c-visual-ink:#C6C9D0;
  --c-music-bg:#282A2F;--c-music-ink:#C6C9D0;
  --c-dance-bg:#282A2F;--c-dance-ink:#C6C9D0;
  --c-part-bg:#282A2F;--c-part-ink:#C6C9D0;
  --c-lit-bg:#282A2F;--c-lit-ink:#C6C9D0;
  --c-theatre-bg:#282A2F;--c-theatre-ink:#C6C9D0;
  --c-film-bg:#282A2F;--c-film-ink:#C6C9D0;
  --r3:#1C1D21;--r3-bg:#F2A8C4;
  --r2:#1C1D21;--r2-bg:#A9C9F7;
  --r1:#1C1D21;--r1-bg:#C4AFD4;
  --r0:#C6C9D0;--r0-bg:#2F3138;
  --warn-bg:#F2A8C4;--warn-ink:#1C1D21;
  --tiles:none;--map-tint:rgba(22,23,26,.18);
}}
:root[data-theme="dark"]{
  --primary:#F2A8C4;--on-primary:#1C1D21;
  --primary-container:#2A2C31;--on-primary-container:#E7E8EC;
  --surface:#16171A;--on-surface:#E7E8EC;
  --surface-container-low:#1B1C20;--surface-container:#212327;
  --surface-container-high:#282A2F;--surface-container-highest:#2F3138;
  --on-surface-variant:#A2A5AD;
  --outline:#8E9099;--outline-variant:#31333A;
  --inverse-surface:#E7E8EC;--inverse-on-surface:#212327;--inverse-primary:#F2A8C4;
  --scrim:#000000;--glass:rgba(22,23,26,.88);
  --accent-soft:#F2A8C4;
  --c-visual-bg:#282A2F;--c-visual-ink:#C6C9D0;
  --c-music-bg:#282A2F;--c-music-ink:#C6C9D0;
  --c-dance-bg:#282A2F;--c-dance-ink:#C6C9D0;
  --c-part-bg:#282A2F;--c-part-ink:#C6C9D0;
  --c-lit-bg:#282A2F;--c-lit-ink:#C6C9D0;
  --c-theatre-bg:#282A2F;--c-theatre-ink:#C6C9D0;
  --c-film-bg:#282A2F;--c-film-ink:#C6C9D0;
  --r3:#1C1D21;--r3-bg:#F2A8C4;
  --r2:#1C1D21;--r2-bg:#A9C9F7;
  --r1:#1C1D21;--r1-bg:#C4AFD4;
  --r0:#C6C9D0;--r0-bg:#2F3138;
  --warn-bg:#F2A8C4;--warn-ink:#1C1D21;
  --tiles:none;--map-tint:rgba(22,23,26,.18);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
img{display:block;max-width:100%}

/* ============================================================
   SHELL — mobile is one column: map behind, sheet over it,
   timeline docked to the bottom. Desktop splits into rail + map.
   ============================================================ */
.app{position:fixed;inset:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr}
.mapwrap{position:relative;grid-area:1/1;overflow:hidden;background:var(--surface-container-low)}
#map{position:absolute;inset:0;z-index:0}
#map .leaflet-tile-pane{filter:var(--tiles)}
.maptint{position:absolute;inset:0;z-index:399;pointer-events:none;background:var(--map-tint)}
.leaflet-container{background:var(--surface-container-low);font-family:var(--font)}
.leaflet-control-zoom{display:none}
.leaflet-bottom{margin-bottom:0}
.leaflet-control-attribution{font-size:10px;background:var(--glass) !important;
  color:var(--on-surface-variant) !important;padding:1px 5px}
.leaflet-control-attribution a{color:var(--primary) !important}

/* ---- top chrome: one 42px row, nothing stacked on top of it ---- */
.topbar{position:absolute;z-index:500;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;
  display:flex;gap:8px;align-items:center;pointer-events:none;height:42px}
.topbar>*{pointer-events:auto}
.pillrow{flex:1 1 auto;min-width:0;display:flex;gap:8px;align-items:center;
  overflow-x:auto;scrollbar-width:none;padding:7px 2px;margin:-7px -2px;
  -webkit-mask:linear-gradient(to right,#000 calc(100% - 18px),#0000);
  mask:linear-gradient(to right,#000 calc(100% - 18px),#0000)}
.pillrow::-webkit-scrollbar{display:none}
.pill{height:42px;padding:0 14px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1);
  display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
  font:600 14px/20px var(--font);white-space:nowrap;
  transition:background var(--dur-short3),color var(--dur-short3),transform var(--dur-short4) var(--spring)}
.pill:active{transform:scale(.94)}
.pill svg{width:18px;height:18px;flex:0 0 18px}
.pill[data-active="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.pill .n{min-width:18px;height:18px;padding:0 5px;border-radius:var(--corner-full);
  background:var(--on-surface);color:var(--surface);font:700 11px/18px var(--font);text-align:center}
.pill[data-active="true"] .n{background:var(--on-primary-container);color:var(--primary-container)}
.circle-btn{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:var(--corner-full);
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1);
  display:grid;place-items:center;cursor:pointer;font:800 12px/1 var(--mono);letter-spacing:-.3px;
  transition:transform var(--dur-short4) var(--spring),background var(--dur-short2)}
.circle-btn:active{transform:scale(.9)}
.circle-btn svg{width:20px;height:20px}

/* ---- base-map switch, second row, left side, clear of everything ---- */
.mapchrome{position:absolute;z-index:500;left:12px;top:calc(62px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:8px}
/* Where Google Maps keeps it: bottom right, riding just above the sheet, so it
   stays reachable by the thumb whatever height the list is at. */
.locate{position:absolute;z-index:505;right:12px;width:44px;height:44px;
  top:calc(var(--sheet-y,60%) - 56px);
  transition:top var(--dur-long2) var(--ease-emph-decel)}
.locate svg{width:20px;height:20px}
.locate[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.locate[data-busy="1"] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* the blue dot everyone already knows */
.mypos{border-radius:50%;background:var(--primary);
  box-shadow:0 0 0 3px var(--surface),0 1px 6px rgba(28,29,33,.35)}
.seg{position:relative;display:flex;padding:3px;border-radius:var(--corner-full);
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1)}
.seg button{border:0;background:none;cursor:pointer;height:30px;padding:0 12px;
  border-radius:var(--corner-full);color:var(--on-surface-variant);
  font:600 12px/16px var(--font);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  transition:background var(--dur-short3),color var(--dur-short3)}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}

/* ---- markers ---- */
.mk{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk[data-on="0"]{display:none}
.mk .bub{border-radius:var(--corner-full);display:grid;place-items:center;
  box-shadow:var(--elev-2);border:2px solid currentColor;
  transition:transform var(--dur-med2) var(--spring)}
.mk .bub svg{width:60%;height:60%}
.mk-r3{color:var(--r3)}
.mk-r3 .bub{width:38px;height:38px;background:var(--r3-bg)}
.mk-r2{color:var(--r2)}
.mk-r2 .bub{width:29px;height:29px;background:var(--r2-bg)}
.mk-r1{color:var(--r1)}
.mk-r1 .bub{width:22px;height:22px;background:var(--r1-bg)}
.mk-r0{color:var(--r0)}
.mk-r0 .bub{width:13px;height:13px;border-width:2px;background:var(--r0-bg)}
.mk-r0 .bub svg{display:none}
/* A cluster wears the highest rank inside it, so a group holding something
   unmissable still reads as unmissable before you open it. These follow the
   rank rules so they win the size on equal specificity. */
.mk-cl .bub{width:100%;height:32px;padding:0 9px;border-radius:var(--corner-full);
  font:800 13px/1 var(--mono);color:currentColor;letter-spacing:.2px}
.mk-cl .bub svg{display:none}
.mk-cl .lab{display:none}
.mk-cl.has-plan{color:var(--primary)}
.mk-cl.has-plan .bub{background:var(--primary-container)}
.mk .lab{margin-bottom:3px;order:-1;max-width:160px;padding:2px 7px;border-radius:var(--corner-s);
  background:var(--surface);box-shadow:var(--elev-1);border:1px solid currentColor;
  color:var(--on-surface);font:700 10px/14px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-r1 .lab,.mk-r0 .lab{display:none}
#map:not([data-close="1"]) .mk-r2 .lab{display:none}
/* In the plan: the pin takes the plan's own colour and wears its stop number,
   so the route reads as 1 → 2 → 3 without opening anything. */
.mk.in-plan{color:var(--primary)}
.mk.in-plan .bub{background:var(--primary-container);
  box-shadow:var(--elev-2),0 0 0 3px var(--surface)}
.mk.in-plan .bub svg{display:none}
.mk.in-plan .bub::after{content:attr(data-n);font:800 12px/1 var(--mono)}
.mk-r0.in-plan .bub{opacity:1}
.mk-r0.in-plan .bub::after{content:none}
.mk.sel .bub{transform:scale(1.3)}
.mk.sel::after{content:"";position:absolute;left:50%;bottom:0;width:66px;height:66px;
  margin:0 0 -16px -33px;border-radius:50%;background:var(--accent-soft);opacity:.42;
  animation:ping 2.4s ease-out infinite;pointer-events:none;z-index:-1}
.mk-r3.sel{color:var(--r3)}.mk-r2.sel{color:var(--r2)}.mk-r1.sel{color:var(--r1)}
@keyframes ping{0%{transform:scale(.5);opacity:.38}70%{transform:scale(1.45);opacity:0}100%{opacity:0}}
.planline{stroke-dasharray:2 7;stroke-linecap:round}

/* Bloom motion, from design/patterns/festarri-bloom-icons.html.
   Two grades, and the choice is not taste: bi-pop is one <use> and one
   scale and goes everywhere; the six staggered petals are the hero
   moment only, which here is the detail panel's own button. Running
   six staggered animations on every row of a list is the thing that
   rule exists against. */
@keyframes bi-pop      {0%{transform:scale(.72)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes bi-fade     {from{opacity:0}to{opacity:1}}
@keyframes bi-petal-in {from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bi-centre-in{from{transform:scale(0)}to{transform:none}}
.bi--sel{transform-box:view-box;transform-origin:12px 12px;
  animation:bi-pop var(--dur-med2) var(--ease-emph-decel) both}
.bi--unsel{animation:bi-fade var(--dur-short4) var(--ease-standard) both}
.bi--bloom>g,.bi--bloom>circle{transform-box:view-box;transform-origin:12px 12px}
.bi--bloom>g{animation:bi-petal-in 400ms var(--ease-emph-decel) both}
.bi--bloom>g:nth-child(2){animation-delay:40ms}
.bi--bloom>g:nth-child(3){animation-delay:80ms}
.bi--bloom>g:nth-child(4){animation-delay:120ms}
.bi--bloom>g:nth-child(5){animation-delay:160ms}
.bi--bloom>g:nth-child(6){animation-delay:200ms}
.bi--bloom>circle{animation:bi-centre-in var(--dur-med2) var(--ease-emph-decel) 260ms both}

/* The favourite blast, ported keyframe for keyframe from Festarri's own
   (scripts/home.html): two rings, then waves of streaks, sparks and petals
   thrown out of the pressed control into a fixed layer, so nothing clips
   them and nothing reflows. Putting an event in your plan here is the same
   act as starring a festival there, so it is the same blast. */
@keyframes fp-fav-ring{
  0%{transform:scale(.2);opacity:0;border-width:12px}
  10%{opacity:.85}
  100%{transform:scale(2.9);opacity:0;border-width:1px}}
@keyframes fp-fav-spark{
  0%{transform:rotate(var(--a)) translateX(calc(var(--fs) * .1)) scale(.35);opacity:0}
  12%{opacity:1}72%{opacity:1}
  100%{transform:rotate(var(--a)) translateX(calc(var(--fs) * var(--d))) scale(.12);opacity:0}}
@keyframes fp-fav-petal{
  0%{transform:rotate(var(--a)) translateX(calc(var(--fs) * .1)) scale(.2) rotate(0deg);opacity:0}
  14%{opacity:1}70%{opacity:1}
  100%{transform:rotate(var(--a)) translateX(calc(var(--fs) * var(--d))) scale(1) rotate(300deg);opacity:0}}
.fp-blast{position:fixed;z-index:940;width:40px;height:40px;pointer-events:none}
.fp-blast i{display:block}

/* ============================================================
   TIMELINE — fixed height, three fixed rows. Nothing here wraps.
   ============================================================ */
.timeline{position:absolute;z-index:505;left:0;right:0;bottom:auto;
  top:calc(62px + env(safe-area-inset-top));
  display:flex;justify-content:flex-end;pointer-events:none;padding:0 12px}
.tl-inner{pointer-events:auto;width:100%;overflow:hidden;
  transition:box-shadow var(--dur-med2);
  background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--elev-2);
  border:1px solid var(--outline-variant);border-radius:var(--corner-xl);
  padding:6px 14px 8px}
.tl-head{display:flex;align-items:center;gap:10px;height:34px}
.tl-clock{flex:0 0 auto;border:0;background:none;padding:0 2px;cursor:pointer;
  color:inherit;font:700 24px/26px var(--mono);letter-spacing:-1.2px}
.tl-clock[data-off="1"]{color:var(--primary)}
.tl-sub{flex:1 1 auto;min-width:0;color:var(--on-surface-variant);
  font:400 12px/16px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-sub b{color:var(--on-surface);font-weight:700}
.tl-nudge{flex:0 0 auto;display:flex;gap:6px}
.tl-nudge button{width:30px;height:30px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--surface-container);display:grid;place-items:center}
.tl-nudge button svg{width:16px;height:16px}
.tl-track{position:relative;height:44px;touch-action:none;cursor:ew-resize;user-select:none;
  margin-top:2px}
#tlsvg{display:block;width:100%;height:44px}
.tl-ticks{display:flex;justify-content:space-between;height:14px;
  color:var(--on-surface-variant);font:500 10px/14px var(--mono)}
#tlReset{color:var(--primary)}
.timeline[data-collapsed="1"] #tlReset{display:none}
#tlToggle svg{transition:transform var(--dur-med2) var(--ease-emphasized)}
#tlToggle[aria-expanded="false"] svg{transform:rotate(180deg)}
/* collapsed: the card shrinks to a pill that still scrubs, and gives the list its space back */
.timeline[data-collapsed="1"] .tl-inner{width:auto;border-radius:var(--corner-full);
  padding:2px 5px 2px 13px}
/* expanded, the card takes the whole row, so what it grew next to steps aside */
.mapwrap.tl-open .mapchrome{opacity:0;pointer-events:none;transition:opacity var(--dur-short3)}
/* The list outranks the map's own controls: they sit below it and are simply
   covered as it rises, rather than floating over the thing being read. */
.mapwrap.sheet-full .mapchrome,
.mapwrap.sheet-full .locate{opacity:0;pointer-events:none}
.mapwrap .mapchrome,.mapwrap .locate{transition:opacity var(--dur-short4) var(--ease-standard)}
.timeline[data-collapsed="1"] .tl-sub,
.timeline[data-collapsed="1"] .tl-track,
.timeline[data-collapsed="1"] .tl-ticks{display:none}
.timeline[data-collapsed="1"] .tl-head{height:32px;gap:6px}
.timeline[data-collapsed="1"] .tl-clock{font-size:18px;line-height:20px}
.timeline[data-collapsed="1"] .tl-nudge button{width:26px;height:26px}
.timeline[data-collapsed="1"] .tl-nudge button svg{width:14px;height:14px}

/* ============================================================
   SHEET — the list, the detail and the plan all live here
   ============================================================ */
.sheet{position:absolute;z-index:510;left:0;right:0;top:0;height:calc(100% - var(--nav-h) - env(safe-area-inset-bottom));
  background:var(--surface);border-radius:var(--corner-xl) var(--corner-xl) 0 0;
  box-shadow:var(--elev-3);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(var(--y,62%));
  transition:transform var(--dur-long2) var(--ease-emph-decel)}
.sheet.dragging{transition:none}
.grab{flex:0 0 auto;padding:0 16px 8px;cursor:grab;user-select:none;touch-action:none}
.grab:active{cursor:grabbing}
.handle{height:22px;display:grid;place-items:center;padding-top:8px}
.handle i{width:36px;height:4px;border-radius:var(--corner-full);background:var(--outline-variant)}
.brand{display:flex;align-items:center;gap:10px;padding:0 2px 8px;
  color:var(--on-surface-variant);font:700 10px/14px var(--font);letter-spacing:1.15px;
  text-transform:uppercase}
.brand .bm{display:inline-flex;align-items:center;gap:6px;color:var(--primary)}
.brand .bm svg{width:17px;height:17px}
.brand .bt{margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  padding:2px 9px;border-radius:var(--corner-full);
  background:var(--r3-bg);color:var(--r3)}

.sheet-head{display:flex;align-items:center;gap:10px;min-height:38px}
/* peeking, the sheet is a handle and a line - so the line carries the count */
.sheet[data-peek="1"] .brand{padding-bottom:4px}
.sheet[data-peek="1"] .sheet-head b{font-size:18px;line-height:23px}
.sheet-head .ht{flex:1;min-width:0}
.sheet-head b{display:block;font:800 20px/25px var(--font);letter-spacing:-.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head span{display:block;color:var(--on-surface-variant);font:400 12px/16px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .circle-btn{background:var(--surface-container);box-shadow:none;backdrop-filter:none;
  width:38px;height:38px;flex:0 0 38px}
.searchbar{display:flex;align-items:center;gap:9px;margin-top:8px;padding:0 12px;height:46px;
  border-radius:var(--corner-full);background:var(--surface-container)}
.searchbar>svg{width:19px;height:19px;flex:0 0 19px;color:var(--on-surface-variant)}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;color:inherit;
  font:500 15px/20px var(--font)}
.searchbar input::-webkit-search-cancel-button{display:none}
.searchbar button{width:30px;height:30px;flex:0 0 30px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface-container-highest);color:var(--on-surface-variant);
  display:grid;place-items:center}
.searchbar button svg{width:15px;height:15px}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  padding:0 14px calc(28px + var(--sheet-y,0px));scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.sbody.locked{overflow:hidden}

/* ---- list rows: image, rank badge on the image, then the facts ---- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:11px;padding:8px;cursor:pointer;text-align:left;
  border:0;width:100%;background:var(--surface);border-radius:var(--corner-l);
  box-shadow:inset 0 0 0 1px var(--surface);
  transition:transform var(--dur-short4) var(--spring),box-shadow var(--dur-short3)}
/* The whole programme is 423 rows. Off-screen ones are skipped for layout and
   paint entirely; the remembered height keeps the scrollbar and any restored
   scroll position honest. One animation on the panel replaced 423 on the rows. */
/* Every part of a row is already fixed or clamped -- 66px picture, two lines of
   title, one line each of time, place and badges -- so the row is given that
   height outright. Then the size below is exact by construction rather than by
   guess, and the scroll height cannot change under the finger as rows
   materialise, which is what was dropping frames on a fling. */
.rows>.row{content-visibility:auto;contain-intrinsic-size:auto 116px;height:116px}
.row:active{transform:scale(.985)}
.row.sel{box-shadow:inset 0 0 0 2px var(--primary)}
.sbody{background:var(--surface-container-low)}
.row .thumb{position:relative;width:66px;height:66px;flex:0 0 66px;border-radius:var(--corner-m);
  background:var(--cat-bg);display:grid;place-items:center}
.thumb .ph{width:26px;height:26px;color:var(--cat-ink);opacity:.55}
.row .thumb img{position:absolute;inset:0}
.row .thumb img{width:100%;height:100%;object-fit:cover;border-radius:var(--corner-m)}
.row .thumb .rkb{position:absolute;left:4px;top:4px;height:17px;padding:0 5px;border-radius:5px;
  background:var(--rk-bg);color:var(--rk-ink);font:800 10px/17px var(--mono);
  display:inline-flex;align-items:center;gap:3px}
.row .thumb .rkb svg{width:9px;height:9px}
.row .thumb .rkb[data-r="0"]{display:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font:700 15px/19px var(--font);letter-spacing:-.15px}
.row .txt .when{margin:3px 0 0;font:600 13px/17px var(--mono)}
.row .txt .where{margin:2px 0 0;display:flex;align-items:center;gap:6px;
  color:var(--on-surface-variant);font:400 13px/17px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--cat-ink)}
.row .fav{flex:0 0 38px;width:38px;height:38px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--cat-bg);color:var(--cat-ink);display:grid;place-items:center;
  transition:transform var(--dur-med2) var(--spring),background var(--dur-short2)}
.row .fav:active{transform:scale(.85)}
.row .fav svg{width:18px;height:18px}
.row .fav .f{display:none}
.row .fav[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.row .fav[aria-pressed="true"] .f{display:block}
.row .fav[aria-pressed="true"] .o{display:none}
.badges{display:flex;flex-wrap:nowrap;gap:4px;margin-top:5px;height:18px;overflow:hidden;
  -webkit-mask:linear-gradient(to right,#000 calc(100% - 14px),#0000);
  mask:linear-gradient(to right,#000 calc(100% - 14px),#0000)}
.badges:empty{-webkit-mask:none;mask:none}
.bdg{padding:2px 7px;border-radius:var(--corner-xs);font:700 10px/14px var(--font);letter-spacing:.3px}
.bdg.warn{background:var(--warn-bg);color:var(--warn-ink)}
.bdg.rain{background:var(--c-dance-bg);color:var(--c-dance-ink)}
.bdg.live{background:#F6C9DE;color:#1C1D21}
.bdg.soon{background:var(--surface-container-highest);color:var(--on-surface)}
.bdg.gone{background:var(--surface-container-highest);color:var(--on-surface)}
.bdg.door{background:var(--surface-container-highest);color:var(--on-surface)}
.bdg.rare{background:var(--surface-container-highest);color:var(--on-surface)}
.bdg.ex{background:var(--surface-container-highest);color:var(--on-surface)}
.dflags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dflag{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 10px;
  border-radius:var(--corner-full);font:700 12px/16px var(--font)}
.dflag svg{width:16px;height:16px;flex:0 0 16px}
.dflag.door{background:var(--c-part-bg);color:var(--c-part-ink)}
.dflag.rare{background:var(--c-visual-bg);color:var(--c-visual-ink)}
.bdg.sess{background:var(--surface-container-highest);color:var(--on-surface);font-family:var(--mono)}

.group-h{display:flex;align-items:center;gap:8px;padding:16px 2px 8px}
.group-h.time{position:sticky;top:0;z-index:2;margin:0 -14px;padding:10px 16px 8px;
  background:linear-gradient(var(--surface) 74%,transparent)}
.group-h.time b{font:700 15px/20px var(--mono);letter-spacing:-.4px;text-transform:none;
  color:var(--on-surface)}
.group-h.time span{color:var(--on-surface-variant)}
.group-h.time.now b{color:var(--r3)}
.group-h.time.now::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--r3)}
.group-h i{width:9px;height:9px;border-radius:50%;background:var(--rk-ink)}
.group-h b{font:700 12px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.group-h span{color:var(--on-surface-variant);font:400 12px/16px var(--font)}
.empty{margin:28px 0;padding:30px 22px;text-align:center;border-radius:var(--corner-xl);
  background:var(--surface-container)}
.empty h3{margin:0 0 4px;font:700 17px/23px var(--font)}
.empty p{margin:0;color:var(--on-surface-variant);font:400 14px/20px var(--font)}

/* ---- detail ---- */
.dhero{position:relative;margin:0 -14px 14px;height:172px;overflow:hidden;
  background:var(--cat-bg);display:grid;place-items:center}
.dhero .ph{width:58px;height:58px;color:var(--cat-ink);opacity:.45}
.dhero img{position:absolute;inset:0}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhero .grad{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(11,21,24,.86),rgba(11,21,24,.15) 58%,rgba(11,21,24,0))}
.dhero:not(:has(img)) .grad{background:linear-gradient(to top,var(--cat-bg),transparent 62%)}
.dhero:not(:has(img)) .chips .chip.cat{background:var(--surface);color:var(--cat-ink)}
.dhero .chips{position:absolute;left:14px;bottom:12px;right:14px;display:flex;flex-wrap:wrap;gap:6px}
.dhero .vpnote{position:absolute;right:12px;top:10px;padding:3px 9px;border-radius:var(--corner-full);
  background:rgba(0,0,0,.46);color:#fff;font:600 10px/14px var(--font);letter-spacing:.5px;
  backdrop-filter:blur(4px)}
.chip{padding:4px 10px;border-radius:var(--corner-s);font:700 10px/14px var(--font);
  letter-spacing:.9px;text-transform:uppercase}
.chip.rank{background:var(--rk-ink);color:var(--surface)}
.chip.cat{background:var(--cat-bg);color:var(--cat-ink)}
.dtitle{margin:0;font:800 23px/28px var(--font);letter-spacing:-.6px;text-wrap:balance}
.dalt{margin:4px 0 0;color:var(--on-surface-variant);font:400 14px/20px var(--font)}
.dmeta{margin:9px 0 0;color:var(--on-surface-variant);font:400 14px/20px var(--font);
  display:flex;align-items:flex-start;gap:8px}
.dmeta svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px}
.dmeta b{color:var(--on-surface);font:700 14px/20px var(--mono)}
.why{margin:14px 0 0;padding:13px 14px;border-radius:var(--corner-l);
  background:var(--rk-bg);color:var(--on-surface)}
.why h4{margin:0 0 5px;color:var(--rk-ink);font:700 10px/14px var(--font);
  letter-spacing:1.1px;text-transform:uppercase}
.why p{margin:0;font:400 14px/21px var(--font)}
.dactions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-accent{flex:1 1 160px;height:48px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--primary-container);color:var(--on-primary-container);
  font:700 15px/20px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:border-radius var(--dur-short3) var(--spring),background var(--dur-short2)}
.btn-accent:active{border-radius:var(--corner-m)}
.btn-accent svg{width:19px;height:19px}
.btn-accent[aria-pressed="true"]{background:var(--rk-ink);color:var(--surface)}
.btn-tonal{flex:0 0 auto;height:48px;padding:0 18px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface-container);color:var(--on-surface);text-decoration:none;
  font:600 15px/20px var(--font);display:inline-flex;align-items:center;gap:8px}
.btn-tonal svg{width:18px;height:18px}
.dsec{margin-top:20px}
.dsec h3{margin:0 0 8px;color:var(--on-surface-variant);
  font:700 11px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.dsec p{margin:0;font:400 15px/23px var(--font);white-space:pre-wrap}
/* Opening an event is a forward move and going back is the same move reversed,
   so the panel travels on one axis. The photograph settles rather than appears,
   which is what says the thing you tapped is the thing that opened. */
@keyframes body-in{from{opacity:0;transform:translateX(var(--from,18px))}to{opacity:1;transform:none}}
@keyframes hero-in{from{opacity:.35;transform:scale(1.07)}to{opacity:1;transform:none}}
.sbody.entering{animation:body-in 300ms var(--ease-emph-decel) both}
.dhero img{animation:hero-in 520ms var(--ease-emph-decel) both}
.desc{position:relative;overflow:hidden;max-height:92px;
  transition:max-height var(--dur-med4) var(--ease-emphasized)}
.desc.open{max-height:6000px}
.readmore{margin-top:8px;height:38px;padding:0 14px;border:0;border-radius:var(--corner-full);
  background:var(--surface-container);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font:600 14px/20px var(--font)}
.readmore svg{width:18px;height:18px;transition:transform var(--dur-med2) var(--ease-emphasized)}
.readmore[aria-expanded="true"] svg{transform:rotate(180deg)}
.info{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.info+.info{border-top:1px solid var(--outline-variant)}
.info .ic{width:36px;height:36px;flex:0 0 36px;border-radius:var(--corner-full);
  background:var(--surface-container);display:grid;place-items:center}
.info .ic svg{width:18px;height:18px}
.info .tx{flex:1;min-width:0}
.info .tx b{display:block;font:600 14px/20px var(--font)}
.info .tx span{display:block;color:var(--on-surface-variant);font:400 13px/19px var(--font)}

/* ---- plan ---- */
.plan-item{position:relative;padding-left:26px}
.plan-item::before{content:"";position:absolute;left:11px;top:0;bottom:-8px;width:2px;
  background:var(--outline-variant)}
.plan-item:last-child::before{display:none}
.plan-item{padding-bottom:2px}
.plan-item .num{position:absolute;left:2px;top:24px;width:20px;height:20px;border-radius:50%;
  background:var(--primary);color:var(--on-primary);display:grid;place-items:center;
  font:700 11px/1 var(--mono);z-index:1}
.at{display:flex;align-items:center;gap:8px;margin:6px 0 0;padding:6px 8px 6px 12px;
  border-radius:var(--corner-full);background:var(--surface-container)}
.at .lb{color:var(--on-surface-variant);font:700 10px/14px var(--font);
  letter-spacing:.9px;text-transform:uppercase}
.at b{font:700 14px/18px var(--mono);min-width:46px;text-align:center}
.at button{width:28px;height:28px;flex:0 0 28px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface);color:var(--on-surface);
  font:700 16px/1 var(--font);display:grid;place-items:center}
.at .hint{flex:1;min-width:0;text-align:right;color:var(--on-surface-variant);
  font:500 12px/16px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at.bad{background:var(--warn-bg)}.at.bad .hint{color:var(--warn-ink);font-family:var(--font);font-weight:700}
.leg{display:flex;align-items:center;gap:7px;padding:6px 0 6px 26px;
  color:var(--on-surface-variant);font:500 12px/16px var(--font)}
.leg svg{width:14px;height:14px;flex:0 0 14px}
.leg.bad{color:var(--warn-ink)}
.share-plan{width:100%;margin-top:20px;margin-bottom:4px;background:var(--rk-bg);color:var(--rk-ink)}
.presets{display:flex;flex-direction:column;gap:8px}
.preset{display:flex;gap:11px;align-items:flex-start;padding:12px;border:0;cursor:pointer;
  text-align:left;width:100%;background:var(--surface-container);border-radius:var(--corner-l);
  transition:transform var(--dur-short4) var(--spring)}
.preset:active{transform:scale(.985)}
.preset .pi{width:34px;height:34px;flex:0 0 34px;border-radius:var(--corner-m);
  display:grid;place-items:center;background:var(--rk-bg);color:var(--rk-ink)}
.preset .pi svg{width:18px;height:18px}
.preset .pt{flex:1;min-width:0}
.preset b{display:block;font:700 15px/20px var(--font)}
.preset span{display:block;margin-top:2px;color:var(--on-surface-variant);font:400 13px/18px var(--font)}

/* ---- overlays ---- */
:root{--nav-h:64px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:530;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--outline-variant);
  display:flex;align-items:center;justify-content:space-around}
.nav-item{border:0;background:none;cursor:pointer;width:33%;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--on-surface-variant);font:600 11px/14px var(--font)}
.nav-ind{position:relative;width:56px;height:30px;border-radius:var(--corner-full);
  display:grid;place-items:center}
.nav-ind::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--primary-container);transform:scale(.4);opacity:0;
  transition:transform var(--dur-med1) var(--ease-emphasized),opacity var(--dur-short3)}
.nav-item[aria-selected="true"] .nav-ind::after{transform:none;opacity:1}
.nav-ind svg{width:22px;height:22px;position:relative;z-index:1}
.nav-item[aria-selected="true"]{color:var(--on-surface)}
.nav-item[aria-selected="true"] .nav-ind{color:var(--on-primary-container)}
.nav-ind .badge{position:absolute;top:-2px;right:8px;min-width:17px;height:17px;padding:0 5px;
  border-radius:var(--corner-full);background:var(--r3);color:var(--surface);
  font:700 10px/17px var(--mono);text-align:center;z-index:2;box-shadow:0 0 0 2px var(--surface)}
.snack{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));z-index:900;
  padding:13px 8px 13px 16px;border-radius:var(--corner-l);
  background:var(--inverse-surface);color:var(--inverse-on-surface);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font:400 14px/20px var(--font);box-shadow:var(--elev-2);
  transform:translateY(16px);opacity:0;visibility:hidden;
  transition:transform var(--dur-med2) var(--ease-emph-decel),opacity var(--dur-short4),visibility var(--dur-med2)}
.snack.show{transform:none;opacity:1;visibility:visible}
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;z-index:800;
  transition:opacity var(--dur-med2),visibility var(--dur-med2)}
.scrim.show{opacity:.4;visibility:visible}
.fsheet{position:fixed;left:0;right:0;bottom:0;z-index:810;max-height:82%;
  display:flex;flex-direction:column;background:var(--surface);
  border-radius:var(--corner-xl) var(--corner-xl) 0 0;transform:translateY(101%);
  opacity:0;visibility:hidden;pointer-events:none;box-shadow:var(--elev-3);
  transition:transform var(--dur-med4) var(--ease-emph-accel),
             opacity var(--dur-short3),visibility var(--dur-med4)}
.fsheet.show{transform:none;opacity:1;visibility:visible;pointer-events:auto;
  transition:transform var(--dur-long2) var(--ease-emph-decel),opacity var(--dur-short3)}
.fsheet.dragging{transition:none}
.fsheet .handle{cursor:grab;touch-action:none}
.fsheet .handle:active{cursor:grabbing}
.fsheet h2{margin:0;padding:8px 22px 4px;font:700 19px/25px var(--font);letter-spacing:-.4px}
.fbody{overflow-y:auto;padding:0 18px 12px;scrollbar-width:none}
.fbody::-webkit-scrollbar{display:none}
.fbody h3{margin:14px 0 9px;color:var(--on-surface-variant);
  font:700 11px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:2px}
.opt{height:40px;padding:0 15px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--surface-container);font:600 14px/20px var(--font);
  display:inline-flex;align-items:center;gap:7px;
  transition:background var(--dur-short2),color var(--dur-short2)}
.opt .ck{width:0;overflow:hidden;transition:width var(--dur-short3) var(--ease-emphasized)}
.opt .ck svg{width:15px;height:15px}
.opt>svg{width:17px;height:17px;flex:0 0 17px}
.opt[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.opt[aria-pressed="true"] .ck{width:15px}
.opt i{width:10px;height:10px;border-radius:50%;background:var(--sw,var(--outline))}
.linkrow{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 14px;
  border:0;border-radius:var(--corner-full);cursor:pointer;text-align:left;
  background:var(--surface-container);color:var(--on-surface)}
.linkrow>svg{width:17px;height:17px;flex:0 0 17px;color:var(--on-surface-variant)}
.linkrow .u{flex:1;min-width:0;display:flex;align-items:baseline;
  font:500 13px/18px var(--mono)}
.linkrow .u .p{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--on-surface-variant)}
.linkrow .u .q{flex:0 0 auto;color:var(--on-surface);font-weight:700}
.linkrow .cp{flex:0 0 auto;color:var(--primary);font:700 12px/16px var(--font);
  letter-spacing:.6px;text-transform:uppercase}
.ffoot{display:flex;gap:10px;padding:10px 18px calc(18px + env(safe-area-inset-bottom));align-items:center}
.btn-ghost{height:46px;padding:0 18px;border:0;border-radius:var(--corner-full);background:none;
  color:var(--on-surface-variant);cursor:pointer;font:600 14px/20px var(--font)}

/* ============================================================
   DESKTOP — the sheet stops being a sheet and becomes a rail
   ============================================================ */
@media (min-width:901px){
  /* The map runs the full window and the list floats over it as one card:
     the sheet is its body, the tab bar its foot. Nothing is flush to an edge,
     so the map reads as the page rather than as a panel beside the list. */
  .app{grid-template-columns:1fr}
  .mapwrap{grid-area:1/1}
  .sheet{left:16px;right:auto;top:16px;width:404px;
    height:calc(100% - 32px - var(--nav-h));
    border-radius:var(--corner-xl) var(--corner-xl) 0 0;
    border:1px solid var(--outline-variant);border-bottom:0;
    transform:none !important;touch-action:auto}
  .nav{left:16px;right:auto;bottom:16px;width:404px;height:var(--nav-h);
    padding-bottom:0;border:1px solid var(--outline-variant);
    border-radius:0 0 var(--corner-xl) var(--corner-xl);
    box-shadow:var(--elev-3);overflow:hidden}
  .grab{cursor:default;padding-top:10px}
  .handle{display:none}
  .sbody{overflow-y:auto !important;padding-bottom:16px}
  .dhero{margin-left:-14px;margin-right:-14px}
  /* everything that floats on the map clears the card's 436px column */
  .topbar{left:436px;right:24px}
  .mapchrome{left:448px}
  .timeline{left:436px;right:0;padding:0 24px;top:calc(62px + env(safe-area-inset-top))}
  .locate{top:auto;bottom:16px;right:16px}
  .snack{left:auto;right:24px;width:340px;bottom:24px}
  .fsheet{left:auto;right:24px;bottom:24px;width:410px;
    border-radius:var(--corner-xl);max-height:66%}
  .leaflet-control-zoom{display:block}
  .leaflet-top.leaflet-right{margin-top:10px}
}
/* ?perf=1 only: a frame-rate readout and switches for the three most expensive
   things on the page, so which one costs the frames can be settled on the
   device in hand instead of inferred from a desktop. */
.perf{position:fixed;left:8px;right:8px;top:8px;z-index:9999;padding:10px 12px;
  border-radius:14px;background:rgba(16,18,24,.93);color:#fff;
  font:600 12px/1.45 var(--mono);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.perf b{font-size:15px}
.perf .sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.perf button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;
  border-radius:999px;padding:5px 11px;font:600 11px var(--font)}
.perf button[aria-pressed="true"]{background:#fff;color:#111}
.perf .env{opacity:.62;font-size:10px;margin-top:6px;line-height:1.4}
html.perf-nomap #map{visibility:hidden}
html.perf-noimg .row .thumb img{display:none}
html.perf-nocv .rows>.row{content-visibility:visible}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  /* asking for no motion usually means the device is also glad to skip these */
  .pill,.circle-btn,.seg,.tl-inner,.mk .lab{backdrop-filter:none;background:var(--surface)}
}
</style>

uisin klo 10–11 kirjaston kulloinkin osoittamissa tiloissa - yleensä ryhmätila Kajuutassa tai sen vieressä olevassa, suuremmassa esiintymiskorokkeellisessa tilassa. Tarkoitus on yksinkertaisesti istua yhdessä hiljaa 45 minuuttia. Kyse ei siis ole terapiaryhmästä, keskustelu- tai opetustilaisuudesta. Session jälkeen jää aikaa vaihtaa kuulumiset. Aloitamme heti kirjaston avautumisen jälkeen. Alustana on kokolattiamatto. Tyyli on vapaa. Kirjasto tarjoaa tuoleja sekä joitain tyynyjä, ja mukaan voi myös ottaa oman tyynyn. Meditaatio tapahtuu osana kirjaston muuta elämää, joten taustalla kuuluvat äänet ja satunnaiset ohikulkijat kuuluvat asiaan.\n\n#helloespoo","c":"Dance","cs":["Kivenlahti","Espoonlahti","Finnoo","Kaitaa","well-being","guidance"],"img":"https://tapahtumasyotto.espoo.fi/media/images/6ead8615-3683-4b14-a800-693c64afa033.png","u":"","ue":"","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"10:00-11:00","n":0,"nn":0,"i":"espoo_le:agpio3d6be","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"40f5d52b5ea36402.webp"},{"src":"cur","eid":"cur2","t":"Design Market","te":"Design Market","v":"Kaapelitehdas","ve":"Kaapelitehdas","a":"Kaapeliaukio 3","la":60.16215,"ln":24.90597,"s":660,"e":1080,"d":"","df":"","c":"Visual arts","cs":["free"],"img":"","u":"https://helsinkidesignweek.com/events/design-market/","ue":"https://helsinkidesignweek.com/events/design-market/","price":"free","r":3,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":1,"tl":"11:00-18:00","n":0,"nn":0,"i":"cur2","qe":"The Nordics' biggest design warehouse sale, and the day Helsinki Design Week opens: furniture, homeware, fashion and accessories sold in Merikaapelihalli by the people who made them. Free, indoors, and the last of two days -- which on a wet Sunday makes it the easiest good decision of the day.","qf":"Pohjoismaiden suurin designin varastomyynti ja Helsinki Design Weekin avauspäivä: huonekaluja, astioita, vaatteita ja asusteita Merikaapelihallissa suoraan tekij p"},{"src":"cur","eid":"cur23","t":"Kallion tietokonemuseo","te":"Kallio Computer Museum","v":"Kallion tietokonemuseo","ve":"Kallion tietokonemuseo","a":"Alppikatu 17","la":60.18556,"ln":24.94641,"s":720,"e":1020,"d":"","df":"","c":"Participate","cs":[],"img":"","u":"","ue":"","price":"","r":1,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"12:00-17:00","n":0,"nn":0,"i":"cur23","qe":"A working computer shop of 1984, kept running. Small, indoors and genuinely odd.","qf":"Toimiva vuoden 1984 tietokonekauppa, yhä käynnissä. Pieni, sisällä ja aidosti omalaatuinen.","qz":"一间还能开机的 1984 年电脑店。小、室内，而且是真的有意思。","vp":0,"cr":"","th":""},{"src":"le","eid":"kulke:69209","t":"Puzzle Theatre: Papa - SAMPO Festivaali","te":"Puzzle Theatre: Papa - SAMPO Festival","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":840,"d":"This theater performance tells, with humor and tenderness, the chaos of moving as seen by a somewhat lost dad, surrounded by cardboard boxes and childhood memories.\n\nPAPA is moving house. He’s completely lost! He can’t find anything anymore, not even his... child! Cardboard boxes everywhere – what an incredible playground! \n\nWhen you move, you leave something behind… or someone… \n\nAnd you realise there’s a piece of paper missing from the child’s every drawing hanging on the wall… \n\nWhen you move house, everything is upside down! You no longer know which way is up or down. You don’t know if everything that’s happening is real or if you’re in a funny dream. \n\nIn a playful and humorous way, the actor shows curious minds how masks and puppets can be made from pieces of packaging cardboard using simple and inexpensive methods.\n\nDuration: 40 minutes\nLanguage: The performance is nearly wordless and understanding its language is not necessary for enjoying the piece.\nAge recommendation: 4 years old and up\n\nTickets sold at Puppet Theatre Sampo . Basic ticket: EUR 15; support ticket: EUR 20.\n\nCreator, performance: Csaba Raduly\nDirection: Pavla Mano\nVisual design and costuming: Ivan Stavrev\nMasks and puppets: Csaba Raduly and Pavla Mano\nOriginal music: Petya Nedeva\n\nSAMPO Festival \n\nInternational visual theatre and puppet theatre festival SAMPO is held already for the 10th time in Helsinki","df":"Tämä teatteriesitys kertoo huumorin ja lempeyden sävyttämänä muuton aiheuttamasta kaaoksesta.\n\nNäkökulma on isän, joka on hieman hukassa pahvilaatikoiden ja lapsuuden muistojen keskellä.\n\nPAPA tekee muuttoa. Kaikki on hukassa! Hän ei löydä enää mitään, ei edes omaa… lastaan! Pahvilaatikoita on kaikkialla – mikä uskomaton leikkikenttä! \n\nKun muuttaa, jättää aina taakseen jotakin… Tai jonkun… \n\nJa huomaa, että jokaisesta seinälle kiinnitetystä lapsen piirustuksesta puuttuu pala paperia… \n\nKun muuttaa, koko talo on mullin mallin! Ei enää tiedä, mikä on ylhäällä ja mikä alhaalla. Ei tiedä, onko kaikki todellista vai onko jossain kummallisessa unessa. \n\nEsityksen tarkoituksena on inspiroida ja rohkaista lapsia luomaan asioita itse. Jokaisen esityksen lopussa järjestetään yleisön kanssa vuorovaikutteinen hetki. Hauskalla ja leikkisällä tavalla näyttelijä näyttää yleisölle, kuinka valmistaa naamioita ja nukkeja pahvilaatikoiden paloista yksinkertaisin ja edullisin keinoin.\n\nKesto: 40 minuuttia\nKieli: Esitys sisältää hyvin vähän puhetta, jonka ymmärtäminen ei ole edellytys esityksestä nauttimiselle.\nIkäsuositus: Yli 4-vuotiaille\n\nLippuja esityksiin myy Nukketeatteri Sampo . Lipun hinta: 15 €; kannatuslippu: 20 €.\n\nTekijä, esiintyjä: Csaba Raduly\nOhjaus: Pavla Mano\nVisuaalinen suunnittelu ja puvustus: Ivan Stavrev\nNaamiot ja nuket: Csaba Raduly ja Pavla Mano\nAlkuperäismusiikki: Petya Ne","c":"Theatre","cs":["Lastentapahtumat","Teatteri","Teatteri ja sirkus","Annantalo","Suomi","Ruotsi"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_793513.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/5AE465D6D55186A4D173D7D8D3D5F5E6/Puzzle_Theatre_Papa","ue":"http://www.annantalo.fi/en/events/event/5AE465D6D55186A4D173D7D8D3D5F5E6/Puzzle_Theatre_Papa","price":"","r":1,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"12:00-14:00","n":0,"nn":0,"i":"kulke:69209","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"bb8354e0043941a7.webp"},{"src":"cur","eid":"cur22","t":"Aino Ackté -teatterikävely","te":"Aino Ackté theatre walk","v":"Tullisaaren kartanonpuisto","ve":"Tullisaaren kartanonpuisto","a":"Tullisaari","la":60.17894,"ln":25.03631,"s":720,"e":840,"d":"","df":"","c":"Theatre","cs":["out"],"img":"","u":"","ue":"","price":"","r":0,"io":"out","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"12:00-14:00","n":0,"nn":0,"i":"cur22","qe":"","qf":"","qz":"","vp":0,"cr":"","th":""},{"src":"le","eid":"hkm:3466","t":"Lasten kaupunki","te":"Children's Town","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"Near the Senate Square, in the oldest city blocks of Helsinki, you can find the blue-grey Sederholm House, built in 1757. It is the oldest house in Helsinki. There, as a part of the Helsinki City Museum, is located Children’s Town, an exhibition especially targeted at the youngest citizens. In Children’s Town, children and their companions can learn more about Helsinki’s history through own experiences and joint activities.\n\nChildren’s Town offers an opportunity to jump into a horse-drawn carriage or steer a ship in 18th century surroundings. For the youngest museum visitors, there is a special marine play, reading and rest corner. You can study everyday items from the 1970s in Grandma’s House and watch the favourite TV shows of the time. On weekends, a museum grandma or grandpa is at home in Grandma’s House. In the 1930s elementary school class, you can just picture a schoolmaster with a pointer and a stern face.\n\nThere is a lot to study and explore. Showcases feature favourite toys from different periods, from little ponies to mutant turtles and Star Wars figures. The Sederholm shop from the 18th century is a perfect environment for playing shop. Puppets and amusing role costumes and role cards are available in the theatre. You can practise your writing skills, using old tools from sandbox to blackboard, and in another room, you can play with cars or decorate the dolls’ house","df":"Senaatintorin kulmalla Helsingin vanhimmissa kortteleissa sijaitsee siniharmaa Sederholmin talo, joka valmistui vuonna 1757. Se on Helsingin vanhin talo. Siellä sijaitsee pienimpien kaupunkilaisten oma Lasten kaupunki osana Helsingin kaupunginmuseota. Lasten kaupungissa leikki-ikäiset ja heidän seuralaisensa pääsevät tutustumaan Helsingin historiaan itse kokeillen ja yhdessä puuhaillen.\n\nLasten kaupungissa voi hypätä hevoskärryihin tai ohjata laivaa 1700-luvun tunnelmissa. Pienimmille museovieraille on oma merellinen leikki-, luku- ja leponurkkaus. Mummolassa saa tutkia 1970-luvun arjen esineitä ja katsoa televisiosta ajan suosikkiohjelmia. Viikonloppuisin mummolassa on mummo tai vaari kotona. 1930-luvun kansakoululuokkaan voi kuvitella tiukkailmeisen opettajan karttakeppeineen.\n\nTutkittavaa on paljon. Vitriineistä voi bongailla eri aikakausien suosikkileluja pikkuponeista mutanttikilpikonniin ja Tähtien sota -hahmoihin. Sederholmin 1700-luvun puodissa kauppaleikit kukoistavat. Teatterissa on käsinukkeja sekä hauskoja roolivaatteita ja roolikortteja. Kirjoitustaitojaan voi harjoittaa vanhan ajan välineillä hiekkapulpetista rihvelitauluun ja toisaalla leikkiä autoilla tai sisustaa suuren nukkekodin makunsa mukaan.\n\nLasten kaupungissa kaikkeen esillä olevaan saa koskea. Lapset leikkivät oman vanhempansa tai muun seuralaisensa vastuulla. Tervetuloa tutustumaan Helsingin historiaan","c":"Visual arts","cs":["everyday","cultural events","Helsinki residents","museums","urban history"],"img":"https://api.hel.fi/linkedevents/media/images/kaupunginmuseo_lasten_kaupunki_jussi_hellsten_5961.jpg","u":"https://www.helsinginkaupunginmuseo.fi/nayttelyt/lasten-kaupunki/","ue":"https://www.helsinginkaupunginmuseo.fi/en/exhibitions/childrens-town/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"hkm:3466","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"37970f9b1fb8b0d6.webp"},{"src":"le","eid":"helsinki:agp5dhl25y","t":"Minä ja maailmankaikkeus","te":"The Universe and I","v":"Tiedemuseo Liekin observatorio","ve":"Observatory of the Helsinki University Museum Flame","a":"Kopernikuksentie 1","la":60.16188,"ln":24.95167,"s":720,"e":1200,"d":"Dive into the world of astronomy and the history of the Observatory building! \n\nThe permanent exhibition, excluding the towers and the planetarium, is located on the main floor.\n\nHowever, by booking a guide you can add to your visit the old astronomical observation towers and a planetarium show.\n\nObservatory\n\nPermanent exhibition","df":"Observatorion perusnäyttely kutsuu kaikki vauvasta vaariin sukeltamaan avaruuden ihmeisiin ja Observatoriorakennuksen vaiheikkaaseen historiaan. \n\nNäyttely sijaitsee torneja ja planetaariota lukuun ottamatta Observatorion pääkerroksessa. Varaamalla opastetun kierroksen pääset näkemään myös tornit ja planetaarion.\n\nObservatorio\n\nPysyvä näyttely","c":"Visual arts","cs":["science","astronomy","outer space","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/2_observatorio_zoomaus_Saara_Sepp%C3%A4l%C3%A4.jpg","u":"https://www.helsinki.fi/fi/tiedemuseo-liekki/nayttelyt/mina-ja-maailmankaikkeus","ue":"https://www.helsinki.fi/en/helsinki-university-museum-flame/exhibitions/universe-and-i","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp5dhl25y","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"3b273fa59861c401.webp"},{"src":"le","eid":"helsinki:agcmhmphwi","t":"Tekniikan maa","te":"TechLand","v":"Tekniikan museo","ve":"The Museum of Technology","a":"Viikintie 1d","la":60.21594,"ln":24.98309,"s":720,"e":1200,"d":"The exhibition highlights the role of technology, industry and innovation in the construction of 100-year-old Finland. The exhibition reveals the influence of technology on daily life, work and the environment, showcasing the past, present and future of technology and industry.\n\nThe starting point of the exhibition is the home, from where the themes expand to infrastructure, production, raw materials, processes as well as recycling and reuse of materials. The exhibition, which will be on display until 2026, will be renewed throughout its life cycle.\n\nMuseum of Technology\n\n1.10.2017-31.12.2027","df":"Tekniikan maa on näyttely teknologian, teollisuuden ja alan innovaatioiden roolista 100-vuotiaan Suomen rakentajina. Näyttely kertoo tekniikan vaikutuksesta arkeen, työhön ja ympäristöön ja esillä ovat niin teknologian ja teollisuuden menneisyys, nykyisyys kuin tulevaisuus.\n\nNäyttelyn lähtöpisteenä on koti, josta teemat laajenevat infrastruktuuriin, tuotantoon, raaka-aineisiin ja prosesseihin sekä uusiokäyttöön. Vuoteen 2026 asti esillä oleva näyttely uudistuu koko elinkaarensa ajan.\n\nSuomalaiset usein identifioituvat kekseliääksi insinöörikansaksi ja tekniikan nopeiksi omaksujiksi. Suomen tarinaa ei silti ole koskaan aiemmin esitetty tekniikan näkökulmasta.\n\nKokeminen ja tekeminen ovat näyttelyssä tärkeässä roolissa. Tavoite on innostaa ja yllättää niin alaa tuntevat kuin museon uudet yleisöt.\n\nTekniikan museo\n\n1.10.2017-31.12.2027","c":"Visual arts","cs":["technology","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/P9104994.JPG","u":"https://www.tekniikanmuseo.fi/nayttely/tekniikan-maa/","ue":"https://www.tekniikanmuseo.fi/en/exhibition/techland/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agcmhmphwi","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"3e230ca1f022aeb3.webp"},{"src":"le","eid":"helsinki:af23nmwzda","t":"Aikakone","te":"Time machine","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"Most of us have probably wished we could sneak a peek into the past to see how people used to live. Now, you can do exactly that and step onboard our Time Machine that whisks you away to visit a very lively and authentic Helsinki of a hundred years past.\n\nSigne Brander’s photographs of Helsinki come alive\nTo commemorate the 150th anniversary of Signe Brander, a new 2.0 version has been created of the Time Machine virtual experience. The new Time Machine brings Signe Brander’s photographs to life with the help of VR technology to create an immersive and interactive spatial installation that takes visitors on a journey through Helsinki’s past. Time Machine 2.0 will whisk visitors away to early 20th-century Helsinki, where wooden houses are making way for a new city of stone castles. The new city is a mix of national romanticism, Art Nouveau and Nordic classicism – old traditions and new winds.\n\nDuring Brander’s lifetime, Helsinki was for the first time visible from new vantage points, such as the National Museum’s tower. In addition to the bird’s-eye view, Brander also photographed panoramas at street level, capturing everyday details of urban life. Time Machine 2.0 shows projections based on Brander’s panorama photos of Kallio Church and St Nicholas’ Church (now Helsinki Cathedral).\n\nBorn on 15 April 1869, Brander photographed Helsinki and life in Helsinki at the beginning of th","df":"Moni on joskus haaveillut mahdollisuudesta kurkistaa entisajan ihmisten elämään. Helsingin kaupunginmuseossa se onnistuu, sillä museokävijät voivat astua Aikakoneeseen, joka imaisee heidät elävään ja todentuntuiseen menneisyyden Helsinkiin.\n\nSigne Branderin valokuvat Helsingistä heräävät eloon\nAikakone herättää Signe Branderin valokuvat eloon ja immersiivinen, interaktiivinen tilainstallaatio kuljettaa kävijän läpi menneisyyden Helsingin. Aikakone 2.0 vie aikamatkaajan 1900-luvun alun Helsinkiin, jossa uusi kivilinnojen kaupunki valtaa alaa puutaloilta. Uusi kaupunki on sekoitus kansallisromantiikkaa, jugendia, sekä pohjoismaista klassismia – vanhaa perinnettä ja uusia tuulia.\n\nBranderin aikana Helsinki oli ensimmäistä kertaa nähtävissä uusista näköalapaikoista, kuten Kansallismuseon tornista. Lintuperspektiivin lisäksi Brander kuvasi panoraamoja myös katutasosta ja tavoitti näin kaupunkielämän arkiset yksityiskohdat. Aikakone 2.0:ssa nähdään projisioita, jotka perustuvat Branderin ottamiin panoraamakuviin Kallion kirkosta ja Nikolainkirkosta eli nykyisestä Tuomiokirkosta käsin.\n\n15. huhtikuuta 1869 syntynyt Brander kuvasi Helsinkiä ja helsinkiläistä elämänmenoa viime vuosisadan alussa, jolloin Helsingin muinaismuistolautakunta palkkasi hänet tallentamaan kiivaasti muuttuvaa kaupunkia. Branderin vuosina 1907–1913 kuvaamat 907 lasinegatiivia ovat kaupunginmuseon kokoelmien perus","c":"Visual arts","cs":["museums of cultural history","history","cultural history","virtuality","regional identity of Helsinki residents","photographs"],"img":"https://www.helsinginkaupunginmuseo.fi/wp-content/uploads/2016/01/190408_Aikakone2_vr_2-Edit.jpg","u":"","ue":"","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:af23nmwzda","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"3363847db7156aa5.webp"},{"src":"le","eid":"helsinki:af3wzcwooi","t":"Krunikan kortteleissa","te":"In the Quarters of Kruununhaka","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"Helsinki City Museum has produced the In the Quarters of Kruununhaka exhibition on electrical cabinets as part of the OmaStadi project. OmaStadi is Helsinki’s way of implementing participatory budgeting together with the residents. Some of the photographs in the exhibition were featured in the vote held in July 2020. The permanent exhibition consist of 29 photographs. Most of the photos are from the collections of Helsinki City Museum.\n\nThe images in the exhibition are nostalgic snapshots of the history of the district and changes in the urban environment. You can navigate from one electrical cabinet to another with the help of the map and start your tour in the location of your choice. The map: helsinginkaupunginmuseo.fi/en/quarters-of-kruununhaka\n\nImage: Eeva Rista / Helsinki City Museum. 1970","df":"Helsingin kaupunginmuseo on tuottanut Krunikan kortteleissa -valokuvanäyttelyn Kruununhaan sähkökaappeihin osana OmaStadi-hanketta. OmaStadi on Helsingin tapa toteuttaa osallistuvaa budjetointia yhdessä kaupunkilaisten kanssa. Osa näyttelyyn tulevista valokuvista oli mukana yleisöäänestyksessä, joka järjestettiin heinäkuussa 2020. Pysyvä näyttely koostuu 29 valokuvasta, jotka ovat pääosin Helsingin kaupunginmuseon kuvakokoelmista.\n\nNäyttelyn kuvat ovat nostalgisia välähdyksiä kaupunginosan historiasta ja kaupunkiympäristön muutoksesta. Sähkökaapilta toiselle voi suunnistaa kartan avulla ja kierroksen voi aloittaa itselleen sopivasta kohdasta. Kartta: helsinginkaupunginmuseo.fi/krunikan-kortteleissa\n\nKuvassa: Lapsia Meritullinkadun ja Liisankadun kulmassa. Kuva: Eeva Rista / Helsingin kaupunginmuseo. 1970","c":"Visual arts","cs":["photography exhibitions","outdoor recreation","cultural events","exhibitions","urban history"],"img":"https://api.hel.fi/linkedevents/media/images/Meritullinkatu_26_Liisankatu.jpg","u":"https://www.helsinginkaupunginmuseo.fi/nayttelyt/krunikan-kortteleissa/","ue":"https://www.helsinginkaupunginmuseo.fi/en/exhibitions/quarters-of-kruununhaka/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:af3wzcwooi","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"ef31c00ff77e2389.webp"},{"src":"le","eid":"helsinki:af5kileoqi","t":"Helsingin valitut palat","te":"Helsinki Bites","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"The Helsinki Bites exhibition dives into the past of Helsinki, bringing up common memories about the city’s history.\n\nHistory comes near in the Helsinki Bites exhibition, allowing the visitor to experience the past of the city with all of their senses in many different points. “I remember that, that’s just what we used to have!” many visitors may exclaim in many different spots.\n\nFree entry","df":"Helsingin valitut palat -näyttely tekee sukelluksia Helsingin menneisyyteen ja tuo pintaan yhteisiä muistoja kaupungin historiasta. Näyttelyssä voi vierailla 1950-luvun kodissa tai ihailla yhdeksänkymmentä vuotta vanhaa pienoismallia vuoden 1878 Helsingistä.\n\n”Tuon minä muistan, tuollainen meilläkin oli!” saattaa moni huudahtaa tutkiessaan Helsingin valitut palat -näyttelyä. Historia tulee lähelle, ja monessa kohtaa kävijä pääsee kokemaan kaupungin menneisyyden kaikilla aisteillaan. \n\nVapaa pääsy","c":"Visual arts","cs":["cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/kaupunginmuseo_020321_kuva_jussi_hellsten_6279.jpg","u":"","ue":"","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:af5kileoqi","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"2b6825d8a849353f.webp"},{"src":"le","eid":"helsinki:af6mbikcry","t":"Kotimuseo","te":"House Museum","v":"Sinebrychoffin taidemuseo","ve":"Sinebrychoff Art Museum","a":"Bulevardi 40","la":60.16252,"ln":24.93228,"s":720,"e":1200,"d":"The heart of the Sinebrychoff Art Museum is the unique home of Paul and Fanny Sinebrychoff, which has been on permanent display on the second floor of the building since 27 November 1921.\n\nThe Sinebrychoffs’ palatial town house at Bulevardi 40 was completed in 1842. The building was immediately considered to be one of the most significant private homes in Helsinki.\n\nThe last occupants of the house bearing the name Sinebrychoff, Paul and Fanny Sinebrychoff, were passionate art enthusiasts. They collected the most beautiful European art and objects for their home. When their collections were donated to the Finnish state in 1921, they comprised more than 900 items.\n\nPaul and Fanny’s wish to open the doors of their home to the public to see the art treasures they had collected was recorded in a will almost one hundred years ago. The same spirit still lives on in the museum.\n\nSinebrychoff Art Museum\n\n27.11.2021-31.1.2040\n\nFree entry","df":"Sinebrychoffin taidemuseon ytimen muodostaa Paul ja Fanny Sinebrychoffin ainutlaatuinen kotimiljöö, joka on pysyvästi esillä museon toisessa kerroksessa.\n\nVuonna 1842 valmistui Sinebrychoffien kaupunkipalatsi Bulevardi 40:een. Rakennusta pidettiin heti yhtenä Helsingin merkittävimpänä yksityistalona.\n\nTalon viimeiset Sinebrychoff-nimiset asukkaat, Paul ja Fanny Sinebrychoff, olivat intohimoisia taiteenharrastajia. He keräsivät kotiinsa kauneinta eurooppalaista taidetta ja esineistöä. Kun kokoelmat lahjoitettiin valtiolle 1921, ne sisälsivät jo yli 900 teosta.\n\nPaulin ja Fannyn toive avata kaikille ovet keräämiensä taideaarteiden äärelle on kirjattu testamenttiin lähes sata vuotta sitten. Sama henki elää museossa edelleenkin.\n\nSinebrychoffin taidemuseo, 2. krs\n\n27.11.2021-31.1.2040\n\nVapaa pääsy","c":"Visual arts","cs":["home museums","art","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Kustavilainen-sali.jpg","u":"https://sinebrychoffintaidemuseo.fi/nayttelyt/kotimuseo/","ue":"https://sinebrychoffintaidemuseo.fi/en/exhibitions/house-museum/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:af6mbikcry","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"0e23a2591a750f1f.webp"},{"src":"le","eid":"helsinki:agcthjidge","t":"Tahdon tarina","te":"The Story of Tahto","v":"Urheilun ja liikunnan kulttuurikeskus TAHTO","ve":"Cultural Centre of Sports TAHTO","a":"Paavo Nurmen tie 1, Olympiastadion","la":60.18658,"ln":24.9257,"s":720,"e":1200,"d":"The new exhibition is enlivened by versatile and unique audiovisual contents that guide the visitor from story to another and emotion to another: from the Helsinki Olympic Games to the world of e-sports, from excitement through disappointment to joy for victory. \n\nThe exhibition brings the heroes of Finnish success sports, such as track and field athletics, Formula One racing and ice hockey, as well as Finnish people who climb mountains, jump from airplanes or negotiate rapids and rails.\n\nCultural Centre of Sports Tahto\n\nPermanent exhibition\n\nMon-Tue & Fri: 10-18\nWed-Thu: 10-19\nSat-Sun: 11-17\n\nPrices:\nChildren 0–6 years: Free admission\nChildren 7–17 years:4 €\nAdults: 16 €\n\nStudents, seniors, conscripts, persons undergoing non-military service, unemployed: 11 €","df":"Tahdon päänäyttely tuntuu kaikilla aisteilla, kuten urheilu. Urheilu läpäisee koko yhteiskunnan, ja ihmisen.\n\nNäyttelyssä kävijä voi eläytyä jännitykseen, riemuun tai vaikka pettymykseen. Näyttely koostuu viidestä teemasta, mitkä ovat pukuhuone, Helsinki 1952, elämysurheilu, sankaruus sekä lumi ja jää.\n\nNäyttelysuunnistus tarjoaa lapsille ja nuorille oivalluksia historiasta ja nykypäivästä. Näyttelyssä saa halutessaan myös hien pintaan.\n\nTahdon tarina rakentuu kansainvälisesti ainutlaatuisista ja laajoista liikuntakulttuurin kokoelmista, mitä on kerätty 1900-luvun alusta alkaen.\n\nUrheilun ja liikunnan kulttuurikeskus Tahto\n\nPysyvä näyttely\n\nMa-ti & pe klo 10-18\nKe-to klo 10-19\nLa-su klo 10-17\n\nHinnat:\nLapset 0–6 V: Vapaa pääsy\nLapset 7–17 V: 6,50 €\nAikuiset: 16 €\n\nOpiskelijat, eläkeläiset, varushenkilöt, siviilipalvelushenkilöt, työttömät: 11 €","c":"Visual arts","cs":["exhibitions","sports"],"img":"https://api.hel.fi/linkedevents/media/images/50A7026-1-1440x900.jpg","u":"https://tahto.com/nayttelyt/urheilumuseon-paanayttely/","ue":"https://tahto.com/en/exhibitions/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agcthjidge","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"f9cc6c82e7fcf980.webp"},{"src":"le","eid":"helsinki:agcrba6zjq","t":"Ajan kysymys","te":"A Question of Time","v":"Ateneumin taidemuseo","ve":"Ateneum Art Museum","a":"Kaivokatu 2","la":60.17009,"ln":24.9441,"s":720,"e":1200,"d":"The collection exhibition A Question of Time reflects on the major questions of the present time through art. \n\nThe exhibition also offers fresh perspectives into Finland’s oldest and most extensive art collection and how it was built.\n\nAteneum Art Museum\n\nPermanent exhibition, starting from 14.4.2023\n\nAdmission fee 13-23€, under 18 yrs free entry","df":"Ajan kysymys -kokoelmanäyttely katsoo Ateneumin neljältä eri vuosisadalta teoksia sisältävää kokoelmaa ja etenkin sen muodostumista uusin silmin. \n\nMiten vallankäyttö ja aatteet, yksilöt kuten museon työntekijät ja keräilijät sekä puhdas sattuma ovat vaikuttaneet kokoelmaan? Miksi jotakin on hankittu ja toisaalta jätetty hankkimatta?\n\nAjankohtaiseen, yhteiskunnalliseen keskusteluun Ajan kysymys osallistuu teemavalinnoillaan Luonnon aika, Kansan kuvat, Moderni elämä ja Taiteen vallassa.\n\nAteneumin taidemuseo avaa ovensa yleisölle jälleen 14. huhtikuuta 2023, museo suljettiin maaliskuussa 2022 ilmanvaihtoremontin takia.\nNäyttelyitä on vuodelle 2023 luvassa kolme. Näistä ensimmäisenä, samaan aikaan museon kanssa avautuu uusi kokoelmanäyttely Ajan kysymys, joka tulee olemaan esillä usean vuoden ajan.\n\nAteneumin taidemuseo\n\nPysyvä näyttely 14.4.2023 lähtien\n\nSisäänpääsy 13-23€, alle 18-v. vapaa pääsy","c":"Visual arts","cs":["art","cultural events","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Wright_sikoja-ja-harakoita.jpg","u":"https://ateneum.fi/nayttelyt/ajan-kysymys/","ue":"","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agcrba6zjq","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"8d45c2ba09683ee7.webp"},{"src":"le","eid":"hkm:3465","t":"PÄÄTTYNYT: Aikakone","te":"CLOSED: Time Machine","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"Most of us have probably wished we could sneak a peek into the past to see how people used to live. Now, you can do exactly that and step onboard our Time Machine that whisks you away to visit a very lively and authentic Helsinki of a hundred years past.\n\n<h4>Signe Brander’s photographs of Helsinki come alive</h4> To commemorate the 150th anniversary of Signe Brander, a new 2.0 version has been created of the Time Machine virtual experience. The new Time Machine brings Signe Brander’s photographs to life with an immersive and interactive spatial installation that takes visitors on a journey through Helsinki’s past. Time Machine 2.0 will whisk visitors away to early 20th-century Helsinki, where wooden houses are making way for a new city of stone castles. The new city is a mix of national romanticism, Art Nouveau and Nordic classicism – old traditions and new winds.\n\nDuring Brander’s lifetime, Helsinki was for the first time visible from new vantage points, such as the National Museum’s tower. In addition to the bird’s-eye view, Brander also photographed panoramas at street level, capturing everyday details of urban life. Time Machine 2.0 shows projections based on Brander’s panorama photos of Kallio Church and St Nicholas’ Church (now Helsinki Cathedral).\n\nBorn on 15 April 1869, Brander photographed Helsinki and life in Helsinki at the beginning of the previous century, when sh","df":"Moni on joskus haaveillut mahdollisuudesta kurkistaa entisajan ihmisten elämään. Helsingin kaupunginmuseossa se onnistuu, sillä museokävijät voivat astua Aikakoneeseen, joka imaisee heidät elävään ja todentuntuiseen menneisyyden Helsinkiin.\n\n<h4>Signe Branderin valokuvat Helsingistä heräävät eloon</h4> Aikakone herättää Signe Branderin valokuvat eloon ja immersiivinen, interaktiivinen tilainstallaatio kuljettaa kävijän läpi menneisyyden Helsingin. Aikakone 2.0 vie aikamatkaajan 1900-luvun alun Helsinkiin, jossa uusi kivilinnojen kaupunki valtaa alaa puutaloilta. Uusi kaupunki on sekoitus kansallisromantiikkaa, jugendia, sekä pohjoismaista klassismia – vanhaa perinnettä ja uusia tuulia.\n\nBranderin aikana Helsinki oli ensimmäistä kertaa nähtävissä uusista näköalapaikoista, kuten Kansallismuseon tornista. Lintuperspektiivin lisäksi Brander kuvasi panoraamoja myös katutasosta ja tavoitti näin kaupunkielämän arkiset yksityiskohdat. Aikakone 2.0:ssa nähdään projisioita, jotka perustuvat Branderin ottamiin panoraamakuviin Kallion kirkosta ja Nikolainkirkosta eli nykyisestä Tuomiokirkosta käsin.\n\n15. huhtikuuta 1869 syntynyt Brander kuvasi Helsinkiä ja helsinkiläistä elämänmenoa viime vuosisadan alussa, jolloin Helsingin muinaismuistolautakunta palkkasi hänet tallentamaan kiivaasti muuttuvaa kaupunkia. Branderin vuosina 1907–1913 kuvaamat 907 lasinegatiivia ovat kaupunginmuseon kokoelm","c":"Visual arts","cs":["everyday","cultural events","Helsinki residents","museums","urban history"],"img":"https://www.helsinginkaupunginmuseo.fi/wp-content/uploads/2016/01/190408_Aikakone2_vr_2-Edit.jpg","u":"","ue":"","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"hkm:3465","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"3363847db7156aa5.webp"},{"src":"le","eid":"kulke:67091","t":"Piilossa tapahtuu!","te":"Piilossa tapahtuu!","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":1200,"d":"Annantalo’s side programme for the Piilossa (Hidden) exhibition includes a variety of events and workshops – and, sometimes, even the exhibition itself changes!","df":"Piilossa-näyttelyn ohessa järjestetään tapahtumia ja työpajoja – välillä jopa näyttely itsessään muuttuu!\n\nTältä sivulta näet listauksen, josta näet mitä kaikkea on tulossa:\n\nto 9.10.2025\n Perhosia piilossa \nUusi teos näyttelyssä - Kuvataideryhmä Suti ja roiske ja Tanssi- ja kuvataideryhmä Värisevät varpaat ovat laittaneet näyttelytilaan perhosia piiloon - löydätkö ne?\n\nto 15.11.2025\n Piiloutuneet lapset \nUusi teos näyttelyssä - Ryhmät Lumotut silmät ja Lumotut kädet ovat toteuttaneet installaation keramiikka ja akryylimaalaus installaation, joissa naamioiden takana on piilossa salaperäinen lasten joukko.\n\nke 26.11.-20.12.2025\n Muotokuvia Suomen eläimistä \nUusi teos näyttelyssä - Helsingin ranskalais-suomalaisen koulun 5B:n ja Vuoniityn peruskoulun 4E:n hiilipiirrokset ovat esillä Kellari tilassa.\n\nla 29.11.2025 klo 10.30 \n Tehdään taidejuttuja: Piiloleikkiä ryövärien metsässä \nSukella Ronja Ryövärintyttären maailmaan teatterityöpajassa!\n\nla 29.11.2025 klo 11.00 - 14.00\n Annantalon taidelauantai: Mullan alla \nMinkälaisia asioita voisi piileksiä mullan alla marraskuussa? Juuria, onkaloita, myyriä vai matojen makuuhuone? Annantalon taidelauantain työpajassa pääset piirtämään ruskan sävyisillä kuivapastelliiduilla oman tulkintasi maanalaisesta maailmasta.\n\nla 29.11.2025 klo 13.30 \n Tehdään taidejuttuja: Piiloleikkiä ryövärien metsässä \nSukella Ronja Ryövärintyttären maailmaan teat","c":"Visual arts","cs":["Lastentapahtumat","Annantalo","Muut tapahtumat","Suomi","Ruotsi","Englanti"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_777911.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/C43CBD3DDD54E539EF347E3727BEA24C/Piilossa_tapahtuu_","ue":"http://www.annantalo.fi/en/events/event/C43CBD3DDD54E539EF347E3727BEA24C/Piilossa_tapahtuu_","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:67091","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"efa63c045aee5314.webp"},{"src":"le","eid":"kulke:66833","t":"Piilossa","te":"Piilossa (Hidden)","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":1200,"d":"An exhibition of things that are not always visible.\n\nHidden or visible? The exhibition has changed the gallery into nine separate rooms - each different kind of hiding place.\n\nThe exhibition is a process – meaning that it does not stay the same but instead changes during the exhibition term. Some of the rooms may be closed for a time and then reopen with new contents or different works. You can therefore visit the exhibition many times and always find something new!\n\nThere’s a lot happening in the exhibition! See more information about workshops and other events related to the exhibition. \n\nThe Annantalo theme for 2025–2026 is Hide and seek. It invites families to explore all the things that could be hidden – feelings, dreams, games or entire stories. Maybe something hidden is only waiting to be seen. Maybe we can discover it together at Annantalo!","df":"Pilven sisällä, pinnan alla, maan kätköissä vai luukun takana? Piilossa on näyttely asioista, jotka eivät aina ole näkyvillä.\n\nPiilossa-näyttelyssä Alagalleria on muuttunut huoneistoksi: se on jaettu erilaisiin tiloihin, joista kukin on omanlaisensa piilo.\n\nNäyttely on prosessi – se ei siis ole jatkuvasti samanlainen, vaan muuttuu kauden aikana. Osa huoneista saattaa olla välillä kiinni ja avautua uudella sisällöllä tai siellä olevat teokset voivat vaihtua. Näyttelyssä voi siis vierailla monta kertaa ja löytää aina jotain uutta!\n\nNäyttelyssä ovat mukana taiteilijat Janne Kärkkäinen , Anniina Salo ja Kirsti Taiviola . Esillä on myös vaihtuvasti teoksia lapsilta ja nuorilta. Mukana ovat taideryhmät Kohina , Kontrasti , Jäljen etsijät , Painotassut ja Sähäkät siveltimet .\n\nNäyttelyssä tapahtuu! Katso lisätietoja työpajoista ja muista näyttelyyn liittyvistä tapahtumista \n\nAnnantalon vuosien 2025-2026 teemana on Piilossa. Se kutsuu perheitä tutkimaan, mitä kaikkea voi olla näkymättömissä – tunteita, unelmia, leikkejä tai kokonaisia tarinoita. Piilossa voi olla jotakin, joka vain odottaa tulevansa nähdyksi. Ehkä löydämme sen yhdessä Annantalosta!","c":"Visual arts","cs":["Lastentapahtumat","Annantalo","Näyttelyt","Suomi","Ruotsi","Englanti"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_772494.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/631086C4A57DC529631B9A941D17A7E9/Piilossa","ue":"http://www.annantalo.fi/en/events/event/631086C4A57DC529631B9A941D17A7E9/Piilossa_Hidden_","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:66833","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"abe0e5c6c7154610.webp"},{"src":"le","eid":"hkm:7653","t":"Stefan Bremer - Helsinki by Night","te":"Stefan Bremer - Helsinki by Night","v":"Hakasalmen huvila","ve":"Villa Hakasalmi","a":"Mannerheimintie 13b","la":60.17466,"ln":24.93409,"s":720,"e":1200,"d":"Helsinki by Night is photographer Stefan Bremer ’s profoundly personal view of the Helsinki nightscape. With his camera, he wandered through the city, capturing both the vibrant nightlife and misty urban landscapes. Alongside poetic cityscapes, the exhibition features photos of the diverse youth cultures, subcultures and music scenes of the era. A section of the exhibition is dedicated to images taken at rock concerts, some of which were hand-colored and used as LP cover art.\n\nStefan Bremer (b. 1953) is a central figure in Finnish photography art. He is renowned for documenting urban nightlife – iconic works from his legendary series Helsinki by Night (1983), Creatures of the Night (1984–86), and Valokuva on Rock (1982) are also on display at Villa Hakasalmi. His images offer intimate and powerful glimpses into a time when the city’s streets, concert venues, and clubs became
