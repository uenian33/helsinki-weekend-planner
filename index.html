ossa_tapahtuu_","ue":"http://www.annantalo.fi/en/events/event/C43CBD3DDD54E539EF347E3727BEA24C/Piilossa_tapahtuu_","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:67091","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:66833","t":"Piilossa","te":"Piilossa (Hidden)","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":1200,"d":"An exhibition of things that are not always visible.\n\nHidden or visible? The exhibition has changed the gallery into nine separate rooms - each different kind of hiding place.\n\nThe exhibition is a process – meaning that it does not stay the same but instead changes during the exhibition term. Some of the rooms may be closed for a time and then reopen with new contents or different works. You can therefore visit the exhibition many times and always find something new!\n\nThere’s a lot happening in the exhibition! See more information about workshops and other events related to the exhibition. \n\nThe Annantalo theme for 2025–2026 is Hide and seek. It invites families to explore all the things that could be hidden – feelings, dreams, games or entire stories. Maybe something hidden is only waiting to be seen. Maybe we can discover it together at Annantalo!","df":"Pilven sisällä, pinnan alla, maan kätköissä vai luukun takana? Piilossa on näyttely asioista, jotka eivät aina ole näkyvillä.\n\nPiilossa-näyttelyssä Alagalleria on muuttunut huoneistoksi: se on jaettu erilaisiin tiloihin, joista kukin on omanlaisensa piilo.\n\nNäyttely on prosessi – se ei siis ole jatkuvasti samanlainen, vaan muuttuu kauden aikana. Osa huoneista saattaa olla välillä kiinni ja avautua uudella sisällöllä tai siellä olevat teokset voivat vaihtua. Näyttelyssä voi siis vierailla monta kertaa ja löytää aina jotain uutta!\n\nNäyttelyssä ovat mukana taiteilijat Janne Kärkkäinen , Anniina Salo ja Kirsti Taiviola . Esillä on myös vaihtuvasti teoksia lapsilta ja nuorilta. Mukana ovat taideryhmät Kohina , Kontrasti , Jäljen etsijät , Painotassut ja Sähäkät siveltimet .\n\nNäyttelyssä tapahtuu! Katso lisätietoja työpajoista ja muista näyttelyyn liittyvistä tapahtumista \n\nAnnantalon vuosien 2025-2026 teemana on Piilossa. Se kutsuu perheitä tutkimaan, mitä kaikkea voi olla näkymättömissä – tunteita, unelmia, leikkejä tai kokonaisia tarinoita. Piilossa voi olla jotakin, joka vain odottaa tulevansa nähdyksi. Ehkä löydämme sen yhdessä Annantalosta!","c":"Visual arts","cs":["Lastentapahtumat","Annantalo","Näyttelyt","Suomi","Ruotsi","Englanti"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_772494.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/631086C4A57DC529631B9A941D17A7E9/Piilossa","ue":"http://www.annantalo.fi/en/events/event/631086C4A57DC529631B9A941D17A7E9/Piilossa_Hidden_","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:66833","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"hkm:7653","t":"Stefan Bremer - Helsinki by Night","te":"Stefan Bremer - Helsinki by Night","v":"Hakasalmen huvila","ve":"Villa Hakasalmi","a":"Mannerheimintie 13b","la":60.17466,"ln":24.93409,"s":720,"e":1200,"d":"Helsinki by Night is photographer Stefan Bremer ’s profoundly personal view of the Helsinki nightscape. With his camera, he wandered through the city, capturing both the vibrant nightlife and misty urban landscapes. Alongside poetic cityscapes, the exhibition features photos of the diverse youth cultures, subcultures and music scenes of the era. A section of the exhibition is dedicated to images taken at rock concerts, some of which were hand-colored and used as LP cover art.\n\nStefan Bremer (b. 1953) is a central figure in Finnish photography art. He is renowned for documenting urban nightlife – iconic works from his legendary series Helsinki by Night (1983), Creatures of the Night (1984–86), and Valokuva on Rock (1982) are also on display at Villa Hakasalmi. His images offer intimate and powerful glimpses into a time when the city’s streets, concert venues, and clubs became stages for a new generation’s self-expression.\n\nCoinciding with the exhibition’s opening, Parvs Publishing Company will release Bremer’s Helsinki by Night photo book. The exhibition is produced by Jari Harju , Head of Audience Services at the Helsinki City Museum, and the exhibition design is by Osmo Leppälä .\n\nStefan Bremer – Helsinki by Night 24 October 2025 – 30 August 2026 Villa Hakasalmi Mannerheimintie 13b Tickets: €17/11\n\nPhotos: Stefan Bremer","df":"Helsinki by Night on valokuvaaja Stefan Bremerin henkilökohtainen näkemys öisestä Helsingistä. Hän kulki kaupungin halki kameransa kanssa, kuvaten sekä sykkivää yöelämää että utuisia kaupunkimaisemia. Runollisten kaupunkikuvien rinnalla näyttelyyn tulee esille valokuvia aikakauden moninaisista nuorisokulttuureista: Rautatieaseman diinareista Lepakon punkkareihin. Oman kokonaisuutensa muodostaa rock-bändien keikoilta otetut kuvat, joista osa päätyi käsin väritettyinä LP-levyjen kansikuviksi.\n\nStefan Bremer (s. 1953) on keskeinen nimi suomalaisessa valokuvataiteessa. Hän on tullut tunnetuksi urbaanin yöelämän dokumentoijana – legendaaristen kuvasarjojen Helsinki By Night (1983), Yön hahmot (1984–86) ja Valokuva on Rock (1982) ikonisia teoksia nähdään myös Hakasalmen huvilassa. Hänen kuvansa ovat intiimejä ja voimakkaita väläyksiä ajasta, jolloin kaupungin kadut, konserttipaikat ja klubit muuntuivat näyttämöiksi uuden sukupolven itseilmaisulle.\n\nNäyttelyn avautumisen yhteydessä Kustannusosakeyhtiö Parvs julkaisee Helsinki by Night -valokuvakirjan. Bremerin lisäksi kirjaan ovat kirjoittaneet Kjell Westö ja Rosa Liksom . Kirja on myytävänä Hakasalmen huvilan museokaupassa.\n\nNäyttelyn ovat kuratoineet Stefan Bremer ja Asko Mäkelä . Näyttelyn on tuottanut Jari Harju ja näyttelysuunnittelusta vastaa Osmo Leppälä .\n\nStefan Bremer – Helsinki by Night 24.10.2025–30.8.2026 Hakasalmen huvil","c":"Visual arts","cs":["Culture and leisure","everyday","Helsinki residents","museums","urban history"],"img":"https://www.helsinginkaupunginmuseo.fi/app/uploads/sites/2/2025/06/artikkelikuva_825x513px_Stefan_Bremer_Helsinki_by_Night_diinarit_HH_syksy25.jpg","u":"https://hakasalmenhuvila.fi/nayttelyt/stefan-bremer-helsinki-by-night/","ue":"https://hakasalmivilla.fi/exhibition/stefan-bremer-helsinki-by-night/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"hkm:7653","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agn7vmidyy","t":"Epic Scape Rikhardinkadun kirjasto","te":"Epic Scape Rikhardinkadun kirjasto","v":"Rikhardinkadun kirjasto","ve":"Rikhardinkatu Library","a":"Rikhardinkatu 3","la":60.16634,"ln":24.94678,"s":720,"e":1200,"d":"Tervetuloa kokeilemaan pakohuonetyyppistä peliä, jossa pelialueena on koko Rikhardinkadun kirjasto.\n\nPeliä pelataan nettisivulla, jonka QR-koodin löydät kirjastosta. Peli on suunniteltu kaikenikäisille, eikä pelaaminen vaadi latauksia tai rekisteröitymistä.\n\nAstu seikkailuun ja pidä hauskaa!\n\nhttps://www.instagram.com/epicscape/","df":"Tervetuloa kokeilemaan pakohuonetyyppistä peliä, jossa pelialueena on koko Rikhardinkadun kirjasto.\n\nPeliä pelataan nettisivulla, jonka QR-koodin löydät kirjastosta. Peli on suunniteltu kaikenikäisille, eikä pelaaminen vaadi latauksia tai rekisteröitymistä.\n\nAstu seikkailuun ja pidä hauskaa!\n\nhttps://www.instagram.com/epicscape/","c":"Visual arts","cs":["nuorten lomatekemistä","participation","escape rooms","games"],"img":"https://api.hel.fi/linkedevents/media/images/Epic_Scape_Riku_le.jpg","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agn7vmidyy","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agn7vmidyy","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agn7vmidyy","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agou2bhv4a","t":"Ruttovuoden todistajat -audiodraama","te":"Voices from the Plague, Audio Drama","v":"Vanha kirkkopuisto - Ruttopuisto","ve":"Old Church Park - Ruttopuisto","a":"Bulevardi","la":60.16609,"ln":24.93973,"s":720,"e":1200,"d":"Voices from the Plague - An audio journey through the graveyard in the autumn of 1710 - ECHOES audiowalk \n\nPut on your headphones and step into the cemetery in the year 1710, when two thirds of Helsinki’s residents died in the plague.\n\nThe audio drama Voices from the Plague, produced by Yle Svenska, is available in Finnish, Swedish, and English through the free Echoes app. The use of headphones is recommended.\n\nDifferent parts of the drama are activated as the listener moves through different areas of the Helsinki Old Church Park. The drama will be available continuously until the end of 2026.","df":"Ruttovuoden todistajat - äänikävely hautausmaan läpi syksyllä 1710 - ECHOES audiowalk \n\nLaita kuulokkeet korville ja astu hautausmaalle vuoteen 1710, jolloin kaksi kolmasosaa Helsingin asukkaista kuoli ruttoon. \n\nYle Svenskan tuottama Ruttovuoden todistajat -audiodraama (Röster från pestens år 1710) kuunneltavissa suomeksi, ruotsiksi ja englanniksi lataamalla ilmainen Echoes-sovellus. Kuulokkeiden käyttö suositeltava. \n\nDraaman eri osat aktivoituvat kuunneltavaksi, kun kuuntelija liikkuu puiston eri osissa. Draama on kuunneltavissa jatkuvasti vuoden 2026 loppuun asti.","c":"Dance","cs":["guidance","walking tours","theatre (art forms)","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/Pestens_ar_fi_297x460.jpg","u":"https://explore.echoes.xyz/collections/EZZ3CXLMomKakgr4","ue":"https://explore.echoes.xyz/collections/EZZ3CXLMomKakgr4","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agou2bhv4a","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:67975","t":"Piilopeli","te":"Hiding Game","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":1200,"d":"A self-guided escape game has opened within the Hidden exhibition!\n\nRabbits have taken over the exhibition. Players get to help robot caretaker B-Ö solve the problem.\nCome and see if you can solve the problem!\n\nThe game is suitable for the whole family.\nDuration: roughly 30 min\nOpen during the opening hours of the exhibition.\n\n_\n\nGame design: Maaria Klemetti\nProduction: Annantalo 2026","df":"Piilossa-näyttelyssä avautuu omatoiminen pakopeli!\n\nJänikset ovat ottaneet vallan näyttelyssä. Pelaajat pääsevät auttamaan robottivahtimestari B-Ö:tä pulman ratkaisussa.\nTule kokeilemaan saatko ratkaistua pulman!\n\nPelata kannattaa kaverin kanssa tai ryhmässä - useammat aivot ratkovat pulmia usein tehokkaammin.\nJa, jos peli ei ratkea kerralla, voi aina palata jatkamaan myöhemmin!\n\nPeli sopii koko perheelle.\nKesto n. 30min\nAvoinna näyttelyn aukioloaikoina.\n\n_\n\nPelisuunnittelu: Maaria Klemetti\nTuotanto: Annantalo 2026","c":"Visual arts","cs":["Lastentapahtumat","Annantalo","Näyttelyt","Muut tapahtumat","Suomi","Ruotsi"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_783892.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/42152FBCB9B71677862E774C69CE1AC8/Piilopeli","ue":"http://www.annantalo.fi/en/events/event/42152FBCB9B71677862E774C69CE1AC8/Hiding_Game","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:67975","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agohvgnuge","t":"Tove Jansson -galleria: Taiteilijaperhe Jansson","te":"Tove Jansson Gallery: Artist Family Jansson","v":"Helsingin taidemuseo HAM","ve":"Helsinki Art Museum HAM","a":"Eteläinen Rautatiekatu 8","la":60.17016,"ln":24.9302,"s":720,"e":1200,"d":"The Tove Jansson Gallery at HAM opens on a larger scale than ever before, now spreading across three exhibition halls.\n\nThe Tove Jansson Gallery is built around the beloved frescos Party in the Countryside and Party in the City, which are permanently on display. \n\nSpanning three exhibition halls, the gallery aims to strengthen Tove Jansson’s artistic legacy and significance in both art history and Finnish society. It showcases Jansson’s art in a diverse way and introduces new perspectives on her as both a Helsinki-based and international artist.\n\nThe gallery’s first exhibition presents the diverse forms of expression and shared artistic projects of the Jansson family of artists. Photographs also provide a glimpse into the family’s leisure time. \n\nThe home’s atmosphere, close relationships and shared family adventures were later reflected in the Moomin stories that launched Tove Jansson to international fame. \n\nThe Artist Family Jansson exhibition commemorates the book Comet in Moominland, which is celebrating its 80th anniversary in 2026.\n\nHelsinki Art Museum HAM\n\n13.2.2026-10.1.2027\n\nAdmission fee 0-20€","df":"Uudistetun Tove Jansson -gallerian ensimmäinen näyttely keskittyy Janssonin taiteilijaperheeseen ja avaa oven kotiin, jossa taide oli elämäntapa.\nSuomenruotsalainen Janssonin perhe on yksi suomalaisen taide-elämän merkittävimmistä taiteilijaperheistä. \n\nKuvittajana ja graafikkona työskennellyt Signe-äiti sekä kuvanveistäjäisä Viktor kannustivat lapsiaan taiteen pariin. Tovesta tuli kuvataiteilija ja kirjailija, Per Olovista taidevalokuvaaja ja kirjailija, ja Larsista sarjakuvataiteilija ja kirjailija.   \n\nNäyttelyssä on esillä yli 140 teosta ja esinettä. Signe Hammarsten Janssonilta nähdään 50 piirustusta, yli 20 ex libris-, seteli- ja postimerkkiluonnosta, kymmeniä toteutuneita postimerkkejä ja karikatyyreistä koostetulla tapetilla päällystetty seinä. \n\nKokonaisuus kattaa myös Viktor Janssonin 13 pienoisveistosta ja Tove Janssonin freskot, maalauksia, piirustuksia, lehtien kansikuvituksia sekä ex libriksiä. Lars Janssonin kädenjälki näkyy veistoksessa, kirjoissa ja sarjakuvaoriginaaleissa. Per Olov Janssonilta mukana on valokuvia ja kirjoja.\n\nTaiteilijaperhe Jansson -näyttelyssä viihtyvät aikuisten lisäksi myös lapset. Yksi seinä on täynnä luukkuja, joihin kävijät voivat kurkistaa ja löytää Janssonin perheenjäseniä muistuttavia Muumilaakson asukkaita. \n\nHelsingin taidemuseo HAM\n\n13.2.2026-10.1.2027\n\nSisäänpääsy 0-20€","c":"Literature","cs":["art","cultural events","exhibitions","literature"],"img":"https://api.hel.fi/linkedevents/media/images/Taiteilijaperhe-Jansson.jpg","u":"https://www.hamhelsinki.fi/exhibitions/tove-jansson-galleria/","ue":"https://www.hamhelsinki.fi/en/exhibitions/tove-jansson-gallery/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agohvgnuge","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agnnsqrtla","t":"Nelivärinen uni - Kiasman kokoelmanäyttely","te":"A Dream in Four Colours - Kiasma Collection Exhibition","v":"Nykytaiteen museo Kiasma","ve":"Museum of Contemporary Art Kiasma","a":"Mannerheiminaukio 2","la":60.17206,"ln":24.93662,"s":720,"e":1200,"d":"The exhibition unfolds like a dream: fragmentary and wondrous, interweaving fantasy and reality. Meanings shift and shimmer, like in dreams themselves, which transcend everyday comprehension. Visitors encounter a space where the possible and impossible hover side by side, evoking experiences that words cannot fully capture.\n\nThe exhibition presents works from the Finnish National Gallery’s collection, which holds over 43,000 works in total. It features around 40 artists, including Eija-Liisa Ahtila, Riikka Anttonen, Milla Aska, Korakrit Arunanondchai, Bruce Nauman, Olli Lyytikäinen, Elina Merenmies, Pakui Hardware, and Cindy Sherman.","df":"Näyttely on kuin uni. Se avautuu kävijälle katkelmina ja ihmeellisinä kohtaamisina, joissa tosi ja kuviteltu sekoittuvat. Merkitykset liukuvat ja muuttavat muotoaan – kuten unissa, jotka ylittävät arkisen ymmärryksen ja joissa koettua on vaikea sanoilla tavoittaa.\n\nNäyttely on koottu Kansallisgallerian kokoelmasta, johon kuuluu yli 43 000 teosta. Kahteen kerrokseen levittäytyvässä näyttelyssä on mukana noin 40 taiteilijaa. Esillä on teoksia muun muassa Eija-Liisa Ahtilalta, Milla Askalta, Dara Birnbaumilta, Minjee Hwang Kimiltä, Leena Luostariselta, Olli Lyytikäiseltä, Elina Merenmieheltä, Oskari Ruuskalta ja Cindy Shermanilta.","c":"Visual arts","cs":["fine arts","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/MerenmiesElina_ASnakeFullofSighs2023-24_KuvaKG_PetriVirtanen.jpg","u":"https://kiasma.fi/nayttelyt/nelivarinen-uni/","ue":"https://kiasma.fi/en/exhibitions/a-dream-in-four-colours/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agnnsqrtla","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agnwsh6v5i","t":"Anna Sinebrychoff - Edelläkävijä","te":"Anna Sinebrychoff - Ahead of Her Time","v":"Sinebrychoffin taidemuseo","ve":"Sinebrychoff Art Museum","a":"Bulevardi 40","la":60.16252,"ln":24.93228,"s":720,"e":1200,"d":"Anna Sinebrychoff (1830–1904) had a bourgeois girl’s education, married the successful businessman Paul Sinebrychoff (1799–1883) in 1850, and they had four children. \n\nOn her husband’s death, she attained a position that was rare for a woman in Finland, as majority shareholder and chair of the board of a large company. In the latter half of the 19th century, she became the most important woman in the prominent Sinebrychoff Brewery clan. \n\nShe resolutely led the family and kept a close eye on the work of her two sons as they managed the company. \n\nShe was the undisputed matriarch and a revered grandmother. Anna Sinebrychoff died in 1904. The numerous obituaries noted her extensive charitable work.\n\nThe exhibition offers a broad overview of Anna’s life and work in Helsinki from the 1850s onwards. At its core is Anna Sinebrychoff the active influencer: bearer of responsibility for the family and business, benefactor, prominent figure in associations and societies, and member of the Orthodox congregation. \n\nSinebrychoff Art Museum, Red Cellar\n\n3.3.2026-29.8.2027\n\nTue, Thu, Fri 11.00-18.00\n\nWed 10.00-20.00\n\nSat-Sun 10.00-17.00\n\nAdmission fee 0-21€","df":"Anna Sinebrychoff (1830–1904) oli poikkeuksellinen nainen, joka hallitsi 1800-luvun lopulla yhtä Suomen menestyksekkäintä yritystä, Sinebrychoffien panimoa. \n\nAnna Sinebrychoffin elämä liittyy kiinteästi taidemuseon omaan historiaan. Hän asui Bulevardilla talon paraatiasunnossa yli 50 vuotta ja jätti lapsilleen mittavan taloudellisen ja henkisen perinnön. \n\nAnna Sinebrychoff (1830–1904) sai porvaristytön koulutuksen, avioitui vuonna 1850 menestyneen liikemiehen Paul Sinebrychoffin (1799–1883) kanssa ja he saivat neljä lasta. Hän saavutti miehensä kuoleman jälkeen Suomen oloissa harvinaisen aseman suuryrityksen enemmistöosakkaana ja hallituksen puheenjohtajana. \n\nAnnasta tuli tunnetun Sinebrychoffin panimosuvun merkittävin nainen 1800-luvun jälkipuolella. Määrätietoisella otteella hän johti perhettään ja valvoi kahden poikansa toimintaa yrityksen johtajina. \n\nNäyttely tuo kattavasti esiin Anna Sinebrychoffin elämän ja toiminnan Helsingissä 1850-luvulta alkaen. Sen keskiössä on Anna aktiivisena vaikuttajana: perheen ja liiketoiminnan vastuunkantajana, hyväntekijänä, yhdistystoimijana ja ortodoksisen seurakunnan jäsenenä. \n\nNäyttely asettaa Annan keskelle oman aikansa yhteiskunnallisia ja taloudellisia muutoksia. \n\nSinebrychoffin taidemuseo, Punainen kellari\n\n3.3.2026–29.8.2027 \n\nTi, to, pe 11.00–18.00\nke 10.00–20.00\nLa–su 10.00–17.00\n\nSisäänpääsy 0-21€","c":"Visual arts","cs":["fine arts","art","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/4f4dc39e-ee84-4ab3-b986-791b7722d933.jpg","u":"https://sinebrychoffintaidemuseo.fi/nayttelyt/anna-sinebrychoff-edellakavija/","ue":"https://sinebrychoffintaidemuseo.fi/en/exhibitions/anna-sinebrychoff-ahead-of-her-time/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agnwsh6v5i","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agok37p6si","t":"Käsityönä tehdyn lasin lumo","te":"The Magic of Handmade Glass","v":"Suomenlinna-museo","ve":"Suomenlinna Museum","a":"Suomenlinna C 74","la":60.14521,"ln":24.98776,"s":720,"e":1200,"d":"The touring exhibition organized by the Finnish Glass Museum celebrates the inclusion of handmade glassmaking on UNESCO’s Representative List of the Intangible Cultural Heritage of Humanity. \n\nThe exhibition presents the tradition of handmade glass and highlights Finnish glassmaking activities and expertise.\n\nGlass has been blown in Suomenlinna since the 1970s. The studio glass activity initiated by Heikki Kallio has been continued by Glass Studio Hytti, which has hosted several makers of both functional and art glass. \n\nThe touring exhibition has been complemented with works by Heikki Kallio and glass artists who have worked in Suomenlinna in the 2020s.\n\nSuomenlinna Museum\n\n6.3.2026-10.1.2027\n\nDaily 10.30-17.00; June-August 10.00-18.00\n\nAdmission fee 5-10€","df":"Suomen lasimuseon kokoama kiertonäyttely juhlistaa käsityönä valmistetun lasin liittämistä Unescon aineettoman kulttuuriperinnön luetteloon. Näyttely kertoo käsityönä valmistetun lasin perinteestä ja suomalaisesta lasialan toiminnasta ja osaamisesta.\n\nSuomenlinnassa on puhallettu lasia jo 1970-luvulla. Heikki Kallion aloittamaa studiolasitoimintaa on jatkanut Lasistudio Hytti, jossa on työskennellyt useita käyttö- ja taidelasin tekijöitä. \n\nKiertonäyttelyä on täydennetty Heikki Kallion ja Suomenlinnassa 2020-luvulla toimineiden lasitaiteilijoiden teoksilla.\n\nSuomenlinna-museo\n\n6.3.2026-10.1.2027\n\nPäivittäin 10.30-17.00; kesä-elokuu 10.00-18.00\n\nSisäänpääsy 5-10€","c":"Visual arts","cs":["Design","exhibitions","design (artistic creation)","glass art"],"img":"https://api.hel.fi/linkedevents/media/images/lasimuseo-ella-tommila.png","u":"https://suomenlinnatours.com/kasityona-tehdyn-lasin-lumo-nayttely-suomenlinna-museossa/","ue":"https://suomenlinnatours.com/en/activities-at-suomenlinna/suomenlinna-museum/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agok37p6si","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agoqwzi2om","t":"Tony Granholm - Unelmani korumuseosta","te":"Tony Granholm - Dreaming a Jewellery Museum","v":"Suomen kello- ja korumuseo Kruunu","ve":"Finnish Museum of Horology and Jewellery Kruunu","a":"Ahertajantie 3","la":60.17876,"ln":24.79674,"s":720,"e":1200,"d":"The exhibition presents goldsmith and designer Tony Granholm’s donation of his life’s work to the Finnish Museum of Horology in 2018.\n\nWith his donation, Granholm wanted to show the goldsmiths’ industry that the cultural heritage of their field should be preserved and shown to future generations. \n\nt was a great dream of the artist to have a Finnish jewellery museum. This dream came true when The Finnish Museum of Horology and Jewellery Kruunu was founded in 2021.\n\nFinnish Museum of Horology and Jewellery Kruunu, Espoo\n\n6.3.-6.9.2026\n\nWed-Sat 11.00-17.00\n\nSun 10.00-17.00\n\nAdmission fee 0-15€","df":"Näyttely esittelee kultaseppä ja muotoilija Tony Granholmin vuonna 2018 tehtyä elämäntyölahjoitusta Suomen Kellomuseolle.\n\nGranholmin omien sanojen mukaan hän halusi osoittaa lahjoituksellaan muille kultasepänalan toimijoille, että alan kulttuuriperintöä tulee säilyttää ja esitellä tuleville sukupolville. \n\nTaiteilijan suurena unelmana oli suomalainen korumuseo. Tämä unelma täyttyi, kun Suomen kello- ja korumuseo Kruunu perustettiin vuonna 2021.\n\nSuomen kello- ja korumuseo Kruunu, Espoo\n\n6.3.-6.9.2026\n\nKe-la 11.00-17.00\n\nSu 10.00-17.00\n\nSisäänpääsy 0-15€","c":"Visual arts","cs":["Design","jewellery","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/hirvenp%C3%A4%C3%A4kokoelma_pieni.jpg","u":"https://www.kellojakorumuseo.fi/nayttelyt/tony-granholm-unelmani-korumuseosta","ue":"https://www.kellojakorumuseo.fi/en/exhibitions/tony-granholm-dreaming-a-jewellery-museum","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agoqwzi2om","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agnosoicsm","t":"Eero Nelimarkka","te":"Eero Nelimarkka","v":"Ateneumin taidemuseo","ve":"Ateneum Art Museum","a":"Kaivokatu 2","la":60.17009,"ln":24.9441,"s":720,"e":1200,"d":"An exhibition covering the entire career of Eero Nelimarkka (1891–1977) takes a fresh look at the versatile artist and sheds light on his view of the world. \n\nThe artist’s fascinating life story traces his journey from being the son of a washerwoman in Vaasa to one of Finland’s most popular artists.\n\nAteneum Art Museum\n\n13.3.-13.9.2026\n\nTue & Fri 10.00-18.00\nWed-Thu 10.00-20.00\nSat-Sun 10.00-17.00\n\nAdmission fee 0-23€","df":"Eero Nelimarkan (1891–1977) koko uran kattava näyttely katsoo monipuolista taiteilijaa uusin silmin ja valottaa sitä, millaisen linssin läpi hän katsoi maailmaa. \n\nTaiteilijan kiehtova elämäntarina kertoo matkan vaasalaisen pyykinpesijän pojasta yhdeksi Suomen suosituimmista taiteilijoista.\n\nAteneumin taidemuseo, 3. krs\n\n13.3.-13.9.2026\n\nTi & pe 10.00-18.00\nKe-to 10.00-20.00\nLa-su 10.00-17.00\n\nSisäänpääsy 0-23€","c":"Visual arts","cs":["fine arts","art","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/f9c93b71-2e9f-4495-b249-da53730f428f.jpg","u":"https://ateneum.fi/nayttelyt/eero-nelimarkka/","ue":"https://ateneum.fi/en/exhibitions/eero-nelimarkka/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agnosoicsm","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agohvikzfq","t":"Petri Ala-Maunus ja Mauno Markkula: Palava taivas","te":"Petri Ala-Maunus and Mauno Markkula: Blazing Sky","v":"Helsingin taidemuseo HAM","ve":"Helsinki Art Museum HAM","a":"Eteläinen Rautatiekatu 8","la":60.17016,"ln":24.9302,"s":720,"e":1200,"d":"The opening exhibition of HAM’s new collection space brings together two painters from different eras, united by their emotional exploration of landscape.\n\nHAM looks after an art collection that belongs to all residents of Helsinki. The new collection space presents the collection in a more extensive and innovative way. \n\nThe space is based on the Bäcksbacka collections, whose key artists include Mauno Markkula. Markkula’s works from the 1940s and 1950s now enter into an interesting dialogue with Petri Ala-Maunus’ paintings from the 2010s and 2020s. \n\nThe exhibition takes visitors to surreal landscapes amid storms of colour.\n\nHelsinki Art Museum HAM\n\n13.3.2026-31.1.2027\n\nAdmission fee 0-20€","df":"HAMin uuden kokoelmatilan ensimmäinen näyttely tuo yhteen kaksi eri aikakauden taidemaalaria, joita yhdistää maiseman tunnepitoinen tarkastelu.\n\nTilan perustan muodostavat Bäcksbackan kokoelmat, joiden avaintaiteilijoihin Mauno Markkula kuuluu. \n\nNyt Markkulan 1940–50-lukujen teokset asettuvat mielenkiintoiseen vuoropuheluun Petri Ala-Maunuksen 2010–2020-lukujen maalausten kanssa. Näyttely saattelee vierailijat epätodellisiin maisemiin värimyrskyjen keskelle.\n\nHelsingin taidemuseo HAM\n13.3.2026-31.1.2027\n\nSisäänpääsy 0-20€","c":"Visual arts","cs":["art","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Petri-Ala-Maunus-Valaistu-puu-1083x1300.jpg","u":"https://www.hamhelsinki.fi/exhibitions/petri-ala-maunus-ja-mauno-markkula/","ue":"https://www.hamhelsinki.fi/en/exhibitions/petri-ala-maunus-and-mauno-markkula/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agohvikzfq","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpsn6yefi","t":"Tekoälyn tila","te":"AI Space","v":"Tekniikan museo","ve":"The Museum of Technology","a":"Viikintie 1d","la":60.21594,"ln":24.98309,"s":720,"e":1200,"d":"Explore the world of artificial intelligence—its history, principles, and the questions surrounding it. Discover how AI has developed over time and how it works.\nLearning how AI works helps us understand its impact on people'slives today and its possibilities for the future. This space provides perspectives on how AI has evolved and how it is understood today. Because AI is advancing rapidly, this space will continue to evolve. The content will be updated regularly in collaboration with experts and partners.\n\nMuseum of Technology invites you to send a message with your thoughts and reflections about this rapidly growing phenomenon in the global society to the developers and researchers of artificial intelligence.\n\nMuseum of Technology\n\n20.3.2026-31.12.2027","df":"Tekoäly muuttuu jatkuvasti – muuttaen samalla ihmisten arkea. Mutta mistä tekoäly on tullut, ja miten se oikeastaan toimii?\n\nTekoälyn tila tarkastelee tekoälyä ilmiönä, avaa sen taustoja, kehitystä ja keskeisiä käsitteitä ymmärrettävästi. \n\nSe kuljettaa varhaisista teorioista nykypäivän kielimalleihin ja näyttää, miten tekoälyä rakennetaan, miten se oppii ja millaisia rajoja siihen liittyy.\n\nTila tarkastelee tekoälyn vaikutuksia laajasti: miten se muuttaa työtä, päätöksentekoa ja yhteiskuntaa. Mukana ovat sekä teknologinen kehitys että ajankohtaiset aiheet, kuten tekoälyn sääntely. \n\nTekniikan museo\n\n20.3.2026-31.12.2027","c":"Visual arts","cs":["technology","artificial intelligence","exhibitions","computers"],"img":"https://api.hel.fi/linkedevents/media/images/P9104994.JPG","u":"https://www.tekniikanmuseo.fi/nayttely/tekniikan-maa/","ue":"https://www.tekniikanmuseo.fi/en/exhibition/ai-space/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpsn6yefi","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agnnsrxuuq","t":"Entiset ainoat - Saamelaisen taiteen aika","te":"We Who Remain - Sámi Art in Focus","v":"Nykytaiteen museo Kiasma","ve":"Museum of Contemporary Art Kiasma","a":"Mannerheiminaukio 2","la":60.17206,"ln":24.93662,"s":720,"e":1200,"d":"The Sápmi region, which today spans four countries, existed long before the emergence of Nordic nation-states or national ideologies. The exhibition invites viewers to explore Sámi identity as expressed by the Sámi themselves. The exhibition highlights the complexities of Sámi experience, showing how Sámi identity endures and remains vibrant despite externally imposed pressures.\n\nCurated by Saami Rights advocate, essayist and musician Petra Laiti, the exhibition features more than 20 artists and works created from the 1970s to the present day. The exhibition presents contemporary art by and about the Sámi community across the Sápmi territories of Finland, Sweden, and Norway.","df":"Nykyään neljän valtion alueella sijaitseva Saamenmaa oli olemassa ennen pohjoismaista valtiokäsitystä tai kansallisaatteita. Näyttely esittelee nykytaidetta, joka johdattaa tarkastelemaan saamelaisuutta heidän itsensä kertomana. Esille nousevat monikerroksiset kokemukset, joissa saamelaisuus säilyy elävänä ja jatkaa olemassaoloaan ulkopuolelta asetetuista rakenteista huolimatta.\n\nNäyttelyssä on mukana yli 20 taiteilijaa ja teoksia 1970-luvulta nykypäivään. Näyttelyn on kuratoinut erityisasiantuntija Petra Laiti.","c":"Visual arts","cs":["fine arts","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/siriBaggerman_Drone2021_KuvaSiriBaggerman.jpg","u":"https://kiasma.fi/nayttelyt/entiset-ainoat/","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agnnsrxuuq","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agnnsrxuuq","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agosu5bda4","t":"Film still - Malla Hukkasen valokuvia elokuvista","te":"Film Stills by Malla Hukkanen","v":"Suomen valokuvataiteen museo","ve":"Finnish Museum of Photography","a":"Kaapeliaukio 3","la":60.16188,"ln":24.90581,"s":720,"e":1200,"d":"Film still photographs, colloquially known as simply stills, are not freeze frames from the film reel, but rather photographers' reinterpretations of scenes. The still photographer steps in with their camera once the scene has been shot. \n\nThe still photographer's goal is to capture the atmosphere of the scene — and at times of the entire film — into a single image. \n\nMarja-Leena “Malla” Hukkanen (b. 1959) has photographed film stills for more than four decades. She is one of the few Finnish photographers who have devoted their entire career to film still photography. \n\nHukkanen is especially known for her collaboration with director Aki Kaurismäki. Altogether, she has photographed stills for over one hundred Finnish films.\n\nHukkanen's photographs demonstrate that film stills are not merely a by-product of a film, but an independent art form that merges the frozen moment of photography with the vitality of cinema into a unique visual language.\n\nThe exhibition presents Hukkanen’s series Shadows in Paradise, based on Aki Kaurismäki’s films. Also on display are stills and behind-the-scenes photos from films selected by Hukkanen herself from across her career. \n\nFinnish Museum of Photography\n\n27.3.-20.9.2026\n\nTue-Fri 11.00–19.00\n\nSat-Sun 11.00–18.00\n\nAdmission fee 0-16€","df":"Stillkuvina yleisemmin tunnetut elokuvien kohtausvalokuvat eivät ole pysäytysruutuja elokuvan filmiraidasta, vaan valokuvaajien uudelleentulkintoja kohtauksista. Stillkuvaaja astuu kameransa kanssa esiin, kun elokuvakohtaus on kuvattu. \n\nStillkuvaajan tavoitteena on tiivistää kyseisen kohtauksen – ja toisinaan koko elokuvan – tunnelma yhteen kuvaan. \n\nMarja-Leena “Malla” Hukkanen (s. 1959) on kuvannut elokuvien stillkuvia yli neljän vuosikymmenen ajan. Hukkanen lukeutuu niihin harvoihin suomalaisiin valokuvaajiin, jotka ovat tehneet elämäntyönsä stillkuvaajana. \n\nHänet tunnetaan erityisesti yhteistyöstään Aki Kaurismäen kanssa. Yhteensä hän on kuvannut stillit yli sataan suomalaiseen elokuvaan. \n\nStillkuvat ilmentävät työryhmien, eli lavastajien, pukusuunnittelijoiden, maskeeraajien, näyttelijöiden, ohjaajien, elokuvaajien ja Hukkasen yhteispanosta. \n\nHukkasen valokuvat osoittavat, että stillkuva ei ole vain elokuvan sivutuote, vaan itsenäinen taidemuoto, joka yhdistää valokuvan pysäytyksen ja elokuvan elävyyden ainutlaatuiseksi kuvalliseksi kieleksi.\n\nFilm Still -näyttely esittelee Hukkasen näyttelykokonaisuuden Kaihon Kultamaa Aki Kaurismäen elokuvista. Lisäksi esillä on Hukkasen still- ja työkuvia hänen itse uransa varrelta valitsemistaan elokuvista.\n\nSuomen valokuvataiteen museo\n\n27.3.-20.9.2026\n\nTi–pe 11.00–19.00\n\nLa–su 11.00–18.00\n\nSisäänpääsy 0-16€","c":"Cinema","cs":["photographic art","photography exhibitions","art","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/kauas_pilvet_karkaavat_d2026_12_4_small.jpg","u":"https://www.valokuvataiteenmuseo.fi/fi/nayttelyt/film-still-malla-hukkasen-valokuvia-elokuvista","ue":"https://www.valokuvataiteenmuseo.fi/en/exhibitions/film-stills-malla-hukkanen","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agosu5bda4","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agostqaew4","t":"Ilo ja epäsymmetria / Joy and asymmetry","te":"Joy and asymmetry","v":"Meilahden taidehalli","ve":"Meilahti Art Hall","a":"Tamminiementie 6","la":60.19107,"ln":24.88356,"s":720,"e":1200,"d":"The exhibition Joy and asymmetry is curated by artist Nanna Susi, who is a Finnish artist. \n\nJoy and asymmetry is her first curated exhibition showcasing independent artworks of six different artists.\n\nMinä missä milloin / Kari Cavén\nSatakieli / Hanna Westerberg\nOvenvartija / Paavo Halonen\nHeijaa eestaas / Liivia Sirola\nYöllisiä kohtaamisia / Minja Karoliina Laakso\nPinna alla / Canal Cheong Jagerroos\n\nMeilahti Art Hall\n\n1.4.-30.8.2026\n\nAdmission fee 10/15€","df":"Nanna Suden kuratoima yhteisnäyttely Ilo ja epäsymmetria!\n\nNanna Susi on suomalainen taidemaalari. Ilo ja epäsymmetria on hänen ensimmäinen laajasti kuratoimansa yhteisnäyttely. Näyttelyn nimi tuli valituksi Mirkka Rekolan inspiroivan Ilo ja epäsymmetria-runokokoelman mukaisesti. Näyttelyssä on esillä kuuden taiteilijan itsenäisiä teoksia, jotka muodostavat laajemman kokonaisuuden omissa säkeissään.\n\nMinä missä milloin / Kari Cavén\nSatakieli / Hanna Westerberg\nOvenvartija / Paavo Halonen\nHeijaa eestaas / Liivia Sirola\nYöllisiä kohtaamisia / Minja Karoliina Laakso\nPinna alla / Canal Cheong Jagerroos\n\nMeilahden Taidehalli\n\n1.4.-30.8.2026\n\nSisäänpääsy 10/15€","c":"Visual arts","cs":["art","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Nimet%C3%B6n_malli_50_vHoTnmM.png","u":"https://meilahdenkartano.fi/nayttelyt/ilojaepasymmetria/","ue":"https://meilahdenkartano.fi/nayttelyt/ilojaepasymmetria/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agostqaew4","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agou2hx7hu","t":"Kätketty kädenjälki - Museo Kruunun kokoelmat","te":"Traces of Craft - Museo Kruunu's Collections","v":"Suomen kello- ja korumuseo Kruunu","ve":"Finnish Museum of Horology and Jewellery Kruunu","a":"Ahertajantie 3","la":60.17876,"ln":24.79674,"s":720,"e":1200,"d":"Come and explore the museum’s collections in the long-awaited exhibition Traces of Craft.\n\nThe collections of Museo Kruunu originated with the establishment of the Finnish School of Watchmaking in 1944 and the teaching collection it assembled through donations of various clocks, watches, and watchmaking tools. \n\nIn 2015, a project was launched to expand the museum concept to include not only horology and the watchmaking tradition, but also jewellery and goldsmithing. The collections also include an extensive archive, library, and photograph collection.\n\nThe exhibition Traces of Craft presents the museum’s collections in a broad scope, featuring both long-time favourites and more recent donations. \n\nIn the exhibition, you can explore not only the museum’s own history through its collections, but also Finnish watch and jewellery history through the objects used here and the stories they tell. These objects reflect Finnish cultural history, and the collections preserve the craftsmanship of numerous skilled artisans from the past.\n\nThe Finnish Museum of Horology and Jewellery\n\n8.4.2026-19.9.2027\n\nAdmission fee 0-15€","df":"Tule tutustumaan museon kokoelmiin toivotussa Kätketty kädenjälki -näyttelyssä.\n\nMuseo Kruunun kokoelmat saivat alkunsa Kelloseppäkoulun perustamisesta vuonna 1944 ja koulun keräämästä opetuskokoelmasta, johon otettiin lahjoituksina vastaan erilaisia kelloja ja kellosepän työkaluja. \n\nVuonna 2015 käynnistyi projekti museokonseptin laajentamisesta kattamaan kellojen ja kellosepänalan perinnön lisäksi myös korut ja kultasepänalan esineistön. Kokoelmiin kuuluu myös laaja arkisto, kirjasto sekä valokuvakokoelma. \n\nKätketty kädenjälki -näyttely esittelee laajasti museon kokoelmia niin vanhojen suosikkien kuin uudempien lahjoitusten myötä. \n\nNäyttelyssä pääset tutustumaan paitsi museon omaan historiaan kokoelmamme kautta myös suomalaisten kello- ja koruhistoriaan täällä käytössä olleiden esineiden ja niiden tarinoiden välityksellä. Esineet kertovat suomalaisesta kulttuurihistoriasta ja kokoelmat kätkevät sisäänsä lukuisten menneiden, taitavien käsityöläisten kädenjäljen. \n\nSuomen kello- ja korumuseo Kruunu\n\n8.4.2026-19.9.2027\n\nSisäänpääsy 0-15€","c":"Visual arts","cs":["Design","cultural events","exhibitions","design (artistic creation)"],"img":"https://api.hel.fi/linkedevents/media/images/Museo_Kruunu_Kokoelma_2026_kollaasiotsikko_50cm_150_png_1.png","u":"https://www.kellojakorumuseo.fi/nayttelyt/katketty-kadenjalki-museo-kruunun-kokoelmat","ue":"https://www.kellojakorumuseo.fi/en/exhibitions/traces-of-craft-museo-kruunus-collections","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agou2hx7hu","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpr3jnprm","t":"Jumppatytöt","te":"Jumppatytöt","v":"Urheilun ja liikunnan kulttuurikeskus TAHTO","ve":"Cultural Centre of Sports TAHTO","a":"Paavo Nurmen tie 1, Olympiastadion","la":60.18658,"ln":24.9257,"s":720,"e":1200,"d":"Jumppatytöt – A Love Letter to Aesthetic Group Gymnastics\n\nRising from the theater stage to a national phenomenon, Jumppatytöt expanded into an exhibition at TAHTO Center for Finnish Sports Culture.\n\nThe exhibition dives into the history and culture of Finnish Aesthetic group gymnastics culture, highlights powerful moments of the present, and explores dreams for the future. \n\nThe exhibition shares stories of competitive gymnasts, coaches, and enthusiasts alike – both the small and the big moments that make this sport so deeply loved in Finland. On display is a wide range of group gymnastics artifacts, videos, photographs, stories, and diary entries, as well as the competition costume of five-time world champion Paula Thesleff.\n\nIn theatre, Jumppatytöt premiered on April 13, 2024, in Minervaskolan in Helsinki. The theatre production is based on the personal experiences of the members of the creative team – current actresses and former gymnasts Katariina Havukainen, Inkeri Hyvönen, and Ella Lahdenmäki – with aesthetic group gymnastics. \n\nThe exhibition also draws on research material by PhD Sinikka Selin related to the experiences of group gymnasts.\n\nThis exhibition offers a unique opportunity to peek behind the scenes of the sport, to understand the power of movement, and to appreciate the importance of community within Finnish sporting culture.\n\nTAHTO Center for Finnish Sports ","df":"Jumppatytöt - rakkauskirje joukkuevoimistelulle\n\nTeatterilavoilta kansalliseksi ilmiöksi noussut Jumppatytöt laajeni näyttelyksi Urheilun ja liikunnan kulttuurikeskus TAHDOSSA.\n\nNäyttelyssä sukelletaan suomalaisen voimistelukulttuurin historiaan, nostetaan esiin nykyhetken sykähdyttäviä tapahtumia ja tulevaisuuden unelmia. \n\nJumppatytöt – rakkauskirje joukkuevoimistelulle kertoo niin kilpavoimistelijoiden, valmentajien kuin harrastajienkin tarinoita – niitä pieniä ja suuria hetkiä, jotka tekevät tästä lajista niin rakastetun. Esillä on monipuolisesti joukkuevoimistelun esineistöä, videoita, valokuvia, tarinoita ja päiväkirjamerkintöjä sekä lajin viisinkertaisen maailmanmestarin Paula Thesleffin kisapuku.\n\nTeatterissa Jumppatytöt kantaesitettiin Helsingin Minervaskolanin juhlasalissa 13.4.2024. Teatteriesitys pohjautuu työryhmän jäsenten, nykyisten näyttelijöiden ja entisten voimistelijoiden, Katariina Havukaisen, Inkeri Hyvösen ja Ella Lahdenmäen henkilökohtaisiin kokemuksiin joukkuevoimistelun parissa. \n\nNäyttelyssä hyödynnetään myös filosofian tohtori Sinikka Selinin tutkimusaineistoja joukkuevoimistelijoiden kokemuksiin liittyen.\n\nNäyttely tarjoaa ainutlaatuisen mahdollisuuden kurkistaa lajin kulisseihin, ymmärtää liikkeen voimaa ja yhteisön merkitystä urheilukulttuurissamme.\n\nUrheilun ja liikunnan kulttuurikeskus Tahto\n\n10.4.-13.9.2026","c":"Visual arts","cs":["team gymnastics","exhibitions","gymnastics","sports"],"img":"https://api.hel.fi/linkedevents/media/images/170A4626_lores.jpg","u":"https://tahto.com/nayttely/jumppatytot-rakkauskirje-joukkuevoimistelulle/","ue":"https://tahto.com/en/exhibition/jumppatytot-a-love-letter-to-aesthetic-group-gymnastics/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpr3jnprm","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agnnstpnxi","t":"Edith Karlson: Sarastus","te":"Edith Karlson: Dawn till Dawn","v":"Nykytaiteen museo Kiasma","ve":"Museum of Contemporary Art Kiasma","a":"Mannerheiminaukio 2","la":60.17206,"ln":24.93662,"s":720,"e":1200,"d":"Mythical characters, for Karlson, are a vehicle for exploring questions that reason alone cannot answer. Prehistory, fossils, and archaeology also provide enduring inspiration. Humans and animals are united by instinct, a tenacious will to survive, and the ability to adapt – themes she consistently examines in her practice.\n\nKarlson employs a diverse array of materials, including clay, concrete, and silicone, creating works that often retain a raw, unfinished quality. Many pieces are left unglazed, their surfaces rough, evoking processes of transformation and transition. Birds and snakes capable of shedding their skin are recurring motifs, symbolising continual renewal.\n\nTallinn-based Karlson has exhibited widely both in Estonia and internationally, including venues such as the Sapieha Palace Contemporary Art Centre in Vilnius (2025), the Contemporary Art Museum of Estonia (2021), the KUMU Art Museum (2019–2020), and the Museum der bildenden Künste Leipzig (2018). She also represented Estonia at the 2024 Venice Biennale.","df":"Karlsonille tarunomaiset hahmot ovat keino käsitellä kysymyksiä, joita on järkeilemälllä vaikeaa tai mahdotonta ymmärtää. Ihmisiä ja eläimiä yhdistävät vietit, sinnikäs elämänhalu ja kyky sopeutua. Näitä aiheita Karlson käsittelee teoksissaan. Myös esihistoria, fossiilit ja arkeologiset löydökset kiehtovat häntä.\n\nKarlson käyttää materiaaleinaan muun muassa savea, betonia ja silikonia. Hänen työnsä jälki on raakaa, ja voi vaikuttaa jopa keskeneräiseltä: hän jättää saven usein lasittamatta ja veistosten pinnat rosoisiksi. Näyttelyssä on viittauksia muodonmuutokseen tai siirtymään kohti jotakin uutta. Linnut sekä nahan luomiseen kykenevä käärme toistuvat Karlsonin teoksissa.\n\nEdith Karlson asuu ja työskentelee Tallinnassa. Hänen teoksiaan on esitetty lukuisissa näyttelyissä Virossa ja kansainvälisesti, viimeisimpinä muun muassa kulttuurikeskus Sapieha Palacessa Vilnassa (2025), Viron nykytaiteen museossa (2021), taidemuseo KUMUssa (2019–2020) ja Museum der bildenden Künste Leipzigissa (2018). Karlson edusti Viroa vuoden 2024 Venetsian biennaalissa.","c":"Visual arts","cs":["fine arts","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/EdithKarlson_SapiehaPalace_photo-by-AndrejVasilenko.jpg","u":"https://kiasma.fi/nayttelyt/edith-karlson/","ue":"https://linkedevents.hel.fi/en/events/create","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agnnstpnxi","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpr3etnke","t":"Paperitähdet - Rauni Palosen paperinukkeja","te":"Paper Stars - Paper Dolls by Rauni Palonen","v":"Tamminiemi","ve":"Tamminiemi","a":"Seurasaarentie 15","la":60.18912,"ln":24.88421,"s":720,"e":1200,"d":"Paper Stars – Paper Dolls by Rauni Palonen, 1968–1982\nTamminiemi features a nostalgic glimpse into the world of celebrities and popular culture of President Kekkonen’s era.\n\nThe small-scale exhibition showcases paper dolls drawn by fashion artist and editor Rauni Palonen (b. 1929). Originally published in Apu magazine between 1968 and 1982, these drawings depicted the most celebrated stars of the era: beauty queens, singers, actors, television personalities, athletes, and even royalty from neighbouring countries.\n\nPalonen would produce weekly sketches of celebrities, complete with outfits tailored to the latest fashion trends. For many, these paper stars were treasured toys. They were carefully cut out, glued to cardboard, accessorised with handmade outfits, and preserved with care.\n\nSeveral of these paper stars were also a familiar sight at Kekkonen’s home in Tamminiemi or at the Independence Day reception at the Presidential Palace.\n\nPaper Stars is a tribute to the long and distinguished career of fashion editor Rauni Palonen, whose paper dolls were known to the entire nation in her time. The collection donated by Palonen to the Finnish Heritage Agency’s Picture Collections contains a total of 207 paper stars. In this small-scale exhibition, approximately 80 figures are on display, featuring both digitised versions and original drawings.\n\nTamminiemi\n\n17.4.2026-9.1.2028","df":"Paperitähdet – Rauni Palosen paperinukkeja 1968–1982\nTamminiemessä on esillä nostalginen pala presidentti Kekkosen ajan julkkismaailmaa ja populaarikulttuurin historiaa.\n\nPienimuotoisessa näyttelyssä nähdään muotitaiteilija ja -toimittaja Rauni Palosen (s. 1929) piirtämiä paperinukkeja. Apu-lehdessä vuosina 1968–1982 julkaistuissa piirroksissa esiintyivät aikansa ihailluimmat tähdet, missit, laulajat, näyttelijät, tv-kasvot, urheilijat ja jopa naapurimaan kuninkaalliset.\n\nPalonen piirsi viikoittain julkisuuden henkilön ja suunnitteli tälle viimeisimmän muodin mukaiset asut. Monille nämä paperiset tähdet olivat tärkeitä leluja. Ne leikattiin varovasti irti, liimattiin pahville, askarreltiin lisää vaatteita ja säilytettiin huolella.\n\nUseat tähdistä olivat myös tuttu näky Kekkosen kodissa Tamminiemessä tai itsenäisyyspäivän vastaanotolla Presidentinlinnassa.\n\nPaperitähdet on kunnianosoitus pitkän uran muotitoimittajana tehneelle Rauni Paloselle, jonka paperinuket olivat omana aikanaan koko kansan tuntemia. Palosen Museoviraston Kuvakokoelmille lahjoittama kokoelma sisältää kaikkiaan 207 paperista tähteä. Pienoisnäyttelyssä näistä nähdään noin 80, osa digitoituna ja osa alkuperäisinä piirroksina.\n\nTamminiemi\n\n17.4.2026-9.1.2028","c":"Visual arts","cs":["Design","paper dolls","exhibitions","drawing (artistic creation)"],"img":"https://api.hel.fi/linkedevents/media/images/Paperit%C3%A4hdet.jpg","u":"https://www.kansallismuseo.fi/fi/naeyttelyt/paperitahdet-rauni-palosen-paperinukkeja-1968-1982","ue":"https://www.kansallismuseo.fi/en/exhibitions/paperitahdet-rauni-palosen-paperinukkeja-1968-1982","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpr3etnke","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"hkm:23821","t":"Tuntematon lähiö","te":"COMING SOON: The Unknown Suburb","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"Around one in three Finns live in suburbs, but discussions about suburbs are often based on outdated and negatively charged preconceptions. Helsinki City Museum's exhibition The Unknown Suburb reverses the stigmas associated with suburbs and challenges the perception of suburbs being nests of boredom, misery and poverty. The exhibition aims to look beyond the surface and also explore the love that locals have for their neighbourhoods.\n\nThe themes are presented vividly through participatory exercises, an immersive sound environment, tactile façade materials and graffiti by artist Kim Somervuori , among other methods. The Helsinki residents interviewed for the exhibition get to share their everyday and sometimes surprising experiences of their home suburbs.\n\n<h3>Slab architecture and refrigerator houses</h3> The exhibition takes visitors on a journey from two-billion-year-old bedrock to a suburban apartment block of the 2000s. The architecture brings together at a glance, through spatial means, the history of Finnish suburbs from the 1940s onwards, with their changing building types. The story culminates at the heart of the suburb, a shopping centre.\n\nAt the City Museum, visitors get to explore homely slab architecture, the ‘refrigerator houses’ of Pihlajamäki, the East Helsinki identity and identities outside the city centre, as well as other dimensions of the suburb that are ra","df":"Lähiöissä asuu noin joka kolmas suomalainen, mutta keskustelu niistä nojaa usein vanhentuneisiin ja negatiivisesti latautuneisiin mielikuviin. Helsingin kaupunginmuseon vaihtuva näyttely Tuntematon lähiö kääntää ympäri asuinalueisiin liitettyjä stigmoja ja haastaa käsityksen lähiöistä tylsyyden, kurjuuden ja köyhyyden tyyssijoina. Näyttelyssä halutaan kurkistaa pintaa syvemmälle ja tutkia myös paikallisten tuntemaa rakkautta omaa asuinaluettaan kohtaan.\n\nNäyttelyn teemat esitellään elävästi muun muassa osallistavien tehtävien, immersiivisen ääniympäristön, kosketeltavien julkisivumateriaalien sekä taiteilija Kim Somervuoren toteuttaman graffitin kautta. Näyttelyä varten haastatellut helsinkiläiset pääsevät kertomaan ääneen omat arkiset ja joskus yllättävätkin kokemuksensa kotilähiöistään.\n\n<h3>Laatta-arkkitehtuuria ja jääkaappitaloja</h3> Näyttely kuljettaa kävijän kahden miljardin takaiselta peruskalliolta 2000-luvun kerrostalolähiöön. Arkkitehtuuri kokoaa tilallisin keinoin yhdellä vilkaisulla nähtäväksi asumalähiöiden 1940-luvulta alkavan historian muuttuvine rakennustyyppeineen. Tarina huipentuu lähiön sydämeen, ostarille.\n\nKaupunginmuseossa kävijät pääsevät tutustumaan kotoisaan laatta-arkkitehtuuriin, Pihlajamäen “jääkaappitaloihin”, itäläisyyteen ja kantakaupungin ulkopuolisiin identiteetteihin, sekä muihin harvoin ääneen lausuttuihin lähiön ulottuvuuksiin.\n\nNäyttelyn ov","c":"Visual arts","cs":["everyday","cultural events","Helsinki residents","museums","urban history"],"img":"https://www.helsinginkaupunginmuseo.fi/app/uploads/2026/01/hkm-lahio-website-article-825x513px-daytime.jpg","u":"https://www.helsinginkaupunginmuseo.fi/nayttelyt/tuntematon-lahio/","ue":"https://www.helsinginkaupunginmuseo.fi/en/exhibitions/the-unknown-suburb/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"hkm:23821","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agozvjssmy","t":"Okkulttinen Helsinki Kävelykierros","te":"Occult Helsinki Walking Tour","v":"Helsingin Tuomiokirkko","ve":"Helsinki Cathedral","a":"Unioninkatu 29","la":60.17034,"ln":24.95223,"s":720,"e":1200,"d":"Uncover the hidden symbols, forgotten myths, and obscure secrets in local attractions and points of interest with a cultural guide.\n\nBeyond the modern architecture of Finland’s capital lies a hidden layer of history — a city built on ancient myths, secrets, and celestial influence.\n\nJoin Henri, a seasoned performer and storyteller, for a three-hour walking journey through Occult Helsinki.\n\nThis is not just another sightseeing tour, it is a peek into the silent language of the city, designed for those who wish to discover a side of it that most travelers and even locals never get to experience.\n\nMeeting point: Cathedral\n\n21.4.-11.11.2026\n\nAdmission fee 49€, duration 3h, age limit 18 yrs\n\nK-18\n\nLight walking (suitable for most fitness levels).\n\nThis tour requires a minimum of 2 guests to take place. \n\nHeld in English","df":"Löydä paikallisten nähtävyyksien kätketyt symbolit, unohdetut myytit ja hämärät salaisuudet kulttuurioppaan johdolla.\n\nSuomen pääkaupungin modernin arkkitehtuurin takana piilee historian kätketty kerros – kaupunki, joka on rakennettu muinaisten myyttien, salaisuuksien ja taivaallisten vaikutteiden perustalle.\n\nLähde Henrin, kokeneen esiintyjän ja tarinankertojan mukaan kolmituntiselle kävelymatkalle halki okkulttisen Helsingin.\n\nTämä ei ole pelkkä kävelykierros, vaan kurkistus kaupungin hiljaiseen kieleen. Se on suunniteltu niille, jotka haluavat löytää siitä puolen, jota useimmat matkailijat ja monet paikallisetkaan eivät koskaan edes ajattele.\n\nLähtöpaikka: Tuomiokirkko\n\n21.4.-11.11.2026\n\nOsallistumismaksu 49€, kesto 3h, K-18\n\nKevyttä kävelyä (sopii useimmille kuntotasoille)\n\nKierroksen toteutuminen edellyttää vähintään kahta osallistujaa. \n\nAikataulut:\n\nhttps://www.airbnb.com/x/occulthelsinki \n\nKierros on englanninkielinen","c":"Dance","cs":["guidance","walking tours","cultural events","occultism"],"img":"https://api.hel.fi/linkedevents/media/images/OCCULT_HELSINKI_TOUR.png","u":"https://www.airbnb.com/x/occulthelsinki","ue":"https://www.airbnb.com/x/occulthelsinki","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agozvjssmy","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agmu2wux4y","t":"Runollinen todellisuus","te":"Poetic Reality","v":"Villa Gyllenberg","ve":"Villa Gyllenberg","a":"Kuusisaarenpolku 11","la":60.18413,"ln":24.85222,"s":720,"e":1200,"d":"Poetic reality – exhibition on the romantic and cheerful art, fashion, design and gardens of the 1920–1940s. \n\nMany artists and designers longed for beauty, ornaments and vibrant colours during the interwar period. Flowers, gardens and paradise were common motifs.\n\nOne of the exhibition’s main themes is French post-impressionism from the 1920–1940s, the so called “painters of the poetic reality” (Les peintres de la réalité poétique). \n\nThese painters would paint art in a poetic and cheerful style, taking impressions from Henri Matisse and Pierre Bonnard. Many Finnish artists who spent time in Paris, such as Tove Jansson, Birger Carlstedt and Yngve Bäck, were influenced by this art.\n\nVilla Gyllenberg\n\n22.4.-13.9.2026\n\nWed, Sat & Sun 12.00-17.00\n\nAdmission fee 10/12€, under 18 yrs free entry (2025)","df":"Runollinen todellisuus – 1920–40-lukujen romanttista ja elämäniloista kuvataidetta, muotia, muotoilua ja puutarhoja\n\nMaailmansotien välisenä aikana ja 1940-luvulla moni kuvataiteilija ja muotoilija janosi kauneutta, dekoratiivisuutta ja värikkyyttä. Kukat, puutarhat ja paratiisilliset näkymät olivat yleisiä aiheita. Historiasta ammentaminen oli hyvin yleistä niin huonekalumuotoilussa, kuvataiteessa kuin muodissakin.\n\nYksi näyttelyn pääteemoista on ranskalainen jälki-impressionismi, niin kutsutut poeettisen todellisuuden maalarit (Les peintres de la réalité poétique). He maalasivat esittävää taidetta runolliseen ja elämäniloiseen tyyliin Henri Matissen ja Pierre Bonnardin jalanjäljissä erityisesti 1930- ja 40-luvuilla. Moni Pariisissa toiminut suomalainen taiteilija, kuten Tove Jansson, Birger Carlstedtin ja Yngve Bäck, innoittui tästä taiteesta.\n\nNäyttelyssä esitellään 1920–40-lukujen ranskalaista ja suomalaista maalaustaidetta, tyylipukuja, huonekaluja ja puutarhoja.\n\nVilla Gyllenberg\n\n22.4.-13.9.2026\n\nKe, la & su 12.00-17.00\n\nSisäänpääsy 10/12€, alle 18-v. vapaa pääsy (2025)","c":"Visual arts","cs":["art","exhibitions","design (artistic creation)","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/harrasteet.jpg","u":"https://www.villagyllenberg.fi/nayttelyt/runollinen-todellisuus-1920-40-lukujen-taidetta-muotia-muotoilua-ja-puutarhoja","ue":"https://www.villagyllenberg.fi/en/exhibitions/runollinen-todellisuus-1920-40-lukujen-taidetta-muotia-muotoilua-ja-puutarhoja","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agmu2wux4y","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:67241","t":"Heli Kemiläinen: Connecting - Piirrosnäyttely","te":"Heli Kemiläinen: Connecting - Exhibition of drawings","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":1200,"d":"Detailed pencil drawings that reflect on different themes of life through animal characters, nature and various objects.\n\nThe Connecting exhibition consists of more than ten pencil drawings that focus on the search for connection with oneself, emotions, other people and nature. The series consists of detailed pencil drawings that allow the viewer to stop to observe and explore what they see. The works are stories, each with its own underlying phenomenon. The exhibition consists of pencil works in which I reflect on different themes of life through animal characters and elements of nature. The exhibition draws on the tradition of pencil drawing.\n\nThe works are a process, taking time to marvel at the versatile possibilities of a pencil. Drawing as a creative method is in itself a valuable journey into stories – at its best, it offers an opportunity for contemplation, a meditative state.\n\nOpening event on 23 April at 17.00–19.00 – hope to see you there!\n\nThe exhibition was selected for the programme through an open call at Annantalo. During the spring of 2025, Annantalo received 230 applications, from which the Annantalo student jury selected six artists for the second floor galleries and the joint exhibition downstairs.","df":"Yksityiskohtaisia lyijykynäpiirroksia, joissa pohditaan elämän eri teemoja eläinhahmojen, luonnon ja erilaisten esineiden kautta.\n\nConnecting - teoskokonaisuus koostuu yli kymmenestä lyijykynäpiirustuksesta, joissa keskiössä on yhteyden etsiminen itseensä, tunteisiin, toisiin ihmisiin sekä luontoon. Sarja koostuu yksityiskohtaisista lyijykynä piirustuksista, joissa katsoja saa pysähtyä havainnoimaan ja tutkimaan näkemäänsä. Työt ovat tarinoita, joissa jokaisessa on oma ilmiö taustalla. Näyttely koostuu lyijykynäteoksista, joissa pohdin elämän eri teemoja eläinhahmojen ja luonnon elementtien kautta. Näyttely nojaa lyijykynäpiirtämisen perinteeseen.\n\nTeokset ovat prosessi, jossa syvennytään pitkäksi aikaa ihmettelemään lyijykynän monipuolisia mahdollisuuksia. Piirtäminen luovana menetelmänä itsessään on arvokas matka tarinoiden sisään - parhaimmillaan se tarjoaa mahdollisuuden mietiskelyyn, meditatiivisen tilan.\n\nAvajaiset 23.4. klo 17-19 – Tervetuloa!\n\nNäyttely on valittu ohjelmistoon Annantalon avoimen haun kautta. Kevään 2025 aikana hakuun tuli 230 hakemusta, joiden joukosta Annantalon oppilasraati valitsi kuusi taiteilijaa toisen kerroksen gallerioihin sekä alakerran yhteisnäyttelyyn.","c":"Cinema","cs":["Lastentapahtumat","Annantalo","Näyttelyt","Suomi","Ruotsi","Englanti"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_780203.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/02C71E1267C537CB7EA90E294FF4F9C5/Heli_Kemilainen_Connecting_","ue":"http://www.annantalo.fi/en/events/event/02C71E1267C537CB7EA90E294FF4F9C5/Heli_Kemilainen_Connecting","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:67241","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agqcgorts4","t":"Epic Scape: Kirjailijoiden puisto","te":"Epic Scape: The Authors' Park","v":"Esplanadin puisto","ve":"Esplanade Park","a":"Eteläesplanadi-Pohjoisesplanadi","la":60.16745,"ln":24.94761,"s":720,"e":1200,"d":"The Espa looks like an ordinary park: There are benches, there are trees. There are people lounging or hurrying by, each in their own style. The park also has many statues, each with a story to tell. \n\nWriters from the past live and breathe in stone and bronze, hoping that their message will echo through Helsinki and maybe even across the entire world.\n\nYour task is to decipher the message hidden in the Authors’ Park!\n\nEsplanade Park\n\n1.5.-31.10.2026","df":"Helsingissä Esplanadi tunnetaan tuttavallisesti nimellä Espa.\n\nEspa näyttää tavalliselta puistolta: On penkkejä, on puita. On ihmisiä lorvimassa tai hoppuilemassa kukin omalla tyylillään. Lisäksi puistossa on monta patsasta, joista jokaisella on sanottavaa. \n\nMenneiden aikojen kirjailijat elävät ja hengittävät kivessä ja pronssissa ja toivovat, että heidän äänetön viestinsä kaikuisi halki Helsingin ja Suomen ja vaikka koko maailman.\n\nSinun tehtäväsi on selvittää Kirjailijoiden puistoon kätketty viesti!\n\nEsplanadin puisto\n\n1.5.-31.10.2026","c":"Participate","cs":["games"],"img":"https://api.hel.fi/linkedevents/media/images/Merenneito_2dxcTfb.jpg","u":"http://espa.epicscape.game","ue":"http://espa.epicscape.game","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agqcgorts4","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agoywy5yrm","t":"Merellinen Helsinki: Helsinki Archipelago risteily","te":"Maritime Helsinki Day: Helsinki Archipelago Cruise","v":"Kauppatorin Laituri","ve":"Kauppatorin Laituri","a":"Eteläranta","la":60.16632,"ln":24.95347,"s":720,"e":1200,"d":"Welcome to join a sightseeing, lunch, or dinner cruise in the Helsinki archipelago!\n\nDaily cruises offer an opportunity to explore Helsinki’s coastal scenery and island nature from the sea. There are three different cruise options available: a sightseeing cruise, a lunch cruise, and a dinner cruise.\n\nDeparture: Helsinki Market Square, Kolera-allas\n\n1.5.-27.9.2025\n\nSightseeing cruise lasts 1.5 hours and departs every hour on the hour with two ships, between 11:00 and 17:00 from the Market Square (last departure at 17:00). The cruise provides a comprehensive view of Helsinki's waterfront and notable landmarks from the sea.\n\nLunch cruises are available daily with two different ships at 12:00, 13:00, 14:00, 15:00, 16:00 and 17:00. Each cruise lasts 1.5 hours and includes lunch served while enjoying the surrounding archipelago.\n\nDinner cruise departs daily at 18:00 and 19:00 with two different ships and lasts 2.5 hours. Dinner is served on board while passengers enjoy the evening atmosphere of the archipelago.\n\nBook your cruise on Royal Line's website. Please check departure times and dates before booking.","df":"Tervetuloa mukaan sightseeing-, lounas- tai illallisristeilylle Helsingin saaristoon!\n\nPäivittäin järjestettävillä risteilyillä tutustutaan Helsingin merelliseen kaupunkimaisemaan ja saariston luontoon. Vaihtoehtoina on kolme eri risteilykokemusta: nähtävyyksien katseluun keskittyvä risteily, lounasristeily ja illallisristeily.\n\nLähtöpaikka: Kauppatori, Kolera-allas\n\n1.5.-27.9.2026.\n\nSightseeing-risteily kestää 1,5 tuntia ja lähtee Kauppatorilta kahdella eri aluksella tasatunnein klo 11–17 (viimeinen lähtö klo 17). Risteily tarjoaa kattavan kuvan Helsingin rannikkonäkymistä ja merkittävistä maamerkeistä mereltä käsin.\n\nLounasristeilyt järjestetään kesällä päivittäin kahdella eri aluksella klo 12, 13, 14, 15, 16 ja 17. Risteily kestää 1,5 tuntia, ja sen aikana nautitaan lounas merimaisemien ympäröimänä.\n\nIllallisristeily lähtee kesällä päivittäin kahdella eri aluksella klo 18 ja 19 ja kestää 2,5 tuntia. Risteilyn aikana tarjoillaan illallinen, ja matkan varrella voi ihailla ilta-auringon värittämää saaristoa.\n\nVaraa ruokaristeilyt Royal Linen verkkosivuilta. Tarkista lähtöajat ja päivämäärät ennen varausta.","c":"Dance","cs":["Maritime Helsinki","cruises","guidance","food"],"img":"https://api.hel.fi/linkedevents/media/images/royal_line_oy_cover.jfif","u":"https://royalline.fi/collections/helsinki-kaikki","ue":"https://royalline.fi/en/collections/helsinki-latest","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agoywy5yrm","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agohvkvpuq","t":"Magdalena Abakanowicz: Rajojen ylittäjä","te":"Magdalena Abakanowicz: Crossing Boundaries","v":"Helsingin taidemuseo HAM","ve":"Helsinki Art Museum HAM","a":"Eteläinen Rautatiekatu 8","la":60.17016,"ln":24.9302,"s":720,"e":1200,"d":"HAM presents the works of Magdalena Abakanowicz (1930–2017), one of Poland’s most renowned artists, more extensively than ever before in Finland.\n\nMagdalena Abakanowicz emerged as a pioneer in creating organic, fibre-based sculptures and installations in the 1960s and 1970s. \n\nHAM’s grand arched halls will be filled with the artist’s iconic textile sculptures, “Abakans”, as well as impressive jute sculptures.\n\nHelsinki Art Museum HAM\n\n6.5.-30.8.2026\n\nAdmission fee 0-20€","df":"HAM esittelee Puolan tunnetuimpiin taiteilijoihin kuuluvan Magdalena Abakanowiczin (1930–2017) teoksia laajemmin kuin koskaan aiemmin Suomessa.\n\nMagdalena Abakanowicz nousi jo 1960–1970-luvuilla orgaanisen, kuitupohjaisen kuvanveiston ja installaatiotaiteen edelläkävijäksi. \n\nHAMin suuret kaarihallit täyttyvät taiteilijan ikonisilla tekstiiliveistoksilla ”abakaneilla” sekä vaikuttavilla juuttiveistossarjoilla.\n\nHelsingin taidemuseo HAM\n\n6.5.-30.8.2026\n\nSisäänpääsy 0-20€","c":"Visual arts","cs":["art","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Magdalena-Abakanowicz_portrait.jpg","u":"https://www.hamhelsinki.fi/exhibitions/magdalena-abakanowicz/","ue":"https://www.hamhelsinki.fi/en/exhibitions/magdalena-abakanowicz/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agohvkvpuq","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agozk2ijxi","t":"Silta -valokuvanäyttely","te":"The Bridge - Photo exhibition","v":"Työpajankatu 8, Helsinki","ve":"Työpajankatu 8, Helsinki","a":"Työpajankatu 8","la":60.18858,"ln":24.97587,"s":720,"e":1200,"d":"The photographs depict the construction of the new Hakaniemi Bridge between 2022 and 2025. \n\nRather than presenting a chronological account, the exhibition invites viewers to follow the rhythm, events, and labour of the building process. Through the images, visitors are encouraged to pause and reflect on the unfinished and to see the city as a changing entity – one in which the builder carries out their work and gradually guides our steps onto new paths.\n\nThe exhibition will be on display from May 7 to August 31, 2026, at the City of Helsinki’s office building (Työpajankatu 8, lobby exhibition space).\n\nOpening hours: Mon–Fri, 8:00–16:00\n\nFree admission","df":"Kuvat kertovat uuden Hakaniemensillan rakentamisesta vuosina 2022-2025. Valokuvanäyttely ei ole ajallisesti etenevä dokumentti vaan kutsuu seuraamaan rakentamisen rytmiä, tapahtumia ja työtä. \n\nKuvien kautta katsoja voi hetkeksi pysähtyä keskeneräisyyden äärelle ja nähdä kaupungin muuttuvana entiteettinä, paikkana jossa rakentaja tekee työtään ja vähitellen ohjaa askeleitamme uusille poluille.\n\nKuvat: Marketta Hormia\n\nNäyttely on esillä 7.5.-31.8.2026 Helsingin kaupungin toimitalossa (Työpajankatu 8, aulan näyttelytila)\n\nTila avoinna ma-pe klo 8-16\n\nVapaa pääsy","c":"Visual arts","cs":["urban landscape","urban space","photography","fine arts","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/uusin_web_siltakuva_aXBPGQ8.jpg","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agozk2ijxi","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agozk2ijxi","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agozk2ijxi","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpr2v3gu4","t":"Saapasjalkakissa - kaikkien aikojen satuseikkailu","te":"Puss in Boots","v":"Median museo ja arkisto Merkki","ve":"The Media Museum and Archives Merkki","a":"Ludviginkatu 2-4","la":60.16576,"ln":24.94536,"s":720,"e":1200,"d":"The Puss in Boots exhibition is a fun fairy-tale adventure for the whole family, where visitors explore the story of Puss in Boots through play and by solving engaging puzzles and challenges.\n\nMedia Museum and Archives Merkki\n\n8.5.–30.12.2026 \n\nMon-Tue, Thu-Sun 11.00-17.00\n\nWed 11.00-18.00\n\nFree entry","df":"Tarina Saapasjalkakissasta on ikiaikainen kansansatu, jota on kerrottu lukemattomissa eri muodoissa ympäri maailmaa. \n\nNokkelan kissan ja köyhän myllärinpojan seikkailuista on tehty aikojen saatossa kirjoja, näytelmiä, elokuvia, tv-sarjoja, pelejä, jopa oopperoita – ja nyt uusimpana myös näyttely.\n\nNäyttely on koko perheen iloinen satuseikkailu, jonka aikana Saapasjalkakissan tarina käydään läpi leikkimällä ja ratkomalla visaisia tehtäviä. Lopussa voitetaan ilkeä hirviö – oveluudella se onnistuu! Matkan varrella tutustutaan paitsi ihanaan prinsessaan, myös muihin satuihin ja niiden sankareihin: Kuka onkaan unohtanut punaisen hilkkansa joen rannalle? Millaisia supervoimia saa eri taikaesineiden avulla?\n\nNäyttelyssä voi myös askarrella, pukeutua hauskoihin häntiin ja viittoihin tai opetella asioita ihan oikeiden kissojen elämästä Tassupyörää pyörittämällä.\n\nMedian museo Merkki\n\n8.5.–30.12.2026 \n\nMa-ti, to-su 11.00-17.00\n\nKe 11.00-18.00\n\nVapaa pääsy","c":"Literature","cs":["fairy tales","playing (children's games)","children's literature","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Mediamuseo_Merkki_valokuva_tapahtumiin.jpg","u":"https://merkkiin.fi/nayttelyt/saapasjalkakissa/","ue":"https://merkkiin.fi/nayttelyt/saapasjalkakissa/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpr2v3gu4","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agozbo7xry","t":"Harakan näyttelykesä 2026","te":"Harakka Island Summer Exhibitions","v":"Harakan saari, P 60° 9,029' ja I 24° 57,451'","ve":"Harakka Island, N 60° 9,029' and E 24° 57,451'","a":"Harakka","la":60.15109,"ln":24.95781,"s":720,"e":1200,"d":"Temporary exhibitions and events by artists working on Harakka Island throughout the summer.\n\nThe artists at Harakka Artists’ House organize art exhibitions and various events on Harakka Island from May through October. During the summer, Galleria Lennätin operates out of the island’s old telegraph building, and exhibitions are also held in locations such as the old military casemates.\n\nOver 30 professionals from various art fields work at Harakka Artists’ House. Inside the building, art forms and generations of artists come together in a unique way. The weekly rotating exhibitions offer a glimpse into the heart of Harakka’s artist community: the work of individual creators intertwines with a larger whole, where the island’s environment and history are woven together.\n\nHarakka Island\n\n12.5.-18.10.2026\n\nFor more detailed information about the exhibitions and opening hours, visit: www.harakka.fi","df":"Harakan saarella työskentelevien taiteilijoiden vaihtuvia näyttelyitä ja tapahtumia saarella läpi kesän.\n\nHarakan Taiteilijatalon taiteilijat järjestävät Harakan saarella taidenäyttelyitä ja erilaisia tapahtumia toukokuusta lokakuuhun. Saaren vanhassa Lennätinrakennuksessa toimii kesäisin Galleria Lennätin ja lisäksi näyttelyitä järjestetään muun muassa armeijan vanhoissa Kasemateissa. \n\nHarakan Taiteilijatalossa työskentelee yli 30 eri taidealojen ammattilaista. Talon sisällä kohtaavat ainutlaatuisella tavalla taidemuodot ja taiteilijasukupolvet. \n\nViikoittain vaihtuvat näyttelyt tarjoavat kurkistuksen Harakan taiteilijayhteisön ytimeen: yksittäisten tekijöiden työ limittyy osaksi suurempaa kokonaisuutta, jossa saariympäristö ja historia kietoutuvat yhteen. \n\nHarakan saari\n\n12.5.-18.10.2026\n\nTarkemmat lisätiedot näyttelyistä ja aukioloajoista löydät osoitteesta: www.harakka.fi","c":"Visual arts","cs":["fine arts","art","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/harakansaari_pieni_TjAnXVI.jpg","u":"https://harakka.fi","ue":"https://harakka.fi","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agozbo7xry","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:68245","t":"Made in Vuosaari - Vuosaaren kirjastossa","te":"Made in Vuosaari - Vuosaaren kirjastossa","v":"Vuosaaren kirjasto","ve":"Vuosaari Library","a":"Mosaiikkitori 2","la":60.20868,"ln":25.14392,"s":720,"e":1200,"d":"Made in Vuosaari on kuvataiteilija Anne Roinisen moniosainen puheenvuoro tavarasta.\n\nProjektin tarkoitus on kurottaa kohti alueen asukkaita ja saada tutkimaan omia kodin tavaroita. Mistä ne ovat lähtöisin? Onko niillä käyttöä? Minne ne tulevat päätymään, kun niitä ei enää tarvita?\n\nVuosaarelaisten lahjoittamista tarpeettomista tavaroista on tehty koosteita kirjaston elämäkertaosastoille. Esinekoosteet näyttäytyvät alueen asukkaiden muotokuvina. Lahjoitetut esineet on skannattu ja tulostettu uuteen kokonaisuuteen 3D-tulostimella. Näin näyttelyn osaksi tuodaan paikallisten asukkaiden läsnäoloa ja mikrohistoriaa.\n\nAlueen asukkailta kerätyt esineet ovat suurelta osin Kiinassa massatuotettuja tavaroita, joiden merkitys on hävinnyt uutuusarvon kadottua. Ehkä juuri tässä piilee nykyhetkessämme kytevä kriisi: maailma täyttyy muovista ja tavarasta, jota kukaan ei arvosta tai halua. Miten muuttaisimme suhteemme esineisiin vaalivaksi ja arvostavaksi? Miten oppisimme näkemään uutuusarvon ohi ja suosimaan kestäväksi suunniteltuja, korjattavissa olevia, tarinoiden kyllästämiä tavaroita?\n\nAnne Roininen on kuvanveistäjä, joka työskentelee usein paikkasidonnaisesti ja prosessipohjaisesti. Kohtaamiset ihmisten kanssa ovat tärkeä osa Roinisen työskentelyä, ja teosten taustalla on usein poliittinenkin lataus. Lue lisää:https://anneroininen.com/\n\nLöydät teokset Elämäkerta-hyllyistä, Vuosaaren kirja","df":"Made in Vuosaari on kuvataiteilija Anne Roinisen moniosainen puheenvuoro tavarasta.\n\nProjektin tarkoitus on kurottaa kohti alueen asukkaita ja saada tutkimaan omia kodin tavaroita. Mistä ne ovat lähtöisin? Onko niillä käyttöä? Minne ne tulevat päätymään, kun niitä ei enää tarvita?\n\nVuosaarelaisten lahjoittamista tarpeettomista tavaroista on tehty koosteita kirjaston elämäkertaosastoille. Esinekoosteet näyttäytyvät alueen asukkaiden muotokuvina. Lahjoitetut esineet on skannattu ja tulostettu uuteen kokonaisuuteen 3D-tulostimella. Näin näyttelyn osaksi tuodaan paikallisten asukkaiden läsnäoloa ja mikrohistoriaa.\n\nAlueen asukkailta kerätyt esineet ovat suurelta osin Kiinassa massatuotettuja tavaroita, joiden merkitys on hävinnyt uutuusarvon kadottua. Ehkä juuri tässä piilee nykyhetkessämme kytevä kriisi: maailma täyttyy muovista ja tavarasta, jota kukaan ei arvosta tai halua. Miten muuttaisimme suhteemme esineisiin vaalivaksi ja arvostavaksi? Miten oppisimme näkemään uutuusarvon ohi ja suosimaan kestäväksi suunniteltuja, korjattavissa olevia, tarinoiden kyllästämiä tavaroita?\n\nAnne Roininen on kuvanveistäjä, joka työskentelee usein paikkasidonnaisesti ja prosessipohjaisesti. Kohtaamiset ihmisten kanssa ovat tärkeä osa Roinisen työskentelyä, ja teosten taustalla on usein poliittinenkin lataus. Lue lisää:https://anneroininen.com/\n\nLöydät teokset Elämäkerta-hyllyistä, Vuosaaren kirja","c":"Visual arts","cs":["Vuotalo","Näyttelyt","Suomi","Ruotsi","Englanti","online exhibitions"],"img":"http://www.vuotalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_786458.jpg","u":"http://www.vuotalo.fi/fi/tapahtumat/event/D50B706A0B2D9A3FC8B30813AB05C3C8/Made_in_Vuosaari_","ue":"http://www.vuotalo.fi/en/events/event/D50B706A0B2D9A3FC8B30813AB05C3C8/Made_in_Vuosaari","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:68245","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agnosdtcnq","t":"Generation 2026","te":"Generation 2026","v":"Amos Rex","ve":"Amos Rex","a":"Mannerheimintie 22-24","la":60.17033,"ln":24.93619,"s":720,"e":1200,"d":"Amos Rex’s Generation triennial offers a bold and fascinating glimpse into the art and thoughts of the young, emerging generation of artists. \n\nHeld every three years, the exhibition features a broad selection of works by approximately 40 young artists aged 15–23, chosen by a jury from open call submissions. \n\nAmos Rex\n\n13.5.-6.9.2026","df":"Neljättä kertaa toteutettava Generation-triennaali tuo yhteen 50 taiteilijaa ja työryhmää. \n\nGeneration 2026 -näyttelyyn valitut taiteilijat ja heidän teoksensa tarjoavat suodattamattoman näkymän nuorten taiteilijoiden tämänhetkisiin huoliin, kamppailuihin ja unelmiin. \n\nHe hämärtävät perinteisiä taidegenrejen rajoja ja kutsuvat kohtaamaan nykyajan kipeimpiä yhteiskunnallisia kysymyksiä. \n\nNäyttelyn 15–23-vuotiaiden taiteilijoiden suhde luovuuteen on monitaiteinen, ennakkoluuloton ja suvereeni.\n\nAmos Rex\n\n13.5.-6.9.2026","c":"Visual arts","cs":["art","cultural events","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Amosrex_Shoothayley11.jpg","u":"https://amosrex.fi/nayttelyt/generation
