 that tell meaningful visual stories and inspire emotional reflection. \n\nSelected Exhibitions: \n\n2021 Metso Library, Tampere, Finland 2022 Hervanta Library Tampere, Finland 2022 Kamppi, Helsinki, Finland The exhibition can be seen during the library opening hours. Welcome!","df":"Malee Aaltonen (akryylitaiteilija, kirjailija, kulttuuripromoottori) on syntynyt Thaimaassa ja asuu Suomessa.\n\nTaidenäyttelyn teokset käsittelevät tunteita, muistoja, kulttuurista identiteettiä sekä thaimaalaisen ja suomalaisen kulttuurin välistä yhteyttä. Ilmeikkäiden värien, rikkaiden tekstuurien ja symbolisten sommitelmien avulla taiteilija luo tarinallisia maalauksia, jotka herättävät ajatuksia ja tunteita.\n\nAiempia näyttelyitä:\n\n2021 Metson kirjasto, Tampere 2022 Hervannan kirjasto, Tampere 2022 Kamppi, Helsinki Näyttely on nähtävissä kirjaston aukioloaikoina. Tervetuloa!","c":"Visual arts","cs":["Leppävaara","libraries","cultural events","exhibitions"],"img":"https://tapahtumasyotto.espoo.fi/media/images/bae9e91c-274a-4eba-b3a5-a15f2d5016a7.jpg","u":"https://tapahtumat.hel.fi/fi/events/espoo_le:agqeglymae","ue":"https://tapahtumat.hel.fi/en/events/espoo_le:agqeglymae","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"espoo_le:agqeglymae","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"e159a6857969b3ee.webp"},{"src":"le","eid":"espoo_le:agp672uxe4","t":"Seija Riekkinen: Heijastuksia (taidenäyttely)","te":"Seija Riekkinen: Reflections (art exhibition)","v":"Entressen kirjasto","ve":"Entresse Library","a":"Siltakatu 11","la":60.20364,"ln":24.65786,"s":720,"e":1200,"d":"\"Life is reflected on paper and canvas. I don’t know what’s coming – what colour or shape it will take this time. The paintings are reflections of everything around me, everything I’ve experienced and seen. You don’t have to understand everything. You can simply marvel at it! Yet it feels as though art is always true; it captures the essence of even the most mythical.\n\nMy art therapy studies at the Inartes Institute gave me the courage to use colour and, above all, the joy of painting. I’m happy when I get to paint.\n\nThe works on display were created over the last few years, since I retired. I spent my working life in the service of the Church as a hospital chaplain and a work supervisor. My interest in art has been a more or less influential undercurrent throughout my life.”\n\nThe exhibition can be seen during the library’s opening hours. Welcome!","df":"\"Elämä heijastuu paperille ja kankaalle. En tiedä, mitä on tulossa – millainen väri tai muoto tällä kertaa. Taulut ovat heijastuksia kaikesta ympärillä olevasta, koetusta ja nähdystä. Kaikkea ei tarvitse ymmärtää. Voi vain ihmetellä! Kuitenkin tuntuu, että taide on aina totta, se tavoittaa tarustakin olennaisen.\n\nTaideterapian opinnot Inartes-instituutissa toivat mukanaan rohkeuden käyttää värejä ja ennen kaikkea maalaamisen ilon. Olen onnellinen, kun saan maalata.\n\nEsillä olevat työt ovat syntyneet muutaman viime vuoden aikana, kun jäin eläkkeelle. Työurani olen tehnyt kirkon palveluksessa sairaalapappina ja työnohjaajana. Taiteen harrastus on kulkenut mukana enemmän tai vähemmän vaikuttavana pohjavireenä.\" \n\nNäyttely on nähtävissä kirjaston aukioloaikoina. Tervetuloa!","c":"Visual arts","cs":["Espoon keskus","Kaupunginkallio","Muurala","libraries","cultural events","exhibitions"],"img":"https://tapahtumasyotto.espoo.fi/media/images/b3a4075f-d98f-4fcc-9437-40464209095d.jpg","u":"https://tapahtumat.hel.fi/fi/events/espoo_le:agp672uxe4","ue":"https://tapahtumat.hel.fi/en/events/espoo_le:agp672uxe4","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"espoo_le:agp672uxe4","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"01b1c248120d1c26.webp"},{"src":"le","eid":"helsinki:agp3o3zh2q","t":"Anton Alvarez: The Colour of Gravity","te":"Anton Alvarez: The Colour of Gravity","v":"Helsinki Contemporary","ve":"Helsinki Contemporary","a":"Bulevardi 10","la":60.16556,"ln":24.94105,"s":720,"e":960,"d":"Helsinki Contemporary is presenting Swedish Chilean artist Anton Alvarez's first solo exhibition in Finland. The Colour of Gravity presents striking ceramic sculptures that play with the human scale and challenge perceptions of craftsmanship and the use of technology in art.\n\nAnton Alvarez approaches artmaking through materials and processes. He designs and builds machines that he uses to create his works, combining the roles of both engineer and sculptor. \n\nIn addition to ceramics, Alvarez has worked with materials such as thread and, as of late, papier- mâché.\n\nThe works in The Colour of Gravity range from large to small. The basic elements of sculpture— the sculpture itself and its base, the interplay between weight and the illusion of weightlessness, and the sculpture’s relationship to space and the human body—take centre stage.\n\nIn Alvarez’s ceramic works one can sense the gravitational pull of Earth and the pressure of machinery squeezing out clay through a nozzle. \n\nAnton Alvarez (b. 1980, Uppsala, Sweden) is a graduate of the Royal College of Art in London and Konstfack in Stockholm. Alvarez’s works have been featured in numerous solo and group shows since 2014. Alvarez has created several public sculptures in Sweden and has collaborated with eg. Gucci, Fendi, Acne and Issey Miyake. \n\nHelsinki Contemporary\n\n7.-30.8.2026\n\nWed-Fri 12.00-18.00\n\nSat-Sun 12.00-16.00\n\nFree ","df":"Helsinki Contemporarylla on esillä ruotsalais-chileläisen taiteilijan Anton Alvarezin ensimmäinen yksityisnäyttely Suomessa. The Colour of Gravity (Painovoiman väri) esittelee näyttävien keraamisten veistosten kokonaisuuden, joka kommentoi ihmisen mittakaavaa ja haastaa käsityksiä käsityön ja teknologian rooleista taiteessa.\n\nAnton Alvarez lähestyy taiteen tekemistä materiaalin ja prosessin kautta. Hän suunnittelee ja luo erilaisia koneita, joiden avulla hän luo teoksensa, yhdistellen työskentelyssään insinöörin ja käsityöläisen rooleja. Keramiikan lisäksi Alvarez on työskennellyt muun muassa langan ja viime aikoina myös paperimassan kanssa. \n\nNäyttelyn teokset vaihtelevat kooltaan suurista pieniin, joissa voi tuntea maan vetovoiman ja saven pusertamisen paineen. Leikkisä vuoropuhelu tuttuuden ja vierauden, raskauden ja keveyden sekä mekaanisen ja orgaanisen välillä tekee Alvarezin taiteesta sekä helposti lähestyttävää että käsitteellistä.\n\nAnton Alvarez (s. 1980, Uppsala, Ruotsi) on valmistunut Royal College of Artista Lontoosta ja Konstfackista Tukholmasta. Alvarezin teoksia on nähty useissa yksityis- ja ryhmänäyttelyissä vuodesta 2014. Alvarez on toteuttanut useita julkisia teoksia Ruotsissa ja tehnyt yhteistyötä mm. Guccin, Fendin, Acnen ja Issey Miyaken kanssa. \n\nHelsinki Contemporary\n\n7.-30.8.2026\n\nKe-pe 12.00-18.00\n\nLa-su 12.00","c":"Visual arts","cs":["fine arts","art","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/260615__alvarez009202_09_small.jpg","u":"https://helsinkicontemporary.com/exhibitions/the-colour-of-gravity","ue":"https://helsinkicontemporary.com/exhibitions/the-colour-of-gravity","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"12:00-16:00","n":0,"nn":0,"i":"helsinki:agp3o3zh2q","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"f13417e96f1a8689.webp"},{"src":"le","eid":"helsinki:agqc33xlwq","t":"Shanghailainen dumpling pop-up","te":"Shanghai Xiaolongbao Pop-up","v":"Kulmavuorenkatu 4, Helsinki","ve":"Kulmavuorenkatu 4, Helsinki","a":"Kulmavuorenkatu 4","la":60.18855,"ln":24.96489,"s":720,"e":1080,"d":"A four-day Shanghai dumpling pop-up in Sörnäinen! Freshly made xiaolongbao, small bites and drinks. Vegan option available.\n\nThe star of the menu is xiaolongbao – Shanghai’s iconic steamed soup dumplings, freshly made on site. There are both classic pork and vegan xiaolongbao.\n\nThere will also be a few small bites, something sweet, and refreshing drinks.\n\nCome for lunch, dinner, or simply a basket of xiaolongbao!\n\nSupear, Kulmavuorenkatu 4\n27.-30.8.2026\nThu-Fri 11.00–14.00 & 17.00–20.00\nSat 12.00–20.00\nSun 12.00–18.00\n\nWalk-ins are welcome, or DM to reserve a table","df":"Neljän päivän Shanghai dumpling pop-up Sörnäisissä! Tuoreita xiaolongbao-nyyttejä, pieniä herkkuja ja juomia. \n\nMenun tähtenä on xiaolongbao – Shanghain ikoninen höyrytetty keittotäytteinen nyytti, joka valmistetaan tuoreena paikan päällä. Tarjolla on sekä klassinen possu-xiaolongbao että vegaaninen vaihtoehto.\n\nLisäksi tarjolla on muutamia pieniä annoksia, jotain makeaa sekä raikkaita juomia.\n\nTule lounaalle, illalliselle tai ihan vain nauttimaan korillinen xiaolongbao-nyyttejä!\n\nSupear, Kulmavuorenkatu 4\n27.–30.8.2026\n\nTo-pe 11.00–14.00 & 17.00–20.00\nLa 12.00–20.00\nSu 12.00–18.00\n\nHinnat keskimäärin 16.90–30 € / hlö, valinnoista riippuen.\n\nWalk-in-asiakkaat ovat tervetulleita, tai halutessasi voit varata pöydän lähettämällä viestiä Instagramissa.","c":"Participate","cs":["cultural events","food"],"img":"https://api.hel.fi/linkedevents/media/images/4_xDbyXov.jpg","u":"https://www.instagram.com/p/DcUASTMjJXa/","ue":"https://www.instagram.com/p/DcUASTMjJXa/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"12:00-18:00","n":0,"nn":0,"i":"helsinki:agqc33xlwq","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"44f6fdd53b6ec3a0.webp"},{"src":"le","eid":"helsinki:agpyi4zrny","t":"Love & Loss -taidenäyttely","te":"Love & Loss -taidenäyttely","v":"TakeMeHome-Galleria","ve":"TakeMeHome-Gallery","a":"Kauppiaankatu 8-10","la":60.1669,"ln":24.9673,"s":720,"e":900,"d":"Love & Loss on Jonna Jokikunnaksen ja Ninni Melenderin yhteisnäyttely ja kunnianosoitus luonnolle, luopumiselle ja rakkaudelle.\n\nTervetuloa avajaisiin lauantaina 1.8. klo 16 alkaen Katajanokalle.\n\nJonna Jokikunnas on kuvataiteilija, jonka runollista realismia edustavat öljyvärimaalaukset käsittelevät elämän haurautta, katoavaisuutta ja luonnon hiljaista voimaa. Nykyinen näyttely koostuu kokonaan puulle maalatuista teoksista, joissa puun luonnollinen pinta ja muodot ovat olennainen osa ilmaisua. Jokainen teos kutsuu katsojan pysähtymään ja löytämään omat tulkintansa.\n\nNinni Melender on kokenut helsinkiläinen graafikko, AD ja kuvittaja. Ninni osallistuu Take me home Gallerian elokuun näyttelyyn Love & Loss sekä DoGGGs -miniryijysarjoilla. Niiden vaikuttavana teemana on suru ja menetys sekä oivallus, että näiden vahvojen tunteiden vastapuolena on aina rakkaus.\n\n\"Halusin kunnioittaa äitini muistoa ja näin syntyi \"Blackbird singing in the Death of Night\" -miniryijy mustarastaasta pinkillä rakkauden oksalla. Tästä kehittyi intuitiivinen sarja, jossa eri lintuhahmot taklaavat läpi suruprosessin\".","df":"Love & Loss on Jonna Jokikunnaksen ja Ninni Melenderin yhteisnäyttely ja kunnianosoitus luonnolle, luopumiselle ja rakkaudelle.\n\nTervetuloa avajaisiin lauantaina 1.8. klo 16 alkaen Katajanokalle.\n\nJonna Jokikunnas on kuvataiteilija, jonka runollista realismia edustavat öljyvärimaalaukset käsittelevät elämän haurautta, katoavaisuutta ja luonnon hiljaista voimaa. Nykyinen näyttely koostuu kokonaan puulle maalatuista teoksista, joissa puun luonnollinen pinta ja muodot ovat olennainen osa ilmaisua. Jokainen teos kutsuu katsojan pysähtymään ja löytämään omat tulkintansa.\n\nNinni Melender on kokenut helsinkiläinen graafikko, AD ja kuvittaja. Ninni osallistuu Take me home Gallerian elokuun näyttelyyn Love & Loss sekä DoGGGs -miniryijysarjoilla. Niiden vaikuttavana teemana on suru ja menetys sekä oivallus, että näiden vahvojen tunteiden vastapuolena on aina rakkaus.\n\n\"Halusin kunnioittaa äitini muistoa ja näin syntyi \"Blackbird singing in the Death of Night\" -miniryijy mustarastaasta pinkillä rakkauden oksalla. Tästä kehittyi intuitiivinen sarja, jossa eri lintuhahmot taklaavat läpi suruprosessin\".","c":"Visual arts","cs":["fine arts","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/LoveLoss_some_poster_with_opening.jpg","u":"https://www.instagram.com/takemehomegalleria/","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agpyi4zrny","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"12:00-15:00","n":0,"nn":0,"i":"helsinki:agpyi4zrny","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"9ba3528f18601b1d.webp"},{"src":"le","eid":"helsinki:agpeafmyve","t":"Opastettu yleisökierros Suomenlinnassa","te":"Opastettu yleisökierros Suomenlinnassa","v":"Suomenlinnan merilinnoitus","ve":"Suomenlinna Sea Fortress","a":"Suomenlinna","la":60.14882,"ln":24.98479,"s":720,"e":780,"d":"Suomenlinnassa toteutettavalla kävelykierroksella kuullaan linnoituksen mielenkiintoisesta historiasta ja nykypäivästä.\n\nVuonna 1748 käynnistyivät pikkuruisen Helsingin kaupungin edustalla työt, joista alkoi Viaporin historia. Kuudelle saarelle rakennettu bastionilinnoitus palveli Ruotsin Saaristolaivaston tukikohtana, jonka tarpeisiin rakennettiin myös suuri kuivatelakka. Ruotsin ajan lopulla alkuvuosien karusta rakennustyömaasta oli jo kuoriutunut yksi tuolloisen Suomen alueen suurimpia ja vilkkaimpia asutuskeskittymiä.\n\nLinnoituksen venäläinen kausi käynnistyi Suomen sodan aikana, aikalaisia kummastuttaneen ja kauan keskustelua ja kysymyksiä herättäneen linnoituksen antautumisen myötä vuonna 1808. Venäläinen kausi kesti 110 vuotta, ja jätti perinnöksi mm. lukuisia kasarmirakennuksia sekä linnoitussaarten lounaispuolelle rakennetut vallit pattereineen - kauppiaskorttelin marketenttien kuuluisia sukuja ja Krimin sodan kokemuksia ja tarinoita unohtamatta.\n\nLinnoituksen suomalainen kausi puolestaan käynnistyi keväällä 1918 Suomen sisällissodan tummassa varjossa. Sittemmin linnoitussaarista muodostui elävä varuskuntayhteisö ja ainutlaatuinen kulttuuriperintökohde. \n\nOpastettuja kierroksia järjestetään suomeksi:\n\n2.6. - 31.8. päivittäin klo 12.00 (EI juhannuksena)\n\n22. uppetry workshop, no construction or crafting required.\n\nTogether we bring to life newly discovered puppet creatures, be it a two-headed singing slug unicorn, an amiable puppy-cat, or a whatsit-thing-beast. There will be an emphasis on courage, breath, teamwork, and trusting your creative instincts.\n\nAll abilities and experience welcome. Suitable for everyone over 5 years of age.\nAge recommendation: 5+\n 2 h - you can attend only part / English\nLisätietoja: https://sampofestival.fi\n\nTESTIMONIALS:\n“Ingrid Hansen is a dynamic and engaging educator. The students and teachers alike were captivated by energy and presence. The curiosity and fearlessness that she demonstrates as an instructor is contagious. Through Ingrid's workshop everyone became more playful in the collaborative environment that Ingrid created. I can't wait for her to come back to our school!” - Lisa Cox, Arts Teacher at Second Street Middle School, Etobicoke\n\nIngrid Hansen teaches puppetry and physical theatre workshops for adults, kinders, teens, college students, Deaf artists, professionals, first-timers, teachers, artists with disabilities, and puppetry nerds.","df":"Käytännönläheisessä nukketeatterityöpajassa ei rakenneta tai askarrella mitään, vaan tartutaan suoraan asiaan!\n\nHerätämme yhdessä eloon juuri keksittyjä nukkehahmoja: vaikkapa kaksipäisen laulavan etana-yksisarvisen, ystävällisen nukkekissan tai minkä tahansa olion tai hirviön, jonka keksimme! Työpajassa keskitytään rohkeuteen, hengitykseen, yhteistyöhön ja omiin luoviin vaistoihin luottamiseen.\n\nKaiken tasoiset osallistujat ovat tervetulleita. Sopii yli 5-vuotiaille.\n\nKesto 2 t – voit tulla mukaan myös vain osaksi aikaa \nOhjauskieli: englanti\nLisätietoja: https://sampofestival.fi\n\nSuosituksia:\n\n\"Ingrid Hansen on dynaaminen ja innostava kouluttaja. Oppilaat ja opettajat olivat vaikuttuneita hänen energisyydestään ja pelottomuudestaan, ja hänen innostuksensa tarttui muihin. Ingridin työpaja sai kaikki osallistujat leikkimään enemmän yhdessä hänen rakentamassaan luovassa ympäristössä. Toivon todella, että hän palaa vielä kouluumme!\" – Lisa Cox, kuvataiteen opettaja, Second Street Middle School, Etobicoke\n\nIngrid Hansen vetää nukketeatterin ja fyysisen teatterin työpajoja aikuisille, varhaiskasvatusikäisille lapsille, nuorille, korkeakouluopiskelijoille, kuuroille taiteilijoille, ammattilaisille, ensikertalaisille, opettajille, vammaisille taiteilijoille sekä nukketeatterin harrastajille ja intohimoisille ystäville.\nhttps://snafudance.com","c":"Theatre","cs":["Lastentapahtumat","Teatteri","Teatteri ja sirkus","Annantalo","Suomi","Englanti"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_796514.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/1863B7E0976ED47F8DD65F8A9BC7EDC5/How_to_puppeteer_anything_","ue":"http://www.annantalo.fi/en/events/event/1863B7E0976ED47F8DD65F8A9BC7EDC5/How_to_puppeteer_anything_","price":"","r":1,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"13:00-15:00","n":0,"nn":0,"i":"kulke:69707","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"407cf37e59678e6d.webp"},{"src":"le","eid":"helsinki:ago7m3v7nq","t":"Heinähattu, Vilttitossu ja suuri pamaus","te":"Heinähattu, Vilttitossu ja suuri pamaus","v":"Aleksanterin teatteri","ve":"Aleksanterin teatteri","a":"Bulevardi 27","la":60.16341,"ln":24.93332,"s":780,"e":815,"d":"Heinähatun ja Vilttitossun perheeseen odotellaan uutta tulokasta, jota pitää “rasvata aamusta iltaan”. Vilttitossu uskoo, että se on auto. Mutta äidin vatsan paisumista ei voi pysäyttää, vaikka Vilttitossu tekee kaikkensa, jotta taloon ei tulisi kilpailevaa kuopusta. Kuka vatsasta lopulta putkahtaa?\n​\nSinikka ja Tiina Nopolan kirjoittama libretto on saanut innoituksensa Heinähattu, Vilttitossu ja vauva -kirjasta. Perheille tuttua tilannetta käsitellään Nopoloiden tapaan huumorilla ja lapsen näkökulmasta. Teos on läpisävelletty ja sisaruksia esittää kaksi laulavaa näyttelijää. P UNESCO, Suomenlinna fortress, is to join a guided tour.\n\nThe tour introduces you to the famous fortress and offers interesting perspectives on the history of Finland and Northern Europe.\n\nThe construction works of one of the biggest Nordic fortresses, Suomenlinna, begun in 1748.\n\nDuring the guided walking tour an authorized Suomenlinna-guide tells about the 270 years of eventful history of Suomenlinna under the rule of three different states as well as the life on the islands today. The guide will take you to the most important sights of the fortress, such as the Great Courtyard and the Dry Dock, which in its days was among the largest in the world.\n\nDeparture: Suomenlinna Museum\n\n1.6. - 31.8.2026\n\nDaily 13.00-14.00, not during Midsummer 19.-21.6. Tickets 6-16 €, guidance in Swedish","df":"Linnoitusalueella toteutettavalla kävelykierroksella kuullaan linnoituksen mielenkiintoisesta historiasta ja nykypäivästä. \n\nSuomenlinnan opastettu kierros on paras tapa tutustua linnoitukseen. \n\nOpastuskierros Suomenlinnassa on kävelyretki upeissa puitteissa ja samalla tiivis katsaus Suomenlinnan ja koko Suomen historiaan. Kierroksella tutustutaan päänähtävyyksiin kuten Susisaaren suureen linnanpihaan ja aikoinaan maailman suurimpaan kuivatelakkaan.\n\nOpastus sisältää myös ilmaisen sisäänpääsyn Ehrensvärd-museoon museon aukioloaikana.\n\nLähtöpaikka: Suomenlinna-museo\n\n1.6. - 31.8.2026\n\nPäivittäin 13.00-14.00, ei juhannuksena 19.-21.6. Liput 6-16€, opastus on ruotsinkielinen","c":"Dance","cs":["history","guidance","walking tours","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/_MG_0738_6PxlosO.jpg","u":"https://suomenlinna.johku.com/fi_FI/opastettu-yleisokierros-ruotsiksi","ue":"https://suomenlinna.johku.com/sv_SE/opastettu-yleisokierros-ruotsiksi","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"13:00-14:00","n":0,"nn":0,"i":"helsinki:agpie66frq","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"4aaec2675e788069.webp"},{"src":"le","eid":"espoo_le:agp7whjlc4","t":"CareerCraft - Career Reality & Awareness- englanninkielinen seminaari","te":"CareerCraft - Career Reality & Awareness","v":"Lippulaivan kirjasto","ve":"Lippulaiva library","a":"Espoonlahdenkatu 8","la":60.15007,"ln":24.65211,"s":810,"e":1050,"d":"CareerCraft – Career Reality & Awareness is a free interactive seminar for university students and young adults (18–29), especially for international students and those beginning their careers in Finland.\n\nProgram: \n\n13:30 - Doors open 14:00 - Opening - The pieces of the puzzle ( A short intro to the 6-month journey, interactive q&a and a quick \"meet your neighbour\" icebreaker.) 14:30 Fails & Wins - with Lidiia Salo (A young professional who made it to Helsinki shares her biggest failures- and the lessons that turned them into wins. Interactive talk, not a lecture. Followed by a short break.) 15:45 Workshop- Expectation vs. Reality Matrix (In small groups, map your assumptions about job hunting, interviews, networking and Finnish work culture-then run them through the reality filter with our guests & facilitators) 16:45 Reflection Circle and Networking (Leave one fear or bias behind-say it in one word. Then stay for free-form networking before the event closes at 17:30)","df":"CareerCraft – Career Reality & Awareness on ilmainen interaktiivinen seminaari yliopisto-opiskelijoille ja nuorille aikuisille (18–29), erityisesti kansainvälisille opiskelijoille ja niille, jotka ovat aloittamassa uraansa Suomessa. Tervetuloa!\n\nTapahtuma on englanninkielinen.","c":"Dance","cs":["Kivenlahti","Espoonlahti","guidance","libraries","languages"],"img":"https://tapahtumasyotto.espoo.fi/media/images/e03f5833-0f5c-467a-b37b-c7cd73e2765a.jpg","u":"https://tapahtumat.hel.fi/fi/events/espoo_le:agp7whjlc4","ue":"https://tapahtumat.hel.fi/en/events/espoo_le:agp7whjlc4","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"13:30-17:30","n":0,"nn":0,"i":"espoo_le:agp7whjlc4","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"77676c273c2465f8.webp"},{"src":"hf","eid":"hf25182.0","t":"Cloud Gate Dance Theatre of Taiwan: 13 Tongues","te":"Cloud Gate Dance Theatre of Taiwan: 13 Tongues","v":"Tanssin talo, Erkko-sali","ve":"Dance House Helsinki, Erkko Hall","a":"Tanssin talo, Kaapeliaukio, Helsinki, Suomi","la":60.16216,"ln":24.90583,"s":840,"e":930,"d":"One of Asia’s leading contemporary dance companies, Cloud Gate Dance Theatre of Taiwan, will finally be seen in Helsinki. \n\nBangka, Taipei’s oldest district, was known in the 1980s for its vibrant street life, where the religious and the secular, the wealthy and the poor intertwined. As a child, Cloud Gate’s artistic director Cheng Tsung-lung sold slippers on the district’s streets with his father and became fascinated by his mother’s stories of a legendary storyteller from the 1960s, nicknamed “Thirteen Tongues”, who had made those very streets his stage. \n\nNow, thirty years later, Cheng has transformed his childhood memories into a visually stunning work for 13 dancers, where the bustle of historic streets and Taoist traditions blend seamlessly with the present day. The stage is bathed in abundant colours and forms, and the soundscape flows from Taiwanese folk songs to Taoist chanting and electronic music. The virtuosic 13 Tongues weaves together the spiritual and the worldly, taking the audience on an imaginative journey through centuries-old traditions and beliefs. \n\nChoreographer Lin Hwai-min founded Cloud Gate in 1973 as the first contemporary dance company in a Chinese-speaking community. Since 2020, the company has been led by artistic director Cheng Tsung-lung, an internationally awarded choreographer whose work draws on ancient and contemporary Taiwanese traditions. 1","df":"Aasian johtaviin nykytanssiryhmiin kuuluva Cloud Gate Dance Theater of Taiwan nähdään viimein Helsingissä. \n\nTaipein vanhin kaupunginosa Bangka tunnettiin 1980-luvulla eläväisestä katuelämästään, jossa uskonnollinen ja maallinen sekä rikas ja köyhä sulautuivat toisiinsa. Cloud Gaten taiteellinen johtaja Cheng Tsung-lung myi lapsena isänsä kanssa tohveleita kaupunginosan kaduilla ja lumoutui äitinsä kertomuksista legendaarisesta 1960-luvun tarinankertojasta kutsumanimeltään “Kolmetoista kieltä”, joka oli ottanut samaiset kadut näyttämökseen. \n\nNyt 30 vuotta myöhemmin Cheng on muuttanut lapsuusmuistonsa visuaalisesti häikäiseväksi 13 tanssijan teokseksi, jossa historiallisten katujen häly ja taolaiset perinteet sekoittuvat saumattomasti nykypäivään. Teoksen näyttämö kylpee yltäkylläisissä väreissä ja muodoissa, ja äänimaisema soljuu taiwanilaisista kansanlauluista taolaiseen resitointiin ja elektroniseen musiikkiin. Virtuoottinen 13 Tongues nivoo yhteen henkisen ja maallisen, kun se kuljettaa yleisön mielikuvitukselliselle matkalle läpi vuosisataisten perinteiden ja uskomusten. \n\nKoreografi Lin Hwai-min perusti Cloud Gaten vuonna 1973 ensimmäisenä kiinankielisen yhteisön nykytanssiryhmänä. Vuodesta 2020 ryhmän taiteellisena johtajana työskennellyt Cheng Tsung-lung on kansainvälisesti palkittu koreografi, joka pohjaa työnsä muinaisille ja tämän päivän taiwanilaisille perinteille. ","c":"Dance","cs":["Helsinki Festival"],"img":"https://helsinkifestival.fi/app/uploads/sites/8/2025/12/TG-01-362_441-480x318.jpg?ver=365574a6","u":"https://helsinkifestival.fi/event/cloud-gate-dance-theatre-of-taiwan-13-tongues/","ue":"https://helsinkifestival.fi/en/event/cloud-gate-dance-theatre-of-taiwan-13-tongues-2/","price":"","r":3,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":1,"tl":"14:00-15:30","n":0,"nn":0,"i":"hf25182.0","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"0fd3856577f64869.webp"},{"src":"le","eid":"kulke:69039","t":"Mutaveijarit - Espan lavan kauden päättäjäiset","te":"Mutaveijarit - Espa Stage Season's Closing Party","v":"Espan lava","ve":"Espa Stage","a":"Kappeliesplanadi","la":60.16774,"ln":24.95026,"s":840,"e":960,"d":"Mutaveijarit (“muddy mates”) invites people of all ages on a musical journey to the wonderful world of friendship, nature and mud.\n\nWe will embark on a journey across the world together, occasionally diving into the depths of seas and lakes, meeting friends and acquaintances along the way and marvelling at all the wonders of the world. During the concert, the audience has the chance to sing and play along in the enchanting world of Mutaveijarit.\n\nThe hilarious and super-popular Mutaveijarit is a nationally renowned children's music group known for their captivating stage performances and exciting songs. The music of the band is awash with imagination and boldly and playfully combines different music styles. The musically and lyrically insightful songs, combined with inspirational and pedagogically versatile singing games, whisk the listener away on a musical journey that is fun and exciting for people of all ages.\n\nGet in now, fasten your seat belt! \n\nMutaveijarit: Veikko Muikku, Johanna Mäkitalo, Mari Nieminen, Jussi Nikula, Miia Reko, Eveliina Saikkonen, Saija Santavirta, Leena Untamala","df":"Mutaveijarit kutsuu kaikenikäiset kuulijat mukaan vauhdikkaalle musiikkimatkalle ystävyyden, luonnon ja kuravellin riemukkaaseen maailmaan.\n\nSeikkailemme yhdessä ympäri ämpäri maailman, sukellamme välillä merten ja järvien läpi, kohtaamme monenmoista ystävää ja tuttua ja ihmettelemme yhdessä montaa juttua. Konsertissa pääset mukaan laulamaan ja leikkimään Mutaveijareiden valloittavaan maailmaan.\n\nRiemukas ja supersuosittu Mutaveijarit on maanmainio lastenmusiikkiyhtye, joka on tunnettu valloittavasta lavaesiintymisestään ja mukaansatempaavista lauluistaan. Yhtyeen musiikissa mielikuvitus on päästetty valloilleen ja eri musiikkityylejä yhdistellään rohkeasti ja leikkisästi.\n\nMusiikillisesti ja sanoituksellisesti oivaltavat laulut yhdessä innostavien ja pedagogisesti monipuolisten laululeikkien kanssa tempaavat kuulijansa musiikilliselle retkelle, jonka hauskoissa ja jännittävissä käänteissä viihtyvät niin lapset kuin aikuisetkin.\n\nHyppää kyytiin nyt, laita kiinni turvavyö! \n\nMutaveijarit: Veikko Muikku, Johanna Mäkitalo, Mari Nieminen, Jussi Nikula, Miia Reko, Eveliina Saikkonen, Saija Santavirta, Leena Untamala","c":"Participate","cs":["Lastentapahtumat","Espan lava","Suomi","Ruotsi","Englanti","children (age groups)"],"img":"http://www.espanlava.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_785723.jpg","u":"http://www.espanlava.fi/fi/tapahtumat/event/4C124063A83FF3509A637A9416E084B7/Mutaveijarit","ue":"http://www.espanlava.fi/en/events/event/4C124063A83FF3509A637A9416E084B7/Mutaveijarit","price":"free","r":1,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"14:00-16:00","n":0,"nn":0,"i":"kulke:69039","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"810e550cabf6cf0d.webp"},{"src":"cur","eid":"cur14","t":"Runoiltapäivä","te":"Poetry afternoon","v":"Herttoniemen siirtolapuutarha","ve":"Herttoniemen siirtolapuutarha","a":"Kipparlahden silmukka 3","la":60.19203,"ln":25.01899,"s":840,"e":960,"d":"","df":"","c":"Literature","cs":["out"],"img":"","u":"","ue":"","price":"","r":0,"io":"out","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"14:00-16:00","n":0,"nn":0,"i":"cur14","qe":"Poetry among the allotment huts at Herttoniemi.","qf":"Runoutta Herttoniemen siirtolapuutarhan mökkien keskellä.","qz":"在 Herttoniemi 市民农园的小屋之间读诗。","vp":0,"cr":"","th":""},{"src":"le","eid":"helsinki:agp5nammgi","t":"Eesti Noorsooteater: Transport: Frontline","te":"Eesti Noorsooteater: Transport: Frontline","v":"Nukketeatteri Sampo","ve":"Puppet Theatre Sampo","a":"Erottajankatu 7","la":60.16503,"ln":24.94418,"s":840,"e":885,"d":"Transport: Frontline places the viewer in the heart of a war zone and humanitarian crisis, where— through the lens of a war photographer—they become a witness to unfolding events. \n\nHer camera does more than document—it frames a moral landscape where every image captured carries the weight of choice and consequence.\n\nLike war photography, the performance questions the limits of representation: when does an image open a space for empathy, and when does it slip into the aestheticization of suffering.\n\nThe performance invites reflection on the role of the individual in a world shaped by moral dilemmas and urges active confrontation with the systems of violence we help create—or sustain through silence.\n\nAt a time when the line between testimony and sensationalism is increasingly blurred, Transport: Frontline offers a space for reflection on responsibility, solidarity, and the power of the gaze.\n\nTransport is not merely an artistic experience, but a call for change, raising essential ethical questions and challenging us to reconsider the role and responsibility in times of global crisis.\n\nPuppet Theatre Sampo\n\n28.-30.8.2026\n\nPerformances:\n\n28.8. at 18.00-18.45\n\n29.8. & 30.8. at 14.00-14.45\n\nTickets 25€, age recommendation 15+\n\nPerformed in English, surtitles in Finnish","df":"Transport: Frontline asettaa katsojan keskelle sotavyöhykettä ja humanitaarista kriisiä, jossa – sotakuvaajan näkökulman kautta – hänestä tulee todistaja tapahtumien etenemiselle. \n\nHänen kameransa tekee muutakin kuin dokumentoi: se kehystää moraalisen maiseman, jossa jokainen tallennettu kuva kantaa valinnan ja seurausten painoa.\n\nKuten sotajournalismi, esitys kyseenalaistaa representaation rajat: milloin kuva avaa tilan empatialle ja milloin se lipsahtaa kärsimyksen estetisoimiseksi?\n\nEsitys kutsuu pohtimaan yksilön roolia moraalisten dilemmojen muovaamassa maailmassa ja rohkaisee aktiiviseen kohtaamiseen väkivallan järjestelmien kanssa, joita joko luodaan – tai ylläpidetään hiljaisuudella. \n\nAikana, jolloin raja todistamisen ja sensaationhakuisuuden välillä hämärtyy, Transport: Frontline tarjoaa tilan pohdinnalle vastuusta, solidaarisuudesta ja katseen voimasta.\n\nTransport ei ole pelkkä taiteellinen kokemus, vaan kutsu muutokseen. Se nostaa esiin olennaisia eettisiä kysymyksiä ja haastaa tarkastelemaan uudelleen roolia ja vastuuta globaalien kriisien aikana.\n\nNukketeatteri Sampo\n\n28.-30.8.2026\n\nEsitykset:\n\n28.8. klo 18.00-18.45\n\n29.8. & 30.8. klo 14.00-14.45\n\nLiput 25€, ikäsuositus 15+\n\nEsitetään englanniksi, tekstitys suomeksi","c":"Theatre","cs":["theatre (art forms)","cultural events","puppet theatres"],"img":"https://api.hel.fi/linkedevents/media/images/Transport_Frontline_Photo_OskarSuurorg_DSC02963.jpg","u":"https://sampofestival.fi/","ue":"https://sampofestival.fi/en/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"14:00-14:45","n":0,"nn":0,"i":"helsinki:agp5nammgi","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"eaef69404846ddbb.webp"},{"src":"le","eid":"helsinki:agp5ngl6hu","t":"Teatteri Mukamas: Satuvarjon alla: Pikku-Siili","te":"Under the Story Umbrella: Little Hedgehog","v":"Pikku Sampo","ve":"Pikku Sampo","a":"Iso Roobertinkatu 10","la":60.16367,"ln":24.94295,"s":840,"e":870,"d":"For babies! Under the Story Umbrella, together with the little ones in the family, you get to follow Little Hedgehog's day. \n\nWhat delightful things will there be to marvel at?\n\nPikku Sampo\n\n30.8.2026\n\n11.00 & 14.00\n\nTickets 15€","df":"Vauvoille! Satuvarjon suojassa päästään perheen pienokaisten kanssa seuraamaan Pikku-Siilin päivää. Mitä kaikkea iloista ihmeteltävää siihen mahtuu, kun Pikku-Siili kurkistaa pesästään? \n\nPikku Sampo\n\n30.8.2026\n\n11.00 & 14.00\n\nLiput 15€","c":"Theatre","cs":["families with babies","theatre (art forms)","cultural events","puppet theatres"],"img":"https://api.hel.fi/linkedevents/media/images/3Q6A8936-2-400x400.jpg","u":"https://sampofestival.fi/","ue":"https://sampofestival.fi/en/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"14:00-14:30","n":0,"nn":0,"i":"helsinki:agp5ngl6hu","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"c411686bb77dca9a.webp"},{"src":"cur","eid":"cur5","t":"Kun Ilta Tummentuu","te":"Kun Ilta Tummentuu","v":"Aino Acktén huv somewhat lost dad, surrounded by cardboard boxes and childhood memories.\n\nPAPA is moving house. He’s completely lost! He can’t find anything anymore, not even his... child! Cardboard boxes everywhere – what an incredible playground! \n\nWhen you move, you leave something behind… or someone… \n\nAnd you realise there’s a piece of paper missing from the child’s every drawing hanging on the wall… \n\nWhen you move house, everything is upside down! You no longer know which way is up or down. You don’t know if everything that’s happening is real or if you’re in a funny dream. \n\nIn a playful and humorous way, the actor shows curious minds how masks and puppets can be made from pieces of packaging cardboard using simple and inexpensive methods.\n\nDuration: 40 minutes\nLanguage: The performance is nearly wordless and understanding its language is not necessary for enjoying the piece.\nAge recommendation: 4 years old and up\n\nTickets sold at Puppet Theatre Sampo . Basic ticket: EUR 15; support ticket: EUR 20.\n\nCreator, performance: Csaba Raduly\nDirection: Pavla Mano\nVisual design and costuming: Ivan Stavrev\nMasks and puppets: Csaba Raduly and Pavla Mano\nOriginal music: Petya Nedeva\n\nSAMPO Festival \n\nInternational visual theatre and puppet theatre festival SAMPO is held already for the 10th time in Helsinki","df":"Tämä teatteriesitys kertoo huumorin ja lempeyden sävyttämänä muuton aiheuttamasta kaaoksesta.\n\nNäkökulma on isän, joka on hieman hukassa pahvilaatikoiden ja lapsuuden muistojen keskellä.\n\nPAPA tekee muuttoa. Kaikki on hukassa! Hän ei löydä enää mitään, ei edes omaa… lastaan! Pahvilaatikoita on kaikkialla – mikä uskomaton leikkikenttä! \n\nKun muuttaa, jättää aina taakseen jotakin… Tai jonkun… \n\nJa huomaa, että jokaisesta seinälle kiinnitetystä lapsen piirustuksesta puuttuu pala paperia… \n\nKun muuttaa, koko talo on mullin mallin! Ei enää tiedä, mikä on ylhäällä ja mikä alhaalla. Ei tiedä, onko kaikki todellista vai onko jossain kummallisessa unessa. \n\nEsityksen tarkoituksena on inspiroida ja rohkaista lapsia luomaan asioita itse. Jokaisen esityksen lopussa järjestetään yleisön kanssa vuorovaikutteinen hetki. Hauskalla ja leikkisällä tavalla näyttelijä näyttää yleisölle, kuinka valmistaa naamioita ja nukkeja pahvilaatikoiden paloista yksinkertaisin ja edullisin keinoin.\n\nKesto: 40 minuuttia\nKieli: Esitys sisältää hyvin vähän puhetta, jonka ymmärtäminen ei ole edellytys esityksestä nauttimiselle.\nIkäsuositus: Yli 4-vuotiaille\n\nLippuja esityksiin myy Nukketeatteri Sampo . Lipun hinta: 15 €; kannatuslippu: 20 €.\n\nTekijä, esiintyjä: Csaba Raduly\nOhjaus: Pavla Mano\nVisuaalinen suunnittelu ja puvustus: Ivan Stavrev\nNaamiot ja nuket: Csaba Raduly ja Pavla Mano\nAlkuperäismusiikki: Petya Ne","c":"Theatre","cs":["Lastentapahtumat","Teatteri","Teatteri ja sirkus","Annantalo","Suomi","Ruotsi"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_793514.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/CAA2095CB9AEFD3301654B4A85C9E20A/Puzzle_Theatre_Papa","ue":"http://www.annantalo.fi/en/events/event/CAA2095CB9AEFD3301654B4A85C9E20A/Puzzle_Theatre_Papa","price":"","r":1,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"15:00-17:00","n":0,"nn":0,"i":"kulke:69210","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"a977928fbfcfa7a4.webp"},{"src":"cur","eid":"cur13","t":"Torpantie 3","te":"Torpantie 3","v":"Kupla Tapiola","ve":"Kupla Tapiola","a":"Kulttuuriaukio 2, Espoo","la":60.17756,"ln":24.80449,"s":900,"e":1020,"d":"","df":"","c":"Participate","cs":[],"img":"","u":"","ue":"","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"15:00-17:00","n":0,"nn":0,"i":"cur13","qe":"","qf":"","qz":"","vp":0,"cr":"","th":""},{"src":"le","eid":"helsinki:agp5zekiti","t":"Kirjanjulkistus: Pauli Löija: Parempaa väkeä osa 2","te":"Kirjanjulkistus: Pauli Löija: Parempaa väkeä osa 2","v":"Keskustakirjasto Oodi","ve":"Helsinki Central Library Oodi","a" dance, music and visual art meld together. The performance asks, what is left after a loss, and if what has been lost can still be found in the body, voice, and movement. \n\n** \n\nCircus offers a singular context for this inquiry: its history is entwined with the thresholds between the human and the more-than-human – from the serpent-like contortionists (käärmeihminen, ‘snake-human’ in Finnish), to beast tamers, and legacies of bodily dehumanisation. \n\nThe dramaturgical core of the work grows from the extinction story of the Kauaʻi ʻōʻō bird species. The last male of the species continued to sing its duet-form mating call even after the last female had disappeared in a hurricane in 1982. In the 1987 recording by the Cornell Lab of Ornithology, heard during the performance, ever-lengthening silences open within the song – spaces for another voice to enter, a voice that no longer answers. \n\nOn stage, the circus artists move at the thresholds of acrobatics, dance, balance, and a corporeality that reaches toward the more-than-human. The electroacoustic music brings forth the pulse of the living and the finality of e","df":"OLEMA on nykysirkusnäyttämöteos, joka tutkii ja tunnustelee ihmiskeskeisyyden purkamista ja yhteyden kokemista.\n\nTeos pohjautuu tarinaan sukupuuttoon kuolleesta linnusta, jonka yksin jäänyt laulu päättyy hiljaisuuteen. Näyttämöllä akrobatia, tanssi, musiikki ja visuaalisuus kietoutuvat yhteen. Esitys kysyy, mitä menetysten jälkeen jää jäljelle ja voiko kadonnut silti näkyä kehossa, äänessä ja liikkeessä. \n\n***\n\nSirkus tarjoaa esityksen teemojen tutkimukselle ainutlaatuisen kontekstin: sen historia on kietoutunut ihmisen ja muunlajisten rajapintoihin; käärmenaisiin, pedonkesyttäjiin ja kehollisen epäinhimillistämisen perintöihin. \n\nTeoksen dramaturginen ydin kasvaa kauainkiharapyrstön sukupuuttotarinasta. Lintulajin viimeinen koiras jäi laulamaan yksin dueton puolikasta viimeisen naaraan kadottua hurrikaani Iwan mukana vuonna 1982. Esityksessä kuultavalla Cornellin yliopiston vuoden 1987 nauhoituksella lauluun avautuu yhä pidempiä hiljaisuuksia – paikkoja toiselle äänelle, joka ei enää vastaa.\n\nNäyttämöllä sirkustaiteilijat liikkuvat akrobatian, tanssin, tasapainoilun ja muunlajiseksi kurottavan kehollisuuden rajapinnoilla. Elektroakustinen musiikki tuo kuuluviin elämän sykkeen ja sukupuuton lopullisuuden. Pukusuunnittelijan työ tuo teokseen liikettä vasten asettuvia pintoja: kitkaa ja liukua, kiiltoa ja sameutta, olentojen ääriä. Valo- ja lavastussuunnittelija loihtii näyttämöl","c":"Theatre","cs":["Tanssi","Teatteri","Teatteri ja sirkus","Caisa","Suomi","Ruotsi"],"img":"http://www.caisa.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_794269.jpg","u":"http://www.caisa.fi/fi/tapahtumat/event/D5595565EA9D9BBCB1A05CAF8C3B5F6E/OLEMA","ue":"http://www.caisa.fi/en/events/event/D5595565EA9D9BBCB1A05CAF8C3B5F6E/OLEMA","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"15:00-16:00","n":0,"nn":0,"i":"kulke:69430","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"98b2ee7137f58152.webp"},{"src":"le","eid":"helsinki:agp5ndu26a","t":"Transport: Fasten your seatbelts","te":"Transport: Fasten your seatbelts","v":"Nukketeatteri Sampo","ve":"Puppet Theatre Sampo","a":"Erottajankatu 7","la":60.16503,"ln":24.94418,"s":900,"e":945,"d":"Lithuanian Klaipėdos lėlių teatras: Transport: Fasten your seatbelts\n\nSpace tourism promises new opportunities—but at what cost? Is travelling to space true progress, or an escape from the problems we have left unresolved on Earth\n\nTransport: Fasten your Seatbelts! is a dazzling, ironic satire that invites us to look at a fractured world from a distance—from above—where its contradictions become sharper and harder to ignore.\n\nAt the center of the story is Megan, an ambitious young woman raised to believe that anything is possible if you want it badly enough. \n\nWhen she receives the most prestigious birthday gift imaginable—a luxurious trip to space—it seems her dreams have finally come true.\n\nBut the view from space reveals another side of the story: beneath the shiny surface of technological progress lies the growing social inequality, environmental exhaustion, and a blind faith in escape as a solution. \n\nFasten Your Seatbelts! raises pressing questions about the future of luxury space tourism— offering new horizons while simultaneously exposing deep-rooted inequality and environmental consequences.\n\nPuppet Theatre Sampo\n\n28.-30.8.2026\n\nPerformances:\n\n28.8. at 19.00-19.45\n\n29.-30.8. at 15.00-15.45\n\nTickets 25€, age recommendation 15+\n\nPerformed in English, surtitles in Finnish","df":"Klaipėdos lėlių teatras: Transport: Fasten your seatbelts\n\nAvaruusturismi lupaa uusia mahdollisuuksia, mutta millä hinnalla? Onko avaruusmatkailu edistystä vai pakoa Maahan jättämistä ongelmista?\n\nLiettualaisen Klaipėdos lėlių teatrasin esitys on häikäisevä, ironinen satiiri, joka kutsuu tarkastelemaan pirstaloitunutta maailmaa etäältä, ylhäältä käsin, missä sen ristiriidat muuttuvat entistä terävämmiksi ja vaikeammin sivuutettaviksi.\n\nTarinan keskiössä on Megan, kunnianhimoinen nuori nainen, joka on kasvatettu uskomaan, että kaikki on mahdollista, jos sitä vain tarpeeksi haluaa. \n\nKun hän saa syntymäpäivälahjakseen kaikkein arvostetuimman mahdollisen kokemuksen – ylellisen matkan avaruuteen – näyttää siltä, että hänen unelmansa ovat viimein toteutuneet.\n\nMutta näkymä avaruudesta paljastaa toisen puolen todellisuudesta: kiiltävän teknologisen edistyksen pinnan alla piilevät kasvava sosiaalinen eriarvoisuus, ympäristön ylikuormitus ja sokea usko pakenemiseen ratkaisuna. \n\nAmerikkalaisen unelman ihanne – joskus kaikkien mahdollisuuksien symboli – on muuttunut harvojen etuoikeudeksi. \n\nNukketeatteri Sampo\n\n28.-30.8.2026\n\nEsitykset:\n\n28.8. klo 19.00-19.45\n\n29.-30.8. klo 15.00-15.45\n\nLiput 25€, ikäsuositus 15+\n\nEsitys on englanniksi, tekstitys suomeksi","c":"Theatre","cs":["theatr res reflection on the steps we can take toward sustainable living and a more conscious relationship with the natural world.\n\nPuppet Theatre Sampo\n\n28.-30.8.2026\n\nPerformances:\n\n28.8. at 20.00-20.45\n\n29.8. & 30.8. at 16.00-16.45\n\nTickets 25€, age recommendation 14+\n\nPerformed in English, surtitles in Finnish","df":"Tsekkiläisen Divadlo Alfan Transport: Tipping Point on mukaansatempaava, dokumentaarinen teatteriesitys, joka sijoittaa katsojan keskelle oikeussalidraamaa. \n\nSyytetyn penkillä istuu edustaja yhdestä maailman suurimmista energiayhtiöistä, jota syytetään osallisuudesta yhteen tuhoisimmista ympäristökatastrofeista. \n\nÖljynporauslautan räjähdys paljastaa järjestelmiemme haurauden, fossiilisten polttoaineyhtiöiden valvomattoman vallan sekä ahneuden ja rakenteellisen välinpitämättömyyden kohtalokkaan kietoutumisen.\n\nEsitys ei kuitenkaan ole pelkkä kertomus Yhdysvaltojen suurimmasta ympäristökatastrofista – se on myös pohdinta maailmasta, jossa luonto kamppailee selviytyäkseen pääoman armottoman logiikan puristuksessa. \n\nDokumentaarisen materiaalin, audiovisuaalisen kerronnan ja live-esiintymisen vaikuttavan yhdistelmän kautta Transport: Tipping Point herättää keskustelua globaalista liikenteestä, ihmisten tarpeista, kaupasta, fossiilisista polttoaineista, yritysintresseistä ja ympäristöstä. \n\nSe haastaa katsojat kohtaamaan oman vastuunsa ja kannustaa pohtimaan, millaisin askelin voi edetä kohti kestävämpää elämäntapaa ja tietoisempaa suhdetta luontoon.\n\nNukketeatteri Sampo\n\n28.-30.8.2026\n\nEsitykset:\n\n28.8. klo 20.00-20.45\n\n29.8. & 30.8. klo 16.00-16.45\n\nLiput 25€, ikäsuositus 14+\n\nEsitetään englanniksi, tekstitys suomeksi","c":"Theatre","cs":["theatre (art forms)","cultural events","puppet theatres"],"img":"https://api.hel.fi/linkedevents/media/images/6AaohVWA.jpeg","u":"https://sampofestival.fi/","ue":"https://sampofestival.fi/en/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"16:00-16:45","n ,"qf":"","qz":"","vp":0,"cr":"","th":"1f6ed9192d1dc881.webp"},{"src":"le","eid":"helsinki:agqaytarmu","t":"Ajan hermoilla - hyväntekeväisyyskonsertti","te":"Ajan Hermoilla - Charity Concert","v":"Viikin kirkko","ve":"Viikki church","a":"Agronominkatu 5","la":60.23371,"ln":25.03454,"s":1080,"e":1140,"d":"Ajan hermoilla is a warm-hearted charity concert where music brings people together and doing good is at the very heart of the event.\n\nIn the program music by Mozart, Puccini and Merikanto.\n\nArtists:\n\nRiku Salminen (baritone), Jussi Miilunpalo (piano), Kati Paajanen (violin), Kaisa Kallinen (violin), Olli Kilpiö (viola), Tuulia Ylönen (clarinet), Jussi Viitala (cello)\n\nViikki Church\n\n30.8.2026\n\n18.00-19.00\n\nTickets 10/20€ from Lippupiste","df":"Ajan hermoilla on lämminhenkinen hyväntekeväisyyskonsertti, joka sai alkunsa Neuroliiton palvelutalo Merenpisaran asukkaan ideasta. \n\nAjatus innosti muita mukaan ja kasvoi yhteiseksi teoksi – konsertiksi, jossa musiikki yhdistää ja hyvän tekeminen on kaiken ytimessä.\n\nIllan aikana kuullaan muun muassa W.A. Mozartin Klarinettikvintetto, Giacomo Puccinin Tosca-oopperasta tehty sovitus jousikvartetille sekä Oskar Merikannon musiikkia baritoni Riku Salmisen esittämänä ja Jussi Miilunpalon säestämänä. Konsertin päättää Sofia Voltin säveltämä ja Merenpisaran asukkaiden sanoittama Pisaroita-kappale.\n\nKonsertin suojelijana toimii oopperalaulaja Jaakko Ryhänen.\n\nEsiintyjät:\n\nRiku Salminen (baritoni), Jussi Miilunpalo (piano), Kati Paajanen (viulu), Kaisa Kallinen (viulu), Olli Kilpiö (alttoviulu), Tuulia Ylönen (klarinetti), Jussi Viitala (sello)\n\nViikin kirkko\n\n30.8.2026\n\n18.00-19.00\n\nLiput 10/20€ Lippupisteestä\n\nTuotot ohjataan neurologisten sairauksien tutkimukseen Neuroliiton ja Liikehäiriösairauksien liiton kautta","c":"Music","cs":["concerts","music","charity"],"img":"https://api.hel.fi/linkedevents/media/images/Kuva3_2.jpg","u":"https://huny.fi/ajan-hermolla-konsertti-30-8/","ue":"https://huny.f  Suomi","la":60.18043,"ln":24.94248,"s":1140,"e":1230,"d":"Egotrippi celebrates one of the most significant albums of their career, Vielä koittaa uusi aika , with a special 20th-anniversary concert at Huvila. Released in February 2006, the album became the band’s first to top the Finnish charts, reaching gold status within its first week. \n\nThe concert evening at Huvila in August is divided into two parts: the first half features rare gems from the band’s 33-year career, and the second half features a complete performance of the album Vielä koittaa uusi aika . \n\nLive on stage, Egotrippi is a warm, melodic, and effortlessly cohesive group whose songs—filled with longing, comfort, and bright choruses—create unforgettable nights with the audience. The band’s signature sound, strong storytelling, and anthemic climaxes make their shows feel simultaneously intimate and grand.\n\nTailored specifically for Huvila, this anniversary concert offers a rare chance to revisit the album’s timeless landscapes and world of memories, presenting a setlist that will likely never be heard exactly like this again. \n\nMore information: \n Doors: 17.30\n\nEgotrippi: 19.00\n\nAge limit: 18","df":"Egotrippi juhlistaa Huvilassa yhtä uransa merkittävintä albumia, Vielä koittaa uusi aika , väliajallisessa 20-vuotiskonsertissa. Albumi ilmestyi helmikuussa 2006 ja nousi yhtyeen ensimmäisenä Suomen albumilistan ykköseksi saavuttaen viikossa kultalevyn myyntimäärän. \n\nHuvilan elokuisen konsertti-illan kaari jakaantuu kahteen osaan: ensimmäisellä puoliajalla nautitaan harvinaisuuksista yhtyeen 33-vuotisen uran ajalta ja toisella puoliajalla kuullaan Vielä koittaa uusi aika -albumi kokonaisuudessaan.\n\nEgotrippi on livenä lämmin, melodinen ja mutkattomasti yhteen soiva ryhmä, jonka kappaleiden kaiho, lohtu ja kirkkaat kertosäkeet luovat unohtumattomia iltoja yleisön kanssa. Bändin tunnistettava soundi, vahva tarinallisuus ja yhteislauluun kutsuvat huipennukset tekevät keikoista yhtä aikaa intiimejä ja suurien tunteiden elämyksiä. \n\nHuvilaan räätälöity juhlakonsertti tarjoaa harvinaisen mahdollisuuden palata levyn ajattomiin maisemiin ja muistojen maailmaan sekä samalla kuulla kappalekokonaisuus, jota ei täsmälleen tällaisena tule enää vastaan. \n\n“ Kun kuuntelee Egotripin harmonisesti soljuvaa musiikkia, saattaa helposti unohtaa, että tämä yhtye on merkittävä oppositiovoima suomalaisen rockin kentässä. Egotripin soiva ilmiasu voi vaikuttaa huolitellulta, mutta pinnan alla puhkuu itsepäinen ja sinnikäs vastarannan kiiski.” – Soundi \n\n“ Vielä koittaa uusi aika on musikaalisesti mieti","c":"Participate","cs":["Helsinki Festival"],"img":"https://helsinkifestival.fi/app/uploads/sites/8/2026/03/Egotrippi-Huvilateltta-pystykuva-480x270.jpg?ver=d8c90fcd","u":"https://helsinkifestival.fi/event/egotrippi-viela-koittaa-uusi-aika-albumin-20-vuotisjuhlakonsertti/","ue":"https://helsinkifestival.fi/en/event/egotrippi-viela-koittaa-uusi-aika-20th-anniversary-concert/","price":"","r":2,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":1,"tl":"19:00-20:30","n":0,"nn":0,"i":"hf25539.0","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"e9bb47b14e0ee898.webp"},{"src":"le","eid":"helsinki:agp2srbioi","t":"Open Air Cinema: Pretty Woman","te":"Open Air Cinema: Pretty Woman","v":"Malja Helsinki","ve":"Malja Helsinki","a":"Hietalahdenranta 6","la":60.16072,"ln":24.92946,"s":1140,"e":1260,"d":"A romantic classic charms with its character and iconic scenes. Julia Roberts and Richard Gere make this the perfect summer evening movie.\n\nWhether you want to enjoy the summer evening on the seaside terrace or chill indoors, Malja Helsinki has got you covered – the movies will be shown on giant screens both inside and outside. \n\nMalja Helsinki will also be adding more movies to the lineup later, so expect even more great film nights throughout the summer. \n\nRelax with friends, grab a drink, and enjoy unforgettable movie nights at Malja. \n\nMalja Helsinki\n\n30.8.2026\n\n19.00-21. /* The address bar is the share format. A link can name its language as a path
   (…/zh/, …/ch/, …/fi/) or as ?lang=, and can carry a whole plan as
   ?plan=<session>_<arrival>,… so a route can be handed to somebody. */
const LANG_ALIAS={en:'en',eng:'en',english:'en',
                  fi:'fi',fin:'fi',suomi:'fi',
                  zh:'zh',ch:'zh',cn:'zh',chinese:'zh','zh-cn':'zh','zh-hans':'zh','zh-hant':'zh'};
function langFromURL(){
  const q=new URLSearchParams(location.search).get('lang');
  if(q&&LANG_ALIAS[q.toLowerCase()])return LANG_ALIAS[q.toLowerCase()];
  const seg=location.pathname.split('/').filter(Boolean).pop();
  if(seg&&LANG_ALIAS[seg.toLowerCase()])return LANG_ALIAS[seg.toLowerCase()];
  return null;
}
function planFromURL(){
  const q=new URLSearchParams(location.search).get('plan');
  if(!q)return null;
  const out=q.split(',').map(pair=>{
    const [i,at]=pair.split('_');
    return {i,at:parseInt(at,10)};
  }).filter(p=>p.i&&!isNaN(p.at));
  return out.length?out:null;
}
const planParam=()=>plan.map(p=>p.i+'_'+p.at).join(',');
function shareURL(withPlan){
  const u=new URL(location.href);
  u.search='';u.hash='';
  /* a language directory already says the language, so do not say it twice */
  const seg=u.pathname.split('/').filter(Boolean).pop();
  if(!(seg&&LANG_ALIAS[seg.toLowerCase()]))u.searchParams.set('lang',lang);
  if(withPlan&&plan.length)u.searchParams.set('plan',planParam());
  return u.toString();
}
/* Keeps the address bar honest about the language, and leaves any ?plan that
   arrived in the link alone — a plan only enters a URL when somebody presses
   share, never because they happened to save something. */
function syncURL(){
  const u=new URL(location.href);
  const parts=u.pathname.split('/');
  const last=parts[parts.length-1]===''?parts.length-2:parts.length-1;
  const seg=(parts[last]||'').toLowerCase();
  if(seg&&LANG_ALIAS[seg]){
    if(LANG_ALIAS[seg]!==lang){parts[last]=lang;u.pathname=parts.join('/')}
    u.searchParams.delete('lang');
  }else{
    u.searchParams.set('lang',lang);
  }
  history.replaceState(null,'',u.toString());
}

const CELL=58;

const SPREAD_Z=16;
function regroup(){
  const on=new Set(visible().map(e=>e.i));
  plan.forEach(p=>on.add(p.i));           /* your own stops never filter out */
  const z=map.getZoom();
  let h=0,n=0;
  EV.forEach((e,idx)=>{if(on.has(e.i)){h=(h*31+idx)|0;n++}});
  const key=[z,h,n,lang,plan.length,sel].join('|');
  if(key===groupKey)return;
  groupKey=key;
  if(z>=SPREAD_Z){
    const byPoint=new Map();
    EV.forEach(e=>{
      if(!on.has(e.i))return;
      const k=e.la.toFixed(5)+','+e.ln.toFixed(5);
      let a=byPoint.get(k);if(!a){a=[];byPoint.set(k,a)}
      a.push(e);
    });
    groups=[];
    byPoint.forEach(items=>{
      if(items.length===1){
        const e=items[0];
        groups.push({k:'s'+e.i,items,n:1,at:L.latLng(e.la,e.ln),r:e.r});
        return;
      }
      const c=map.project([items[0].la,items[0].ln],z);
      const rad=Math.min(15+items.length*2.4,52);
      items.forEach((e,i)=>{
        const ang=(i/items.length)*Math.PI*2-Math.PI/2;
        const p=L.point(c.x+Math.cos(ang)*rad,c.y+Math.sin(ang)*rad);
        groups.push({k:'s'+e.i,items:[e],n:1,at:map.unproject(p,z),r:e.r});

  const cells=new Map();

    if(!on.has(e.i))return;
    const p=map.project([e.la,e.ln],z);
    const k=((p.x/CELL)|0)+':'+((p.y/CELL)|0);
    let g=cells.get(k);
    if(!g){g={items:[],x:0,y:0};cells.set(k,g)}
    g.items.push(e);g.x+=p.x;g.y+=p.y;
  });

  cells.forEach((g,k)=>{
    const c=g.items.length;

                  :map.unproject(L.point(g.x/c,g.y/c),z);

  groups.forEach(g=>{

function density(){

let badgeAt=new Map(),rowEls=new Map();
function badgesFor(e){
  const live=e.s<=T&&e.e>T,rain=wxAt(e.s)[2];
  const b=[];
  if(e.x)b.push(`<span class="bdg gone">${t('cancelled')}</span>`);
  if(e.nn)b.push(`<span class="bdg sess">${t('sittingBadge',{n:e.n,m:e.nn})}</span>`);
  if(live&&mode!=='now')b.push(`<span class="bdg live">${t('onNowBadge')}</span>`);
  else if(!live&&e.s>T&&e.s-T<=90)b.push(`<span class="bdg soon">${t('startsIn',{n:e.s-T})}</span>`);
  if(e.bk)b.push(`<span class="bdg warn">${t('bookingShort')}</span>`);

  if(e.rr)b.push(`<span class="bdg rare">${t('rareShort')}</span>`);

let listSig=null;

function listHTML(list){

  const allday=list.filter(e=>e.ex).sort((a,b)=>b.r-a.r||a.te.localeCompare(b.te));

function walk(a,b){
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLa=rad(b.la-a.la),dLn=rad(b.ln-a.ln);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.la))*Math.cos(rad(b.la))*Math.sin(dLn/2)**2;
  return Math.max(2,Math.round(2*R*Math.asin(Math.sqrt(h))/75)+2);   /* 75 m/min + friction */
}
/* A stop is a visit, not the whole run of the event.
   A fixed performance ends when it ends and you plan around that.
   An open-all-evening venue is elastic: you stay until you have to leave for
   the next stop, so the only thing that can go wrong is having no time there. */
const FLEXIBLE=75;                                    /* longer than this is a venue you drop into, not a show you sit through */
function buildPlan(){
  const stops=plan.map(p=>({p,e:byId[p.i]})).filter(x=>x.e)
                  .sort((a,b)=>a.p.at-b.p.at||a.e.s-b.e.s);
  stops.forEach((v,k)=>{
    const e=v.e,next=stops[k+1];
    v.flex=(e.e-e.s)>FLEXIBLE;
    v.arrive=v.p.at;
    v.walkNext=next?walk(e,next.e):0;
    const mustLeave=next?next.p.at-v.walkNext:Infinity;
    v.depart=v.flex
      ? Math.max(v.arrive,Math.min(e.e,mustLeave===Infinity?Math.min(e.e,v.arrive+90):mustLeave))
      : e.e;
    v.stay=Math.max(0,v.depart-Math.max(v.arrive,e.s));
    v.missed=v.arrive>=e.e;
    v.early=v.arrive<e.s;
  });
  stops.forEach((v,k)=>{
    if(!k){v.walk=0;v.slack=null;return}
    const prev=stops[k-1];
    v.walk=prev.walkNext;
    v.slack=prev.flex?null:v.arrive-(prev.e.e+v.walk);   /* only a fixed show can be cut short */
  });
  return stops;
}
function renderPlan(){

  let body=items.length?'':presets;
  if(items.length){
    body+=`<div class="group-h" style="${rv(2)}"><i></i><b>${t('inOrder')}</b>
      <span>${fmt(items[0].arrive)}–${fmt(items[items.length-1].depart)}</span></div><div class="rows">`;
    items.forEach((v,k)=>{

/* ---- the blast ----
   burstParts and favBurst are Festarri's, function for function. The palette
   is read off the pressed control rather than written down, so a magenta R3
   throws magenta and a green "normally closed" throws green. */
function burstParts(pal){
  const rnd=(a,b)=>a+Math.random()*(b-a),parts=[];
  [[0,560],[90,620]].forEach(pair=>parts.push({
    position:'absolute',width:'100%',height:'100%',borderRadius:'50%',
    border:'3px solid currentColor',opacity:0,willChange:'transform, opacity',
    animation:`fp-fav-ring ${pair[1]}ms cubic-bezier(.12,.78,.26,1) ${pair[0]}ms forwards`}));
  const wave=(count,o)=>{
    const spread=360/count;
    for(let i=0;i<count;i++){
      const sz=rnd(o.size[0],o.size[1]);
      const st={position:'absolute',opacity:0,willChange:'transform, opacity',
        '--a':((o.offset||0)+spread*i+rnd(-spread/4,spread/4)).toFixed(1)+'deg',
        '--d':rnd(o.dist[0],o.dist[1]).toFixed(3),'--fs':'40px',
        width:'calc(40px * '+sz.toFixed(4)+(o.kind==='streak'?' * 3.4':'')+')',
        height:'calc(40px * '+sz.toFixed(4)+')',
        borderRadius:'999px',
        background:pal[Math.floor(rnd(0,pal.length))],
        animation:`fp-fav-${o.kind==='petal'?'petal':'spark'} ${o.dur}ms `+
          `cubic-bezier(.08,.72,.2,1) ${(o.delay+rnd(0,70)).toFixed(0)}ms forwards`};
      /* A lobe with one corner brought to a point: the mark's own petal at
         confetti size. The box already travels along its line, so the point
         is the trailing corner and the petals fly tip-last. */
      if(o.kind==='petal')st.borderRadius='50% 50% 50% 0';
      parts.push(st);
    }
  };
  wave(14,{dist:[1.15,1.75],size:[.045,.07],delay:0,dur:640,kind:'streak'});
  wave(10,{dist:[.75,1.15],size:[.04,.065],delay:70,dur:580,offset:14});
  wave(6,{dist:[.95,1.45],size:[.10,.16],delay:130,dur:760,offset:28,kind:'petal'});
  return parts;
}
function favBurst(host){
  if(!host)return;
  const rect=host.getBoundingClientRect();
  if(!rect.width)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cs=getComputedStyle(host);
  const pal=['--rk-ink','--cat-ink','--primary','--cat-bg','--rk-ink']
    .map(v=>cs.getPropertyValue(v).trim()).filter(Boolean);
  const layer=document.createElement('div');
  layer.className='fp-blast';layer.setAttribute('aria-hidden','true');
  layer.style.color=pal[0]||'currentColor';
  layer.style.left=(rect.left+rect.width/2-20).toFixed(1)+'px';
  layer.style.top=(rect.top+rect.height/2-20).toFixed(1)+'px';
  burstParts(pal.length?pal:['#888']).forEach(st=>{
    const el=document.createElement('i');
    Object.keys(st).forEach(k=>{
      if(k.charAt(0)==='-')el.style.setProperty(k,st[k]);else el.style[k]=st[k]});
    layer.appendChild(el)});
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(),1300);
}

   should not be the one that ignores your thumb. */
(function(){
  const f=$('#fsheet');let y0=null,dy=0,t0=0,v=0;
  const grabbable=e=>!e.target.closest('button,input,a')||e.target.closest('.handle');
  f.addEventListener('pointerdown',e=>{
    const body=$('#fbody');
    if(body.contains(e.target)&&body.scrollTop>0)return;   /* let it scroll first */
    if(!grabbable(e))return;
    y0=e.clientY;dy=0;t0=performance.now();v=0;f.classList.add('dragging');
  });
  f.addEventListener('pointermove',e=>{
    if(y0===null)return;
    const now=performance.now();
    dy=Math.max(0,e.clientY-y0);
    v=dy/Math.max(1,now-t0);
    f.style.transform=`translateY(${dy}px)`;
  });
  const end=()=>{
    if(y0===null)return;
    const far=dy>90||v>0.6;
    y0=null;f.classList.remove('dragging');
    if(far)closeSheet();else f.style.transform='';
  };
  f.addEventListener('pointerup',end);
  f.addEventListener('pointercancel',end);
})();
$$('[data-sheet]').forEach(p=>p.onclick=()=>openSheet(p.dataset.sheet));
$('#langBtn').onclick=()=>openSheet('lang');
$('#scrim').onclick=closeSheet;$('#applyBtn').onclick=closeSheet;
$('#clearSheet').onclick=()=>{
  if(openKey==='rank')minRank=0;
  if(openKey==='type')cats.clear();
  if(openKey==='where')shelter='any';
  if(openKey==='when')mode='now';
  if(openKey==='special'){onlyOpen=false;onlyRare=false}
  openSheet(openKey);syncPills();render();
};
$('#fbody').addEventListener('click',ev=>{
  const b=ev.target.closest('.opt');if(!b)return;
  if(b.dataset.rank!==undefined)minRank=+b.dataset.rank;
  if(b.dataset.cat){cats.has(b.dataset.cat)?cats.delete(b.dataset.cat):cats.add(b.dataset.cat)}
  if(b.dataset.shelter)shelter=b.dataset.shelter;
  if(b.dataset.only==='open')onlyOpen=!onlyOpen;
  if(b.dataset.only==='rare')onlyRare=!onlyRare;
  if(b.dataset.when)mode=b.dataset.when;
  if(b.dataset.lang){lang=b.dataset.lang;applyLang()}
  if(b.dataset.theme){setTheme(b.dataset.theme)}
  if(view==='detail'&&!b.dataset.lang){view='list';sel=null}
  openSheet(openKey);syncPills();render();
});
function syncPills(){
  $('#rankLbl').textContent=t('rankPill')[minRank];
  $('[data-sheet="rank"]').dataset.active=minRank>0;
  $('#whenLbl').textContent=t(mode==='now'?'onNow':mode==='soon'?'soon':'all');
  $('[data-sheet="when"]').dataset.active=mode!=='all';
  const rst=$('#tlReset');
  rst.hidden=mode==='all';
  rst.setAttribute('aria-label',t('all'));
  rst.title=t('whenAllSub');
  const ty=$('[data-sheet="type"]');ty.dataset.active=cats.size>0;
  const n=$('.n',ty);n.hidden=!cats.size;n.textContent=cats.size;
  $('[data-sheet="where"]').dataset.active=shelter!=='any';
  $('#specialLbl').textContent=t('special');
  const sp=$('[data-sheet="special"]'),spn=(onlyOpen?1:0)+(onlyRare?1:0);
  sp.dataset.active=spn>0;
  const spb=$('.n',sp);spb.hidden=!spn;spb.textContent=spn;
  $('#themeLbl').textContent=t(isDark()?'dark':'light');
  $('#themeIcon').innerHTML=`<use href="#${isDark()?'i-moon':'i-sun'}"/>`;
}
$('#themePill').onclick=()=>setTheme(isDark()?'light':'dark');
function setTheme(v){
  document.documentElement.setAttribute('data-theme',v);
  try{localStorage.setItem('ty26theme',v)}catch(e){}
  applyBase();syncPills();if(tlOpen)drawTimeline();
}

/* ---------------- sheet drag (mobile only) ---------------- */
const sheet=$('#sheet'),grab=$('#grab'),sbody=$('#sbody');
let snaps=[],snapIdx=1,dragging=false,startY=0,startTop=0,lastY=0,lastT=0,vel=0;
const mobile=()=>window.matchMedia('(max-width:900px)').matches;
function calcSnaps(){
  const h=window.innerHeight-parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue('--nav-h'),10)-(window.visualViewport?0:0);
  snaps=[Math.max(180,h-124),Math.round(h*0.42),72];
}
function setSnap(i,animate=true){
  if(!mobile()){sbody.classList.remove('locked');
    document.documentElement.style.setProperty('--sheet-y','0px');return}
  calcSnaps();snapIdx=Math.max(0,Math.min(2,i));
  sheet.classList.toggle('dragging',!animate);
  sheet.style.setProperty('--y',snaps[snapIdx]+'px');
  sheet.dataset.peek=snapIdx===0?'1':'0';
  $('.mapwrap').classList.toggle('sheet-full',snapIdx===2);
  document.documentElement.style.setProperty('--sheet-y',snaps[snapIdx]+'px');
  sbody.classList.toggle('locked',snapIdx===0);
  if(!animate)requestAnimationFrame(()=>sheet.classList.remove('dragging'));
}
grab.addEventListener('pointerdown',e=>{
  if(!mobile()||e.target.closest('button,input,.searchbar'))return;
  calcSnaps();dragging=true;sheet.classList.add('dragging');
  startY=e.clientY;startTop=parseFloat(sheet.style.getPropertyValue('--y'))||snaps[1];
  lastY=e.clientY;lastT=performance.now();vel=0;
  /* attach before capturing: setPointerCapture throws if the pointer has gone
     already, and the drag must not be left without its move handler */
  window.addEventListener('pointermove',onDragMove,{passive:false});
  try{grab.setPointerCapture(e.pointerId)}catch(err){}});
function onDragMove(e){
  const now=performance.now();vel=(e.clientY-lastY)/Math.max(1,now-lastT);
  lastY=e.clientY;lastT=now;
  sheet.style.setProperty('--y',Math.max(snaps[2]-16,Math.min(snaps[0]+70,startTop+e.clientY-startY))+'px');
  e.preventDefault();
}
function endDrag(){
  if(!dragging)return;
  window.removeEventListener('pointermove',onDragMove);
  dragging=false;sheet.classList.remove('dragging');
  const y=parseFloat(sheet.style.getPropertyValue('--y'));
  let target;
  if(vel<-0.55)target=snapIdx===0?1:2;
  else if(vel>0.55)target=snapIdx===2?1:0;
  else target=snaps.indexOf(snaps.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a));
  setSnap(target);
}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
grab.addEventListener('click',e=>{
  if(!e.target.closest('button')&&Math.abs(vel)<.05&&snapIdx<2)setSnap(snapIdx+1)});
let pullY=null;
sbody.addEventListener('pointerdown',e=>{pullY=sbody.scrollTop<=0?e.clientY:null},{passive:true});
sbody.addEventListener('pointermove',e=>{
  if(pullY!==null&&e.clientY-pullY>26&&snapIdx===2){pullY=null;setSnap(1)}},{passive:true});
sbody.addEventListener('pointerup',()=>{pullY=null},{passive:true});
sbody.addEventListener('pointercancel',()=>{pullY=null},{passive:true});
window.addEventListener('resize',()=>{measureChrome();setSnap(snapIdx)});

/* ---------------- boot ---------------- */
try{const th=localStorage.getItem('ty26theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
if(urlPlan)view='plan';   /* look at it; the first edit is what adopts it */
applyBase();applyLang();setTimeline(tlOpen,false);setSnap(1,false);render();
map.whenReady(()=>setTimeout(()=>{
  map.invalidateSize();syncMarkers();
  /* somebody else's evening arrives framed, so the list and the map agree */
  if(urlPlan&&plan.length){calcSnaps();fitTo(plan.map(p=>byId[p.i]))}
},80));
map.on('zoomend moveend',syncMarkers);

/* ---------------- ?perf=1 ---------------- */
if(new URLSearchParams(location.search).has('perf')){
  const box=document.createElement('div');box.className='perf';
  box.innerHTML=`<b id="pfFps">--</b> fps · worst <span id="pfWorst">--</span> ms ·
    <span id="pfBad">--</span>% slow frames
    <div class="sw">
      <button data-k="nomap" aria-pressed="false">map off</button>
      <button data-k="noimg" aria-pressed="false">images off</button>
      <button data-k="nocv" aria-pressed="false">no skip-layout</button>
      <button data-k="reset" aria-pressed="false">reset</button>
    </div>
    <div class="env" id="pfEnv"></div>`;
  document.body.appendChild(box);
  const supports=(p,v)=>CSS.supports(p,v)?'yes':'NO';
  $('#pfEnv').innerHTML=[
    navigator.userAgent.slice(0,72),
    'dpr '+devicePixelRatio+' · '+innerWidth+'x'+innerHeight,
    'cores '+(navigator.hardwareConcurrency||'?')+' · ram '+(navigator.deviceMemory||'?')+'GB',
    'content-visibility '+supports('content-visibility','auto')+
      ' · backdrop-filter '+supports('backdrop-filter','blur(4px)'),
    'rows <span id="pfRows">'+$$('#sbody .row').length+'</span> · pins '+$$('.mk').length
  ].join('<br>');
  box.addEventListener('click',ev=>{
    const b=ev.target.closest('button');if(!b)return;
    const k=b.dataset.k;
    if(k==='reset'){['nomap','noimg','nocv'].forEach(x=>document.documentElement.classList.remove('perf-'+x));
      $$('.perf button').forEach(x=>x.setAttribute('aria-pressed','false'));return}
    const on=!document.documentElement.classList.contains('perf-'+k);
    document.documentElement.classList.toggle('perf-'+k,on);
    b.setAttribute('aria-pressed',String(on));
  });
  /* Frames are only counted while the list is actually moving; an idle page
     reports 60 and tells us nothing. */
  let last=performance.now(),frames=[],moving=0,shown=0;
  $('#sbody').addEventListener('scroll',()=>{moving=performance.now()},{passive:true});
  (function tick(now){
    const d=now-last;last=now;
    /* a gap of half a second is the tab being suspended, not a slow frame */
    if(now-moving<400&&d<500){frames.push(d);if(frames.length>90)frames.shift()}
    if(frames.length>8&&now-shown>250){
      shown=now;
      const avg=frames.reduce((a,b)=>a+b,0)/frames.length;
      $('#pfFps').textContent=Math.round(1000/avg);
      $('#pfWorst').textContent=Math.round(Math.max(...frames));
      $('#pfBad').textContent=Math.round(frames.filter(f=>f>20).length/frames.length*100);
      $('#pfRows').textContent=$$('#sbody .row').length;
    }
    requestAnimationFrame(tick);
  })(performance.now());
}
</script>
</body>
