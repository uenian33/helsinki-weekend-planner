tuotantoa esittelevän näyttelyn Suo­messa. \n\nMorris oli muotoilun uudistaja ja Arts and Crafts -liikkeen kantava voima, jonka runsaat ja sadunomaiset tapetit ja kankaat ovat edelleen ajankohtaisia. \n\nNäyttelyn esineet ja alkuperäiset luonnokset tulevat William Morris Galleryn ja William Morris Societyn kokoelmista Iso-Britanniasta.\n\nDidrichsenin taidemuseo\n\n29.5.–30.8.2026\n\nTi-su 11.00-18.00","c":"Visual arts","cs":["art","exhibitions","textile art","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Trellis_Wallpaper_block_printed_on_paper_designed_by_William_Morris_1862._William_Morri.jpg","u":"https://www.didrichsenmuseum.fi/n%C3%A4yttelyt","ue":"https://www.didrichsenmuseum.fi/en/n%C3%A4yttelyt","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agnqeauydi","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"af23d6efb9c348ba.webp"},{"src":"le","eid":"helsinki:agpiq2ioye","t":"Ympäristötaidenäyttely","te":"Environmental Art Exhibition","v":"Meilahden Kartano","ve":"Meilahti Manor","a":"Tamminiementie 8","la":60.19173,"ln":24.88399,"s":720,"e":1200,"d":"Uudenmaan kuvataidejärjestöt ry (UKJ ry) organizes an environmental art exhibition in summer 2026 in the park area of Meilahti Manor in Helsinki. The exhibition brings contemporary art into a historic and maritime park environment, where the works engage in a dialogue with nature, the landscape, and time.\n\nPark Area of Meilahti Manor,\n\n31.5.-31.8.2026\n\nFree entry","df":"Uudenmaan kuvataidejärjestöt ry (UKJ ry) järjestää kesällä 2026 ympäristötaidenäyttelyn Meilahden kartanon puistoalueella Helsingissä. Näyttely tuo nykytaiteen osaksi historiallista ja merellistä puistoympäristöä, jossa teokset asettuvat vuoropuheluun luonnon, maiseman ja ajan kanssa.\n\nNäyttely vapaasti katsottavissa Kartanon puistoalueella 31.5.-31.8.2026!\n\nMeilahden Kartanon puistoalue\n\n31.5.-31.8.2026\n\nVapaa pääsy","c":"Visual arts","cs":["exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/N%C3%A4ill%C3%A4_leveyksill%C3%A4_-albumin_julkkarikeikka_IG.png","u":"https://meilahdenkartano.fi/nayttelyt/ymparistotaidenayttely/","ue":"https://meilahdenkartano.fi/nayttelyt/ymparistotaidenayttely/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpiq2ioye","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"c96a4ebc44a00c85.webp"},{"src":"le","eid":"helsinki:ago5rtwpf4","t":"Merenkulkijan kartastot","te":"Atlases of The Mariner","v":"Ehrensvärd-museo","ve":"Ehrensvärd Museum","a":"Suomenlinna B 40","la":60.14423,"ln":24.9855,"s":720,"e":1200,"d":"Atlases of The Mariner -Historical sea charts of the Baltic Sea exhibition introduces in its first room the basics of marine charting and the history of mapping the Baltic sea.\n\nFor centuries, sailors have travelled the waters of the Baltic Sea, yet the region’s first true sea charts were not created until the late 16th century. Over the following centuries—especially in the 17th and 18th centuries—Swedish and Russian cartographers laid the foundations for systematic marine charting. Sea charts were cutting edge technology of their time: strategically and economically valuable documents that were carefully protected.\n\nThe maritime collection of the John Nurminen Foundation comprises nearly one thousand old maps of the Baltic Sea and northern waters, dating back as far as the 15th century. At the heart of the collection are eight rare atlases, images of which are featured in the exhibition Atlases of the Mariner.\n\nThe exhibition introduces in its first room the basics of marine charting and the history of mapping the Baltic Sea. The second room presents four sea atlases from the 17th to the 19th centuries. The charts take visitors across the entire Baltic region, offering Swedish, Dutch, Russian, and English perspectives.\n\nEhrensvärd Museum\n\n2.4.-30.9.2026\n\nDaily:\nMay 10.30-16.00\nJune-August 10.30-13.00 & 13.30-17.30\n\nSat & Sun:\nSeptember 10.30-16.00\n\nAdmission fee 4-7€","df":"Merenkulkijan kartastot – Karttojen matkassa Itämerellä -näyttely avaa merikartoituksen perusteita ja esittelee 1600–1800‑lukujen merikartastoa. \n\nItämeren aalloilla on kuljettu jo viikinkiajoista, mutta alueen ensimmäiset varsinaiset merikartat syntyivät vasta 1500‑luvun lopulla. Seuraavien vuosisatojen aikana, erityisesti 1600–1700‑luvuilla, ruotsalaiset ja venäläiset loivat järjestelmällisen merikartoituksen perustan. Merikartat olivat aikansa huipputeknologiaa – strategisesti ja taloudellisesti arvokkaita dokumentteja, joita suojeltiin tarkoin.\n\nJohn Nurmisen Säätiön merellinen kokoelma kattaa lähes tuhat vanhaa karttaa Itämeren ja pohjoisten merialueiden vesiltä aina 1400‑luvulta lähtien. Kokoelman ytimen muodostaa kahdeksan harvinaista kartastoa, joista osan kuvia nähdään näyttelyssä Merenkulkijan kartastot.\n\nSuomenlinnan Ehrensvärd-museoon rakentuva näyttely avaa ensimmäisessä tilassaan merikartoituksen perusteita ja Itämeren kartoituksen vaiheita. Toisessa tilassa syvennytään neljään 1600–1800‑lukujen merikartastoon. Kartat kuljettavat kävijänsä koko Itämeren alueelle, ja mukana on ruotsalaisia, hollantilaisia, venäläisiä ja englantilaisia näkökulmia.\n\nEhrensvärd-museo\n\n2.4.-30.9.2026\n\nPäivittäin:\ntoukokuu 10.30-16.00\nkesä-elokuu 10.30-13.00 & 13.30-17.30\n\nLauantai ja sunnuntai:\nsyyskuu 10.30-16.00\n\nSisäänpääsy 4-7€","c":"Visual arts","cs":["Maritime Helsinki","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/tunnuskuva2.jpg","u":"https://suomenlinnatours.com/tekemista-suomenlinnassa/ehrensvard-museo/","ue":"https://suomenlinnatours.com/en/activities-at-suomenlinna/ehrensvard-museum/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:ago5rtwpf4","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"b602e7a667ed21c7.webp"},{"src":"le","eid":"helsinki:agp4xzvina","t":"Morsiuspuurosta hääkakkuun","te":"From Bridal Porridge to Wedding Cake","v":"Hotelli- ja ravintolamuseo","ve":"Hotel and Restaurant Museum","a":"Kaapelitehdas, Kaapeliaukio 3","la":60.16196,"ln":24.9057,"s":720,"e":1200,"d":"The summer mini-exhibition is a selection of materials from the museum’s collections, showcasing many different kinds of wedding celebrations.\n\nHotel and Restaurant Museum\n\n2.6.-27.9.2026\n\nTue-Fri 11.00-19.00\n\nSat-Sun 11.00-18.00\n\nAdmission fee 0-16€","df":"Hotelli- ja ravintolamuseon kesän pienoisnäyttelyssä on esillä valikoima museon kokoelmien monenlaisista hääjuhlista kertovista aineistoista. \n\nValokuvat, ohjelmat ja ruokalistat kertovat, miten avioliiton satamaan astumista on juhlistettu eri aikoina. \n\nNäyttely valottaa sitä, miten häiden ruoka- ja juomatarjoilu on aikojen saatossa muuttunut ja minkälaisia perinteitä eri aikoina on vallinnut. Näyttelyssä selviää esimerkiksi, mikä oli morsiuspuuro tai krokaani.\n\nHäitä on ollut hyvin erikokoisia ja ruokatarjoilujen laajuus on vaihdellut paljon kahvihäistä useamman päivän kestäneisiin pitoihin, joissa ruokaa oli tarjolla kellon ympäri. \n\nNäyttelyssä pääset tutustumaan muun muassa häiden ruokalistoihin 1800-luvun lopulta 2010-luvulle.\n\nHotelli- ja ravintolamuseo\n\n2.6.-27.9.2026\n\nTi-pe 11.00-19.00\n\nLa-su 11.00-18.00\n\nSisäänpääsy 0-16€","c":"Visual arts","cs":["weddings","food","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/2_21.jpg.jpg","u":"https://hotellijaravintolamuseo.fi/nayttelyt/nayttely-haiden-historiasta/","ue":"https://hotellijaravintolamuseo.fi/nayttelyt/nayttely-haiden-historiasta/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp4xzvina","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"ea7018670975e1cf.webp"},{"src":"le","eid":"helsinki:agpg4rjdji","t":"Gabriella Presnal: Trajectories","te":"Gabriella Presnal: Trajectories","v":"MUU Ikkuna","ve":"MUU Window","a":"Välimerenkatu 15A","la":60.15863,"ln":24.91387,"s":720,"e":1200,"d":"Trajectories explores weaving as queering spatiality. The praxis takes broken cabling and uses self-taught basket weaving techniques to transform a two-dimensional landscape into three-dimensional places. \n\nDeleuze and Guattari refer to weaving as the most striated - or controlled/measured - form of “nomad art” as there is no space to aerate within the confines of a tightly woven square. As described in A Thousand Plateaus (1980), nomad art applies the characteristics of land and space to textile formats. \n\nThe sculptures aim to reclaim what is described as a striated and transform it into something smooth or nomadic where it can be permeated, creating cracks where spatial tensions emerge. The materials address a feeling of artificiality in relation to cultural identity as well as an interdependence between digital places, cultural heritage, queerness, and community. \n\nTrajectories refers to nomadic trajectories described by Delueze and Guattari where vectors, such as hurricanes, travel across striated or smooth planes. The works are then observing blurred lines between striated and smooth spatialities, the cracks within them, as well as the vectors that travel through them. \n\nMUU Window is a new space for contemporary art in Jätkäsaari, Helsinki, located at street level in the new student housing complex run by the Varsinaissuomalainen osakunta Student Housing Foundation. The ","df":"Trajectories-teoksessa kutomista tarkastellaan queer-tilallisuuden näkökulmasta.\n\nGabriella Presnal käyttää rikkoutuneita sähköjohtoja ja hyödyntää itse opittuja korinpunonta tekniikoita muuttaakseen kaksiulotteisen maiseman kolmiulotteisiksi paikoiksi. \n\nDeleuze ja Guattari kutsuvat kutomista juovikkaimmaksi – tai kontrolloiduimmaksi/mitatuimmaksi – \"nomaditaiteen\" muodoksi, sillä tiiviisti kudotun neliön rajoissa ei ole tilaa hengittää.\n\nKuten teoksessa A Thousand Plateaus (1980) kuvataan, nomadi taide soveltaa maan ja tilan ominaisuuksia tekstiiliformaatteihin. Veistokset pyrkivät palauttamaan juovikkaaksi kuvatun ja muuttamaan sen joksikin sileäksi tai nomadiseksi, jossa se voi läpäistä, luoden halkeamia, joissa syntyy tilallisia jännitteitä. \n\nMUU ikkuna Helsingin Jätkäsaaressa on uusi tila nykytaiteen esittämiseen. Tila sijaitsee Jätkäsaareen valmistuneessa Helsingin Varsinaissuomalaisen Ylioppilashuonesäätiön opiskelijasuntolan katutasossa. Talon avajaisia vietettiin syyskuussa 2024 ja MUUn näyttelytoiminta käynnistyi lokakuussa 2024.\n\nAvajaiset 4.6.2026 klo 17.00-18.00 ikkunanäyttelytilassa Välimerenkadun ja Messitytönkujan kulmassa.\n\nMUU Ikkuna\n\n4.6.-30.8.2026\n\nAvoinna 24h\n\nVapaa pääsy","c":"Visual arts","cs":["fine arts","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/MYHELSINKI_oxmTIe4.jpg","u":"https://www.muu.fi/fi/kaikkea-muuta/muu-ikkuna/gabriella-presnal-trajectories/","ue":"https://www.muu.fi/muu-and-more/muu-window/gabriella-presnal-trajectories/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpg4rjdji","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"91ce3c7d7d5fd7ec.webp"},{"src":"le","eid":"helsinki:agphqzbcza","t":"Meilahden taidepäivystys - Stogiksen pitkä vaihtuva kesänäyttely","te":"Meilahden taidepäivystys - Stogis summer exhibition","v":"Meilahden Tilajakamo","ve":"Meilahden Tilajakamo","a":"Tukholmankatu 10","la":60.19119,"ln":24.9021,"s":720,"e":1200,"d":"Small lobby gallery Stogis' first summer exhibition invites the viewer to become part of perception, presence, and landscape. The artists in the exhibition each respond to the theme of nature in their own voice. A range of perspectives, all united by a shared sense that the boundary between the self and the external world is thinner than one might expect.\n\nThe opening of the exhibition takes place on June 5, at 17.00-20.00. \n\nStogis - Small lobby gallery, in Meilahden tilajakamo\n\n5.6.-6.9.2026\n\nFri-Sun 13.00-18.00\n\nFree entry","df":"Stogiksen ensimmäinen kesänäyttely kutsuu katsojan osaksi havaintoa, läsnäoloa ja maisemaa. Näyttelyn taiteilijat vastaavat luontoteemaan jokainen omalla äänellään. Monta näkemystä, joita kaikkia kuitenkin yhdistää tunne siitä, että raja itsen ja ulkopuolisen välillä on ohuempi kuin uskoisi.\n\nAvajaisia vietetään perjantaina 5.6.2026 kello 17-20. Lämpimästi tervetuloa tapaamaan taiteilijoita ja kokemaan vaihtuvan kesänäyttelyn ensimmäinen näyttely! Tarjolla myös sointukylpykokemus. \n\nGalleria on avoinna pe-su klo 13-18 ja löytyy Meilahden tilajakamolta osoitteesta Tukholmankatu 10, 00290 Helsinki. Vapaa pääsy.\n\nVuonna 2013 perustettu Tilajakamo on osuuskuntamuotoinen työtilayhteisö, jolla on vuokratiloja myös alkuperäisessä Lapinlahden sairaalassa ja Vuosaaressa. Meilahdessa sijaitsevan vanhan sairaanhoito-oppilaitoksen seitsemän kerrosta keräävät suojiinsa laajasti eri luovien alojen ammattilaisia. \n\nStogis - pieni aulagalleria, Meilahden tilajakamo\n\n5.6.-6.9.2026\n\nPe-su 13.00-18.00\n\nVapaa pääsy","c":"Visual arts","cs":["sculptures (works of art)","fine arts","exhibitions","painting (visual arts)","modern art"],"img":"https://api.hel.fi/linkedevents/media/images/Juliste_stogiksenkesa_A3_RGB_highres.png","u":"https://www.instagram.com/stogis_galleria/","ue":"https://www.instagram.com/stogis_galleria/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agphqzbcza","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"25f619b1dbb83769.webp"},{"src":"le","eid":"helsinki:agocgpvuqq","t":"Aalto Design - Hyvinvoinnin muodot","te":"Aalto Design - Shapes of Wellbeing","v":"Arkkitehtuuri- ja designmuseo","ve":"Architecture & Design Museum Helsinki","a":"Korkeavuorenkatu 23","la":60.16312,"ln":24.9466,"s":720,"e":1200,"d":"The exhibition invites visitors to explore Alvar, Aino and Elissa Aalto’s architecture and design from the perspective of wellbeing. \n\nThe exhibition highlights wellbeing as the Aaltos’ major contribution to Western architectural modernism and examines how their work and philosophy approach it as a balance between people, nature, the built environment, and materials. \n\nIt connects the Aaltos’ idea of holistic wellbeing with contemporary thinking and the growing desire to understand wellbeing as extending beyond the individual to concern the whole planet.  \n\nThe exhibition brings together a diverse dialogue of presentation methods and materials, including drawings and scale models, furniture, glass objects and material experiments, as well as artworks. The exhibition also features rarely displayed items from the museum’s collections.  \n\nAmong other works, the exhibition includes the multi-channel video installation Other Actors (2025) by London-based artist and researcher  Ilona Sagar. \n\nThe Aalto Lounge offers a calm space for rest and reflection and invites visitors to explore how being in a space affects their body and mind in the presence of authentic Aalto objects.\n\nArchitecture and Design Museum\n\n5.6.2026-6.1.2027\n\nAdmission fee 0-23€\n\nFurther information about the exhibition and public program  will be announced at a later date.","df":"Arkkitehtuuri- ja designmuseon näyttely kutsuu tarkastelemaan Alvar, Aino ja Elissa Aallon perintöä hyvinvoinnin näkökulmasta.\n\nNäyttely tarkastelee Aaltojen työn ja filosofian tapaa lähestyä hyvinvointia ihmisen, luonnon, rakennetun ympäristön ja materiaalien välisenä tasapainona. Se nivoo Aaltojen kokonaisvaltaisen hyvinvoinnin ajatuksen nykyiseen käsitykseen ja haluun ajatella hyvinvointia yksilöä laajempana, koko maapalloa koskevana kysymyksenä.\n\nAalto Design -näyttely koostuu monimuotoisesta esitystapojen ja aineistojen, kuten piirustusten ja pienoismallien, huonekalujen, lasiesineiden ja materiaalikokeilujen sekä taideteosten vuoropuhelusta. Mukana on myös harvoin esillä olleita esineitä Arkkitehtuuri- ja designmuseon kokoelmista.\n\nNäyttelyssä nähdään muun muassa Lontoossa asuvan taiteilija-tutkija Ilona Sagarin monikanavainen Other Actors -videoteos (2025), joka tarkastelee kehon ja rakennuksen sekä terveyden ja arkkitehtuurin välisiä yhteyksiä Aaltojen suunnittelemassa Paimion parantolassa.\n\nNäyttelyarkkitehtuurista vastanneen Linda Bergrothin suunnittelema Aalto-lounge tarjoaa puolestaan rauhallisen paikan oleskeluun ja kutsuu tunnustelemaan tilassa olemisen vaikutusta omaan kehoon ja mieleen autenttisten Aalto-esineiden äärellä.\n\nArkkitehtuuri- ja designmuseo\n\n5.6.2026-6.1.2027\n\nSisäänpääsy 0-23€\n\nLisätietoja näyttelystä ja ohjelmistosta julkaistaan myöhemmin.","c":"Visual arts","cs":["Design","well-being","exhibitions","architecture"],"img":"https://api.hel.fi/linkedevents/media/images/05_Aalto_Design_Shapes_of_Wellbeing_2026_Architecture__Design_Museum_Helsink_photo_Paavo_Lehtonen.jpg","u":"https://admuseo.fi/nayttely/aalto-design-hyvinvoinnin-muodot/","ue":"https://admuseo.fi/en/exhibition/aalto-design-shapes-of-wellbeing/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agocgpvuqq","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"26e8e759fd429dfb.webp"},{"src":"le","eid":"helsinki:agpig5euma","t":"LEGO® Jurassic World: The Exhibition","te":"LEGO® Jurassic World: The Exhibition","v":"Talttakuja 6, Helsinki","ve":"Talttakuja 6, Helsinki","a":"Talttakuja 6","la":60.24345,"ln":25.02273,"s":720,"e":1200,"d":"LEGO® Jurassic World: The Exhibition takes visitors into the world of Jurassic World, where the adventure familiar from the films is brought to life with more than 6 million LEGO bricks. Walk through the iconic Jurassic World gates, explore the setting of a mysterious laboratory, and encounter impressive LEGO dinosaur models, including triceratops, velociraptors and the mighty T. rex.\n\nThis visual experience for the whole family combines environments familiar from the films, impressive LEGO models and hands-on LEGO brick building. Visitors can take part in dinosaur-themed building activities, mystery mosaics, island building and creating their own hybrid dinosaurs. A total of 2.5 million LEGO bricks will be available for building throughout the exhibition.\n\nCreated by LEGO Certified Professional and LEGO Masters Australia judge Ryan “Brickman” McNaught and his internationally acclaimed team, LEGO Jurassic World: The Exhibition has already attracted more than 1.2 million visitors worldwide. Arriving in Helsinki directly from Paris, this immersive exhibition experience for the whole family will now be seen in Finland for the first time.\n\nMalmi Ice Hall\n\n6.6.-6.9.2026\n\nTickets, Lippu.fi: 20,90 €/adults, 14,90 €/children (3-17 years), 16,90 €/discount groups, 63,88 €/family ticket (4 persons, max. 2 adults), 179 €/birthday package (10 people)\n\nThe daily opening hours and available ","df":"LEGO® Jurassic World: The Exhibition vie koko perheen keskelle Jurassic Worldin maailmaa, jossa elokuvista tuttu seikkailu herää eloon yli 6 miljoonan LEGO®-palikan avulla. Kulje ikonisten Jurassic World -porttien läpi, tutustu laboratorion kulisseihin ja kohtaa vaikuttavia LEGO®-dinosauruksia, kuten triceratops, velociraptorit ja mahtava T. rex.\n\nNäyttelyssä ei vain katsella — täällä myös rakennetaan. Kävijät pääsevät mukaan dinosaurusaiheisiin rakennustehtäviin, mysteerimosaiikkiin, oman Jurassic World -saaren rakentamiseen ja hybrididinosaurusten luomiseen. Luvassa on koko perheen seikkailu, jossa LEGO®-rakentelu, dinosaurukset ja Jurassic World yhdistyvät elämykseksi, joka pitää kokea paikan päällä.\n\nNäyttelyelämyksen ovat luoneet sertifioitu LEGO®-ammattilainen Ryan “Brickman” McNaught sekä hänen kansainvälisesti arvostettu tiiminsä. Jo yli 1,2 miljoonaa kävijää ympäri maailman kerännyt LEGO® Jurassic World: The Exhibition saapuu Helsinkiin suoraan Pariisista. Tällainen kokemus on täysin uutta Suomessa ja tässä mittakaavassa ennenkokematonta.\n\nMalmin jäähalli\n\n6.6.-6.9.2026\n\nLiput, Lippu.fi: 20,90 €/aikuinen, 14,90 €/lapsi (3-17v), 16,90 €/alennusryhmät, 63,88 €/perhelippu (4 hlöä, max. 2 aikuista), 179 €/synttäripaketti (10 hlö)\n\nPäiväkohtaiset aukioloajat ja vapaat vierailuajat ovat nähtävissä lipunmyyntisivulla.","c":"Visual arts","cs":["exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/JLW116_Lippufi_702x408-2.jpg","u":"https://legojurassicworldtheexhibition.fi/","ue":"https://legojurassicworldtheexhibition.fi/en/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpig5euma","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"0af8e256871ba729.webp"},{"src":"le","eid":"kulke:68446","t":"Luontosuhteita","te":"Luontosuhteita (‘Relations to nature')","v":"Stoa","ve":"Cultural Centre Stoa","a":"Turunlinnantie 1","la":60.2121,"ln":25.07989,"s":720,"e":1200,"d":"This multi-arts exhibition will explore the forest and our relationship with nature, and encourages visitors to reflect on emotions, cycles and personal involvement in nature conservation.\n\nThe Stoa downstairs gallery will be filled with a multi-arts entity that explores the forest, the cycles of nature and related emotions ranging from comfort to despair. The Luontosuhteita (‘Relations to nature’) exhibition invites you to reflect on your own relationship with nature and its conservation.\n\nThe exhibition will feature paintings, photography, dance, sound art, sculpture and installations, as well as participatory workshops. The group's roots are partly in nature activism in Stansvik, and at the heart of the exhibition is a dialogue between nature and human agency.\n\nArtists: \nOlli Kaukonen Lindholm\nLauri Lähteenmäki\nValde Paananen\nMinttu Pyykkönen\nEmiel Riiko\n\nAt Stoa, the exhibition will be accompanied by workshops, where participants from all backgrounds and age groups are welcome. You are warmly welcome as you are. Details of the workshops will be published later.\n\nThe exhibition and events are part of the environmental programme of the City of Helsinki Cultural Services. Read more: https://www.stoa.fi/fi/esittely#Ymp%C3%A4rist%C3%B6vastuu\n\nFree entry","df":"Monitaiteinen näyttely pureutuu metsään ja luontosuhteeseen, ja herättää pohtimaan tunteita, kiertokulkuja ja omaa toimijuutta luonnon suojelussa.\n\nStoan alakerran galleria täyttyy monitaiteisesta kokonaisuudesta, joka tarkastelee metsää, luonnon kiertokulkuja ja niihin liittyviä tunteita lohdusta epätoivoon. Luontosuhteita-näyttely kutsuu pohtimaan omaa suhdetta luontoon ja sen suojeluun.\n\nEsillä on maalausta, valokuvaa, tanssia, äänitaidetta, kuvanveistoa ja installaatioita sekä osallistavia työpajoja. Taiteilijaryhmän juuret ovat osin Stansvikin luontoaktivismissa, ja näyttelyn ytimessä on dialogi luonnon ja ihmisen toimijuuden välillä.\n\nTaiteilijat: \nKATOAVA-kollektiivi\nOlli Kaukonen Lindholm\nLauri Lähteenmäki\nMinttu Pyykkönen\nEmiel Riiko\n\nNäyttelyn avajaisia vietetään Helsinki-päivänä pe 12.6. klo 17-19. Lämpimästi tervetuloa!\n\nNäyttelyn oheisohjelmana Stoassa järjestetään työpajoja, joihin toivotaan yleisöä eri taustoista ja ikäryhmistä. Olet lämpimästi tervetullut sellaisena kuin olet. Työpajat julkaistaan myöhemmin.\n\nNäyttely ja tapahtumat ovat osa Helsingin kaupungin kulttuuripalveluiden ympäristöohjelmaa.\n\nLue lisää: https://www.stoa.fi/fi/esittely#Ymp%C3%A4rist%C3%B6vastuu","c":"Visual arts","cs":["Stoa","Näyttelyt","Suomi","Ruotsi","Englanti","Muut kulttuuritapahtumat (monitaide)"],"img":"http://www.stoa.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_788820.jpg","u":"http://www.stoa.fi/fi/tapahtumat/event/F2E50462006DF628DE768041D5EE7228/Luontosuhteita","ue":"http://www.stoa.fi/en/events/event/F2E50462006DF628DE768041D5EE7228/Luontosuhteita_Relations_to_nature_","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:68446","qe":"","qf":"","qz":"","vp":0,"cr":"" //www.kanneltalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_792344.jpg","u":"http://www.kanneltalo.fi/fi/tapahtumat/event/F127DD6C28354BB53FD295938987DECD/Mun_Kantsu","ue":"http://www.kanneltalo.fi/en/events/event/F127DD6C28354BB53FD295938987DECD/Mun_Kantsu","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:68945","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"c73cdc605ffd859b.webp"},{"src":"le","eid":"kulke:69255","t":"Elonkirjon kaupunki: Vaihtoehtokaavoja elonkirjon puolesta","te":"Elonkirjon kaupunki: Vaihtoehtokaavoja elonkirjon puolesta","v":"Stoa","ve":"Cultural Centre Stoa","a":"Turunlinnantie 1","la":60.2121,"ln":25.07989,"s":720,"e":1200,"d":"Elonkirjon kaupunki -hanke tuottaa kaupunkien metsää tuhoavien suunnitelmien rinnalle vaihtoehtoja, joiden avulla kaupunkimetsät säästyvät rakentamiselta.\n\nKaupungit ja kunnat kaavoittavat ympäri Suomen uusia asuin- ja teollisuusalueita sekä esimerkiksi datakeskuksia luonnon kustannuksella, vaikka lähiluonnon merkitys ihmisen hyvinvoinnille, luonnon monimuotoisuudelle ja ilmastonmuutokseen sopeutumiselle on tutkitusti merkittävä.\n\nMonet kaupunkien metsäalueille rakentamista osoittavat kaavat perustuvat vanhentuneisiin lähtökohtiin, eivätkä riittävissä määrin huomioi metsän merkitystä ihmisen ja elonkirjon elinolosuhteiden turvaajana ilmasto- ja ympäristökriisien ajassa. Suuri osa Suomen viimeisistä luonnontilaisisen kaltaisista metsistä sijaitsee kaupungeissa, koska niitä on harvemmin valjastettu metsätalouden käyttöön.\n\nOlemme toteuttaneet kaavaehdotuksia Kuopion Pieneen Neulamäkeen, Helsingin Stansvikiin ja Kumpulaan sekä Lehtivuoreen Lempäälässä – jokainen niistä tiiviissä yhteistyössä paikallisten kanssa. Huolella laadittujen vaihtoehtokaavojen tarkoituksena on vahvistaa asukkaiden toimijuutta kaupunkisuunnittelussa ja suojella lähimetsiä: ne ovat työkalu lähiluonnon puolustamiseen. Kustakin kaavaehdotuksesta järjestetään tiedotustilaisuuksia ja kaavakävelyitä, joissa asukkaat, päättäjät ja suunnittelijat kohtaavat.\n\nElonkirjon kaupungin muodostavat arkkitehdit Heljä Niemin","df":"Elonkirjon kaupunki -hanke tuottaa kaupunkien metsää tuhoavien suunnitelmien rinnalle vaihtoehtoja, joiden avulla kaupunkimetsät säästyvät rakentamiselta.\n\nKaupungit ja kunnat kaavoittavat ympäri Suomen uusia asuin- ja teollisuusalueita sekä esimerkiksi datakeskuksia luonnon kustannuksella, vaikka lähiluonnon merkitys ihmisen hyvinvoinnille, luonnon monimuotoisuudelle ja ilmastonmuutokseen sopeutumiselle on tutkitusti merkittävä.\n\nMonet kaupunkien metsäalueille rakentamista osoittavat kaavat perustuvat vanhentuneisiin lähtökohtiin, eivätkä riittävissä määrin huomioi metsän merkitystä ihmisen ja elonkirjon elinolosuhteiden turvaajana ilmasto- ja ympäristökriisien ajassa. Suuri osa Suomen viimeisistä luonnontilaisisen kaltaisista metsistä sijaitsee kaupungeissa, koska niitä on harvemmin valjastettu metsätalouden käyttöön.\n\nOlemme toteuttaneet kaavaehdotuksia Kuopion Pieneen Neulamäkeen, Helsingin Stansvikiin ja Kumpulaan sekä Lehtivuoreen Lempäälässä – jokainen niistä tiiviissä yhteistyössä paikallisten kanssa. Huolella laadittujen vaihtoehtokaavojen tarkoituksena on vahvistaa asukkaiden toimijuutta kaupunkisuunnittelussa ja suojella lähimetsiä: ne ovat työkalu lähiluonnon puolustamiseen. Kustakin kaavaehdotuksesta järjestetään tiedotustilaisuuksia ja kaavakävelyitä, joissa asukkaat, päättäjät ja suunnittelijat kohtaavat.\n\nElonkirjon kaupungin muodostavat arkkitehdit Heljä Niemin","c":"Visual arts","cs":["Stoa","Näyttelyt","Suomi","Ruotsi","Englanti","online exhibitions"],"img":"http://www.stoa.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_793585.jpg","u":"http://www.stoa.fi/fi/tapahtumat/event/0C2A94B263D2D32105C25E071D706846/Elonkirjon_kaupunki_Vaihtoehtokaavoja_elonkirjon_puolesta_","ue":"http://www.stoa.fi/en/events/event/0C2A94B263D2D32105C25E071D706846/Elonkirjon_kaupun Kesällä 2026 Kivinokassa nähdään ja kuullaan ikoninen laulunäytelmä Myrskyluodon Maija.\n\nAnni Blomqvistin romaanisarjaan perustuva tunteellinen tarina on monille tuttu Åke Lindmanin tv-tulkinnasta 70-luvulta, vuoden 2024 tuoreesta elokuvaversiosta tai ehkä Lasse Mårtensonin koskettavan kappaleen kautta. \n\nJussi Helmisen kirjoittama näyttämösovitus saa estradin osuvasti merenläheisessä Kivinokassa pitkän linjan musiikkiteatteriohjaaja Kari Kinnaslammen luotsaamana. Ainutlaatuisiin tunnelmiin johdattelee Matti Puurtisen sykähdyttävät sävellykset nelihenkisen orkesterin voimin Mikko Mattilan johtamana.\n\nPäärooleja tähdittävät ilmiömäisesti Maijana Heidi Kyrö ja vanhana Maijana Inga Sulin sekä Jannena Juho Taskinen. Muissa rooleissa nähdään mittava yli 20 näyttelijän kaarti. Koreografioista vastaa Anneli Rautiainen, puvustuksesta Mona Aho ja lavastuksesta Maija Michelsson sekä Artturi Iivarinen.\n\nTuttu tarina sijoittuu 1800-luvun loppupuolelle Ahvenanmaan karuun ulkosaaristoon. Elämä ankaran luonnon helmassa vaatii sitkeyttä ja sinnikkyyttä vastoinkäymisestä toiseen. Meren hakkaamille kallioille piirtyy myrskyisä kuvaelma koettelemuksia ja lohduttomuutta, mutta myös autuutta, onnea ja rakkautta.\n\nKivinokan kesäteatteri\n\n24.6.-30.8.2026\n\nEnsi-ilta 25.6.2026\n\nLiput 26,60-44,10€ Lippupisteestä, tiedustelut ryhmälipuista +358 50 3619464, min 20 henk.\n\nEsitys on suomenkielinen, ikäsuosi","df":"Kesällä 2026 Kivinokassa nähdään ja kuullaan ikoninen laulunäytelmä Myrskyluodon Maija.\n\nAnni Blomqvistin romaanisarjaan perustuva tunteellinen tarina on monille tuttu Åke Lindmanin tv-tulkinnasta 70-luvulta, vuoden 2024 tuoreesta elokuvaversiosta tai ehkä Lasse Mårtensonin koskettavan kappaleen kautta. \n\nJussi Helmisen kirjoittama näyttämösovitus saa estradin osuvasti merenläheisessä Kivinokassa pitkän linjan musiikkiteatteriohjaaja Kari Kinnaslammen luotsaamana. Ainutlaatuisiin tunnelmiin johdattelee Matti Puurtisen sykähdyttävät sävellykset nelihenkisen orkesterin voimin Mikko Mattilan johtamana.\n\nPäärooleja tähdittävät ilmiömäisesti Maijana Heidi Kyrö ja vanhana Maijana Inga Sulin sekä Jannena Juho Taskinen. Muissa rooleissa nähdään mittava yli 20 näyttelijän kaarti. Koreografioista vastaa Anneli Rautiainen, puvustuksesta Mona Aho ja lavastuksesta Maija Michelsson sekä Artturi Iivarinen.\n\nTuttu tarina sijoittuu 1800-luvun loppupuolelle Ahvenanmaan karuun ulkosaaristoon. Elämä ankaran luonnon helmassa vaatii sitkeyttä ja sinnikkyyttä vastoinkäymisestä toiseen. Meren hakkaamille kallioille piirtyy myrskyisä kuvaelma koettelemuksia ja lohduttomuutta, mutta myös autuutta, onnea ja rakkautta.\n\nKivinokan kesäteatteri\n\n24.6.-30.8.2026\n\nEnsi-ilta 25.6.2026\n\nLiput 26,60-44,10€ Lippupisteestä, tiedustelut ryhmälipuista +358 50 3619464, min 20 henk.\n\nEsitys on suomenkielinen, ikäsuosi","c":"Theatre","cs":["summer theatres","music","theatre (art forms)","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/IMG_3679_4KXRNYM.PNG","u":"https://www.lippu.fi/artist/kivinokan-kesateatteri/","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agott33biq","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agott33biq","qe":"","qf":"Kesäteatteria ulkona Kivinokassa -- katso taivaalle ennen kuin lupaat mitään.","qz":"Kivinokka 的露天夏季剧场——答应去之前先看看天。","vp":0,"cr":"","th":"7857287a225719b1.webp"},{"src":"le","eid":"kulke:68243","t":"Made in Vuosaari - Vuotalon pihalla","te":"Made in Vuosaari - Vuotalon pihalla","v":"Vuotalo","ve":"Vuosaari House","a":"Mosaiikkitori 2","la":60.20885,"ln":25.14335,"s":720,"e":1200,"d":"We bring much of our goods, equipment, clothes and everything that surrounds us in our daily lives in containers by sea.\n\nVuosaari Harbour and the sea that is so close to us are part of the global movement of goods.\n\nIn the courtyard of Cultural Centre Vuotalo, an installation that is the same dimensions as a shipping container will be built, with stacks of tiles depicting the waves of the seascape, as if they were the cargo of a ship, the sea cubed into merchandise.\n\nThe installation seeks to create an airy and light atmosphere, a sense of the sea and, on the other hand, a sense of wistfulness and sadness in a time of ecological crisis.\n\nMade in Vuosaari is based on Anne Roininen's ongoing series of ‘Made in’ works, which have been realised with slightly different emphases in Ylikiiminki in Oulu, and Töölö and Kruunuvuorenranta in Helsinki.\n\nYou can read more about them here: https://kruunuvuorenranta.cargo.site/\n\nThe focus is on the global commodity production machine and the processing of local identity.\n\nAnne Roininen is a sculptor whose works are often site-specific and process-based. Encounters with people are an important part of Roininen's work, and the works are often politically charged.\n\nRead more: https://anneroininen.com/","df":"Merten kautta, konteissa, tuodaan suuri osa tavaroistamme, laitteista, vaatteista ja kaikesta, mikä meitä arjessa ympäröi.\n\nLäheinen meri ja Vuosaaren satama ovat osa globaalia tavarantuotantoliikennettä.\n\nVuotalon pihalle rakentuu merikontin rungon mittoja mukaileva installaatio, jossa on pinoissa merimaiseman aallokkoa kuvaavat laatat, ikään kuin ne olisivat laivan lastina, merta kuutioituna kauppatavaraksi.\n\nTunnelma, jota installaatio tavoittelee, on hengittävä ja kevyt, meren tunnun ja toisaalta haikeuden ja surun tunne ekologisen kriisin aikana.\n\nMade in Vuosaari -kokonaisuuden taustalla on Anne Roinisen meneillään oleva Made in -teosten sarja, joka on toteutettu Ylikiimingissä Oulussa sekä Töölössä ja Kruunuvuorenrannassa, hieman eri painotuksin.\n\nNiistä voi lukea lisää: https://kruunuvuorenranta.cargo.site/\n\nKeskiössä on globaali tavarantuotantokoneisto ja paikallisidentiteetin käsittely.\n\nAnne Roininen on kuvanveistäjä, joka työskentelee usein paikkasidonnaisesti ja prosessipohjaisesti. Kohtaamiset ihmisten kanssa ovat tärkeä osa Roinisen työskentelyä, ja teosten taustalla on usein poliittinenkin lataus.\n\nLue lisää: https://anneroininen.com/","c":"Visual arts","cs":["Vuotalo","Näyttelyt","Suomi","Ruotsi","Englanti","online exhibitions"],"img":"http://www.vuotalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_786462.jpg","u":"http://www.vuotalo.fi/fi/tapahtumat/event/2E247DCF3F8460563409052C1226D72F/Made_in_Vuosaari","ue":"http://www.vuotalo.fi/en/events/event/2E247DCF3F8460563409052C1226D72F/Made_in_Vuosaari","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:68243","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"fadac4705501b670.webp"},{"src":"le","eid":"helsinki:agpvlmhjwu","t":"Eeva Halme Art: Helsinki-aiheinen taidenäyttely","te":"Eeva Halme Art: Helsinki Exhibition","v":"Robert's Coffee Bulevardi Bubbles Corner","ve":"Robert's Coffee Bulevardi Bubbles Corner","a":"Bulevardi 1","la":60.16655,"ln":24.94289,"s":720,"e":1200,"d":"Enjoy Suomenlinna, Kaivopuisto, Uunisaari, Esplanade and the statue of Havis Amanda all at the same time while having a coffee or a glass of bubbling. In the corner of Mannerheimintie and Bulevardi. \n\nThere you´ll find a cozy Art Cafe Roberts Coffee presenting a solo exhibition of a Helsinki based artist Eeva Halme.\n\nRoberts Coffee, Bulevardi 1\n\n1.7.-30.8.2026\n\nFree entry, open daily\n\nJust a step aside in Hotel Marski Art Gallery, you´ll find another exhibition by Eeva Halme Art. Also free entry, open daily.","df":"Kahvilassa olevassa Eeva Halmeen taidenäyttelyssä on esillä 8 suurta maalausta Helsingistä. Suomenlinna, Pihlajasaari, Havis Amanda, Kaivopuisto...katso kaikki nähtävyydet nauttimalla samalla vaikka kuppi kahvia. \n\nRoberts Coffee, Bulevardi 1\n\n1.7.-30.8.2026\n\nVapaa pääsy ja auki joka päivä\n\nSamaan aikaan myös Marskin Galleriassa Eeva Halmeen taidenäyttely. Sisäänkäynti hotellin pääovista ja alakertaan. Vapaa pääsy, auki joka päivä.","c":"Visual arts","cs":["fine arts","art","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/EHArt_yhteiskuva_MB.jpg","u":"https://eevahalmeart.fi/","ue":"https://eevahalmeart.fi/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpvlmhjwu","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"e2afda40ae6f7d50.webp"},{"src":"le","eid":"helsinki:agppuqwwua","t":"Suomenlinnan opastettu yleisökierros englanniksi","te":"Guided Walking Tour at Suomenlinna in English","v":"Suomenlinna-museo","ve":"Suomenlinna Museum","a":"Suomenlinna C 74","la":60.14521,"ln":24.98776,"s":720,"e":1200,"d":"The tour introduces you to the famous fortress and offers interesting perspectives on the history of Finland and Northern Europe.\n\nThe construction works of one of the biggest Nordic fortresses, Suomenlinna, begun in 1748. The best way to get to know the fascinating story behind the World Heritage Site of UNESCO, Suomenlinna fortress, is to join a guided tour.\n\nDuring the guided walking tour an authorized Suomenlinna-guide tells about the 270 years of eventful history of Suomenlinna under the rule of three different states as well as the life on the islands today. \n\nThe guide will take you to the most important sights of the fortress, such as the Great Courtyard and the Dry Dock, which in its days was among the largest in the world.\n\nDeparture: Suomenlinna Museum\n\n1.6. - 31.8.2026: every day at 10:30, 12:30 and 14:30\n\nAdmission fee 6-16€, duration 1 h\n\nGuidance in English","df":"Linnoitusalueella toteutettavalla englanninkielisellä kävelykierroksella kuullaan linnoituksen mielenkiintoisesta historiasta ja nykypäivästä. \n\nVuonna 1748 käynnistyivät pikkuruisen Helsingin kaupungin edustalla työt, joista alkoi Viaporin historia. Tähän jo 270 vuotta jatkuneeseen tarinaan tutustuu parhaiten opastetulla kierroksella. Kuudelle saarelle rakennettu bastionilinnoitus palveli Ruotsin Saaristolaivaston tukikohtana, jonka tarpeisiin rakennettiin myös suuri kuivatelakka. Ruotsin ajan lopulla alkuvuosien karusta rakennustyömaasta oli jo kuoriutunut yksi tuolloisen Suomen alueen suurimpia ja vilkkaimpia asutuskeskittymiä.\n\nLinnoituksen venäläinen kausi käynnistyi Suomen sodan aikana, aikalaisia kummastuttaneen ja kauan keskustelua ja kysymyksiä herättäneen linnoituksen antautumisen myötä vuonna 1808. Venäläinen kausi kesti 110 vuotta, ja jätti perinnöksi mm. lukuisia kasarmirakennuksia sekä linnoitussaarten lounaispuolelle rakennetut vallit pattereineen - kauppiaskorttelin kuuluisia sukuja ja Krimin sodan kokemuksia ja tarinoita unohtamatta.\n\nKierroksella tutustutaan päänähtävyyksiin kuten Suureen Linnanpihaan ja aikoinaan maailman suurimpaan kuivatelakkaan. Opastus sisältää myös ilmaisen sisäänpääsyn Ehrensvärd-museoon museon aukioloaikana.\n\nLähtöpaikka: Suomenlinna-museo\n\nKesällä 2026:\n\n1.6. - 31.8. päivittäin klo 10:30, 12:30 ja 14:30\n\nLiput 6-16€, kesto 1 h\n\nOpastu","c":"Dance","cs":["guidance","walking tours","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/Suomenlinna-kuninkaanportti.jpg","u":"https://suomenlinnatours.com/opastukset/","ue":"https://suomenlinnatours.com/en/guided-tours-at-suomenlinna/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agppuqwwua","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"1e4356af97bf6b72.webp"},{"src":"le","eid":"helsinki:agprga35oq","t":"Ailan ja Eilan akryyli- ja öljyväritöitä","te":"Ailan ja Eilan akryyli- ja öljyväritöitä","v":"Kampin palvelukeskus","ve":"Kamppi Service Centre","a":"Salomonkatu 21 B","la":60.16822,"ln":24.92685,"s":720,"e":1200,"d":"Ailan ja Eilan akryyli- ja öljyväritöitä 1.7.–31.8.\n\nPaikka: 1.kerroksen vitriinit","df":"Ailan ja Eilan akryyli- ja öljyväritöitä 1.7.–31.8.\n\nPaikka: 1.kerroksen vitriinit","c":"Visual arts","cs":["exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Pensseli o on nykytaidenäyttely, joka tutkii pohjoista identiteettiä, vuodenaikojen rytmiä ja luonnon muuttuvaa tunnelmaa viiden teeman kautta.\n\nNäyttelyssä suomalaiset nykytaiteilijat tulkitsevat viittä pohjoista vuodenaikaa Menzinon tunnusomaisille Rivoluzione Weekend Bag -laukuille luoduissa uniikeissa teoksissa. Jokainen teos yhdistää nykytaiteen, käsityötaidon ja muotoilun yhdeksi kokonaisuudeksi.\n\nNäyttely järjestetään Kalasataman Horisontin 22. kerroksessa, Suomen korkeimmassa toimistopilvenpiirtäjässä, yli 100 metrin korkeudessa Helsingin yläpuolella. Horisontti on Suomen korkein toimistorakennus.\n\nHorisontti, Hermannin rantatie 9, 22. krs\n\n1.8.-27.9.2026\n\nSisäänpääsy 5/8€","c":"Visual arts","cs":["Design","art","exhibitions","contemporary art"],"img":"https://api.hel.fi/linkedevents/media/images/NORDIC_FORMS_BY_MENZINO_2_OTX8Xjb.JPEG","u":"https://www.menzino.com/nordic-forms-exhibition-at-kalasataman-horisontti","ue":"https://www.menzino.com/nordic-forms-exhibition-at-kalasataman-horisontti","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp4f6mfzy","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"62f8ddf0166cf6b1.webp"},{"src":"le","eid":"helsinki:agp3qoezzm","t":"Taidenäyttely: Kerttu","te":"Taidenäyttely: Kerttu","v":"Kallion kirjasto","ve":"Kallio Library","a":"Viides linja 11","la":60.18372,"ln":24.95356,"s":720,"e":1200,"d":"Kertun (1v 8kk) canvas-maalauksia. \n\nHänen lempiasiansa maailmassa ovat pyöräily ja maalaaminen. Jokaisen taulun alanurkkassa on QR-koodi, josta pääsee katsomaan videon taulun maalausprosessista, videot ovat suomeksi ja englanniksi. \n\nViimeisimmän, eli -272-loppuisen taulun kohdalla hän on oppinut puhumaan ja osasi kertoa, että taulussa on hiiri ja isi. \n\n***\n\nKallion kirjasto \nViides linja 11\n09 310 850 53\n\nFacebook | Kallion kirjasto","df":"Kertun (1v 8kk) canvas-maalauksia. \n\nHänen lempiasiansa maailmassa ovat pyöräily ja maalaaminen. Jokaisen taulun alanurkkassa on QR-koodi, josta pääsee katsomaan videon taulun maalausprosessista, videot ovat suomeksi ja englanniksi. \n\nViimeisimmän, eli -272-loppuisen taulun kohdalla hän on oppinut puhumaan ja osasi kertoa, että taulussa on hiiri ja isi. \n\n***\n\nKallion kirjasto \nViides linja 11\n09 310 850 53\n\nFacebook | Kallion kirjasto","c":"Visual arts","cs":["fine arts","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/vintin_n%C3%A4yttely_elokuu.png","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agp3qoezzm","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agp3qoezzm","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp3qoezzm","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"746bfdea0dc1f9ba.webp"},{"src":"le","eid":"helsinki:agpw66o34a","t":"Anu Kangas: Vihreä vihellys","te":"Anu Kangas: Vihreä vihellys","v":"Rikhardinkadun kirjasto","ve":"Rikhardinkatu Library","a":"Rikhardinkatu 3","la":60.16634,"ln":24.94678,"s":720,"e":1200,"d":"Anu Kangas (anu_abstract) tuo esille viiden maalauksen sarjan, joka tutkii hetkellisyyttä ja keveyttä. Tässä näyttelyssä hetkellisyys muuttuu visuaaliseksi kokemukseksi.\n\nNäyttelyn teoksia hallitsee vihreä väri, joka toimii siltana luonnon, kasvun ja levon välillä. Se symboloi orgaanista liikettä, joka virtaa maalauksissa vapaasti mutta määrätietoisesti – aivan kuten ilmavirta muuttuu vihellykseksi.\n\nNäkymätön voima saa muodon \n\nKun tuuli puhaltaa vapaasti, se on hiljainen. Ääni syntyy vasta, kun ilma kohtaa puun oksan, neulasen tai kallionkielekkeen. Mitä kovempi tuuli on ja mitä tiheämmät metsän raot ovat, sitä nopeammin ilmapyörteet syntyvät. Tämä nopea värähtely luo korkean, viheltävän äänen. Paksummat puunrungot taas synnyttävät hitaampaa värähtelyä – matalampaa huminaa tai ulvontaa. Tämä näkymätön värähtely muuttuu vihellykseksi. Se on hetki, jossa puhdas energia saa muodon ja äänen.\n\nVastakohtien harmoniaa pa evaasta_ja_kesasta_2026","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:69624","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"fbb4873380385a4f.webp"},{"src":"le","eid":"helsinki:agp3oe4nrm","t":"Mervi Karhunen - Askeleita tuntemattomaan","te":"Mervi Karhunen - Askeleita tuntemattomaan","v":"Arabianrannan kirjasto","ve":"Arabianranta Library","a":"Hämeentie 135 A","la":60.20898,"ln":24.97678,"s":720,"e":1200,"d":"Arabianrannan kirjastossa esillä Mervi Karhusen taidenäyttely Askeleita tuntemattomaan 4.8.-30.9. 2026. \n\nNäyttelyni teokset ovat lähteneet liikkeelle maalaustekniikoiden kokeilusta. Olen työskennellyt nestemäisellä värillä ja pääosin ilman perinteisiä maalausvälineitä. \n\nTällainen lähestymistapa on auttanut minua vapautumaan suunnitellusta ja ennalta-arvattavasta lopputuloksesta ja vienyt minut tuntemattomalle, luovalle alueelle.\n\nMaalausprosessiin ja valmiisiin teoksiin on tullut yllätyksellisyyttä ja kiehtovuutta – välillä niin, että teoksen valmistuttua on ollut vaikeaa palauttaa mieleen, miten teos on syntynyt.\nToivon katsojankin voivan tavoittaa tällaista laatua teoksissani, pystyvän astumaan tälle alueelle kanssani.\n\nOlen valmistunut taidemaalariksi Kuvataideakatemiasta ja työskentelen Helsingissä kuvataiteilijana ja taideopettajana. Olen akateemisten taideopintojen jälkeen käynyt myös ekspressiivisen taideterapeutin koulutuksen, mikä on osaltaan vaikuttanut työskentelyyni.\n\nMuita keskeisiä vaikuttimia taiteellisessa työskentelyssäni ovat lapsuus kuvataiteen ympäröimänä, pitkät matkat Aasiaan, kiinnostus kielelliseen ilmaisuun sekä kiinnostus ihmisenä olemiseen ja kasvuun.\n\nNäyttely on järjestetty yhteistyössä Helsingin Taiteilijaseuran kanssa.\n\nMervi Karhunen: Steps into the Unknown\nArabianranta Library 4.8.-30.9.2026\n\nThe painting process for the works in my exhibition","df":"Arabianrannan kirjastossa esillä Mervi Karhusen taidenäyttely Askeleita tuntemattomaan 4.8.-30.9. 2026. \n\nNäyttelyni teokset ovat lähteneet liikkeelle maalaustekniikoiden kokeilusta. Olen työskennellyt nestemäisellä värillä ja pääosin ilman perinteisiä maalausvälineitä. \n\nTällainen lähestymistapa on auttanut minua vapautumaan suunnitellusta ja ennalta-arvattavasta lopputuloksesta ja vienyt minut tuntemattomalle, luovalle alueelle.\n\nMaalausprosessiin ja valmiisiin teoksiin on tullut yllätyksellisyyttä ja kiehtovuutta – välillä niin, että teoksen valmistuttua on ollut vaikeaa palauttaa mieleen, miten teos on syntynyt.\nToivon katsojankin voivan tavoittaa tällaista laatua teoksissani, pystyvän astumaan tälle alueelle kanssani.\n\nOlen valmistunut taidemaalariksi Kuvataideakatemiasta ja työskentelen Helsingissä kuvataiteilijana ja taideopettajana. Olen akateemisten taideopintojen jälkeen käynyt myös ekspressiivisen taideterapeutin koulutuksen, mikä on osaltaan vaikuttanut työskentelyyni.\n\nMuita keskeisiä vaikuttimia taiteellisessa työskentelyssäni ovat lapsuus kuvataiteen ympäröimänä, pitkät matkat Aasiaan, kiinnostus kielelliseen ilmaisuun sekä kiinnostus ihmisenä olemiseen ja kasvuun.\n\nNäyttely on järjestetty yhteistyössä Helsingin Taiteilijaseuran kanssa.\n\nMervi Karhunen: Steps into the Unknown\nArabianranta Library 4.8.-30.9.2026\n\nThe painting process for the works in my exhibition","c":"Visual arts","cs":["fine arts","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Askeleita_300_L%C3%A4mminpieni.jpg","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agp3oe4nrm","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agp3oe4nrm","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp3oe4nrm","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"6e07bdfab2022b16.webp"},{"src":"le","eid":"helsinki:agp4zmufgy","t":"The art of","te":"The art of","v":"Kohta","ve":"Kohta","a":"Työpajankatu 2 B, rakennus 7, 3. krs","la":60.18963,"ln":24.97177,"s":720,"e":1200,"d":"This group exhibition seeks to bring together visual art, architecture and design as an extended field. \n\nL’Esprit de L’Escalier is an international project set up in Helsinki’s Kulttuurisauna in 2012 to further the idea of publishing as a creative practice. \n\nWhen working under this label, translatable as ‘staircase wit’, its authors remain anonymous. Their contribution to The art of hinges on a new version of a display from the exhibition Unbuilt Helsinki at the Finnish Museum of Architecture in 2012. \n\nHenrietta Lehtonen trained as an architect and emerged on the international art scene with the ‘relational aesthetics’ wave of the mid-1990s. She revisits her hybrid installations from that period in Nest, which may be characterised as a personal ’memory palace’. \n\nHedy Leung has come to visual art through the practice of contemporary experimental ikebana. Her materials tend to be sourced around the venues where she realises her installations, which are constructed around an inaugural performance moment. \n\nEglė Ridikaitė uses a self-invented technique of spray painting through stencils. In recent years she has been making 1:1 representations of patterned tile floors from 19th and 20th-century buildings in Vilnius. \n\nKohta Taidehalli\n\n6.8.-4.10.2026\n\nTue-Fri 12.00-18.00\n\nSat-Sun 12.00-16.00\n\nFree entry","df":"Ryhmänäyttely tuo yhteen kuvataiteen, arkkitehtuurin ja muotoilun laaja-alaisia aiheita.\n\nL’Esprit de L’Escalier on Kulttuurisaunasta vuonna 2012 alkanut ja julkaisemista luovana projektina tutkiva kansainvälinen projekti. \n\nProjektin nimettöminä pysyttelevät tekijät asettavat esille version Arkkitehtuurimuseon Unbuilt Helsinki -näyttelyä varten vuonna 2012 suunnitellusta kokonaisuudesta. \n\nHenrietta Lehtonen on koulutukseltaan arkkitehti ja nousi kansainväliselle taidekentälle ”relaatioestetiikan” aallon myötä 1990-luvulla. Teoksessaan Nest (reconstruction of a nest I wanted to build 6 years old) hän palaa tuon ajanjakson hybridi-installaatioihinsa. \n\nHedy Leung on päätynyt kuvataiteen pariin kokeellisen ikebanan kautta. Hänen materiaalinsa ovat usein peräisin läheltä paikkoja, joissa hän toteuttaa avajaisissa yleisön edessä rakentuvat installaationsa. \n\nEglė Ridikaitė on kehittänyt tekniikan, joka perustuu spraymaalaamiseen sapluunoiden läpi. Viime vuosina hän on jäljentänyt Vilnan 1800- ja 1900-luvun rakennusten lattioita. Triptyykki Floor of the Great Synagogue of Vilna koostuu pingoittamattomista kankaista ja toisintaa toisen maailmansodan jälkeen puretun synagogan terrazzo-lattioita. \n\nKohta Taidehalli\n\n6.8.-4.10.2026\n\nTi-pe 12.00-18.00\n\nLa-su 12.00-16.00\n\nVapaa pääsy","c":"Visual arts","cs":["Design","fine arts","exhibitions","architecture"],"img":"https://api.hel.fi/linkedevents/media/images/KOHTA_TheArtOf_02.jpg","u":"https://kohta.fi/exhibition/art-of/?lang=fin","ue":"https://kohta.fi/exhibition/art-of/?lang=eng","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp4zmufgy","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"6467af6d298a2d17.webp"},{"src":"le","eid":"helsinki:agp4xx3g6u","t":"Inka Bell: Edestakas","te":"Inka Bell: To and Fro","v":"Galerie Anhava","ve":"Galerie Anhava","a":"Fredrikinkatu 43","la":60.16557,"ln":24.93551,"s":720,"e":1200,"d":"Inka Bell‘s delicate yet edgy solo exhibition explores liminal spaces between two- and three-dimensionality. \n\nThe show consists of paper sculptures and collage-like works whose essence lies in the dynamic between geometric forms and the material and technique. \n\nEven with their echoes of minimalism and concretism, the works are nevertheless unmistakably, playfully, insightfully Bell’s own. They are subtle events of transition, repetition, and transformation where two surfaces come together again and again.\n\nThe exhibition’s title, To and Fro, is like hint to the viewer: as one moves through the space, the works’ subtle insights, clever diversions, and optical events become activated; patterns and colours come to life, something happens before one’s eyes, the brain gets a jolt. \n\nThe elements in the works live in all sorts of directions, repeating, turning, rotating, stretching or falling into a rhythmic relation with what came before. \n\nChanges and transitions become visible in the relationship between the image and its outline. The components can be arranged in countless ways, rhythms, and combinations. \n\nAs she works, Bell herself navigates among the potentialities of the piece, returning to and drifting away from the original idea, and perhaps discovering something new along the way.\n\nGalerie Anhava\n\n6.-30.8.2026\n\nTue-Fri 11.00–17.00\n\nSat-Sun 12.00–16.00\n\nFree entry","df":"Inka Bellin herkän särmikkäässä soolonäyttelyssä liikutaan kaksi- ja kolmiulotteisen välitiloissa. \n\nEsillä on paperiveistoksia ja kollaasimaisia teoksia, joiden olemus tiivistyy geometristen muotojen suhteessa materiaaliin ja tekniikkaan. \n\nTeoksissa on kaikuja minimalismista ja konkretismista, mutta ne ovat tunnistettavasti, leikkisästi ja oivaltavasti aina Belliä. \n\nNe ovat hienovaraisia siirtymän, toiston ja muuntumisen tapahtumia, joissa kaksi pintaa kerta toisensa jälkeen kohtaa.\n\nNäyttelyn nimi Edestakas on kuin vihje katsojalle: tilassa liikkumalla teosten hienovaraiset oivallukset, älykkäät huvitukset ja optiset tapahtumat aktivoituvat, kuviot ja värit alkavat elää, silmissä tapahtuu ja aivoissa nytkähtää. \n\nTeosten elementit elävät suuntaan ja toiseen, kertautuvat, kääntyvät, pyörivät, venyvät tai rytmittyvät suhteessa edelliseen. \n\nMuutokset ja siirtymät tulevat näkyviksi kuva-aiheen suhteessa ääriviivoihinsa. Teokset syntyvät osista, jotka ovat järjestettävissä lukuisilla tavoilla, rytmeillä ja yhdistelmillä. \n\nTyöskennellessään Bell itse liikkuu teoksen mahdollisuuksien sisällä, palaa ja etääntyy alkuperäisestä ideasta ja löytää ehkä matkalla jotain uutta.\n\nGalerie Anhava\n\n6.-30.8.2026\n\nTi–pe 11.00–17.00\n\nLa–su 12.00–16.00\n\nVapaa pääsy","c":"Visual arts","cs":["fine arts","art","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Bell_Kieryva2.jpg","u":"https://anhava.com/exhibitions/inka-bell-edestakas/","ue":"https://anhava.com/exhibitions/inka-bell-edestakas/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp4xx3g6u","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"2a20df8834620f44.webp"},{"src":"le","eid":"helsinki:agpwagrshy","t":"Lady T","te":"Lady T","v":"Suomen Kansallisteatteri","ve":"Finnish National Theatre","a":"Läntinen Teatterikuja 1","la":60.17249,"ln":24.94384,"s":720,"e":1200,"d":"Tiina Puumalaisen Lady T on vaikuttava uutuusdraama Britannian Rautarouvan ja alipalkatun hotellityöntekijän kohtaamisesta.\n\nMaggie ‒ pikkukaupungin nousukas, joka aateloitiin paronittareksi.\n\nEnsimmäinen nainen Yhdistyneen kuningaskunnan pääministerinä ja miesvaltaisen puolueensa johtajana.\n\nTinkimätön uusliberalisti ja koulutusleikkausten tekijä. \n\nRautarouva, joka hallitsi maataan ankaralla otteella.\n\nNainen, joka jätti maailmanpolitiikkaan lähtemättömän jäljen.\n\nPerhearvoja korostanut konservatiivi, joka jäi lapsilleen etäiseksi.\n\nIhailtu ja vihattu Margaret Thatcher. \n\nSuomen Kansallisteatteri, Pieni näyttämö\n\n6.8.-31.10.2026\n\nKantaesitys 15.4.2026\n\nEsitykset \n\nLiput 24-49€, kesto 2 h 5 min, sis. väliajan\n\nEsitys on suomenkielinen","df":"Tiina Puumalaisen Lady T on vaikuttava uutuusdraama Britannian Rautarouvan ja alipalkatun hotellityöntekijän kohtaamisesta.\n\nMaggie ‒ pikkukaupungin nousukas, joka aateloitiin paronittareksi.\n\nEnsimmäinen nainen Yhdistyneen kuningaskunnan pääministerinä ja miesvaltaisen puolueensa johtajana.\n\nTinkimätön uusliberalisti ja koulutusleikkausten tekijä. \n\nRautarouva, joka hallitsi maataan ankaralla otteella.\n\nNainen, joka jätti maailmanpolitiikkaan lähtemättömän jäljen.\n\nPerhearvoja korostanut konservatiivi, joka jäi lapsilleen etäiseksi.\n\nIhailtu ja vihattu Margaret Thatcher. \n\nSuomen Kansallisteatteri, Pieni näyttämö\n\n6.8.-31.10.2026\n\nKantaesitys 15.4.2026\n\nEsitykset \n\nLiput 24-49€, kesto 2 h 5 min, sis. väliajan\n\nEsitys on suomenkielinen","c":"Theatre","cs":["theatre events","theatre (art forms)","performing arts","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/54946900672_4b9d66103a_k.jpg","u":"https://www.kansallisteatteri.fi/esitys/lady-t-0","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agpwagrshy","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpwagrshy","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"b2190509e9dd9dc8.webp"},{"src":"le","eid":"helsinki:agpqio2nde","t":"Maria Koskivirta: The Universe Is a Machine","te":"Maria Koskivirta: The Universe Is a Machine","v":"Forum Box","ve":"Forum Box","a":"Ruoholahdenranta 3 a","la":60.16163,"ln":24.92455,"s":720,"e":1200,"d":"Maria Koskivirta's new movie to watch for free at the Forum Box gallery. \n\nThe Universe Is a Machine explores the idea of reality as mechanical, automatic and perhaps indifferent; it challenges the idea that the universe is alive, magical or spiritually meaningful, but rather cold and predetermined – like a machine running without emotion or meaning.\n\nThe film consists of a series of slowly evolving, fragmented visual sequences. Its pacing is deliberately measured and lacks narrative resolution, maintaining a continuous but non-linear flow. \n\nThe film builds itself out of residues: liminal architectural voids, torn skin under macro gaze, a beam of light scanning, searching, failing to land. Reflecting on dissemination of the body and space as well as noting this idea of disembodiment, the shots collected are intended to take apart elements; to reveal loss – to shed light on disappearance.\n\nThe language of the film hovers between prayer, warning and resignation – fragments drawn from personal loss and collective tragedy. Ultimately, the text illuminates the loss of autonomy, as the speech accepts mechanical inevitability and offers suicide as the final act of existential freedom; understanding violence not as an event, but as a structure.\n\nThe Universe Is a Machine, 2025\n8 min 25 s\n\nForum Box\n\n7.-30.8.2026\n\nTue-Sun 12.00-17.00\n\nFree entry","df":"Maria Koskivirran uusi elokuva, jonka voi katsoa ilmaiseksi Forum Box -galleriassa. \n\nThe Universe Is a Machine tutkii ajatusta todellisuudesta mekaanisena, automaattisena ja kenties välinpitämättömänä. Se kyseenalaistaa käsityksen, jonka mukaan maailmankaikkeus olisi elävä, maaginen tai hengellisesti merkityksellinen, vaan esittää sen pikemminkin kylmänä ja ennalta määrättynä: kuin koneena, joka toimii ilman tunteita tai merkitystä.\n\nTyö koostuu sarjasta hitaasti kehittyviä, pirstaleisia visuaalisia jaksoja. Elokuva rakentuu jäännöksistä: liminaalisista arkkitehtonisista tyhjyyksistä, makrotarkastelun alla repeytyneestä ihosta, skannaavasta, etsivästä, kohdalleen osumattomasta valonsäteestä. \n\nPohtiessaan ruumiin ja tilan hajautumista sekä kiinnittäessään huomiota tähän ruumiillisuuden menettämisen ajatukseen, kootut otokset on tarkoitettu purkamaan elementtejä; paljastamaan menetystä, valaisemaan katoamista.\n\nElokuvan kieli liikkuu rukouksen, varoituksen ja alistumisen välimaastossa – koostuen katkelmista, jotka ammentavat henkilökohtaisesta menetyksestä ja kollektiivisesta tragediasta. \n\nThe Universe Is a Machine, 2025\n8 min 25 s\n\nForum Box\n\n7.-30.8.2026\n\nTi-su 12.00-17.00\n\nVapaa pääsy","c":"Cinema","cs":["films","art","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/teoskuva_pressikuva.jpg","u":"https://forumbox.fi/exhibition/maria-koskivirta/","ue":"https://forumbox.fi/en/exhibition/maria-koskivirta-2/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpqio2nde","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"22476c2aa9b42897.webp"},{"src":"le","eid":"helsinki:agp6vcaugy","t":"Christian Langenskiöld: Leavetaking","te":"Christian Langenskiöld: Leavetaking","v":"Valokuvagalleria Hippolyte","ve":"Photographic Gallery Hippolyte","a":"Yrjönkatu 8-10, sisäpiha","la":60.16452,"ln":24.94293,"s":720,"e":1200,"d":"Christian Langenskiöld’s exhibition Leavetaking at Photographic Gallery Hippolyte consists of five photographic works: four diaviewers for large-format sheet film and one stereoscope. \n\nThe exhibition pieces are built by the artist using timber from fallen trees collected from a place connected to his youth, with each work featuring its own handcrafted structure.\n\nAt the core of the exhibition is a reflection on places and experiences where personal memory intersects with longer cultural and historical layers. \n\nThe works draw from summers spent in Raasepori, as well as a journey to Sicily with Diana, a long-standing friend from the artist’s youth who had a deep personal connection to the island and was revisiting places from her earlier life. \n\nThe photographs originate from this trip and from her home environment, as does the timber used in the works, forming a body of work shaped by encounters with landscapes, architecture, and everyday spaces that carry traces of change over time.\n\nPhotographic Gallery Hippolyte\n\n7.8.-6.9.2026\n\nTue-Fri 12.00-17.00\n\nSat-Sun 12.00-16.00\n\nFree entry","df":"Christian Langenskiöldin näyttely Leavetaking Valokuvagalleria Hippolytessä käsittää viisi valokuvateosta: neljä diankatselulaitetta suuriformaattiselle laakafilmille ja yhden stereoskoopin. \n\nTaiteilija on käyttänyt teostensa rakentamiseen kaatuneita puita, joita hän on löytänyt omaan nuoruuteensa liittyvältä paikalta. Jokaisella teoksella on oma käsityönä tehty rakenteensa.\n\nNäyttelyn ytimessä on pohdinta paikoista ja kokemuksista, joissa henkilökohtaiset muistot leikkautuvat laajempiin kulttuurisiin ja historiallisiin kerrostumiin. \n\nTeosten taustalla on taiteilijan Raaseporissa viettämät kesät sekä yhdessä pitkäaikaisen ystävän Dianan kanssa tehty matka Sisiliaan, johon Dianalla oli syvä henkilökohtainen side. \n\nSaarella he vierailivat Dianan aiemmasta elämästä tutuilla paikoilla. Valokuvat ovat peräisin tältä matkalta ja Dianan kotiympäristöstä, samoin kuin teoksissa käytetyt puumateriaalit. \n\nNiistä muodostuu teoskokonaisuus, jota ovat muokanneet kohtaamiset maisemien, arkkitehtuurin ja arkisten tilojen kanssa, joihin kaikkiin ajan myötä tapahtuneet muutokset ovat jättäneet jälkensä.\n\nValokuvagalleria Hippolyte\n\n7.8.-6.9.2026\n\nTi-pe 12.00-17.00\n\nLa-su 12.00-16.00\n\nVapaa pääsy","c":"Visual arts","cs":["photographic art","fine arts","art","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Christian_Langenskiold_Open_Air_Museum.jpg","u":"https://hippolyte.fi/nayttely/christian-langenskiold/","ue":"https://hippolyte.fi/en/nayttely/christian-langenskiold/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp6vcaugy","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"ffc1e36a53dfa4fc.webp"},{"src":"le","eid":"helsinki:agp6vfgwuu","t":"Charlotte Clermont: du soleil, que ça existe","te":"Charlotte Clermont: du soleil, que ça existe","v":"Valokuvagalleria Hippolyte","ve":"Photographic Gallery Hippolyte","a":"Yrjönkatu 8-10, sisäpiha","la":60.16452,"ln":24.94293,"s":720,"e":1200,"d":"Charlotte Clermont’s exhibition du soleil, que ça existe in Hippolyte Studio is a two-channel analog projection that explores the temporal dimensions of how the body forms, preserves, and creates what one translates as the real, using film, sound and space. \n\nCentered on themes of desire, distance, and language, this textual project moves through the vastness of language and landscapes, creating a sense of space within dialogues and approaching landscapes as bodies. \n\nIt examines the human relationship with natural elements, particularly water. Fluidity—both of water and identity—is central to the work, inviting viewers to reflect on the nature of self and perception. \n\nShot on black-and-white 16mm film, the images move away from classical cinematic narrative to become moving photographs. Though figurative, the slow panoramas of landscapes and close-ups of bodies tend toward abstraction. \n\nOn a technical level, Clermont experimented with solarization to produce images that blur the boundaries between drawing, painting, and film. The result is a play of textures, light, and shadow that adds to the emotional depth of the work. \n\nPhotographic Gallery Hippolyte, Studio\n\n7.8.-6.9.2026\n\nTue-Fri 12.00-17.00\n\nSat-Sun 12.00-16.00\n\nFree entry","df":"Charlotte Clermontin näyttely du soleil, que ça existe Hippolyte Studiossa on kaksikanavainen analoginen projisointi. Elokuvaa, ääntä ja tilaa käyttäen teos tutkii ajallisuutta, jonka kautta keho muodostaa, säilyttää ja luo sitä, mitä pidetään todellisuutena. Halun, etäisyyden ja kielen teemoihin keskittyvän tekstuaalinen kokonaisuus liikkuu kielen ja maisemien laajuudessa. \n\nTeos tarkastelee vuoropuheluun kätkeytyvää tilaa ja lähestyy maisemia ikään kuin ne olisivat kehoja. Tarkastelun kohteena on ihmisen suhde luonnon elementteihin, ennen kaikkea veteen. Teoksen keskiössä on sekä veden että identiteetin virtaavuus, mikä kutsuu katsojaa pohtimaan itsen ja havainnon luonnetta.\n\nMustavalkoiselle 16 millimetrin filmille kuvatun teoksen näkymät ottavat etäisyyttä klassiseen elokuvakerrontaan; ne ovat pikemminkin kuin liikkuvia valokuvia. Hitaasti avautuvat figuratiiviset maisemapanoraamat ja kehoista otetut lähikuvat ovat abstraktin rajamailla. \n\nClermont on käyttänyt kokeellista solarisaatiotekniikkaa, jolla hän hämärtää piirustuksen, maalauksen ja elokuvan välisiä rajoja. Näin syntyvä valon, varjon ja tekstuurien leikki on omiaan syventämään teoksen emotionaalista syvyyttä. \n\nValokuvagalleria Hippolyte, Studio\n\n7.8.-6.9.2026\n\nTi-pe 12.00-17.00\n\nLa-su 12.00-16.00\n\nVapaa pääsy","c":"Visual arts","cs":["photographic art","photography exhibitions","art","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/CharlotteClermont_DuSoleilQueCaExiste_2026_01.jpg","u":"https://hippolyte.fi/nayttely/charlotte-clermont/","ue":"https://hippolyte.fi/en/nayttely/charlotte-clermont/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp6vfgwuu","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"9e92b4c4bde887a4.webp"},{"src":"le","eid":"helsinki:agpqiifc4m","t":"Tianjun Li / Pavel Rotts /Yujie Zhou","te":"Tianjun Li / Pavel Rotts /Yujie Zhou","v":"Forum Box","ve":"Forum Box","a":"Ruoholahdenranta 3 a","la":60.16163,"ln":24.92455,"s":720,"e":1200,"d":"Three artists whose works will be on display in August at the Forum Box Gallery:\n\nTianjun Li: Bird Collisions\n\nPavel Rotts: Matter of Touch\n\nYujie Zhou: Health Hammer\n\nForum Box\n\n7.-30.8.2026\n\nTue-Sun 12.00-17.00\n\nFree entry","df":"Forum Box -galleriassa on elokuussa kolme uutta, maksutonta näyttelyä: \n\nTianjun Li: Bird Collisions\n\nPavel Rotts: Matter of Touch\n\nYujie Zhou: Health Hammer\n\nForum Box\n\n7.-30.8.2026\n\nTi-su 12.00-17.00\n\nVapaa pääsy","c":"Visual arts","cs":["fine arts","art","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Kollaasi_verkkosivuille_Li_Rotts_Zhou_QK3DChF.png","u":"https://forumbox.fi/exhibition/tianjun-li-pavel-rotts-yujie-zhou/","ue":"","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpqiifc4m","qe":"","qf":"","qz":"","vp":0,"cr":"","th":"320ab2c3f2db15a7.webp"},{"src":"le","eid":"espoo_le:agpmvtycc4","t":"Lukukoira tavattavissa","te":"Reading dog available","v":"Kauklahden kirjasto","ve":"Kauklahti Library","a":"Hansakallio 2","la":60.18803,"ln":24.59492,"s":720,"e":1200,"d":"He
