<style>
/* ============================================================
   TOKENS — Festarri M3 language, extended with a rank scale.
   Light is the Festarri canvas; dark is the Art Night purple.
   ============================================================ */
:root{
  --corner-xs:4px;--corner-s:6px;--corner-m:10px;--corner-l:12px;
  --corner-l-inc:14px;--corner-xl:18px;--corner-xl-inc:22px;--corner-full:999px;
  --ease-emphasized:cubic-bezier(.2,0,0,1);
  --ease-emph-decel:cubic-bezier(.05,.7,.1,1);
  --ease-emph-accel:cubic-bezier(.3,0,.8,.15);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --dur-short2:100ms;--dur-short3:150ms;--dur-short4:200ms;
  --dur-med1:250ms;--dur-med2:300ms;--dur-med4:400ms;--dur-long1:450ms;--dur-long2:500ms;
  --font:"Roboto Flex","Roboto","Helvetica Neue",Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --elev-1:0 1px 2px rgba(41,28,67,.07),0 1px 3px 1px rgba(41,28,67,.05);
  --elev-2:0 2px 6px 2px rgba(41,28,67,.09),0 1px 2px rgba(41,28,67,.10);
  --elev-3:0 -4px 24px 4px rgba(41,28,67,.14),0 2px 4px rgba(41,28,67,.10);
  --tl-h:118px;

  /* Built from nine given pastels: lavender mist #EAE4E9, linen #FFF1E6,
     soft blush #FDE2E4, petal frost #FAD2E1, mint cream #E2ECE9, light blue
     #BEE1E6, parchment #F0EFEB, lavender #DFE7FD, periwinkle #CDDAFD.
     None of the nine can carry text, so each is used as a ground or a fill and
     paired with an ink deepened from its own hue. The rank scale is petal
     frost, light blue and linen; periwinkle is the app's own voice. */
  --primary:#4A5DA8;--on-primary:#FFFFFF;
  --primary-container:#CDDAFD;--on-primary-container:#1B2A55;
  --surface:#FFFFFF;--on-surface:#2E2B31;
  --surface-container-low:#FBFAF8;--surface-container:#F5F4F0;
  --surface-container-high:#F0EFEB;--surface-container-highest:#EAE4E9;
  --on-surface-variant:#605B64;
  --outline:#9A939C;--outline-variant:#E6E2E4;
  --inverse-surface:#2E2B31;--inverse-on-surface:#F5F4F0;--inverse-primary:#CDDAFD;
  --scrim:#241F26;
  --glass:rgba(255,255,255,.92);
  --c-visual-bg:#DFE7FD;--c-visual-ink:#42539B;
  --c-music-bg:#FAD2E1;--c-music-ink:#A83E6B;
  --c-dance-bg:#BEE1E6;--c-dance-ink:#26636F;
  --c-part-bg:#E2ECE9;--c-part-ink:#3A6B5C;
  --c-lit-bg:#FFF1E6;--c-lit-ink:#8A6134;
  --c-theatre-bg:#FDE2E4;--c-theatre-ink:#A24A52;
  --c-film-bg:#CDDAFD;--c-film-ink:#3F51A8;
  --r3:#B3406A;--r3-bg:#FAD2E1;
  --r2:#2E6E77;--r2-bg:#BEE1E6;
  --r1:#8A6134;--r1-bg:#FFF1E6;
  --r0:#8C8791;--r0-bg:#EAE4E9;
  --warn-bg:#FFF1E6;--warn-ink:#8A6134;
  --tiles:none;--map-tint:rgba(46,43,49,0);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#CDDAFD;--on-primary:#1B2A55;
  --primary-container:#35406E;--on-primary-container:#DFE7FD;
  --surface:#1B1A1E;--on-surface:#EDE9EC;
  --surface-container-low:#211F25;--surface-container:#27242B;
  --surface-container-high:#2F2B33;--surface-container-highest:#38333C;
  --on-surface-variant:#C6BFC7;
  --outline:#9A939C;--outline-variant:#3B363F;
  --inverse-surface:#EDE9EC;--inverse-on-surface:#27242B;--inverse-primary:#4A5DA8;
  --scrim:#000000;--glass:rgba(27,26,30,.88);
  --c-visual-bg:#2C3556;--c-visual-ink:#DFE7FD;
  --c-music-bg:#4A2233;--c-music-ink:#FAD2E1;
  --c-dance-bg:#1E3F45;--c-dance-ink:#BEE1E6;
  --c-part-bg:#233B33;--c-part-ink:#E2ECE9;
  --c-lit-bg:#40342A;--c-lit-ink:#FFF1E6;
  --c-theatre-bg:#452328;--c-theatre-ink:#FDE2E4;
  --c-film-bg:#262F52;--c-film-ink:#CDDAFD;
  --r3:#F7B3CC;--r3-bg:#4A2233;
  --r2:#A8D4DC;--r2-bg:#1E3F45;
  --r1:#E9CDB4;--r1-bg:#40342A;
  --r0:#9A939C;--r0-bg:#302B33;
  --warn-bg:#40342A;--warn-ink:#FFF1E6;
  --tiles:none;--map-tint:rgba(27,26,30,.18);
}}
:root[data-theme="dark"]{
  --primary:#CDDAFD;--on-primary:#1B2A55;
  --primary-container:#35406E;--on-primary-container:#DFE7FD;
  --surface:#1B1A1E;--on-surface:#EDE9EC;
  --surface-container-low:#211F25;--surface-container:#27242B;
  --surface-container-high:#2F2B33;--surface-container-highest:#38333C;
  --on-surface-variant:#C6BFC7;
  --outline:#9A939C;--outline-variant:#3B363F;
  --inverse-surface:#EDE9EC;--inverse-on-surface:#27242B;--inverse-primary:#4A5DA8;
  --scrim:#000000;--glass:rgba(27,26,30,.88);
  --c-visual-bg:#2C3556;--c-visual-ink:#DFE7FD;
  --c-music-bg:#4A2233;--c-music-ink:#FAD2E1;
  --c-dance-bg:#1E3F45;--c-dance-ink:#BEE1E6;
  --c-part-bg:#233B33;--c-part-ink:#E2ECE9;
  --c-lit-bg:#40342A;--c-lit-ink:#FFF1E6;
  --c-theatre-bg:#452328;--c-theatre-ink:#FDE2E4;
  --c-film-bg:#262F52;--c-film-ink:#CDDAFD;
  --r3:#F7B3CC;--r3-bg:#4A2233;
  --r2:#A8D4DC;--r2-bg:#1E3F45;
  --r1:#E9CDB4;--r1-bg:#40342A;
  --r0:#9A939C;--r0-bg:#302B33;
  --warn-bg:#40342A;--warn-ink:#FFF1E6;
  --tiles:none;--map-tint:rgba(27,26,30,.18);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
img{display:block;max-width:100%}

/* ============================================================
   SHELL — mobile is one column: map behind, sheet over it,
   timeline docked to the bottom. Desktop splits into rail + map.
   ============================================================ */
.app{position:fixed;inset:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr}
.mapwrap{position:relative;grid-area:1/1;overflow:hidden;background:var(--surface-container-low)}
#map{position:absolute;inset:0;z-index:0}
#map .leaflet-tile-pane{filter:var(--tiles)}
.maptint{position:absolute;inset:0;z-index:399;pointer-events:none;background:var(--map-tint)}
.leaflet-container{background:var(--surface-container-low);font-family:var(--font)}
.leaflet-control-zoom{display:none}
.leaflet-bottom{margin-bottom:0}
.leaflet-control-attribution{font-size:10px;background:var(--glass) !important;
  color:var(--on-surface-variant) !important;padding:1px 5px}
.leaflet-control-attribution a{color:var(--primary) !important}

/* ---- top chrome: one 42px row, nothing stacked on top of it ---- */
.topbar{position:absolute;z-index:500;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;
  display:flex;gap:8px;align-items:center;pointer-events:none;height:42px}
.topbar>*{pointer-events:auto}
.pillrow{flex:1 1 auto;min-width:0;display:flex;gap:8px;align-items:center;
  overflow-x:auto;scrollbar-width:none;padding:7px 2px;margin:-7px -2px;
  -webkit-mask:linear-gradient(to right,#000 calc(100% - 18px),#0000);
  mask:linear-gradient(to right,#000 calc(100% - 18px),#0000)}
.pillrow::-webkit-scrollbar{display:none}
.pill{height:42px;padding:0 14px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1);
  display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
  font:600 14px/20px var(--font);white-space:nowrap;
  transition:background var(--dur-short3),color var(--dur-short3),transform var(--dur-short4) var(--spring)}
.pill:active{transform:scale(.94)}
.pill svg{width:18px;height:18px;flex:0 0 18px}
.pill[data-active="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.pill .n{min-width:18px;height:18px;padding:0 5px;border-radius:var(--corner-full);
  background:var(--on-surface);color:var(--surface);font:700 11px/18px var(--font);text-align:center}
.pill[data-active="true"] .n{background:var(--on-primary-container);color:var(--primary-container)}
.circle-btn{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:var(--corner-full);
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1);
  display:grid;place-items:center;cursor:pointer;font:800 12px/1 var(--mono);letter-spacing:-.3px;
  transition:transform var(--dur-short4) var(--spring),background var(--dur-short2)}
.circle-btn:active{transform:scale(.9)}
.circle-btn svg{width:20px;height:20px}

/* ---- base-map switch, second row, left side, clear of everything ---- */
.mapchrome{position:absolute;z-index:500;left:12px;top:calc(62px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:8px}
.locate{width:36px;height:36px;flex:0 0 36px}
.locate svg{width:18px;height:18px}
.locate[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.locate[data-busy="1"] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* the blue dot everyone already knows */
.mypos{border-radius:50%;background:var(--primary);
  box-shadow:0 0 0 3px var(--surface),0 1px 6px rgba(0,0,0,.35)}
.seg{position:relative;display:flex;padding:3px;border-radius:var(--corner-full);
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1)}
.seg button{border:0;background:none;cursor:pointer;height:30px;padding:0 12px;
  border-radius:var(--corner-full);color:var(--on-surface-variant);
  font:600 12px/16px var(--font);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  transition:background var(--dur-short3),color var(--dur-short3)}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}

/* ---- markers ---- */
.mk{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk[data-on="0"]{display:none}
.mk .bub{border-radius:var(--corner-full);display:grid;place-items:center;
  box-shadow:var(--elev-2);border:2px solid var(--surface);
  transition:transform var(--dur-med2) var(--spring)}
.mk .bub svg{width:60%;height:60%}
.mk .stem{width:2px;background:var(--surface);box-shadow:var(--elev-1)}
.mk-r3 .bub{width:38px;height:38px;background:var(--r3);color:#fff}
.mk-r3 .stem{height:9px}
.mk-r2 .bub{width:29px;height:29px;background:var(--r2);color:var(--surface)}
.mk-r2 .stem{height:7px}
.mk-r1 .bub{width:22px;height:22px;background:var(--r1);color:var(--surface)}
.mk-r1 .stem{height:6px}
.mk-r0 .bub{width:12px;height:12px;border-width:1.5px;background:var(--r0);opacity:.7}
.mk-r0 .bub svg,.mk-r0 .stem{display:none}
.mk .lab{margin-bottom:3px;order:-1;max-width:160px;padding:2px 7px;border-radius:var(--corner-s);
  background:var(--surface);box-shadow:var(--elev-1);
  color:var(--on-surface);font:700 10px/14px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-r1 .lab,.mk-r0 .lab{display:none}
#map:not([data-close="1"]) .mk-r2 .lab{display:none}
/* In the plan: the pin takes the plan's own colour and wears its stop number,
   so the route reads as 1 → 2 → 3 without opening anything. */
.mk.in-plan .bub{background:var(--primary);color:var(--on-primary);
  box-shadow:var(--elev-2),0 0 0 3px var(--primary-container)}
.mk.in-plan .bub svg{display:none}
.mk.in-plan .bub::after{content:attr(data-n);font:800 12px/1 var(--mono)}
.mk-r0.in-plan .bub{opacity:1}
.mk-r0.in-plan .bub::after{content:none}
.mk.sel .bub{transform:scale(1.3)}
.mk.sel::after{content:"";position:absolute;left:50%;bottom:0;width:66px;height:66px;
  margin:0 0 -16px -33px;border-radius:50%;background:currentColor;opacity:.28;
  animation:ping 2.4s ease-out infinite;pointer-events:none;z-index:-1}
.mk-r3.sel{color:var(--r3)}.mk-r2.sel{color:var(--r2)}.mk-r1.sel{color:var(--r1)}
@keyframes ping{0%{transform:scale(.5);opacity:.38}70%{transform:scale(1.45);opacity:0}100%{opacity:0}}
.planline{stroke-dasharray:2 7;stroke-linecap:round}

/* Bloom motion, from design/patterns/festarri-bloom-icons.html.
   Two grades, and the choice is not taste: bi-pop is one <use> and one
   scale and goes everywhere; the six staggered petals are the hero
   moment only, which here is the detail panel's own button. Running
   six staggered animations on every row of a list is the thing that
   rule exists against. */
@keyframes bi-pop      {0%{transform:scale(.72)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes bi-fade     {from{opacity:0}to{opacity:1}}
@keyframes bi-petal-in {from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bi-centre-in{from{transform:scale(0)}to{transform:none}}
.bi--sel{transform-box:view-box;transform-origin:12px 12px;
  animation:bi-pop var(--dur-med2) var(--ease-emph-decel) both}
.bi--unsel{animation:bi-fade var(--dur-short4) var(--ease-standard) both}
.bi--bloom>g,.bi--bloom>circle{transform-box:view-box;transform-origin:12px 12px}
.bi--bloom>g{animation:bi-petal-in 400ms var(--ease-emph-decel) both}
.bi--bloom>g:nth-child(2){animation-delay:40ms}
.bi--bloom>g:nth-child(3){animation-delay:80ms}
.bi--bloom>g:nth-child(4){animation-delay:120ms}
.bi--bloom>g:nth-child(5){animation-delay:160ms}
.bi--bloom>g:nth-child(6){animation-delay:200ms}
.bi--bloom>circle{animation:bi-centre-in var(--dur-med2) var(--ease-emph-decel) 260ms both}

/* The favourite blast, ported keyframe for keyframe from Festarri's own
   (scripts/home.html): two rings, then waves of streaks, sparks and petals
   thrown out of the pressed control into a fixed layer, so nothing clips
   them and nothing reflows. Putting an event in your plan here is the same
   act as starring a festival there, so it is the same blast. */
@keyframes fp-fav-ring{
  0%{transform:scale(.2);opacity:0;border-width:12px}
  10%{opacity:.85}
  100%{transform:scale(2.9);opacity:0;border-width:1px}}
@keyframes fp-fav-spark{
  0%{transform:rotate(var(--a)) translateX(calc(var(--fs) * .1)) scale(.35);opacity:0}
  12%{opacity:1}72%{opacity:1}
  100%{transform:rotate(var(--a)) translateX(calc(var(--fs) * var(--d))) scale(.12);opacity:0}}
@keyframes fp-fav-petal{
  0%{transform:rotate(var(--a)) translateX(calc(var(--fs) * .1)) scale(.2) rotate(0deg);opacity:0}
  14%{opacity:1}70%{opacity:1}
  100%{transform:rotate(var(--a)) translateX(calc(var(--fs) * var(--d))) scale(1) rotate(300deg);opacity:0}}
.fp-blast{position:fixed;z-index:940;width:40px;height:40px;pointer-events:none}
.fp-blast i{display:block}

/* ============================================================
   TIMELINE — fixed height, three fixed rows. Nothing here wraps.
   ============================================================ */
.timeline{position:absolute;z-index:520;left:0;right:0;bottom:auto;
  top:calc(62px + env(safe-area-inset-top));
  display:flex;justify-content:flex-end;pointer-events:none;padding:0 12px}
.tl-inner{pointer-events:auto;width:100%;overflow:hidden;
  transition:box-shadow var(--dur-med2);
  background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--elev-2);
  border:1px solid var(--outline-variant);border-radius:var(--corner-xl);
  padding:6px 14px 8px}
.tl-head{display:flex;align-items:center;gap:10px;height:34px}
.tl-clock{flex:0 0 auto;border:0;background:none;padding:0 2px;cursor:pointer;
  color:inherit;font:700 24px/26px var(--mono);letter-spacing:-1.2px}
.tl-clock[data-off="1"]{color:var(--primary)}
.tl-sub{flex:1 1 auto;min-width:0;color:var(--on-surface-variant);
  font:400 12px/16px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-sub b{color:var(--on-surface);font-weight:700}
.tl-nudge{flex:0 0 auto;display:flex;gap:6px}
.tl-nudge button{width:30px;height:30px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--surface-container);display:grid;place-items:center}
.tl-nudge button svg{width:16px;height:16px}
.tl-track{position:relative;height:44px;touch-action:none;cursor:ew-resize;user-select:none;
  margin-top:2px}
#tlsvg{display:block;width:100%;height:44px}
.tl-ticks{display:flex;justify-content:space-between;height:14px;
  color:var(--on-surface-variant);font:500 10px/14px var(--mono)}
#tlReset{color:var(--primary)}
.timeline[data-collapsed="1"] #tlReset{display:none}
#tlToggle svg{transition:transform var(--dur-med2) var(--ease-emphasized)}
#tlToggle[aria-expanded="false"] svg{transform:rotate(180deg)}
/* collapsed: the card shrinks to a pill that still scrubs, and gives the list its space back */
.timeline[data-collapsed="1"] .tl-inner{width:auto;border-radius:var(--corner-full);
  padding:2px 5px 2px 13px}
/* expanded, the card takes the whole row, so what it grew next to steps aside */
.mapwrap.tl-open .mapchrome{opacity:0;pointer-events:none;transition:opacity var(--dur-short3)}
.timeline[data-collapsed="1"] .tl-sub,
.timeline[data-collapsed="1"] .tl-track,
.timeline[data-collapsed="1"] .tl-ticks{display:none}
.timeline[data-collapsed="1"] .tl-head{height:32px;gap:6px}
.timeline[data-collapsed="1"] .tl-clock{font-size:18px;line-height:20px}
.timeline[data-collapsed="1"] .tl-nudge button{width:26px;height:26px}
.timeline[data-collapsed="1"] .tl-nudge button svg{width:14px;height:14px}

/* ============================================================
   SHEET — the list, the detail and the plan all live here
   ============================================================ */
.sheet{position:absolute;z-index:510;left:0;right:0;top:0;height:100%;
  background:var(--surface);border-radius:var(--corner-xl) var(--corner-xl) 0 0;
  box-shadow:var(--elev-3);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(var(--y,62%));touch-action:none;
  transition:transform var(--dur-long2) var(--ease-emph-decel)}
.sheet.dragging{transition:none}
.grab{flex:0 0 auto;padding:0 16px 8px;cursor:grab;user-select:none}
.grab:active{cursor:grabbing}
.handle{height:22px;display:grid;place-items:center;padding-top:8px}
.handle i{width:36px;height:4px;border-radius:var(--corner-full);background:var(--outline-variant)}
.brand{display:flex;align-items:center;gap:10px;padding:0 2px 8px;
  color:var(--on-surface-variant);font:700 10px/14px var(--font);letter-spacing:1.15px;
  text-transform:uppercase}
.brand .bm{display:inline-flex;align-items:center;gap:6px;color:var(--primary)}
.brand .bm svg{width:17px;height:17px}
.brand .bt{margin-left:auto;display:inline-flex;align-items:center;gap:7px;

.sheet-head{display:flex;align-items:center;gap:10px;min-height:38px}
/* peeking, the sheet is a handle and a line - so the line carries the count */
.sheet[data-peek="1"] .brand{padding-bottom:4px}
.sheet[data-peek="1"] .sheet-head b{font-size:18px;line-height:23px}
.sheet-head .ht{flex:1;min-width:0}
.sheet-head b{display:block;font:800 20px/25px var(--font);letter-spacing:-.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head span{display:block;color:var(--on-surface-variant);font:400 12px/16px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .circle-btn{background:var(--surface-container);box-shadow:none;backdrop-filter:none;
  width:38px;height:38px;flex:0 0 38px}
.searchbar{display:flex;align-items:center;gap:9px;margin-top:8px;padding:0 12px;height:46px;
  border-radius:var(--corner-full);background:var(--surface-container)}
.searchbar>svg{width:19px;height:19px;flex:0 0 19px;color:var(--on-surface-variant)}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;color:inherit;
  font:500 15px/20px var(--font)}
.searchbar input::-webkit-search-cancel-button{display:none}
.searchbar button{width:30px;height:30px;flex:0 0 30px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface-container-highest);color:var(--on-surface-variant);
  display:grid;place-items:center}
.searchbar button svg{width:15px;height:15px}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:0 14px calc(28px + var(--sheet-y,0px));scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.sbody.locked{overflow:hidden}

/* ---- list rows: image, rank badge on the image, then the facts ---- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:11px;padding:8px;cursor:pointer;text-align:left;
  border:0;width:100%;background:var(--surface-container);border-radius:var(--corner-l);
  transition:transform var(--dur-short4) var(--spring),box-shadow var(--dur-short3)}
/* The whole programme is 423 rows. Off-screen ones are skipped for layout and
   paint entirely; the remembered height keeps the scrollbar and any restored
   scroll position honest. One animation on the panel replaced 423 on the rows. */
.rows>.row{content-visibility:auto;contain-intrinsic-size:auto 97px}
.row:active{transform:scale(.985)}
.row.sel{box-shadow:inset 0 0 0 2px var(--primary)}
.row .thumb{position:relative;width:66px;height:66px;flex:0 0 66px;border-radius:var(--corner-m);
  overflow:hidden;background:var(--cat-bg);display:grid;place-items:center}
.thumb .ph{width:26px;height:26px;color:var(--cat-ink);opacity:.55}
.row .thumb img{position:absolute;inset:0}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.row .thumb .rkb{position:absolute;left:4px;top:4px;height:17px;padding:0 5px;border-radius:5px;
  background:var(--rk-ink);color:var(--surface);font:800 10px/17px var(--mono);
  display:inline-flex;align-items:center;gap:3px;box-shadow:var(--elev-1)}
.row .thumb .rkb svg{width:9px;height:9px}
.row .thumb .rkb[data-r="0"]{display:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font:700 15px/19px var(--font);letter-spacing:-.15px}
.row .txt .when{margin:3px 0 0;font:600 13px/17px var(--mono)}
.row .txt .where{margin:2px 0 0;display:flex;align-items:center;gap:6px;
  color:var(--on-surface-variant);font:400 13px/17px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--cat-ink)}
.row .fav{flex:0 0 38px;width:38px;height:38px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--cat-bg);color:var(--cat-ink);display:grid;place-items:center;
  transition:transform var(--dur-med2) var(--spring),background var(--dur-short2)}
.row .fav:active{transform:scale(.85)}
.row .fav svg{width:18px;height:18px}
.row .fav .f{display:none}
.row .fav[aria-pressed="true"]{background:var(--cat-ink);color:var(--surface)}
.row .fav[aria-pressed="true"] .f{display:block}
.row .fav[aria-pressed="true"] .o{display:none}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.bdg{padding:2px 7px;border-radius:var(--corner-xs);font:700 10px/14px var(--font);letter-spacing:.3px}
.bdg.warn{background:var(--warn-bg);color:var(--warn-ink)}
.bdg.rain{background:var(--c-dance-bg);color:var(--c-dance-ink)}
.bdg.live{background:var(--r3-bg);color:var(--r3)}
.bdg.soon{background:var(--r2-bg);color:var(--r2)}
.bdg.gone{background:var(--surface-container-highest);color:var(--on-surface-variant)}
.bdg.door{background:var(--c-part-bg);color:var(--c-part-ink)}
.bdg.rare{background:var(--c-visual-bg);color:var(--c-visual-ink)}
.bdg.ex{background:var(--surface-container-highest);color:var(--on-surface-variant)}
.dflags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dflag{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 10px;
  border-radius:var(--corner-full);font:700 12px/16px var(--font)}
.dflag svg{width:16px;height:16px;flex:0 0 16px}
.dflag.door{background:var(--c-part-bg);color:var(--c-part-ink)}
.dflag.rare{background:var(--c-visual-bg);color:var(--c-visual-ink)}
.bdg.sess{background:var(--surface-container-highest);color:var(--on-surface-variant);font-family:var(--mono)}

.group-h{display:flex;align-items:center;gap:8px;padding:16px 2px 8px}
.group-h i{width:9px;height:9px;border-radius:50%;background:var(--rk-ink)}
.group-h b{font:700 12px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.group-h span{color:var(--on-surface-variant);font:400 12px/16px var(--font)}
.empty{margin:28px 0;padding:30px 22px;text-align:center;border-radius:var(--corner-xl);
  background:var(--surface-container)}
.empty h3{margin:0 0 4px;font:700 17px/23px var(--font)}
.empty p{margin:0;color:var(--on-surface-variant);font:400 14px/20px var(--font)}

/* ---- detail ---- */
.dhero{position:relative;margin:0 -14px 14px;height:172px;overflow:hidden;
  background:var(--cat-bg);display:grid;place-items:center}
.dhero .ph{width:58px;height:58px;color:var(--cat-ink);opacity:.45}
.dhero img{position:absolute;inset:0}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhero .grad{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(11,21,24,.86),rgba(11,21,24,.15) 58%,rgba(11,21,24,0))}
.dhero:not(:has(img)) .grad{background:linear-gradient(to top,var(--cat-bg),transparent 62%)}
.dhero:not(:has(img)) .chips .chip.cat{background:var(--surface);color:var(--cat-ink)}
.dhero .chips{position:absolute;left:14px;bottom:12px;right:14px;display:flex;flex-wrap:wrap;gap:6px}
.dhero .vpnote{position:absolute;right:12px;top:10px;padding:3px 9px;border-radius:var(--corner-full);
  background:rgba(0,0,0,.46);color:#fff;font:600 10px/14px var(--font);letter-spacing:.5px;
  backdrop-filter:blur(4px)}
.chip{padding:4px 10px;border-radius:var(--corner-s);font:700 10px/14px var(--font);
  letter-spacing:.9px;text-transform:uppercase}
.chip.rank{background:var(--rk-ink);color:var(--surface)}
.chip.cat{background:var(--cat-bg);color:var(--cat-ink)}
.dtitle{margin:0;font:800 23px/28px var(--font);letter-spacing:-.6px;text-wrap:balance}
.dalt{margin:4px 0 0;color:var(--on-surface-variant);font:400 14px/20px var(--font)}
.dmeta{margin:9px 0 0;color:var(--on-surface-variant);font:400 14px/20px var(--font);
  display:flex;align-items:flex-start;gap:8px}
.dmeta svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px}
.dmeta b{color:var(--on-surface);font:700 14px/20px var(--mono)}
.why{margin:14px 0 0;padding:13px 14px;border-radius:var(--corner-l);
  background:var(--rk-bg);color:var(--on-surface)}
.why h4{margin:0 0 5px;color:var(--rk-ink);font:700 10px/14px var(--font);
  letter-spacing:1.1px;text-transform:uppercase}
.why p{margin:0;font:400 14px/21px var(--font)}
.dactions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-accent{flex:1 1 160px;height:48px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--primary-container);color:var(--on-primary-container);
  font:700 15px/20px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:border-radius var(--dur-short3) var(--spring),background var(--dur-short2)}
.btn-accent:active{border-radius:var(--corner-m)}
.btn-accent svg{width:19px;height:19px}
.btn-accent[aria-pressed="true"]{background:var(--rk-ink);color:var(--surface)}
.btn-tonal{flex:0 0 auto;height:48px;padding:0 18px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface-container);color:var(--on-surface);text-decoration:none;
  font:600 15px/20px var(--font);display:inline-flex;align-items:center;gap:8px}
.btn-tonal svg{width:18px;height:18px}
.dsec{margin-top:20px}
.dsec h3{margin:0 0 8px;color:var(--on-surface-variant);
  font:700 11px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.dsec p{margin:0;font:400 15px/23px var(--font);white-space:pre-wrap}
/* Opening an event is a forward move and going back is the same move reversed,
   so the panel travels on one axis. The photograph settles rather than appears,
   which is what says the thing you tapped is the thing that opened. */
@keyframes body-in{from{opacity:0;transform:translateX(var(--from,18px))}to{opacity:1;transform:none}}
@keyframes hero-in{from{opacity:.35;transform:scale(1.07)}to{opacity:1;transform:none}}
.sbody.entering{animation:body-in 300ms var(--ease-emph-decel) both}
.dhero img{animation:hero-in 520ms var(--ease-emph-decel) both}
.desc{position:relative;overflow:hidden;max-height:92px;
  transition:max-height var(--dur-med4) var(--ease-emphasized)}
.desc.open{max-height:6000px}
.readmore{margin-top:8px;height:38px;padding:0 14px;border:0;border-radius:var(--corner-full);
  background:var(--surface-container);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font:600 14px/20px var(--font)}
.readmore svg{width:18px;height:18px;transition:transform var(--dur-med2) var(--ease-emphasized)}
.readmore[aria-expanded="true"] svg{transform:rotate(180deg)}
.info{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.info+.info{border-top:1px solid var(--outline-variant)}
.info .ic{width:36px;height:36px;flex:0 0 36px;border-radius:var(--corner-full);
  background:var(--surface-container);display:grid;place-items:center}
.info .ic svg{width:18px;height:18px}
.info .tx{flex:1;min-width:0}
.info .tx b{display:block;font:600 14px/20px var(--font)}
.info .tx span{display:block;color:var(--on-surface-variant);font:400 13px/19px var(--font)}

/* ---- plan ---- */
.plan-item{position:relative;padding-left:26px}
.plan-item::before{content:"";position:absolute;left:11px;top:0;bottom:-8px;width:2px;
  background:var(--outline-variant)}
.plan-item:last-child::before{display:none}
.plan-item{padding-bottom:2px}
.plan-item .num{position:absolute;left:2px;top:24px;width:20px;height:20px;border-radius:50%;
  background:var(--primary);color:var(--on-primary);display:grid;place-items:center;
  font:700 11px/1 var(--mono);z-index:1}
.at{display:flex;align-items:center;gap:8px;margin:6px 0 0;padding:6px 8px 6px 12px;
  border-radius:var(--corner-full);background:var(--rk-bg)}
.at .lb{color:var(--on-surface-variant);font:700 10px/14px var(--font);
  letter-spacing:.9px;text-transform:uppercase}
.at b{font:700 14px/18px var(--mono);min-width:46px;text-align:center}
.at button{width:28px;height:28px;flex:0 0 28px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface);color:var(--on-surface);
  font:700 16px/1 var(--font);display:grid;place-items:center}
.at .hint{flex:1;min-width:0;text-align:right;color:var(--on-surface-variant);
  font:500 12px/16px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at.bad{background:var(--warn-bg)}.at.bad .hint{color:var(--warn-ink);font-family:var(--font);font-weight:700}
.leg{display:flex;align-items:center;gap:7px;padding:6px 0 6px 26px;
  color:var(--on-surface-variant);font:500 12px/16px var(--font)}
.leg svg{width:14px;height:14px;flex:0 0 14px}
.leg.bad{color:var(--warn-ink)}
.share-plan{width:100%;margin-top:20px;margin-bottom:4px;background:var(--rk-bg);color:var(--rk-ink)}
.presets{display:flex;flex-direction:column;gap:8px}
.preset{display:flex;gap:11px;align-items:flex-start;padding:12px;border:0;cursor:pointer;
  text-align:left;width:100%;background:var(--surface-container);border-radius:var(--corner-l);
  transition:transform var(--dur-short4) var(--spring)}
.preset:active{transform:scale(.985)}
.preset .pi{width:34px;height:34px;flex:0 0 34px;border-radius:var(--corner-m);
  display:grid;place-items:center;background:var(--rk-bg);color:var(--rk-ink)}
.preset .pi svg{width:18px;height:18px}
.preset .pt{flex:1;min-width:0}
.preset b{display:block;font:700 15px/20px var(--font)}
.preset span{display:block;margin-top:2px;color:var(--on-surface-variant);font:400 13px/18px var(--font)}

/* ---- overlays ---- */
.snack{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:900;
  padding:13px 8px 13px 16px;border-radius:var(--corner-l);
  background:var(--inverse-surface);color:var(--inverse-on-surface);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font:400 14px/20px var(--font);box-shadow:var(--elev-2);
  transform:translateY(16px);opacity:0;visibility:hidden;
  transition:transform var(--dur-med2) var(--ease-emph-decel),opacity var(--dur-short4),visibility var(--dur-med2)}
.snack.show{transform:none;opacity:1;visibility:visible}
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;z-index:800;
  transition:opacity var(--dur-med2),visibility var(--dur-med2)}
.scrim.show{opacity:.4;visibility:visible}
.fsheet{position:fixed;left:0;right:0;bottom:0;z-index:810;max-height:82%;
  display:flex;flex-direction:column;background:var(--surface);
  border-radius:var(--corner-xl) var(--corner-xl) 0 0;transform:translateY(101%);
  opacity:0;visibility:hidden;pointer-events:none;box-shadow:var(--elev-3);
  transition:transform var(--dur-med4) var(--ease-emph-accel),
             opacity var(--dur-short3),visibility var(--dur-med4)}
.fsheet.show{transform:none;opacity:1;visibility:visible;pointer-events:auto;
  transition:transform var(--dur-long2) var(--ease-emph-decel),opacity var(--dur-short3)}
.fsheet h2{margin:0;padding:8px 22px 4px;font:700 19px/25px var(--font);letter-spacing:-.4px}
.fbody{overflow-y:auto;padding:0 18px 12px;scrollbar-width:none}
.fbody::-webkit-scrollbar{display:none}
.fbody h3{margin:14px 0 9px;color:var(--on-surface-variant);
  font:700 11px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:2px}
.opt{height:40px;padding:0 15px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--surface-container);font:600 14px/20px var(--font);
  display:inline-flex;align-items:center;gap:7px;
  transition:background var(--dur-short2),color var(--dur-short2)}
.opt .ck{width:0;overflow:hidden;transition:width var(--dur-short3) var(--ease-emphasized)}
.opt .ck svg{width:15px;height:15px}
.opt>svg{width:17px;height:17px;flex:0 0 17px}
.opt[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.opt[aria-pressed="true"] .ck{width:15px}
.opt i{width:10px;height:10px;border-radius:50%;background:var(--sw,var(--outline))}
.linkrow{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 14px;
  border:0;border-radius:var(--corner-full);cursor:pointer;text-align:left;
  background:var(--surface-container);color:var(--on-surface)}
.linkrow>svg{width:17px;height:17px;flex:0 0 17px;color:var(--on-surface-variant)}
.linkrow .u{flex:1;min-width:0;display:flex;align-items:baseline;
  font:500 13px/18px var(--mono)}
.linkrow .u .p{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--on-surface-variant)}
.linkrow .u .q{flex:0 0 auto;color:var(--on-surface);font-weight:700}
.linkrow .cp{flex:0 0 auto;color:var(--primary);font:700 12px/16px var(--font);
  letter-spacing:.6px;text-transform:uppercase}
.ffoot{display:flex;gap:10px;padding:10px 18px calc(18px + env(safe-area-inset-bottom));align-items:center}
.btn-ghost{height:46px;padding:0 18px;border:0;border-radius:var(--corner-full);background:none;
  color:var(--on-surface-variant);cursor:pointer;font:600 14px/20px var(--font)}

/* ============================================================
   DESKTOP — the sheet stops being a sheet and becomes a rail
   ============================================================ */
@media (min-width:901px){
  .app{grid-template-columns:436px 1fr}
  .mapwrap{grid-area:1/2}
  .sheet{position:relative;grid-area:1/1;transform:none !important;height:100%;
    border-radius:0;box-shadow:none;border-right:1px solid var(--outline-variant);touch-action:auto}
  .grab{cursor:default;padding-top:calc(10px + env(safe-area-inset-top))}
  .handle{display:none}
  .sbody{overflow-y:auto !important;padding-bottom:24px}
  .dhero{margin-left:-14px;margin-right:-14px}
  .timeline{left:auto;width:calc(100% - 436px);padding:0 24px;top:calc(62px + env(safe-area-inset-top))}
  .snack{left:auto;right:24px;width:340px;bottom:24px}
  .fsheet{left:auto;right:24px;bottom:24px;width:410px;
    border-radius:var(--corner-xl);max-height:66%}
  .leaflet-control-zoom{display:block}
  .leaflet-top.leaflet-right{margin-top:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  /* asking for no motion usually means the device is also glad to skip these */
  .pill,.circle-btn,.seg,.tl-inner,.mk .lab{backdrop-filter:none;background:var(--surface)}
}
</style>
</head>

<div class="app">
  <div class="sheet" id="sheet" style="--y:62%">
    <div class="grab" id="grab">
      <div class="handle"><i></i></div>
      <div class="brand" title="">
        <span class="bm"><svg><use href="#i-bloom"/></svg>Festarri</span>
        <span class="bt" id="brandDay">Sat 29 Aug</span>
      </div>
      <div class="sheet-head">
        <button class="circle-btn" id="backBtn" hidden><svg><use href="#i-back"/></svg></button>
        <span class="ht"><b id="sheetTitle">On now</b><span id="sheetSub"></span></span>
        <button class="circle-btn" id="sharePlan" hidden><svg><use href="#i-share"/></svg></button>
        <button class="circle-btn" id="clearPlan" hidden><svg><use href="#i-trash"/></svg></button>
      </div>
      <div class="searchbar" id="searchbar" hidden>
        <svg><use href="#i-search"/></svg>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false">
        <button id="searchClear" aria-label="Clear"><svg><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="sbody locked" id="sbody"></div>
  </div>

  <div class="mapwrap">
    <div id="map"></div>
    <div class="maptint"></div>

    <div class="topbar">
      <div class="pillrow">
        <button class="pill" id="planPill" aria-pressed="false"><svg class="o"><use href="#i-bloom-o"/></svg><svg class="f" hidden><use href="#i-bloom"/></svg><span id="planLbl">My plan</span><span class="n" id="planN">0</span></button>
        <button class="pill" data-sheet="when" data-active="true"><svg><use href="#i-clock"/></svg><span id="whenLbl">On now</span></button>
        <button class="pill" data-sheet="rank" data-active="true"><svg><use href="#i-petal"/></svg><span id="rankLbl">Top picks</span></button>
        <button class="pill" data-sheet="type" data-active="false"><svg><use href="#i-tune"/></svg><span id="typeLbl">Type</span><span class="n" hidden></span></button>
        <button class="pill" data-sheet="special" data-active="false"><svg><use href="#i-door"/></svg><span id="specialLbl">Tonight only</span><span class="n" hidden></span></button>
        <button class="pill" data-sheet="where" data-active="false"><svg><use href="#i-rain"/></svg><span id="whereLbl">Shelter</span></button>
        <button class="pill" id="themePill"><svg id="themeIcon"><use href="#i-moon"/></svg><span id="themeLbl">Dark</span></button>
      </div>
      <button class="circle-btn" id="searchBtn" aria-label="Search"><svg><use href="#i-search"/></svg></button>
      <button class="circle-btn" id="langBtn" aria-label="Language">EN</button>
    </div>

    <div class="mapchrome">
    <div class="seg" role="group" aria-label="Base map">
      <button id="segMap" aria-pressed="true"><svg><use href="#i-map"/></svg><span id="segMapLbl">Map</span></button>

to the group’s performance: Bois – Woods. Having seen the performance is not a prerequisite for enjoying the workshop. \n\nInstruction languages: English and French. In the workshop, you can also work by following the example shown, in which case you don't need to understand the instruction language.","df":"Annantalon taidelauantaissa koko perhe voi viettää yhteistä aikaa taiteen parissa kaikille avoimissa työpajoissa, joissa voi piipahtaa tai viipyä pidempään.\n\nSAMPO Festivaalin vieras Puzzle Theatre Kanadasta kutsuu tekemään hahmoja ja tarinoita oksista ja puun kappaleista. Työpaja liittyy ryhmän esitykseen: Bois – Puut. Esityksen katsominen ei ole edellytys työpajasta nauttimiseen.\n\nOhjauskielet: englanti, ranska. Työpajassa voi työskennellä myös näytettyä esimerkkiä seuraamalla, jolloin ohjauskielen ymmärtäminen ei ole välttämätöntä.\n\nOsallistumiseen ei tarvita ennakkotaitoja ja kaikki ovat tervetulleita. Tarvittaessa lapsille on saatavilla kuulosuojaimia ja muita aistiapuvälineitä. Käytössä on myös rauhallinen tila. Annantalon taidelauantai on maksuton.\n\nLämpimästi tervetuloa Annantalolle lauantaisin!","c":"Visual arts","cs":["Lastentapahtumat","Kuvataide","Annantalo","Suomi","Ruotsi","Englanti"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_791531.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/A574D96B484AA70D46AC69AE6FC59D61/Annantalon_taidelauantai_Bois_Puut_","ue":"http://www.annantalo.fi/en/events/event/A574D96B484AA70D46AC69AE6FC59D61/Annantalo_Art_Saturday_Bois_Woods_","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"11:00-14:00","n":0,"nn":0,"i":"kulke:68670","qe":"","qf":"","qz":"","vp":0},{"src":"cur","eid":"cur65","t":"Anton Alvarez","te":"Anton Alvarez: The Colour of Gravity","v":"Helsinki Contemporary","ve":"Helsinki Contemporary","a":"Bulevardi 10","la":60.16556,"ln":24.94105,"s":720,"e":960,"d":"","df":"","c":"Participate","cs":["free"],"img":"https://api.hel.fi/linkedevents/media/images/260615__alvarez009202_09_small.jpg","u":"","ue":"","price":"free","r":1,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"12:00-16:00","n":0,"nn":0,"i":"cur65","qe":"","qf":"","qz":"","vp":0},{"src":"cur","eid":"cur66","t":"Love & Loss","te":"Love & Loss","v":"TakeMeHome","ve":"TakeMeHome","a":"Kauppiaankatu 8-10","la":60.1669,"ln":24.9673,"s":720,"e":960,"d":"","df":"","c":"Participate","cs":["free"],"img":"https://api.hel.fi/linkedevents/media/images/LoveLoss_some_poster_with_opening.jpg","u":"","ue":"","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"12:00-16:00","n":0,"nn":0,"i":"cur66","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"hkm:3466","t":"Lasten kaupunki","te":"Children's Town","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"Near the Senate Square, in the oldest city blocks of Helsinki, you can find the blue-grey Sederholm House, built in 1757. It is the oldest house in Helsinki. There, as a part of the Helsinki City Museum, is located Children’s Town, an exhibition especially targeted at the youngest citizens. In Children’s Town, children and their companions can learn more about Helsinki’s history through own experiences and joint activities.\n\nChildren’s Town offers an opportunity to jump into a horse-drawn carriage or steer a ship in 18th century surroundings. For the youngest museum visitors, there is a special marine play, reading and rest corner. You can study everyday items from the 1970s in Grandma’s House and watch the favourite TV shows of the time. On weekends, a museum grandma or grandpa is at home in Grandma’s House. In the 1930s elementary school class, you can just picture a schoolmaster with a pointer and a stern face.\n\nThere is a lot to study and explore. Showcases feature favourite toys from different periods, from little ponies to mutant turtles and Star Wars figures. The Sederholm shop from the 18th century is a perfect environment for playing shop. Puppets and amusing role costumes and role cards are available in the theatre. You can practise your writing skills, using old tools from sandbox to blackboard, and in another room, you can play with cars or decorate the dolls’ house","df":"Senaatintorin kulmalla Helsingin vanhimmissa kortteleissa sijaitsee siniharmaa Sederholmin talo, joka valmistui vuonna 1757. Se on Helsingin vanhin talo. Siellä sijaitsee pienimpien kaupunkilaisten oma Lasten kaupunki osana Helsingin kaupunginmuseota. Lasten kaupungissa leikki-ikäiset ja heidän seuralaisensa pääsevät tutustumaan Helsingin historiaan itse kokeillen ja yhdessä puuhaillen.\n\nLasten kaupungissa voi hypätä hevoskärryihin tai ohjata laivaa 1700-luvun tunnelmissa. Pienimmille museovieraille on oma merellinen leikki-, luku- ja leponurkkaus. Mummolassa saa tutkia 1970-luvun arjen esineitä ja katsoa televisiosta ajan suosikkiohjelmia. Viikonloppuisin mummolassa on mummo tai vaari kotona. 1930-luvun kansakoululuokkaan voi kuvitella tiukkailmeisen opettajan karttakeppeineen.\n\nTutkittavaa on paljon. Vitriineistä voi bongailla eri aikakausien suosikkileluja pikkuponeista mutanttikilpikonniin ja Tähtien sota -hahmoihin. Sederholmin 1700-luvun puodissa kauppaleikit kukoistavat. Teatterissa on käsinukkeja sekä hauskoja roolivaatteita ja roolikortteja. Kirjoitustaitojaan voi harjoittaa vanhan ajan välineillä hiekkapulpetista rihvelitauluun ja toisaalla leikkiä autoilla tai sisustaa suuren nukkekodin makunsa mukaan.\n\nLasten kaupungissa kaikkeen esillä olevaan saa koskea. Lapset leikkivät oman vanhempansa tai muun seuralaisensa vastuulla. Tervetuloa tutustumaan Helsingin historiaan","c":"Visual arts","cs":["everyday","cultural events","Helsinki residents","museums","urban history"],"img":"https://api.hel.fi/linkedevents/media/images/kaupunginmuseo_lasten_kaupunki_jussi_hellsten_5961.jpg","u":"https://www.helsinginkaupunginmuseo.fi/nayttelyt/lasten-kaupunki/","ue":"https://www.helsinginkaupunginmuseo.fi/en/exhibitions/childrens-town/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"hkm:3466","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp5dhl25y","t":"Minä ja maailmankaikkeus","te":"The Universe and I","v":"Tiedemuseo Liekin observatorio","ve":"Observatory of the Helsinki University Museum Flame","a":"Kopernikuksentie 1","la":60.16188,"ln":24.95167,"s":720,"e":1200,"d":"Dive into the world of astronomy and the history of the Observatory building! \n\nThe permanent exhibition, excluding the towers and the planetarium, is located on the main floor.\n\nHowever, by booking a guide you can add to your visit the old astronomical observation towers and a planetarium show.\n\nObservatory\n\nPermanent exhibition","df":"Observatorion perusnäyttely kutsuu kaikki vauvasta vaariin sukeltamaan avaruuden ihmeisiin ja Observatoriorakennuksen vaiheikkaaseen historiaan. \n\nNäyttely sijaitsee torneja ja planetaariota lukuun ottamatta Observatorion pääkerroksessa. Varaamalla opastetun kierroksen pääset näkemään myös tornit ja planetaarion.\n\nObservatorio\n\nPysyvä näyttely","c":"Visual arts","cs":["science","astronomy","outer space","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/2_observatorio_zoomaus_Saara_Sepp%C3%A4l%C3%A4.jpg","u":"https://www.helsinki.fi/fi/tiedemuseo-liekki/nayttelyt/mina-ja-maailmankaikkeus","ue":"https://www.helsinki.fi/en/helsinki-university-museum-flame/exhibitions/universe-and-i","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp5dhl25y","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agcmhmphwi","t":"Tekniikan maa","te":"TechLand","v":"Tekniikan museo","ve":"The Museum of Technology","a":"Viikintie 1d","la":60.21594,"ln":24.98309,"s":720,"e":1200,"d":"The exhibition highlights the role of technology, industry and innovation in the construction of 100-year-old Finland. The exhibition reveals the influence of technology on daily life, work and the environment, showcasing the past, present and future of technology and industry.\n\nThe starting point of the exhibition is the home, from where the themes expand to infrastructure, production, raw materials, processes as well as recycling and reuse of materials. The exhibition, which will be on display until 2026, will be renewed throughout its life cycle.\n\nMuseum of Technology\n\n1.10.2017-31.12.2027","df":"Tekniikan maa on näyttely teknologian, teollisuuden ja alan innovaatioiden roolista 100-vuotiaan Suomen rakentajina. Näyttely kertoo tekniikan vaikutuksesta arkeen, työhön ja ympäristöön ja esillä ovat niin teknologian ja teollisuuden menneisyys, nykyisyys kuin tulevaisuus.\n\nNäyttelyn lähtöpisteenä on koti, josta teemat laajenevat infrastruktuuriin, tuotantoon, raaka-aineisiin ja prosesseihin sekä uusiokäyttöön. Vuoteen 2026 asti esillä oleva näyttely uudistuu koko elinkaarensa ajan.\n\nSuomalaiset usein identifioituvat kekseliääksi insinöörikansaksi ja tekniikan nopeiksi omaksujiksi. Suomen tarinaa ei silti ole koskaan aiemmin esitetty tekniikan näkökulmasta.\n\nKokeminen ja tekeminen ovat näyttelyssä tärkeässä roolissa. Tavoite on innostaa ja yllättää niin alaa tuntevat kuin museon uudet yleisöt.\n\nTekniikan museo\n\n1.10.2017-31.12.2027","c":"Visual arts","cs":["technology","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/P9104994.JPG","u":"https://www.tekniikanmuseo.fi/nayttely/tekniikan-maa/","ue":"https://www.tekniikanmuseo.fi/en/exhibition/techland/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agcmhmphwi","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:afzapzc5sq","t":"Tunteita ja eleganssia","te":"Emotions and Elegance","v":"Internet","ve":"Internet","a":"","la":60.17058,"ln":24.94149,"s":720,"e":1200,"d":"Photographer Eino Partanen (1902–1962) recorded the Viipuri theatre scene for a period of ten years 1929–1939. \n\nThe online exhibition Emotions and Elegance leads the visitor across decades, in the middle of the of vibrant theatre scene of the buoyant Viipuri.\n\nEmotions and Elegance exhibition conveys, true to its title, the emotions provoked in the audience, and the elegance of a soirée at the theatre.\n\nInternet \nFree entry","df":"Valokuvaaja Eino Partanen (1902–1962) kuvasi viipurilaista teatteria 10 vuoden ajan vuosina 1929–39.\n\nVerkkonäyttely Tunteita ja eleganssia johdattaa vuosikymmenten taakse, keskelle iloisen Viipurin vireää teatterielämää.\n\nTunteita ja eleganssia -näyttely välittää nimensä mukaisesti niitä tunteita, joita yleisö sai katsomossa kokea, ja eleganssia, joka teatteri-iltoihin liittyi.\n\nInternet\nVapaa pääsy","c":"Theatre","cs":["photography exhibitions","Internet","theatre (art forms)","remote participation"],"img":"https://api.hel.fi/linkedevents/media/images/tuovi.jpg","u":"https://www.teatterimuseo.fi/fi/Tunteita-ja-eleganssia","ue":"https://www.teatterimuseo.fi/en/Emotions-and-Elegance","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:afzapzc5sq","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:afzarprjhy","t":"Tragedia ajassa - ajaton tragedia","te":"Tragedy in Time - Timeless Tragedy","v":"Internet","ve":"Internet","a":"","la":60.17058,"ln":24.94149,"s":720,"e":1200,"d":"This online exhibition explores ancient Greek tragedies performed on stage in Finland. It spans four decades, from the 1980s to 2013.\n\nWithin the timeline of this exhibition, more than twenty performances of Greek tragedies were staged in Finnish theatres reflecting an international trend. \n\nThe 2500 years old texts have lent themselves to a variety of experimentations in theatre aesthetics. The chorus, masks, texts in verse composition, and their timeless themes have challenged and inspired theatre artists.\n\nThe structure of the online exhibition follows that of the Theatre Museum exhibition (Tragedy in Time – Timeless Tragedy, 2013–14), which was divided into two main themes, Agora and Ecstasy. These themes are explored through photographic materials, video recordings, interviews, masks, programme leaflets, and tragedy voices i.e. text extracts.\n\nInternet\nFree of charge","df":"Verkkonäyttely Tragedia ajassa – ajaton tragedia esittelee Suomessa esitettyjä antiikin kreikkalaisia tragedioita. Näyttelyn sisältö lähtee liikkeelle 1980-luvun esityksistä ja kulkee aina 2013 vuoteen saakka.\n\nKreikkalaisten tragedioiden esityksiä oli näyttelyn käsittelemän ajanjakson aikana suomalaisissa ammattiteattereissa yli kaksikymmentä.\n\n2500 vuotta vanhat näytelmätekstit ovat taipuneet monenlaisten teatteriesteettisten kokeilujen välineiksi. Kuoro, naamiot, runomuotoiset tekstit ja niiden ajattomiksi koetut teemat ovat haastaneet ja innoittaneet teatteritaiteilijoita.\n\nVerkkonäyttely mukailee vuosina 2013–2014 Teatterimuseossa esillä ollutta samannimistä näyttelyä. Näyttelyn sisältö jakaantuu kahteen pääteemaan: Agora ja Hurmos. Näitä teemoja käsitellään valokuvamateriaalien, videotallenteiden, ohjaajahaastattelujen, naamioiden, käsiohjelmien ja tragediaäänien eli tekstikatkelmien kautta.\n\nInternet\nMaksuton","c":"Theatre","cs":["photography exhibitions","Internet","theatre (art forms)","remote participation"],"img":"https://api.hel.fi/linkedevents/media/images/Herakles.jpg","u":"https://www.teatterimuseo.fi/fi/Tragedia-ajassa-ajaton-tragedia","ue":"https://www.teatterimuseo.fi/en/Tragedy-in-Time--Timeless-Tragedy","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:afzarprjhy","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:afzapwtbae","t":"Teatterimuseo: Teatterin ABC","te":"Teatterimuseo: Teatterin ABC","v":"Internet","ve":"Internet","a":"","la":60.17058,"ln":24.94149,"s":720,"e":1200,"d":"Teatterin ABC-sivustolla voi kokeilla Teatterimuseon ainutlaatuisia pukuja virtuaallisesti. Sieltä löytyy myös helpot ohjeet, miten kotikonstein voi tehdä oman pienoismallin, pienoismaailman.\n\nOsaatko tehdä roolitusta? Vai onko sinussa salapoliisin vikaa ja voisit olla hyvä profiloija?\nOletko tyylitaituri ja pystyt helposti määrittelemään mitä tyylilajia esitys edustaa?\nEntä oletko miettinyt miksi sama näytelmä esitetään uudelleen? Romeo ja Julia -peli avaa silmäsi ja ymmärrät, miksi.\n\nTeatterin ABC -sivustolla pääsee myös tutustumaan näyttelijäntyön tyylilajeihin, lavastukseen ja pukusuunnitteluun.\n\nInternet \nVapaa pääsy","df":"Teatterin ABC-sivustolla voi kokeilla Teatterimuseon ainutlaatuisia pukuja virtuaallisesti. Sieltä löytyy myös helpot ohjeet, miten kotikonstein voi tehdä oman pienoismallin, pienoismaailman.\n\nOsaatko tehdä roolitusta? Vai onko sinussa salapoliisin vikaa ja voisit olla hyvä profiloija?\nOletko tyylitaituri ja pystyt helposti määrittelemään mitä tyylilajia esitys edustaa?\nEntä oletko miettinyt miksi sama näytelmä esitetään uudelleen? Romeo ja Julia -peli avaa silmäsi ja ymmärrät, miksi.\n\nTeatterin ABC -sivustolla pääsee myös tutustumaan näyttelijäntyön tyylilajeihin, lavastukseen ja pukusuunnitteluun.\n\nInternet \nVapaa pääsy","c":"Theatre","cs":["Internet","virtuality","theatre (art forms)","remote participation"],"img":"https://api.hel.fi/linkedevents/media/images/Py%C3%B6rteit%C3%A4.jpg","u":"http://veikko.teatterimuseo.fi/teatterinabc/","ue":"https://tapahtumat.hel.fi/en/events/helsinki:afzapwtbae","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:afzapwtbae","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:af23nmwzda","t":"Aikakone","te":"Time machine","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"Most of us have probably wished we could sneak a peek into the past to see how people used to live. Now, you can do exactly that and step onboard our Time Machine that whisks you away to visit a very lively and authentic Helsinki of a hundred years past.\n\nSigne Brander’s photographs of Helsinki come alive\nTo commemorate the 150th anniversary of Signe Brander, a new 2.0 version has been created of the Time Machine virtual experience. The new Time Machine brings Signe Brander’s photographs to life with the help of VR technology to create an immersive and interactive spatial installation that takes visitors on a journey through Helsinki’s past. Time Machine 2.0 will whisk visitors away to early 20th-century Helsinki, where wooden houses are making way for a new city of stone castles. The new city is a mix of national romanticism, Art Nouveau and Nordic classicism – old traditions and new winds.\n\nDuring Brander’s lifetime, Helsinki was for the first time visible from new vantage points, such as the National Museum’s tower. In addition to the bird’s-eye view, Brander also photographed panoramas at street level, capturing everyday details of urban life. Time Machine 2.0 shows projections based on Brander’s panorama photos of Kallio Church and St Nicholas’ Church (now Helsinki Cathedral).\n\nBorn on 15 April 1869, Brander photographed Helsinki and life in Helsinki at the beginning of th","df":"Moni on joskus haaveillut mahdollisuudesta kurkistaa entisajan ihmisten elämään. Helsingin kaupunginmuseossa se onnistuu, sillä museokävijät voivat astua Aikakoneeseen, joka imaisee heidät elävään ja todentuntuiseen menneisyyden Helsinkiin.\n\nSigne Branderin valokuvat Helsingistä heräävät eloon\nAikakone herättää Signe Branderin valokuvat eloon ja immersiivinen, interaktiivinen tilainstallaatio kuljettaa kävijän läpi menneisyyden Helsingin. Aikakone 2.0 vie aikamatkaajan 1900-luvun alun Helsinkiin, jossa uusi kivilinnojen kaupunki valtaa alaa puutaloilta. Uusi kaupunki on sekoitus kansallisromantiikkaa, jugendia, sekä pohjoismaista klassismia – vanhaa perinnettä ja uusia tuulia.\n\nBranderin aikana Helsinki oli ensimmäistä kertaa nähtävissä uusista näköalapaikoista, kuten Kansallismuseon tornista. Lintuperspektiivin lisäksi Brander kuvasi panoraamoja myös katutasosta ja tavoitti näin kaupunkielämän arkiset yksityiskohdat. Aikakone 2.0:ssa nähdään projisioita, jotka perustuvat Branderin ottamiin panoraamakuviin Kallion kirkosta ja Nikolainkirkosta eli nykyisestä Tuomiokirkosta käsin.\n\n15. huhtikuuta 1869 syntynyt Brander kuvasi Helsinkiä ja helsinkiläistä elämänmenoa viime vuosisadan alussa, jolloin Helsingin muinaismuistolautakunta palkkasi hänet tallentamaan kiivaasti muuttuvaa kaupunkia. Branderin vuosina 1907–1913 kuvaamat 907 lasinegatiivia ovat kaupunginmuseon kokoelmien perus","c":"Visual arts","cs":["museums of cultural history","history","cultural history","virtuality","regional identity of Helsinki residents","photographs"],"img":"https://www.helsinginkaupunginmuseo.fi/wp-content/uploads/2016/01/190408_Aikakone2_vr_2-Edit.jpg","u":"https://www.helsinginkaupunginmuseo.fi/nayttelyt/aikakone/","ue":"https://www.helsinginkaupunginmuseo.fi/en/exhibitions/time-machine/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:af23nmwzda","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:af3wzcwooi","t":"Krunikan kortteleissa","te":"In the Quarters of Kruununhaka","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"Helsinki City Museum has produced the In the Quarters of Kruununhaka exhibition on electrical cabinets as part of the OmaStadi project. OmaStadi is Helsinki’s way of implementing participatory budgeting together with the residents. Some of the photographs in the exhibition were featured in the vote held in July 2020. The permanent exhibition consist of 29 photographs. Most of the photos are from the collections of Helsinki City Museum.\n\nThe images in the exhibition are nostalgic snapshots of the history of the district and changes in the urban environment. You can navigate from one electrical cabinet to another with the help of the map and start your tour in the location of your choice. The map: helsinginkaupunginmuseo.fi/en/quarters-of-kruununhaka\n\nImage: Eeva Rista / Helsinki City Museum. 1970","df":"Helsingin kaupunginmuseo on tuottanut Krunikan kortteleissa -valokuvanäyttelyn Kruununhaan sähkökaappeihin osana OmaStadi-hanketta. OmaStadi on Helsingin tapa toteuttaa osallistuvaa budjetointia yhdessä kaupunkilaisten kanssa. Osa näyttelyyn tulevista valokuvista oli mukana yleisöäänestyksessä, joka järjestettiin heinäkuussa 2020. Pysyvä näyttely koostuu 29 valokuvasta, jotka ovat pääosin Helsingin kaupunginmuseon kuvakokoelmista.\n\nNäyttelyn kuvat ovat nostalgisia välähdyksiä kaupunginosan historiasta ja kaupunkiympäristön muutoksesta. Sähkökaapilta toiselle voi suunnistaa kartan avulla ja kierroksen voi aloittaa itselleen sopivasta kohdasta. Kartta: helsinginkaupunginmuseo.fi/krunikan-kortteleissa\n\nKuvassa: Lapsia Meritullinkadun ja Liisankadun kulmassa. Kuva: Eeva Rista / Helsingin kaupunginmuseo. 1970","c":"Visual arts","cs":["photography exhibitions","outdoor recreation","cultural events","exhibitions","urban history"],"img":"https://api.hel.fi/linkedevents/media/images/Meritullinkatu_26_Liisankatu.jpg","u":"https://www.helsinginkaupunginmuseo.fi/nayttelyt/krunikan-kortteleissa/","ue":"https://www.helsinginkaupunginmuseo.fi/en/exhibitions/quarters-of-kruununhaka/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:af3wzcwooi","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:af5kileoqi","t":"Helsingin valitut palat","te":"Helsinki Bites","v":"Helsingin kaupunginmuseo","ve":"Helsinki City Museum","a":"Aleksanterinkatu 16","la":60.16886,"ln":24.95398,"s":720,"e":1200,"d":"The Helsinki Bites exhibition dives into the past of Helsinki, bringing up common memories about the city’s history.\n\nHistory comes near in the Helsinki Bites exhibition, allowing the visitor to experience the past of the city with all of their senses in many different points. “I remember that, that’s just what we used to have!” many visitors may exclaim in many different spots.\n\nFree entry","df":"Helsingin valitut palat -näyttely tekee sukelluksia Helsingin menneisyyteen ja tuo pintaan yhteisiä muistoja kaupungin historiasta. Näyttelyssä voi vierailla 1950-luvun kodissa tai ihailla yhdeksänkymmentä vuotta vanhaa pienoismallia vuoden 1878 Helsingistä.\n\n”Tuon minä muistan, tuollainen meilläkin oli!” saattaa moni huudahtaa tutkiessaan Helsingin valitut palat -näyttelyä. Historia tulee lähelle, ja monessa kohtaa kävijä pääsee kokemaan kaupungin menneisyyden kaikilla aisteillaan. \n\nVapaa pääsy","c":"Visual arts","cs":["cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/kaupunginmuseo_020321_kuva_jussi_hellsten_6279.jpg","u":"https://www.helsinginkaupunginmuseo.fi/nayttelyt/helsingin-valitut-palat/","ue":"https://www.helsinginkaupunginmuseo.fi/en/exhibitions/helsinki-bites/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:af5kileoqi","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:af6mbikcry","t":"Kotimuseo","te":"House Museum","v":"Sinebrychoffin taidemuseo","ve":"Sinebrychoff Art Museum","a":"Bulevardi 40","la":60.16252,"ln":24.93228,"s":720,"e":1200,"d":"The heart of the Sinebrychoff Art Museum is the unique home of Paul and Fanny Sinebrychoff, which has been on permanent display on the second floor of the building since 27 November 1921.\n\nThe Sinebrychoffs’ palatial town house at Bulevardi 40 was completed in 1842. The building was immediately considered to be one of the most significant private homes in Helsinki.\n\nThe last occupants of the house bearing the name Sinebrychoff, Paul and Fanny Sinebrychoff, were passionate art enthusiasts. They collected the most beautiful European art and objects for their home. When their collections were donated to the Finnish state in 1921, they comprised more than 900 items.\n\nPaul and Fanny’s wish to open the doors of their home to the public to see the art treasures they had collected was recorded in a will almost one hundred years ago. The same spirit still lives on in the museum.\n\nSinebrychoff Art Museum\n\n27.11.2021-31.1.2040\n\nFree entry","df":"Sinebrychoffin taidemuseon ytimen muodostaa Paul ja Fanny Sinebrychoffin ainutlaatuinen kotimiljöö, joka on pysyvästi esillä museon toisessa kerroksessa.\n\nVuonna 1842 valmistui Sinebrychoffien kaupunkipalatsi Bulevardi 40:een. Rakennusta pidettiin heti yhtenä Helsingin merkittävimpänä yksityistalona.\n\nTalon viimeiset Sinebrychoff-nimiset asukkaat, Paul ja Fanny Sinebrychoff, olivat intohimoisia taiteenharrastajia. He keräsivät kotiinsa kauneinta eurooppalaista taidetta ja esineistöä. Kun kokoelmat lahjoitettiin valtiolle 1921, ne sisälsivät jo yli 900 teosta.\n\nPaulin ja Fannyn toive avata kaikille ovet keräämiensä taideaarteiden äärelle on kirjattu testamenttiin lähes sata vuotta sitten. Sama henki elää museossa edelleenkin.\n\nSinebrychoffin taidemuseo, 2. krs\n\n27.11.2021-31.1.2040\n\nVapaa pääsy","c":"Visual arts","cs":["home museums","art","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Kustavilainen-sali.jpg","u":"https://sinebrychoffintaidemuseo.fi/nayttelyt/kotimuseo/","ue":"https://sinebrychoffintaidemuseo.fi/en/exhibitions/house-museum/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:af6mbikcry","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agcthjidge","t":"Tahdon tarina","te":"The Story of Tahto","v":"Urheilun ja liikunnan kulttuurikeskus TAHTO","ve":"Cultural Centre of Sports TAHTO","a":"Paavo Nurmen tie 1, Olympiastadion","la":60.18658,"ln":24.9257,"s":720,"e":1200,"d":"The new exhibition is enlivened by versatile and unique audiovisual contents that guide the visitor from story to another and emotion to another: from the Helsinki Olympic Games to the world of e-sports, from excitement through disappointment to joy for victory. \n\nThe exhibition brings the heroes of Finnish success sports, such as track and field athletics, Formula One racing and ice hockey, as well as Finnish people who climb mountains, jump from airplanes or negotiate rapids and rails.\n\nCultural Centre of Sports Tahto\n\nPermanent exhibition\n\nMon-Tue & Fri: 10-18\nWed-Thu: 10-19\nSat-Sun: 11-17\n\nPrices:\nChildren 0–6 years: Free admission\nChildren 7–17 years:4 €\nAdults: 16 €\n\nStudents, seniors, conscripts, persons undergoing non-military service, unemployed: 11 €","df":"Tahdon päänäyttely tuntuu kaikilla aisteilla, kuten urheilu. Urheilu läpäisee koko yhteiskunnan, ja ihmisen.\n\nNäyttelyssä kävijä voi eläytyä jännitykseen, riemuun tai vaikka pettymykseen. Näyttely koostuu viidestä teemasta, mitkä ovat pukuhuone, Helsinki 1952, elämysurheilu, sankaruus sekä lumi ja jää.\n\nNäyttelysuunnistus tarjoaa lapsille ja nuorille oivalluksia historiasta ja nykypäivästä. Näyttelyssä saa halutessaan myös hien pintaan.\n\nTahdon tarina rakentuu kansainvälisesti ainutlaatuisista ja laajoista liikuntakulttuurin kokoelmista, mitä on kerätty 1900-luvun alusta alkaen.\n\nUrheilun ja liikunnan kulttuurikeskus Tahto\n\nPysyvä näyttely\n\nMa-ti & pe klo 10-18\nKe-to klo 10-19\nLa-su klo 10-17\n\nHinnat:\nLapset 0–6 V: Vapaa pääsy\nLapset 7–17 V: 6,50 €\nAikuiset: 16 €\n\nOpiskelijat, eläkeläiset, varushenkilöt, siviilipalvelushenkilöt, työttömät: 11 €","c":"Visual arts","cs":["exhibitions","sports"],"img":"https://api.hel.fi/linkedevents/media/images/50A7026-1-1440x900.jpg","u":"https://tahto.com/nayttelyt/urheilumuseon-paanayttely/","ue":"https://tahto.com/en/exhibitions/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agcthjidge","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:aggljuz7va","t":"Kiasma Online Art","te":"Kiasma Online Art","v":"Internet","ve":"Internet","a":"","la":60.17058,"ln":24.94149,"s":720,"e":1200,"d":"Kiasma Online Art is the web extension of Kiasma’s Collection. It is an internet experience and tribute to today’s online art-makers.\n\nA growing amount of art is being created exclusively for online environments, social media platforms, blogs and mobile apps. Kiasma Online Art is a compendium of topical online works by contemporary artists.\n\nThe audience plays an active role in many of these works, which include everything from gaming-based art, a VR film and digital paintings to a Random Number Generator that writes poetry and a mixing platform inviting users to create their own soundscapes.\n\nKiasma Online Art takes the art beyond the walls of the museum, making the online collection accessible to anyone, anytime and anywhere. It marks a paradigm shift in the way that art is created, presented and experienced. What happens when art is encountered not in a museum, but online? Is the experience entirely different when art is accessed via smartphone on a crowded bus or on the sofa at home? Can art spread in the form of internet memes?\n\nInternet","df":"Kiasma Online Art on Kiasman verkkotaiteen kokoelma. Se on internet-elämys ja kunnianosoitus tämän päivän taiteentekijöille.\n\nKasvava määrä taidetta tehdään suoraan nettiin, sosiaaliseen median kanaviin, blogialustoille tai esimerkiksi mobiilisovelluksiksi. Kiasma Online Art sivustolle on koottu valikoimia ajankohtaista verkkotaidetta.\n\nKatsoja saa monessa teoksessa aktiivisen roolin. Sivusto tarjoaa mm. pelillisiä teoksia, VR-elokuvan, digitaalisia maalauksia, runoja suoltavan satunnaislukugeneraattorin ja äänitaiteen miksausalustan.\n\nKiasma Online Art levittää taiteen museon seinien ulkopuolelle, koettavaksi missä ja milloin tahansa. Samalla se muuttaa taiteen tekemistä, esittämistä ja kokemista. Mitä tapahtuu taiteelle, kun se kohdataan museon sijaan netissä? Muuttuuko kokemus, kun teoksen voi kokea omalla puhelimella ruuhkabussissa tai kotisohvalla? Voiko taide levitä meemien lailla?\n\nInternet","c":"Visual arts","cs":["remote participation","exhibitions","art exhibitions","contemporary art"],"img":"https://api.hel.fi/linkedevents/media/images/Finalnd_Helsinki_people_bic_79xANe9.jpg","u":"https://onlineart.kiasma.fi/","ue":"https://onlineart.kiasma.fi/en/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:aggljuz7va","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agcrba6zjq","t":"Ajan kysymys","te":"A Question of Time","v":"Ateneumin taidemuseo","ve":"Ateneum Art Museum","a":"Kaivokatu 2","la":60.17009,"ln":24.9441,"s":720,"e":1200,"d":"The collection exhibition A Question of Time reflects on the major questions of the present time through art. \n\nThe exhibition also offers fresh perspectives into Finland’s oldest and most extensive art collection and how it was built.\n\nAteneum Art Museum\n\nPermanent exhibition, starting from 14.4.2023\n\nAdmission fee 13-23€, under 18 yrs free entry","df":"Ajan kysymys -kokoelmanäyttely katsoo Ateneumin neljältä eri vuosisadalta teoksia sisältävää kokoelmaa ja etenkin sen muodostumista uusin silmin. \n\nMiten vallankäyttö ja aatteet, yksilöt kuten museon työntekijät ja keräilijät sekä puhdas sattuma ovat vaikuttaneet kokoelmaan? Miksi jotakin on hankittu ja toisaalta jätetty hankkimatta?\n\nAjankohtaiseen, yhteiskunnalliseen keskusteluun Ajan kysymys osallistuu teemavalinnoillaan Luonnon aika, Kansan kuvat, Moderni elämä ja Taiteen vallassa.\n\nAteneumin taidemuseo avaa ovensa yleisölle jälleen 14. huhtikuuta 2023, museo suljettiin maaliskuussa 2022 ilmanvaihtoremontin takia.\nNäyttelyitä on vuodelle 2023 luvassa kolme. Näistä en hentic Helsinki of a hundred years past.\n\n<h4>Signe Brander’s photographs of Helsinki come alive</h4> To commemorate the 150th anniversary of Signe Brander, a new 2.0 version has been created of the Time Machine virtual experience. The new Time Machine brings Signe Brander’s photographs to life with an immersive and interactive spatial installation that takes visitors on a journey through Helsinki’s past. Time Machine 2.0 will whisk visitors away to early 20th-century Helsinki, where wooden houses are making way for a new city of stone castles. The new city is a mix of national romanticism, Art Nouveau and Nordic classicism – old traditions and new winds.\n\nDuring Brander’s lifetime, Helsinki was for the first time visible from new vantage points, such as the National Museum’s tower. In addition to the bird’s-eye view, Brander also photographed panoramas at street level, capturing everyday details of urban life. Time Machine 2.0 shows projections based on Brander’s panorama photos of Kallio Church and St Nicholas’ Church (now Helsinki Cathedral).\n\nBorn on 15 April 1869, Brander photographed Helsinki and life in Helsinki at the beginning of the previous century, when sh","df":"Moni on joskus haaveillut mahdollisuudesta kurkistaa entisajan ihmisten elämään. Helsingin kaupunginmuseossa se onnistuu, sillä museokävijät voivat astua Aikakoneeseen, joka imaisee heidät elävään ja todentuntuiseen menneisyyden Helsinkiin.\n\n<h4>Signe Branderin valokuvat Helsingistä heräävät eloon</h4> Aikakone herättää Signe Branderin valokuvat eloon ja immersiivinen, interaktiivinen tilainstallaatio kuljettaa kävijän läpi menneisyyden Helsingin. Aikakone 2.0 vie aikamatkaajan 1900-luvun alun Helsinkiin, jossa uusi kivilinnojen kaupunki valtaa alaa puutaloilta. Uusi kaupunki on sekoitus kansallisromantiikkaa, jugendia, sekä pohjoismaista klassismia – vanhaa perinnettä ja uusia tuulia.\n\nBranderin aikana Helsinki oli ensimmäistä kertaa nähtävissä uusista näköalapaikoista, kuten Kansallismuseon tornista. Lintuperspektiivin lisäksi Brander kuvasi panoraamoja myös katutasosta ja tavoitti näin kaupunkielämän arkiset yksityiskohdat. Aikakone 2.0:ssa nähdään projisioita, jotka perustuvat Branderin ottamiin panoraamakuviin Kallion kirkosta ja Nikolainkirkosta eli nykyisestä Tuomiokirkosta käsin.\n\n15. huhtikuuta 1869 syntynyt Brander kuvasi Helsinkiä ja helsinkiläistä elämänmenoa viime vuosisadan alussa, jolloin Helsingin muinaismuistolautakunta palkkasi hänet tallentamaan kiivaasti muuttuvaa kaupunkia. Branderin vuosina 1907–1913 kuvaamat 907 lasinegatiivia ovat kaupunginmuseon kokoelm","c":"Visual arts","cs":["everyday","cultural events","Helsinki residents","museums","urban history"],"img":"https://www.helsinginkaupunginmuseo.fi/wp-content/uploads/2016/01/190408_Aikakone2_vr_2-Edit.jpg","u":"https://www.helsinginkaupunginmuseo.fi/nayttelyt/aikakone/","ue":"https://www.helsinginkaupunginmuseo.fi/en/exhibitions/time-machine/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"hkm:3465","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agky7xt45i","t":"Yrityksen perustaminen Suomessa -video","te":"Starting a Business Info Video","v":"Internet","ve":"Internet","a":"","la":60.17058,"ln":24.94149,"s":720,"e":1200,"d":"Are you considering Entrepreneurship? Start by watching our “Starting a Business Info” video in English! You can watch or return to this video at anytime.\n\nBecoming an entrepreneur always raises many questions. This video will help you take your first steps as an entrepreneur in Finland.\n\nWhat forms of entrepreneurship are you considering ? Do you know the difference between starting a business as a Sole Trader (toiminimi) and starting a Limited Liability Company (osakeyhtiö)?\n\nWhat should you expect when you become an entrepreneur? What kind of permits and insurance policies might you need? Have you thought about taxation, including Value Added Tax (VAT), or how to register your company? What else is there to consider as an entrepreneur and in what order should you proceed with everything?\n\nIf you would like to apply for a startup grant, you should submit your application before you register your business. Read more about startup grants here. \n\nWatch the video on Helsinki Channel here. \n\nThis video lasts about 22 minutes.","df":"Harkitsetko yrityksen perustamista? Katso ensin Business Helsingin video ”Yrityksen perustaminen Suomessa”.\n\nYritystä perustaessa herää varmasti monia kysymyksiä. Tämä video auttaa sinua ottamaan ensimmäiset askeleet kohti yrittäjäksi ryhtymistä Suomessa.\n\nTiedätkö jo mikä yrittäjyyden muoto sinua kiinnostaa? Mitä eroa on toiminimellä yrittäjänä toimimisella ja osakeyhtiöllä?\n\nMikä muuttuu, kun ryhdyt yrittäjäksi? Mitä lupia ja vakuutuksia tarvitset? Entä verotus ja arvonlisävero (ALV)? Miten rekisteröit yrityksen? Mitä muuta yrittäjän tulisi ottaa huomioon, ja missä järjestyksessä eri asiat kannattaa hoitaa?\n\nJos haluat hakea starttirahaa, hakemus tulee jättää ennen yrityksen rekisteröintiä. Lue lisää starttirahasta täältä . \n\nKatso video Helsinki-kanavalla tästä. \n\nVideo kestää noin 19 minuuttia. \n\nVideon luomiseen on käytetty tekoälyä. Puhujan puhe ja eleet ovat tekoälyn tuottamia mutta puhutut sisällöt on tehty ja tarkastettu Business Helsingin yritysneuvonnan ammattilaisten toimesta.","c":"Literature","cs":["lectures","remote participation","enterprises","immigrants"],"img":"https://assets-eur.mkt.dynamics.com/089320dc-8a9a-43cf-9176-ed14943f8904/digitalassets/images/385da679-fa69-ef11-bfe2-00224886462f","u":"https://www.helsinkikanava.fi/fi/video/details/399985101","ue":"https://www.helsinkikanava.fi/en/video/details/308875904","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agky7xt45i","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:67091","t":"Piilossa tapahtuu!","te":"Piilossa tapahtuu!","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":1200,"d":"Annantalo’s side programme for the Piilossa (Hidden) exhibition includes a variety of events and workshops – and, sometimes, even the exhibition itself changes!","df":"Piilossa-näyttelyn ohessa järjestetään tapahtumia ja työpajoja – välillä jopa näyttely itsessään muuttuu!\n\nTältä sivulta näet listauksen, josta näet mitä kaikkea on tulossa:\n\nto 9.10.2025\n Perhosia piilossa \nUusi teos näyttelyssä - Kuvataideryhmä Suti ja roiske ja Tanssi- ja kuvataideryhmä Värisevät varpaat ovat laittaneet näyttelytilaan perhosia piiloon - löydätkö ne?\n\nto 15.11.2025\n Piiloutuneet lapset \nUusi teos näyttelyssä - Ryhmät Lumotut silmät ja Lumotut kädet ovat toteuttaneet installaation keramiikka ja akryylimaalaus installaation, joissa naamioiden takana on piilossa salaperäinen lasten joukko.\n\nke 26.11.-20.12.2025\n Muotokuvia Suomen eläimistä \nUusi teos näyttelyssä - Helsingin ranskalais-suomalaisen koulun 5B:n ja Vuoniityn peruskoulun 4E:n hiilipiirrokset ovat esillä Kellari tilassa.\n\nla 29.11.2025 klo 10.30 \n Tehdään taidejuttuja: Piiloleikkiä ryövärien metsässä \nSukella Ronja Ryövärintyttären maailmaan teatterityöpajassa!\n\nla 29.11.2025 klo 11.00 - 14.00\n Annantalon taidelauantai: Mullan alla \nMinkälaisia asioita voisi piileksiä mullan alla marraskuussa? Juuria, onkaloita, myyriä vai matojen makuuhuone? Annantalon taidelauantain työpajassa pääset piirtämään ruskan sävyisillä kuivapastelliiduilla oman tulkintasi maanalaisesta maailmasta.\n\nla 29.11.2025 klo 13.30 \n Tehdään taidejuttuja: Piiloleikkiä ryövärien metsässä \nSukella Ronja Ryövärintyttären maailmaan teat","c":"Visual arts","cs":["Lastentapahtumat","Annantalo","Muut tapahtumat","Suomi","Ruotsi","Englanti"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_777911.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/C43CBD3DDD54E539EF347E3727BEA24C/Piil
