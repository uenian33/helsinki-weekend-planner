n Spanish. Get in touch and stay updated via instagram @inkyhelsinki.\n\nFREE ENTRANCE — FOR AGES 7-12\n\nIN SPANISH — WITH SUPPORT IN ENGLISH IF NEEDED\n\nSATURDAY 29 AUG / 3 OCT / 7 NOV / 5 DEC — 15.00-16.30\n\nLIPPULAIVA LIBRARY — MAKERSPACE PAJA\n\nThe Poetry Factory \n\nFacilitated by Odette da Silva\n\nThe Poetry Factory is a creative space where words play, sing, and take on surprising shapes. Through fun activities that spark imagination, children explore poetry and develop their own voice in Spanish.\n\nOdette da Silva , poet and educator, believes that poetry can be a place of play and freedom for all ages. She is often joined by her 9-year-old son, who offers his help and builds a special bond with the participants.\n\nEach gathering at the Factory is a small adventure that can be enjoyed independently or as part of an ongoing poetic journey.\n\n--\n\nLa Fábrica de Poesía \n\nFacilitada por Odette d","df":"TÄRKEÄÄ TIETOA TYÖPAJAAN LIITTYEN:\n\nLAPSILLE – SUOSITELTU IKÄ 7–12 VUOTTA\n\nESPANJAKSI – TARVITTAESSA TUKEA SAATAVILLA MYÖS ENGLANNIKSI\n\nTapahtumapäivät ja kellonajat: 29.8., 3.10., 7.11. ja 5.12., klo 15.00–16.30. \n\nLa Fábrica de Poesía \n\nOhjaaja: Odette da Silva \n\nLa Fábrica de Poesía on luova runotyöpaja, jossa sanat leikkivät, laulavat ja ottavat yllättäviä muotoja. Lasten mielikuvitusta herättävien hauskojen aktiviteettien avulla työpajaan osallistuvat tutkivat runoutta ja kehittävät omaa ilmaisutapaansa espanjaksi.\n\nRunoilija ja opettaja Odette da Silva uskoo, että runous voi olla leikin ja vapauden paikka kaiken ikäisille. Silvan 9-vuotias poika tulee usein työpajoihin mukaan ja auttaa luomaan erityisen siteen osallistujien kanssa.\n\nJokainen työpaja on pieni seikkailu, josta voi nauttia itsenäisesti tai osana ryhmää.","c":"Literature","cs":["Kivenlahti","Espoonlahti","Soukka","Finnoo","Suvisaaristo","Kaitaa"],"img":"https://tapahtumasyotto.espoo.fi/media/images/163f900a-6fc6-43ee-9964-3cd279bcd473.jpg","u":"https://tapahtumat.hel.fi/fi/events/espoo_le:agp3ewdgee","ue":"https://tapahtumat.hel.fi/en/events/espoo_le:agp3ewdgee","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"15:00-16:30","n":0,"nn":0,"i":"espoo_le:agp3ewdgee","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:ago7nbiajm","t":"Improa! - Improvisoitu oopperaesitys","te":"Improa! - Improvisoitu oopperaesitys","v":"Lapland Hotels Bulevardi","ve":"Lapland Hotels Bulevardi","a":"Bulevardi 28","la":60.16373,"ln":24.93574,"s":900,"e":960,"d":"Kuvittele oopperalava, jolla kukaan ei tiedä etukäteen mitä seuraavaksi tapahtuu – eivät edes esiintyjät. Yleisön antamasta ideasta syntyy aaria, joka liikuttaa kyyneliin tai saa aikaan kunnon naurut – ja sitä ei koskaan enää toisteta.\n\nOopperaimprovisaatio on improvisoinnin lajeista kenties vaativin, sillä se yhdistää teatteri- ja musiikki-improvisaation. Kaikki lavalla nähty ja kuultu keksitään hetkessä: kohtaukset esitetään klassisella laulutyylillä laulaen, esiintyjät luovat tarinan ja tekstin, musiikin sekä näyttämöilmaisun. \n\nTämä improvisaation laji on vuorovaikutteinen ja katsojalle palkitseva, sillä yleisö pääsee vaikuttamaan monenlaisiin esityksen muuttujiin hahmoista juoneen, teemoihin ja tyylilajiin - esiintyjät toteuttavat yleisön toiveet itseään säästämättä.\n\nImproa! on perustettu alkujaan vuonna 2005 ja siihen kuuluu ammatissa toimivia oopperalaulajia ja improvisaatioon erikoistuneita pianisteja. Ryhmä on erikoistunut improvisoimaan kokoillan oopperoita vuorovaikutuksessa yleisön kanssa.\n\nEsiintyjät: mm. Mia Heikkinen, Jenni Lättilä ja Mikko Helenius (piano)\nTuotanto: Improa! -työryhmä\n\nLapland Hotels Bulevardi\n\n29.8.2026\n\n13.00-15.00\n\nVapaa pääsy, kesto 1 h","df":"Kuvittele oopperalava, jolla kukaan ei tiedä etukäteen mitä seuraavaksi tapahtuu – eivät edes esiintyjät. Yleisön antamasta ideasta syntyy aaria, joka liikuttaa kyyneliin tai saa aikaan kunnon naurut – ja sitä ei koskaan enää toisteta.\n\nOopperaimprovisaatio on improvisoinnin lajeista kenties vaativin, sillä se yhdistää teatteri- ja musiikki-improvisaation. Kaikki lavalla nähty ja kuultu keksitään hetkessä: kohtaukset esitetään klassisella laulutyylillä laulaen, esiintyjät luovat tarinan ja tekstin, musiikin sekä näyttämöilmaisun. \n\nTämä improvisaation laji on vuorovaikutteinen ja katsojalle palkitseva, sillä yleisö pääsee vaikuttamaan monenlaisiin esityksen muuttujiin hahmoista juoneen, teemoihin ja tyylilajiin - esiintyjät toteuttavat yleisön toiveet itseään säästämättä.\n\nImproa! on perustettu alkujaan vuonna 2005 ja siihen kuuluu ammatissa toimivia oopperalaulajia ja improvisaatioon erikoistuneita pianisteja. Ryhmä on erikoistunut improvisoimaan kokoillan oopperoita vuorovaikutuksessa yleisön kanssa.\n\nEsiintyjät: mm. Mia Heikkinen, Jenni Lättilä ja Mikko Helenius (piano)\nTuotanto: Improa! -työryhmä\n\nLapland Hotels Bulevardi\n\n29.8.2026\n\n13.00-15.00\n\nVapaa pääsy, kesto 1 h","c":"Theatre","cs":["opera (arts)","music","theatre (art forms)","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/a30140_febbe1949ef747b3a4710dc806fe6f0bmv2_1.jpeg","u":"https://www.oopperakesa.fi/oopperakesa-2026/improa!--oopperaimprovisaatioryhm%C3%A4","ue":"https://tapahtumat.hel.fi/en/events/helsinki:ago7nbiajm","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":0,"tl":"15:00-16:00","n":0,"nn":0,"i":"helsinki:ago7nbiajm","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:68347","t":"Metsän suojassa - Katja Luhtala ja Metsä M -kollektiivi: Metsäsydän - Oodi lähimetsille | Suomen luonnon päivä","te":"Metsän suojassa - In the Shelter of the Forest - Katja Luhtala and the Metsä M collective: Metsäsydän - Ode to Local Forests | Finnish Nature Day","v":"Kanneltalo","ve":"Cultural Centre Kanneltalo","a":"Klaneettitie 5","la":60.23885,"ln":24.8762,"s":900,"e":930,"d":"Metsäsydän – Oodi lähimetsille (‘Forest Heart – Ode to Local Forests’) is a gentle poetry performance that offers a place of respite where you can immerse yourself in memories of local forests through poetry, organic sounds and music.\n\nThe performance is a communal, group-based work that delves into personal and collective memories and emotions related to local forests.\n\nPerformers: Anneli Johansson, Eeva Markkanen, Johanna Mikkonen, Katja Luhtala, Minna Inkeli, Outi Pirinen\nDirection and dramaturgy: Katja Luhtala \nTexts: creative team, Sari Lilja, Miianinna Auringonsilta \nMusic, instruments and forest materials: creative team. Keyboard backgrounds: Katja Luhtala. Lullaby: Outi Pirinen and Eeva Markkanen. Hulda: Minna Inkeli and Katja Luhtala.\n\nThe event is part of the multi-sensory In the Shelter of the Forest exhibition and event series that invites you to reflect on the future of the forest through art, science and participation. Learn more about the event series .\n\nThe exhibition and events are part of the environmental programme of the City of Helsinki Cultural Services.\n\nThe exhibition and events are free of charge.","df":"Metsäsydän – Oodi lähimetsille on lempeä runoesitys, joka tarjoaa lepopaikan, jossa uppoutua runojen, orgaanisten äänten ja musiikin kautta lähimetsämuistoihin.\n\nEsitys on yhteisöllinen, ryhmälähtöinen teos, joka sukeltaa henkilökohtaisiin ja kollektiivisiin lähimetsiin liittyviin muistoihin ja tunteisiin.\n\nEsiintymässä: Anneli Johansson, Eeva Markkanen, Johanna Mikkonen, Katja Luhtala, Minna Inkeli, Outi Pirinen\nOhjaus ja dramaturgia: Katja Luhtala \nTekstit: työryhmä, Sari Lilja, Miianinna Auringonsilta \nMusiikki, soittimet ja metsämateriaalit: työryhmä, kosketintaustat: Katja Luhtala, Tuutulaulu: Outi Pirinen ja Eeva Markkanen, Hulda: Minna Inkeli ja Katja Luhtala.\n\nTapahtuma on osa moniaistista Metsän suojassa näyttelyä ja tapahtumakokonaisuutta, joka kutsuu pohtimaan metsän tulevaisuutta taiteen, tieteen ja osallistumisen kautta. Katso tarkemmat tiedot tapahtumista tapahtumakalenteristamme .\n\npe 14. – la 29.8. | Metsän suojassa -näyttely K sion (Helsinki Indie)\n17:00–18:00 – Dance Workshop (Salsa/Afro-Cuban)\n18:00–21:00 – Kari Grande , Angel (Millennium sound, MTV hits, ’00s, ’10s)\n\nTickets: €11 (K18)\nTickets from door or Kide.app \n\nThreads / IG","df":"ilta ihmisille, joiden nuoruuden soundtrack soi vuosina 2000–2015 ✨ \n\nTiivistämön ulkoterassilla 17:30-21: \nTommi Partynen (Radio Helsinki, Ihana, Punavuori ’00s sound)\n\nIso Roba room (sisällä):\nKlo 16-17 Dancers session (Helsinki Indie)\nKlo 17-18 Dance workshop (Salsa/AfroCuban)\nKlo 18-21 Kari Grande , Angel (Millenium sound, MTV hits, 00s, 10s)\n\nLiput 11€ Ovelta ja ennakkoon Kide.app:ista. (K18) \n\nThreads / IG","c":"Dance","cs":["dance (performing arts)","music"],"img":"https://api.hel.fi/linkedevents/media/images/ikuinen_millenium_1200.jpg","u":"https://www.threads.com/@ikuinenmillenium","ue":"https://www.threads.com/@ikuinenmillenium","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"16:00-21:00","n":0,"nn":0,"i":"helsinki:agp7vkfgpq","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp5xo5tgu","t":"Viapori Jazz: Mother of Jazz","te":"Viapori Jazz: Mother of Jazz","v":"Tenalji von Fersen","ve":"Tenaille Von Fersen","a":"Suomenlinna B 17c","la":60.14473,"ln":24.98322,"s":960,"e":1040,"d":"Known as the \"Mother of Jazz,\" Mary Lou Williams was one of the most influential composers, pianists and arrangers in jazz history. \n\nAmong her most ambitious works is Zodiac Suite, composed for jazz ensemble and classical orchestra. Written at a time when women composers received little recognition, the suite's twelve movements are dedicated to some of the era's greatest musicians, including Duke Ellington and Billie Holiday.\n\nIn this project by Aki Rissanen and Selma Savolainen, Zodiac Suite is given a new life. Newly composed vocal melodies and lyrics layered onto the original score transform the work from the abstract into something more personal and strikingly contemporary—giving it a voice that speaks to the present day as well.\n\nBeneath the vaulted ceilings of Tenalji von Fersen, audiences will experience both a tribute to the pioneering composer who paved the way for generations of women musicians and a compelling new work in its own right—all in one unforgettable performance.\n\nTenaille von Fersen\n\n29.8.2026\n\n16.00-17.20\n\nTickets 43€ from Lippupiste, age limit 18 yrs","df":"”Mother of Jazz” Mary Lou Williamsin Zodiac Suite 2026\n\nMary Lou Williams, ”Mother of Jazz” oli yksi jazzhistorian keskeisimmistä säveltäjistä, pianisteista ja sovittajista, jonka kunnianhimoisimpia teoksia on klassiselle orkesterille ja jazzyhtyeelle sävelletty Zodiac Suite. \n\nNoina musiikkimaailman totaalisen alinaisituksen aikoina sävelletyn teoksen 12 osaa on omistettu aikakauden suurille muusikoille, kuten Duke Ellingtonille ja Billie Holidaylle.\n\nAki Rissasen ja Selma Savolaisen projektissa Zodiac Suite saa uuden elämän, kun sen alkuperäisen muodon päälle luodut laulumelodiat ja tekstit vievät teosta abstraktista henkilökohtaisempaan ja ajankohtaisempaan suuntaan – kohti ääntä, joka kommentoi myös tätä aikaa. \n\nTenalji von Fersenin holvistossa on siis tarjolla niin kunnianosoitus seuraaville naispolville tietä avanneen säveltäjän perinnölle kuin itsenäinen nykyteoskin, samassa päräyttävässä paketissa! \n\nTenalji von Fersen\n\n29.8.2026\n\n16.00-17.20\n\nLiput 43€ Lippupisteestä, K-18","c":"Music","cs":["concerts","music","cultural events","jazz"],"img":"https://api.hel.fi/linkedevents/media/images/Aki_ja_Selma-_edited.jpg","u":"https://viaporijazz.fi/","ue":"https://viaporijazz.fi/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"16:00-17:20","n":0,"nn":0,"i":"helsinki:agp5xo5tgu","qe":"","qf":"Aki Rissanen ja Selma Savolainen soittavat Mary Lou Williamsia, saaressa.","qz":"Aki Rissanen 和 Selma Savolainen 演绎 Mary Lou Williams，在岛上。","vp":0},{"src":"hf","eid":"hf25492.1","t":"Zonzo Compagnie: Thelonious","te":"Zonzo Compagnie: Thelonious","v":"Suomen kansallisooppera, Alminsali","ve":"Finnish National Opera, Almi Hall","a":"Suomen Kansallisooppera ja -baletti, Helsinginkatu, Helsinki, Suomi","la":60.18158,"ln":24.92962,"s":990,"e":1080,"d":"The pioneering Belgian ensemble Zonzo Compagnie delights with a new production for the whole family, centered on jazz legend Thelonious Monk. A maverick genius based in New York, Monk composed music filled with unexpected harmonies and thrilling rhythms. \n\nWinner of the YAMaward for the best performance for young audiences, the production features the adventurous jazz trio De Beren Gieren, who guide the audience into Monk’s unique world through music and theatre. Nele Fack’s impressive video scenography sweeps viewers into the experimental life of the jazz hero, revealing ever-new facets of this fascinating musician. Benjamin Vandewalle’s lively direction draws both the musicians and the audience into a joyful choreography. \n\nSo, hop on the bebop train and dive into the depths of jazz with all your senses! Wherever this musical journey takes you, it is guaranteed to be a wild ride. \n\nThe performance is suitable for the whole family, with a target audience of children aged 6 and up. \n\nDirection: Benjamin Vandewalle \n\nDrums: Simon Raman\n\nPiano: Fulco Ottervanger \n\nDouble Bass: Lieven Van Pée \n\nVideo: Nele Fack (Studio Sandy) \n\nCostumes: Johanna Trudzinski \n\nTechnician: Pat Caers \n\nProduction: Zonzo Compagnie, in collaboration with HA Concerts, Krokusfestival, KAAP & De Grote Post \n\nSupported by: Flanders & the Creative Europe Programme of the European Union","df":"Uraauurtava belgialainen Zonzo Compagnie ilahduttaa uudella koko perheen teoksella, jonka keskiössä on jazz-legenda Thelonious Monk. New Yorkissa vaikuttanut Monk oli itsepäinen nero, joka sävelsi musiikkia täynnä yllättäviä harmonioita ja jännittäviä rytmejä. \n\nParhaiden nuorille suunnattujen esitysten YAMaward-palkinnon saaneessa teoksessa seikkailunhaluinen De Beren Gieren -jazztrio kuljettaa yleisön soittaen ja näytellen Monkin ainutlaatuiseen maailmaan. Nele Fackin vaikuttava videolavastus tempaa katsojat mukaan jazz-sankarin kokeilunhaluiseen elämään ja paljastaa yhä uusia puolia kiehtovasta muusikosta. Benjamin Vandewallen eläväinen ohjaus houkuttelee niin muusikot kuin yleisönkin mukaan riemastuttavaan koreografiaan. \n\nHyppää siis bebop-junan kyytiin, niin pääset sukeltamaan jazzin syövereihin kaikilla aisteilla! Mihin tahansa tämä musiikillinen retki viekään, matka on taatusti vauhdikas. \n\nTeos sopii koko perheelle, ja sen kohderyhmää ovat erityisesti yli 6-vuotiaat. \n\n” Thelonious ei keskity faktoihin, vaan musiikkiin. Kun tähän lisätään video ja muusikoiden tempaukset, yleisö on täysin lumoutunut – jokainen kappale on uusi kohokohta.” – De Standaard \n\nOhjaus: Benjamin Vandewalle \n\nRummut: Simon Raman \n\nPiano: Fulco Ottervanger \n\nKontrabasso: Lieven Van Pée \n\nVideo: Nele Fack (Studio Sandy) \n\nPuvustus: Johanna Trudzinski \n\nTekniikka: Pat Caers \n\nTuotanto: Zonzo Compag","c":"Participate","cs":["Helsinki Festival"],"img":"https://helsinkifestival.fi/app/uploads/sites/8/2026/03/KAYTA-TATA-Thelonious-c-Charlotte-Boeyden-480x270.jpg?ver=696274c7","u":"https://helsinkifestival.fi/event/zonzo-compagnie-thelonious/","ue":"https://helsinkifestival.fi/en/event/zonzo-compagnie-thelonious-2/","price":"","r":2,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":1,"tl":"16:30-18:00","n":0,"nn":0,"i":"hf25492.1","qe":"","qf":"","qz":"","vp":0},{"src":"cur","eid":"cur17","t":"Korjaamon Venetsialaiset","te":"Korjaamo Venetsialaiset","v":"Korjaamo","ve":"Korjaamo","a":"Töölönkatu 51 a-b","la":60.18412,"ln":24.91994,"s":1020,"e":1560,"d":"","df":"","c":"Participate","cs":["free","late"],"img":"https://korjaamo.fi/wp-content/uploads/2020/10/Vaunusali-181006-hertzen-w009.jpg","u":"","ue":"","price":"free","r":3,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":0,"rr":1,"tl":"17:00-02:00","n":0,"nn":0,"i":"cur17","qe":"Live jazz, foo non yhteisiä kappaleita. Ilta luo kihelmöivän mahdollisuuden myös loppukesään sopiville yllätysnumeroille. \n\nMaailmallakin menestystä niittänyt, vuonna 1997 perustettu Rajaton tunnetaan taidokkaasta ja moni-ilmeisestä äänimaailmastaan, joka yhdistelee ennakkoluulottomasti ja ainutlaatuisesti eri musiikkityylejä. \n\nClub For Five lumoaa yleisönsä rohkealla ja leikittelevällä otteellaan, jossa yhdistyvät syvä taituruus, huumori ja pohjoismainen musiikkiperinne. \n\nHuvilaan räätälöity, väliajallinen konsertti esittelee yleisölle sävelmaailman, jossa ihmisääni tekee mahdottomasta mahdollista. Juhlaviikkoyleisön hartaasti toivomasta illasta ei harmoniaa, energiaa saati karismaa puutu. \n\nLisätiedot: \n Ovet: 13.00\n\nRajaton & Club for Five: 14.00, konsertissa on väliaika\n\nKonsertti päättyy n. klo 16.30\n\nOvet: 17.30\n\nRajaton & Club for Five: 19.00, konsertissa on väliaika\n\nKonsertti päättyy n. klo 22.00\n\nIstuva katsomo, ei numeroituja paikkoja. \n\nHuvilan ikäraja on 18 vuotta.","c":"Participate","cs":["Helsinki Festival"],"img":"https://helsinkifestival.fi/app/uploads/sites/8/2025/12/HJV_rajaton_club_1920x1080-480x270.png?ver=e642bfe2","u":"https://helsinkifestival.fi/event/rajaton-club-for-five-3/","ue":"https://helsinkifestival.fi/en/event/rajaton-club-for-five/","price":"","r":2,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":1,"tl":"19:00-20:30","n":0,"nn":0,"i":"hf25200.0","qe":"","qf":"","qz":"","vp":0},{"src":"cur","eid":"cur39","t":"Skandaalinkäryinen syyskuu","te":"A Scandalous September","v":"NoName","ve":"NoName","a":"Hietaniemenkatu 7B","la":60.17034,"ln":24.92344,"s":1140,"e":1260,"d":"","df":"","c":"Participate","cs":[],"img":"https://api.hel.fi/linkedevents/media/images/ToL_Group_MyHelsinki_iVbyzX3.jpeg","u":"","ue":"","price":"21/16,80 €","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"19:00-21:00","n":0,"nn":0,"i":"cur39","qe":"","qf":"","qz":"","vp":0},{"src":"cur","eid":"cur40","t":"Before Sunset Experience","te":" :24.98322,"s":1200,"e":1280,"d":"Johanna Försti – Dolly Parton\n\nPardon, Ms. Parton. America isn't quite what it used to be – and neither is Dolly Parton...or at least not her songs once Johanna Försti has had her way with them. \n\nAt the bacchanalian finale of Viapori Jazz, the rulebook on harmony is officially thrown out the window as beloved songs by the legendary singer-songwriter are reimagined by Finland's reigning queen of vocalists. \n\nWhen Försti and her stellar band hit full throttle, there's only one thing left to do: let your guard down and surrender to pure musical euphoria.\n\nJohanna Försti – vocals\n\nAnssi Salminen – guitar\n\nMikko Antila – vibraphone\n\nJuho Kivivuori – bass\n\nAbdissa Mamba Assefa – percussion\n\nTenaille von Fersen\n\n29.8.2026\n\n20.00-21.20\n\nTickets 43€ from Lippupiste, age limit 18 yrs","df":"Pardon, ms. Parton. Amerikka ei ole entisensä eikä ole Dolly Partonkaan…… tai ainakaan hänen kappaleensa – Johanna Förstin käsittelyn jälkeen.\n\nSääntöpohjainen sointujärjestys on peruttu Viapori Jazzin viimeisen illan bakkanaaleissa, jossa kuullaan rakastetun laulaja-säveltäjän veisuja Suomen vokalistisen kuningattaren versioina. \n\nKun Försti pistää timanttisen yhtyeensä kanssa kiekkoa päätyyn, ei auta kuin päästää pyörylä puolustuksen läpi ja antautua eufonialle!\n\nJohanna Försti – laulu\n\nAnssi Salminen – kitara\n\nMikko Antila – vibes\n\nJuho Kivivuori – basso\n\nAbdissa Mamba Assefa – perc\n\nTenalji von Fersen\n\n29.8.2026\n\n20.00-21.20\n\nLiput 43€ Lippupisteestä, K-18","c":"Music","cs":["concerts","music","cultural events","jazz"],"img":"https://api.hel.fi/linkedevents/media/images/Johanna_F%C3%B6rsti_kuva_Tero_Ahonen_oMNuOLz.jpeg","u":"https://viaporijazz.fi/","ue":"https://viaporijazz.fi/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":0,"rr":0,"tl":"20:00-21:20","n":0,"nn":0,"i":"helsinki:agp5xg4vo4","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpqgw4yly","t":"Re-Charge","te":"Re-Charg /* The address bar is the share format. A link can name its language as a path
   (…/zh/, …/ch/, …/fi/) or as ?lang=, and can carry a whole plan as
   ?plan=<session>_<arrival>,… so a route can be handed to somebody. */
const LANG_ALIAS={en:'en',eng:'en',english:'en',
                  fi:'fi',fin:'fi',suomi:'fi',
                  zh:'zh',ch:'zh',cn:'zh',chinese:'zh','zh-cn':'zh','zh-hans':'zh','zh-hant':'zh'};
function langFromURL(){
  const q=new URLSearchParams(location.search).get('lang');
  if(q&&LANG_ALIAS[q.toLowerCase()])return LANG_ALIAS[q.toLowerCase()];
  const seg=location.pathname.split('/').filter(Boolean).pop();
  if(seg&&LANG_ALIAS[seg.toLowerCase()])return LANG_ALIAS[seg.toLowerCase()];
  return null;
}
function langFromBrowser(){
  for(const l of (navigator.languages||[navigator.language||''])){
    const k=String(l).toLowerCase();
    if(LANG_ALIAS[k])return LANG_ALIAS[k];
    const base=k.split('-')[0];
    if(LANG_ALIAS[base])return LANG_ALIAS[base];
  }
  return null;
}
function planFromURL(){
  const q=new URLSearchParams(location.search).get('plan');
  if(!q)return null;
  const out=q.split(',').map(pair=>{
    const [i,at]=pair.split('_');
    return {i,at:parseInt(at,10)};
  }).filter(p=>p.i&&!isNaN(p.at));
  return out.length?out:null;
}
const planParam=()=>plan.map(p=>p.i+'_'+p.at).join(',');
function shareURL(withPlan){
  const u=new URL(location.href);
  u.search='';u.hash='';
  /* a language directory already says the language, so do not say it twice */
  const seg=u.pathname.split('/').filter(Boolean).pop();
  if(!(seg&&LANG_ALIAS[seg.toLowerCase()]))u.searchParams.set('lang',lang);
  if(withPlan&&plan.length)u.searchParams.set('plan',planParam());
  return u.toString();
}
/* Keeps the address bar honest about the language, and leaves any ?plan that
   arrived in the link alone — a plan only enters a URL when somebody presses
   share, never because they happened to save something. */
function syncURL(){
  const u=new URL(location.href);
  const parts=u.pathname.split('/');
  const last=parts[parts.length-1]===''?parts.length-2:parts.length-1;
  const seg=(parts[last]||'').toLowerCase();
  if(seg&&LANG_ALIAS[seg]){
    if(LANG_ALIAS[seg]!==lang){parts[last]=lang;u.pathname=parts.join('/')}
    u.searchParams.delete('lang');
  }else{
    u.searchParams.set('lang',lang);
  }
  history.replaceState(null,'',u.toString());
}
function planText(){

  return t('shareIntro',{n:items.length})+'\n'+

    '\n\n'+t('shareOpens');
}
/* Hand it to the phone's own share sheet when there is one, so it lands in
   whatever the two of you actually talk in. Copy to the clipboard otherwise. */
async function sharePlanOut(){
  const url=shareURL(true);
  if(navigator.share){
    try{await navigator.share({title:'Taiteiden yö 2026',text:planText(),url});return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  await copyLink(true);
}
async function copyLink(withPlan){
  const url=shareURL(withPlan);
  try{await navigator.clipboard.writeText(url)}
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=url;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(_){}
    ta.remove();
  }
  toast(t('copied'));
}

/* ---------------- filtering ---------------- */
function passStatic(e){
  if(e.r<minRank)return false;
  if(onlyOpen&&!e.op)return false;
  if(onlyRare&&!e.rr)return false;
  if(cats.size&&!cats.has(e.c))return false;
  if(shelter==='in'&&e.io==='out')return false;
  if(shelter==='out'&&e.io==='in')return false;
  return true;
}
/* All three modes are relative to where the slider is, or the slider would be
   a clock rather than a control. "Rest of the night" is everything that has
   not finished yet, which is also what you actually want at 21:00: not the
   choir that sang at five. */
function passTime(e){
  if(mode==='all')return e.e>T;
  if(mode==='now')return e.s<=T&&e.e>T;
  return e.s>=T&&e.s<=T+45;
}
const fold=s=>String(s||'').toLowerCase()

  if(!query)return false;
  const hay=fold([e.t,e.te,e.v,e.ve,e.a,e.c,e.tl,e.d,e.df].join(' '));
  return fold(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}

function metres(a,b){
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLa=rad(b.lat-a.lat),dLn=rad(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function toggleLocate(){
  if(watchId!==null){

    drawMe();render();return;
  }
  if(!navigator.geolocation){toast(t('locFailed'));return}
  $('#locBtn').dataset.busy='1';toast(t('locating'));
  watchId=navigator.geolocation.watchPosition(pos=>{
    const first=!me;
    me={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy};
    $('#locBtn').dataset.busy='0';$('#locBtn').setAttribute('aria-pressed','true');
    drawMe();render();

let densityCache={key:null,val:null};
function density(){
  const key=[...cats].sort().join(',')+'|'+shelter;
  if(densityCache.key===key)return densityCache.val;
  const pool=EV.filter(e=>(!cats.size||cats.has(e.c))&&
    !(shelter==='in'&&e.io==='out')&&!(shelter==='out'&&e.io==='in'));
  const all=[],top=[];
  for(let m=T0;m<=T1;m+=5){
    const live=pool.filter(e=>e.s<=m&&e.e>m);
    all.push(live.length);top.push(live.filter(e=>e.r>=2).length);
  }
  densityCache={key,val:{all,top}};
  return densityCache.val;
}
function area(vals,max,h,y0){

  vals.forEach((v,i)=>{d+=`L${(i*step).toFixed(1)} ${(y0-(v/max)*h).toFixed(1)}`});
  return d+`L${SPAN} ${y0}Z`;

function walk(a,b){
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLa=rad(b.la-a.la),dLn=rad(b.ln-a.ln);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.la))*Math.cos(rad(b.la))*Math.sin(dLn/2)**2;
  return Math.max(2,Math.round(2*R*Math.asin(Math.sqrt(h))/75)+2);   /* 75 m/min + friction */
}
/* A stop is a visit, not the whole run of the event.
   A fixed performance ends when it ends and you plan around that.
   An open-all-evening venue is elastic: you stay until you have to leave for
   the next stop, so the only thing that can go wrong is having no time there. */
const FLEXIBLE=75;                                    /* longer than this is a venue you drop into, not a show you sit through */
function buildPlan(){
  const stops=plan.map(p=>({p,e:byId[p.i]})).filter(x=>x.e)
                  .sort((a,b)=>a.p.at-b.p.at||a.e.s-b.e.s);
  stops.forEach((v,k)=>{
    const e=v.e,next=stops[k+1];
    v.flex=(e.e-e.s)>FLEXIBLE;
    v.arrive=v.p.at;
    v.walkNext=next?walk(e,next.e):0;
    const mustLeave=next?next.p.at-v.walkNext:Infinity;
    v.depart=v.flex
      ? Math.max(v.arrive,Math.min(e.e,mustLeave===Infinity?Math.min(e.e,v.arrive+90):mustLeave))
      : e.e;
    v.stay=Math.max(0,v.depart-Math.max(v.arrive,e.s));
    v.missed=v.arrive>=e.e;
    v.early=v.arrive<e.s;
  });
  stops.forEach((v,k)=>{
    if(!k){v.walk=0;v.slack=null;return}
    const prev=stops[k-1];
    v.walk=prev.walkNext;
    v.slack=prev.flex?null:v.arrive-(prev.e.e+v.walk);   /* only a fixed show can be cut short */
  });
  return stops;
}

  document.documentElement.style.setProperty('--tl-h',$('.timeline').offsetHeight+'px');
}
let lastView=null;
/* Where the reader was before they opened something: the view, and how far down
   it they had scrolled. Going back without this is going back to the top. */
let returnTo=null;
function render(){
  $('#clock').textContent=fmt(T);
  $('#clock').dataset.off=Math.abs(T-clampT(nowMin()))>=10?'1':'0';
  $('#clock').title=t('nowLbl');
  const w=wxAt(T),onNow=EV.filter(e=>e.s<=T&&e.e>T);
  $('#tlSub').innerHTML=t('onCount',{a:onNow.length,b:onNow.filter(e=>e.r>=2).length})+
    ` · ${w[1]}°C · ${w[2]}%`+(T>=SUNSET?' · '+t('afterSunset'):'');
  $('#searchbar').hidden=view!=='search';
  if(view==='plan'){listSig=null;renderPlan()}
  else if(view==='search'){listSig=null;renderSearch()}
  else if(view==='detail')listSig=null;
  else renderList();
  if(lastView!==view&&view!=='detail'){$('#sbody').scrollTop=0}
  lastView=view;
  syncMarkers();
  if(tlOpen)drawTimeline();
  /* measureChrome reads a layout property, which after writing the list means
     laying the whole list out synchronously. The dock only changes size when it
     is opened, closed, resized or relabelled, so it is measured there instead. */
  $('#planN').textContent=plan.length;
  $('#planPill').setAttribute('aria-pressed',view==='plan');
  $('.o',$('#planPill')).hidden=view==='plan';
  $('.f',$('#planPill')).hidden=view!=='plan';
}

document.addEventListener('click',ev=>{
  const fav=ev.target.closest('[data-fav]');
  if(fav){ev.preventDefault();ev.stopPropagation();
    if(!plan.some(p=>p.i===fav.dataset.fav))favBurst(fav);
    toggleFav(fav.dataset.fav);return}
  const sh=ev.target.closest('[data-share]');
  if(sh){ev.preventDefault();
    if(sh.dataset.share==='plan')sharePlanOut();else copyLink(false);
    return}
  const at=ev.target.closest('[data-at]');
  if(at){
    ev.stopPropagation();
    const p=plan.find(x=>x.i===at.dataset.at),e=byId[at.dataset.at];
    if(p){p.at=Math.max(T0,Math.min(T1,p.at+ +at.dataset.d));savePlan();render()}
    return;
  }
  const pre=ev.target.closest('[data-preset]');
  if(pre){loadPreset(+pre.dataset.preset);return}
  const row=ev.target.closest('.row[data-i]');
  if(row)openDetail(row.dataset.i);
});
document.addEventListener('keydown',ev=>{
  const row=ev.target.closest&&ev.target.closest('.row[data-i]');
  if(row&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();openDetail(row.dataset.i)}

});
function toggleFav(id){
  justToggled=id;
  const k=plan.findIndex(p=>p.i===id),e=byId[id];
  if(k<0){
    /* the timeline position is the intent: adding at 22:00 plans you there at 22:00 */
    const at=Math.min(Math.max(T,e.s),Math.max(e.s,e.e-15));
    plan.push({i:id,at});toast(t('added'));
  }else{plan.splice(k,1);toast(t('removed'))}
  savePlan();
  if(view==='detail'&&sel)openDetail(sel,true,true);   /* refreshing the button must not scroll away */
  render();
  setTimeout(()=>{justToggled=null},600);
}
function loadPreset(k){

/* ---- the blast ----
   burstParts and favBurst are Festarri's, function for function. The palette
   is read off the pressed control rather than written down, so a magenta R3
   throws magenta and a green "normally closed" throws green. */
function burstParts(pal){
  const rnd=(a,b)=>a+Math.random()*(b-a),parts=[];
  [[0,560],[90,620]].forEach(pair=>parts.push({
    position:'absolute',width:'100%',height:'100%',borderRadius:'50%',
    border:'3px solid currentColor',opacity:0,willChange:'transform, opacity',
    animation:`fp-fav-ring ${pair[1]}ms cubic-bezier(.12,.78,.26,1) ${pair[0]}ms forwards`}));
  const wave=(count,o)=>{
    const spread=360/count;
    for(let i=0;i<count;i++){
      const sz=rnd(o.size[0],o.size[1]);
      const st={position:'absolute',opacity:0,willChange:'transform, opacity',
        '--a':((o.offset||0)+spread*i+rnd(-spread/4,spread/4)).toFixed(1)+'deg',
        '--d':rnd(o.dist[0],o.dist[1]).toFixed(3),'--fs':'40px',
        width:'calc(40px * '+sz.toFixed(4)+(o.kind==='streak'?' * 3.4':'')+')',
        height:'calc(40px * '+sz.toFixed(4)+')',
        borderRadius:'999px',
        background:pal[Math.floor(rnd(0,pal.length))],
        animation:`fp-fav-${o.kind==='petal'?'petal':'spark'} ${o.dur}ms `+
          `cubic-bezier(.08,.72,.2,1) ${(o.delay+rnd(0,70)).toFixed(0)}ms forwards`};
      /* A lobe with one corner brought to a point: the mark's own petal at
         confetti size. The box already travels along its line, so the point
         is the trailing corner and the petals fly tip-last. */
      if(o.kind==='petal')st.borderRadius='50% 50% 50% 0';
      parts.push(st);
    }
  };
  wave(14,{dist:[1.15,1.75],size:[.045,.07],delay:0,dur:640,kind:'streak'});
  wave(10,{dist:[.75,1.15],size:[.04,.065],delay:70,dur:580,offset:14});
  wave(6,{dist:[.95,1.45],size:[.10,.16],delay:130,dur:760,offset:28,kind:'petal'});
  return parts;
}
function favBurst(host){
  if(!host)return;
  const rect=host.getBoundingClientRect();
  if(!rect.width)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cs=getComputedStyle(host);
  const pal=['--rk-ink','--cat-ink','--primary','--cat-bg','--rk-ink']
    .map(v=>cs.getPropertyValue(v).trim()).filter(Boolean);
  const layer=document.createElement('div');
  layer.className='fp-blast';layer.setAttribute('aria-hidden','true');
  layer.style.color=pal[0]||'currentColor';
  layer.style.left=(rect.left+rect.width/2-20).toFixed(1)+'px';
  layer.style.top=(rect.top+rect.height/2-20).toFixed(1)+'px';
  burstParts(pal.length?pal:['#888']).forEach(st=>{
    const el=document.createElement('i');
    Object.keys(st).forEach(k=>{
      if(k.charAt(0)==='-')el.style.setProperty(k,st[k]);else el.style[k]=st[k]});
    layer.appendChild(el)});
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(),1300);
}
let toastT=null;
function toast(msg){
  $('#snackText').textContent=msg;$('#snack').classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>$('#snack').classList.remove('show'),2400);

$('#backBtn').onclick=()=>{

  rank:{title:()=>t('rankQ'),render:()=>`<h3>${t('rank')}</h3><div class="wrap">${

  type:{title:()=>t('typeQ'),render:()=>`<h3>${t('showOnly')}</h3><div class="wrap">${
    Object.keys(CATV).map(c=>`<button class="opt" data-cat="${c}" aria-pressed="${cats.has(c)}" style="${cv(c)};--sw:var(--cat-ink)">

    <div class="info"><span class="ic" style="background:var(--c-part-bg);color:var(--c-part-ink)">
      <svg><use href="#i-door"/></svg></span><span class="tx"><b>${t('openDoors')}</b><span>${t('openDoorsSub')}</span></span></div>
    <div class="info"><span class="ic" style="background:var(--c-visual-bg);color:var(--c-visual-ink)">
      <svg><use href="#i-petal"/></svg></span><span class="tx"><b>${t('rareLong')}</b><span>${t('rareSub')}</span></span></div>`},
  where:{title:()=>t('shelterQ'),render:()=>`<h3>${t('shelterNote')}</h3><div class="wrap">${
    [['any','anywhere'],['in','indoors'],['out','outdoors']].map(([v,k])=>
      `<button class="opt" data-shelter="${v}" aria-pressed="${shelter===v}">
        <span class="ck"><svg><use href="#i-check"/></svg></span>${t(k)}</button>`).join('')}</div>
    <h3>${t('hourly')}</h3>${WX.filter(x=>x[0]>=14&&x[0]<=27).map(x=>
      `<div class="info" style="padding:7px 0"><span class="ic" style="background:var(--c-dance-bg);color:var(--c-dance-ink)">
        <svg><use href="#i-rain"/></svg></span>
        <span class="tx"><b>${String(x[0]%24).padStart(2,'0')}:00 · ${x[2]}%</b>
        <span>${x[1]}°C · ${t('wind')} ${x[3]} km/h${x[0]===20?' · '+t('sunset'):''}</span></span></div>`).join('')}`},
  lang:{title:()=>t('language')+' · '+t('theme'),render:()=>`<div class="wrap">${
    Object.keys(STR).map(L=>`<button class="opt" data-lang="${L}" aria-pressed="${lang===L}">
      <span class="ck"><svg><use href="#i-check"/></svg></span>${STR[L].name}</button>`).join('')}</div>
    <h3>${t('theme')}</h3><div class="wrap">${
    [['light','light'],['dark','dark']].map(([v,k])=>
      `<button class="opt" data-theme="${v}" aria-pressed="${(isDark()?'dark':'light')===v}">
        <span class="ck"><svg><use href="#i-check"/></svg></span>${t(k)}</button>`).join('')}</div>
    <h3>${t('shareLink')}</h3>
    ${(()=>{const u=shareURL(false).replace(/^https?:\/\//,'');
      const cut=u.search(/(\?|\/(en|fi|zh|ch)\/?$)/i);
      const head=cut<0?u:u.slice(0,cut),tail=cut<0?'':u.slice(cut);
      return `<button class="linkrow" data-share="lang">
        <svg><use href="#i-share"/></svg>
        <span class="u"><span class="p">${esc(head)}</span><span class="q">${esc(tail)}</span></span>

/* ---------------- sheet drag (mobile only) ---------------- */
const sheet=$('#sheet'),grab=$('#grab'),sbody=$('#sbody');
let snaps=[],snapIdx=1,dragging=false,startY=0,startTop=0,lastY=0,lastT=0,vel=0;
const mobile=()=>window.matchMedia('(max-width:900px)').matches;
function calcSnaps(){
  const h=window.innerHeight;
  snaps=[Math.max(180,h-124),Math.round(h*0.42),72];
}
function setSnap(i,animate=true){
  if(!mobile()){sbody.classList.remove('locked');
    document.documentElement.style.setProperty('--sheet-y','0px');return}
  calcSnaps();snapIdx=Math.max(0,Math.min(2,i));
  sheet.classList.toggle('dragging',!animate);
  sheet.style.setProperty('--y',snaps[snapIdx]+'px');
  sheet.dataset.peek=snapIdx===0?'1':'0';
  document.documentElement.style.setProperty('--sheet-y',snaps[snapIdx]+'px');
  sbody.classList.toggle('locked',snapIdx===0);
  if(!animate)requestAnimationFrame(()=>sheet.classList.remove('dragging'));
}
grab.addEventListener('pointerdown',e=>{
  if(!mobile()||e.target.closest('button,input,.searchbar'))return;
  calcSnaps();dragging=true;sheet.classList.add('dragging');
  startY=e.clientY;startTop=parseFloat(sheet.style.getPropertyValue('--y'))||snaps[1];
  lastY=e.clientY;lastT=performance.now();vel=0;grab.setPointerCapture?.(e.pointerId)});
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const now=performance.now();vel=(e.clientY-lastY)/Math.max(1,now-lastT);
  lastY=e.clientY;lastT=now;
  sheet.style.setProperty('--y',Math.max(snaps[2]-16,Math.min(snaps[0]+70,startTop+e.clientY-startY))+'px');
  e.preventDefault()},{passive:false});
function endDrag(){
  if(!dragging)return;dragging=false;sheet.classList.remove('dragging');
  const y=parseFloat(sheet.style.getPropertyValue('--y'));
  let target;
  if(vel<-0.55)target=snapIdx===0?1:2;
  else if(vel>0.55)target=snapIdx===2?1:0;
  else target=snaps.indexOf(snaps.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a));
  setSnap(target);
}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
grab.addEventListener('click',e=>{
  if(!e.target.closest('button')&&Math.abs(vel)<.05&&snapIdx<2)setSnap(snapIdx+1)});
sbody.addEventListener('pointerdown',e=>{sbody.dataset.top=sbody.scrollTop<=0?e.clientY:''});
sbody.addEventListener('pointermove',e=>{
  if(sbody.dataset.top&&e.clientY-(+sbody.dataset.top)>26&&snapIdx===2){sbody.dataset.top='';setSnap(1)}});
sbody.addEventListener('pointerup',()=>sbody.dataset.top='');
window.addEventListener('resize',()=>{measureChrome();setSnap(snapIdx)});

/* ---------------- boot ---------------- */
try{const th=localStorage.getItem('ty26theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
if(urlPlan)view='plan';   /* look at it; the first edit is what adopts it */
applyBase();applyLang();setTimeline(tlOpen,false);setSnap(1,false);render();
map.whenReady(()=>setTimeout(()=>{
  map.invalidateSize();syncMarkers();
  /* somebody else's evening arrives framed, so the list and the map agree */
  if(urlPlan&&plan.length){calcSnaps();fitTo(plan.map(p=>byId[p.i]))}
},80));
map.on('zoomend',syncMarkers);
