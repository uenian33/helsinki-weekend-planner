istoa.","c":"Dance","cs":["guidance","physical training","sports"],"img":"https://api.hel.fi/linkedevents/media/images/kuntosali_lkhDAxE.jpg","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agp4y4xmoy","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agp4y4xmoy","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp4y4xmoy","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpxkmqsdm","t":"Rafa Macarrón | Anetta Lukjanova","te":"Rafa Macarrón | Anetta Lukjanova","v":"Train Factory","ve":"Train Factory","a":"Konepajanpasaasi 1","la":60.19344,"ln":24.94538,"s":720,"e":1200,"d":"Rafa Macarrón | Los noctivagueantes\n\nThe Spanish artist Rafa Macarrón displays anatomical ﬁgures with their stretched forms and extended proportions. The paintings are full of representations, which are peculiarly scaled. Macarrón’s visual language of human condition is based on reality, yet in a surreal way. \n\nAnetta Lukjanova | Witches' Flight\n\nAnetta Lukjanova works mainly in the medium of oil paintings and public murals in a large scale. Her works combine themes from mysticism, reality and pop culture, bringing forward almost magical version of contemporary ﬁgurative realism. \n\nMAKASIINI SUNDAY DIALOGUES \n\nSunday August 16 at 14.00\n\nMakasiini Sunday Dialogues brings together people to discuss recently opened exhibitions and the questions raised by art.\n\nOn August 16th at 14.00, artist Anetta Lukjanova and Johanna Lindfors will have a discussion, moving between the artworks and the wider questions surrounding contemporary art today.\n\nMakasiini Contemporary\n\n13.8.-6.9.2026\n\nTue – Fri 11-18 \nSat – Sun 12 -16 \n\nWelcome to the exhibition opening on Thursday, August 13, 17.00 to 20.00.\n\nFree entry","df":"Rafa Macarrón | Los noctivagueantes\n\nEspanjalainen taiteilija Rafa Macarrón esittää maalauksissaan anatomisia hahmoja, joiden muodot ovat venyneitä ja mittasuhteet liioiteltuja. Teokset ovat täynnä kuvallisuutta, joka on omalaatuisesti skaalattua. Macarrónin visuaalinen kieli ihmisyydestä perustuu todellisuuteen, mutta surrealistisella tavalla. \n\nAnetta Lukjanova | Witches' Flight\n\nAnetta Lukjanova työskentelee pääasiassa öljymaalausten ja suurikokoisten julkisten muraalien parissa. Hänen teoksensa yhdistävät mystiikan, todellisuuden ja populaarikulttuurin teemoja, tuoden esiin lähes maagisen version nykyisestä figuratiivisesta realismista. \n\nMAKASIINI SUNDAY DIALOGUES \n\nSunnuntaina 16.8. klo 14\n\nMakasiini Sunday Dialoguessa kokoonnutaan keskustelemaan vastikään avautuneista näyttelyistä sekä taiteen herättämistä kysymyksistä.\n\n16.8. kello 14 keskustelemassa taiteilija Anetta Lukjanova sekä Johanna Lindfors. Keskustelu liikkuu näyttelyn teosten sekä nykytaiteen laajempien kysymysten välillä.\n\nMakasiini Contemporary\n\n13.8.-6.9.2026\n\nTi-Pe 11.00-18.00\nLa-Su 12.00-16.00\n\nTervetuloa avajaisiin torstaina 13.8. klo 17.00-20.00.\n\nVapaa pääsy","c":"Visual arts","cs":["fine arts","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/RM008MK.jpeg","u":"https://makasiinicontemporary.com/exhibitions/","ue":"https://makasiinicontemporary.com/exhibitions/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpxkmqsdm","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpsoz6g4e","t":"Eläväksi räätälöity perinne","te":"Tradition Tailored to Life - Hungarian Folk Costumes","v":"Liszt-instituutti - Unkarin kulttuurikeskus","ve":"Liszt Institute","a":"Kaisaniemenkatu 10","la":60.17296,"ln":24.94852,"s":720,"e":1200,"d":"The exhibition showcases the unique beauty of Hungarian folk costumes, celebrated for their rich colours, intricate designs, and remarkable craftsmanship. \n\nAlongside the garments and their accessories, it offers a glimpse into the rural peasant culture of the 18th and 19th centuries. The selection has been drawn from the costume collection of the Forgatós Folk Dance Ensemble.\n\nThe exhibition aims to provide visitors with a vivid snapshot of a bygone era. It illustrates the differences between the clothing of market-town residents, mountain shepherds, bourgeois families, and rural communities. \n\nIt also highlights the moral codes reflected in traditional dress, reveals the distinctions between everyday and festive attire, and demonstrates the shared practical features of children's simple, lightweight, and functional clothing.\n\nThe exhibition presents not only costumes but also a wide variety of accessories, bringing visitors closer to a world that has since disappeared.\n\nLiszt Institute\n\n13.8.-18.9.2026\n\nExhibition opening 13.8. at 18.00 featuring Andrea Doktor and László Doktor of the Forgatós Folk Dance Ensemble, together with members of the ensemble\n\nRegistration: https://forms.office.com/e/dFmum66733 \n\nFree entry, the exhibition is part of Helsinki Design Week","df":"Eläväksi räätälöity perinne - Unkarilaisia kansanpukuja\n\nNäyttely esittelee Unkarin ainutlaatuisen kauniita, väreiltään ja muodoiltaan rikkaita kansanpukuja ja niihin kuuluvia asusteita kuvaten samalla 1700–1800-lukujen talonpoikaiskulttuuria. Valikoima on koottu Forgatós-kansantanssiryhmän pukukokoelmasta.\n\nNäyttely pyrkii antamaan katsojalle eräänlaisen ajankuvan: se havainnollistaa eroja esimerkiksi markkinakaupungin asukkaan, vuoristopaimenen, porvarisperheen tai maalaisyhteisöjen välillä. \n\nSe tuo esiin moraalisia normeja, auttaa näkemään arki- ja juhlapukujen eroavaisuuksia sekä osoittaa rinnakkaisuuksia lasten erilaisten yksinkertaisten, kevyiden ja käytännöllisten vaatteiden välillä.\n\nLászló Doktor, Makón kaupungissa Unkarissa toimivan Forgatós-tanssiryhmän johtajan ja Andrea Doktorin keräystyöhön perustuen näyttelyssä on pukujen lisäksi myös lukuisia asusteita, jotka tuovat katsojan lähemmäs tätä jo kadonnutta maailmaa.\n\nLiszt-instituutti, U Galleria\n\n14.8.–18.9.2026\n\nAvajaiset 13.8. klo 18.00. Tilaisuudessa paikalla ovat Andrea Doktor ja László Doktor Forgatós-kansantanssiryhmästä, sekä ryhmän tanssijoita.\n\nIlmoittautuminen avajaisiin: https://forms.office.com/e/dFmum66733 \n\nVapaa pääsy, näyttely on osa Helsinki Design Weekin ohjelmaa.","c":"Visual arts","cs":["Design","folk costumes","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/KOTISIVU_valmis.jpg","u":"https://culture.hu/fi/helsinki/tapahtumat/elavaksi-raataloity-perinne-unkarilaisia-kansanpukuja","ue":"https://culture.hu/fi/helsinki/tapahtumat/elavaksi-raataloity-perinne-unkarilaisia-kansanpukuja","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpsoz6g4e","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:68281","t":"Metsän suojassa - Moniaistinen näyttely- ja tapahtumakokonaisuus","te":"Metsän suojassa - In the Shelter of the Forest - Multi-sensory exhibition and event series","v":"Kanneltalo","ve":"Cultural Centre Kanneltalo","a":"Klaneettitie 5","la":60.23885,"ln":24.8762,"s":720,"e":1200,"d":"In the Shelter of the Forest is a multi-sensory exhibition and event that invites you to reflect on the future of the forest through art, science and participation.\n\nIn the Shelter of the Forest is a living and multi-sensory exhibition that combines visual art, sound, movement and participatory experiences. The exhibition invites you to reflect on the values and meanings of the forest, and to examine your own relationship with the forest from different perspectives. The project is the culmination of the two-year Metsäkissa2044 project funded by the Kone Foundation.\n\nVisual artist and biologist Susu Rytteri builds a monumental work entitled Utopia metsästä (‘Utopia of a Forest’) in the Kanneltalo gallery, in which a swarm of lightweight black-veined white butterflies fly through a background plastered with clay. The work \nwill be accompanied by a series of 100 drawings entitled Elämän puu (‘The Tree of Life’) and moving images.\n\nMusician Katja Luhtala creates an audio piece for the exhibition entitled Metsän kieli (‘Language of the Forest‘), building a mystical and multidimensional forest atmosphere.\n\nThe audience will have an opportunity to experience the atmosphere of the forest from the point of view of its creatures and organisms, and take part in workshops and discussions. On the Night of the Arts on 20 August, the audience will get to build a community artwork entitled Met","df":"Metsän suojassa on moniaistinen näyttely ja tapahtumakokonaisuus, joka kutsuu pohtimaan metsän tulevaisuutta taiteen, tieteen ja osallistumisen kautta.\n\nMetsän suojassa on elävä ja moniaistinen näyttelykokonaisuus, joka yhdistää visuaalisen taiteen, äänen, liikkeen ja osallistavat kokemukset. Näyttely kutsuu pohtimaan metsän arvoja ja merkityksiä sekä tarkastelemaan omaa metsäsuhdetta eri näkökulmista. Kokonaisuus on Koneen Säätiön rahoittaman kaksivuotisen Metsäkissa2044-hankkeen loppuhuipennus.\n\nKuvataiteilija ja biologi Susu Rytteri rakentaa Kanneltalon galleriaan monumentaalisen teoksen ”Utopia metsästä”, jossa savilaastilla rapatun taustan halki lentää suuri parvi kevyitä pihlajaperhosia. Teoksen rinnalla nähdään sadan piirroksen sarja ”Elämän puu” sekä liikkuvaa kuvaa.\n\nMuusikko Katja Luhtala luo näyttelyyn ääniteoksen ”Metsän kieli”, joka rakentaa tilaan metsän mystisen ja moniulotteisen tunnelman.\n\nYleisö pääsee kokemaan metsän tunnelman sen eliöiden ja olentojen näkökulmasta sekä osallistumaan työpajoihin ja keskusteluihin. Taiteiden yönä 20.8. yleisö saa rakentaa savirapatuista levyistä yhteisötaideteoksen Metsänpohja, ja tuolloin on mahdollista myös silittää Metsäkissaa.\n\nTutustu Metsäkissa2044-hankkeen taiteellisiin ja journalistisiin sisältöihin .\n\nNäyttelyssä ovat esillä myös hankkeen muut osa-alueet: Legioonateatterin metsäteatterikollektiivi Virpi Koskelan johdo","c":"Visual arts","cs":["Kanneltalo","Näyttelyt","Muut tapahtumat","Suomi","Ruotsi","Englanti"],"img":"http://www.kanneltalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_786645.jpg","u":"http://www.kanneltalo.fi/fi/tapahtumat/event/BC3240580FEDA95831DF176E618667B2/Metsan_suojassa","ue":"http://www.kanneltalo.fi/en/events/event/BC3240580FEDA95831DF176E618667B2/Metsan_suojassa_In_the_Shelter_of_the_Forest","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:68281","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp7wdqrtq","t":"Markku Keränen: Pieni kesä","te":"Markku Keränen: A Little Summer","v":"Galerie Forsblom","ve":"Galerie Forsblom","a":"Yrjönkatu 22","la":60.16704,"ln":24.93989,"s":720,"e":1200,"d":"Markku Keränen’s tempera paintings are composed of playful abstract forms that appear to interact with one another. His circular motifs create the illusion of constant motion –shimmering, converging, and drifting apart again. \n\nThis continuous movement lends each form a distinct presence. Working in series, Keränen engages with long-standing traditions of painting, while his distinctive approach to composition allows new visual relationships to constantly emerge.\n\nKeränen began his artistic career in the 1970s, gradually moving from figurative expression towards abstraction. Yet two elements have remained central throughout his oeuvre: color and light. \n\nHis paintings are distinguished by a luminous palette and a sense of harmony that transcends the everyday. In his recent works, serene hues unfold in subtle variations, with dozens of shades often brought together within a single composition.\n\nMarkku Keränen (b. 1945) graduated from the University of Art and Design Helsinki, where he later also taught. He has participated in numerous solo and group exhibitions in Finland and abroad and his works are represented in major Finnish collections.\n\nGalerie Forsblom\n\n14.8.-13.9.2026\nTue-Fri 11.00–18.00\nSat-Sun 12.00–16.00\nFree entry","df":"Markku Keräsen temperamaalauksissa leikki on läsnä, ja abstraktien muotojen vilpitön keskinäinen vuoropuhelu kaikuu kankaalla. Ympyränmuotoiset hahmot ovat alati liikkeessä – väreillen, lähentyen ja loitontuen toisistaan. \n\nLiike tuntuu olevan ikuista, ja lopulta pallot saavat kukin oman luonteensa. Keränen kiinnittyy sarjallisella työskentelyllään maalaustaiteen perinteeseen omaleimaisella tulkinnallaan, jossa sommittelu rakentaa alati uusia maailmoja.\n\nKeräsen taiteilijanura alkoi 1970-luvulla ja hänen ilmaisunsa on vähitellen muuttunut figuratiivisesta kohti abstraktiota. Yhteistä eri aikakausille on kuitenkin värin ja valon hehku. \n\nTaiteilijalle on ominaista puhdas ja kuulas värimaailma, jossa harmonia kohoaa arjen yläpuolelle. Uudet maalaukset kylpevät seesteisen rauhaisassa väripaletissa, ja yhdessä maalauksessa voi olla kymmeniä sävyjä.\n\nMarkku Keränen (s.1945) on valmistunut Taideteollisesta korkeakoulusta Helsingissä, jossa hän on myöhemmin myös opettanut. Keräsellä on ollut lukuisia yksityis- ja ryhmänäyttelyitä niin Suomessa kuin ulkomailla ja hänen teoksiaan kuuluu merkittäviin kokoelmiin. \n\nGalerie Forsblom\n\n14.8.-13.9.2026\nTi-pe 11.00–18.00\nLa-su 12.00–16.00\nVapaa pääsy","c":"Visual arts","cs":["fine arts","art","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/markku_keranen_aamulinnut_sans_turvaraja_qB7ilZo.jpg","u":"https://galerieforsblom.com","ue":"https://galerieforsblom.com","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp7wdqrtq","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp7wafbsm","t":"Emma Helle: Kamara","te":"Emma Helle: Kamara","v":"Galerie Forsblom","ve":"Galerie Forsblom","a":"Yrjönkatu 22","la":60.16704,"ln":24.93989,"s":720,"e":1200,"d":"Emma Helle is a sculptor whose practice explores the question of representation: whose stories are granted visibility? \n\nDrawing on art history, northern folklore, and ancient myth, her sculptures propose alternative narratives and ways of seeing. \n\nCharacterized by voluptuous forms and theatrical presence, her relaxed yet exuberant visual language echoes canonical works of art history. \n\nAcross different eras, representations of the human figure have been shaped by persistent conventions – a legacy that Helle critically examines by challenging binary understandings of the body.\n\nIn this exhibition, Helle's expansive visual vocabulary brings together references ranging from the Venus of Willendorf to figures drawn from Finnish mythology. \n\nIn her sculptures, corporeality and mythology intersect with geological time: frogs and forest spirits carry their own meanings and realities, while the surface of the human body is imagined as an extension of the Earth’s crust. \n\nEmma Helle (b. 1979) graduated from the Academy of Fine Arts at the University of the Arts Helsinki in 2007. She has presented numerous solo and group exhibitions in Finland and internationally. \n\nHer works are represented in several private and public collections.\n\nGalerie Forsblom\n\n14.8.-13.9.2026\nTue-Fri 11.00–18.00\nSat-Sun 12.00–16.00\nFree entry","df":"Emma Helle on kuvanveistäjä, joka tarkastelee taiteessaan representaation kysymystä: kenen tarinat tuodaan esiin? \n\nTeokset tulkitsevat uudelleen tuttuja kertomuksia ja ammentavat taidehistorian lisäksi pohjoisen ja antiikin mytologiasta. \n\nTaiteilijan rento mutta runsas ilmaisu, jota korostavat pehmeät muodot ja teatraalinen läsnäolo, tuo mieleen taidehistorian kanoniset teokset. \n\nEri aikakausina ihmishahmon esittämistä ovat ohjanneet tietyt konventiot – perintö, jota Helle tarkastelee haastamalla kehollisuuden kaksijakoista ajattelua.\n\nNäyttelyssä Helteen rönsyilevä kuvakieli kertoo tarinoita, joissa kivikautinen Willendorfin Venus ja suomalaisesta mytologiasta lainatut hahmot ovat olemassa rinnakkain. \n\nHelteen veistoksissa risteävät kehollisuuden, mytologian ja maankuoren aika, jossa sammakot ja metsänhaltijat kantavat mukanaan merkityksiä ja todellisuuksia, ja ihmiskehon pinta rinnastuu maan kamaraan.\n\nEmma Helle (s.1979) on valmistunut Taideyliopiston Kuvataideakatemiasta vuonna 2007. Hänellä on ollut lukuisia yksityis- ja ryhmänäyttelyitä Suomessa ja ulkomailla, muun muassa Turun taidemuseossa, Lahden visuaalisten taiteiden museo Malvassa ja Nationalmuseumissa Tukholmassa. \n\nHelteen teoksia kuuluu moniin yksityisiin ja julkisiin kokoelmiin. \n\nGalerie Forsblom\n\n14.8.-13.9.2026\nTi-pe 11.00–18.00\nLa-su 12.00–16.00\nVapaa pääsy","c":"Visual arts","cs":["art","exhibitions","ceramic art","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Emma_Helle_Helmiainen_2025_photo_Jussi_Tiainen_Galerie_Forsblom.jpg","u":"https://galerieforsblom.com","ue":"https://galerieforsblom.com","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp7wafbsm","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp7wby7mi","t":"Mie Olise Kjærgaard: Off the Deep End","te":"Mie Olise Kjærgaard: Off the Deep End","v":"Galerie Forsblom","ve":"Galerie Forsblom","a":"Yrjönkatu 22","la":60.16704,"ln":24.93989,"s":720,"e":1200,"d":"Mie Olise Kjærgaard paints women in motion – skiing, riding horses, playing tennis, and swimming, often carrying children as they go. They move with purpose, energy, and joy. \nIn her work, Kjærgaard explores what happens when women act on their own terms and step beyond expectation. \n\nHer figures are active and powerful – taking risks, having fun, and asserting their freedom. Her vigorous, expressive style underscores the strength and independence of the women she depicts. These are not narratives of perfection, but of persistence, invention, and the courage to act.\n\nIn her recent work, Kjærgaard extends this world into an underwater realm that defies gravity. Here, women swim through deep waters alongside fish and hammerhead sharks, in a space governed by its own laws. \n\nAcross these environments, her work asks a compelling question: what happens when one dares to surrender to play, risk falling, or defy gravity altogether – and what rises to the surface as a result?\n\nMie Olise Kjærgaard (b. 1974) holds an MFA from Central Saint Martins in London, as well as MA degrees in architecture from the Aarhus School of Architecture and the Bartlett School of Architecture. She has exhibited widely internationally and her work is held in major collections.\n\nGalerie Forsblom\n\n14.8.-13.9.2026\nTue-Fri 11.00–18.00\nSat-Sun 12.00–16.00\nFree entry","df":"Mie Olise Kjærgaard maalaa naisia liikkeessä – hiihtämässä, pelaamassa tennistä, ratsastamassa, uimassa ja soittamassa musiikkia, usein lapsi sylissään tai selässään, liikkuen kiireellä ja ilolla.\n\nKjærgaardin dynaaminen, lennokas ja ekspressiivinen ilmaisu korostaa maalausten sankarihahmojen omaehtoisuutta ja voimaa. Teokset eivät ole kertomuksia täydellisyydestä, vaan sitkeydestä, kekseliäisyydestä ja rohkeudesta toimia.\n\nKjærgaardin näyttely jatkaa teeman tarkastelua vedenalaisessa maailmassa, jossa painovoima tuntuu liuenneen pois. \n\nTällä kertaa naiset ovat sukeltaneet pinnan alle, missä he uivat yhdessä kalojen ja vasarahaiden kanssa maailmassa, jossa pätevät toisenlaiset lait kuin maan päällä. Syvyyksissä kehot ovat vapaita löytämään oman muotonsa. \n\nTaiteilija kysyy näyttelyllään: mitä tapahtuu, kun uskaltaa antautua leikkiin, ottaa riskin tai päästää painovoimasta kokonaan irti – mitä silloin nousee pintaan?\n\nMie Olise Kjærgaard (s. 1974) on suorittanut kuvataiteen maisterin tutkinnon Central Saint Martinsissa Lontoossa sekä arkkitehtuurin maisterin tutkinnot Aarhus School of Architecturessa ja Bartlett School of Architecturessa. \n\nHänellä on ollut lukuisia kansainvälisiä yksityis- ja ryhmänäyttelyitä sekä hänen teoksiaan kuuluu lukuisiin merkittäviin kokoelmiin.\n\nGalerie Forsblom\n\n14.8.-13.9.2026\nTi-pe 11.00–18.00\nLa-su 12.00–16.00\nVapaa pääsy","c":"Visual arts","cs":["fine arts","art","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Mie_Olise_Kj%C3%A6rgaard_Optional_Gravity_with_sharks_2026_Acrylic_on_canvas_195_x_220_cm_76_34_x_86_58_in_photo_courtesy_of_the_artist.jpg","u":"https://galerieforsblom.com","ue":"https://galerieforsblom.com","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp7wby7mi","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp7vadtle","t":"Echoes of freedom","te":"Echoes of freedom","v":"Kulttuurilabra","ve":"Kulttuurilabra","a":"Untuvaisentie 2","la":60.19879,"ln":25.05838,"s":720,"e":1200,"d":"Nuoria taiteentekijöitä, 15-29 v, kutsutaan tutkimaan vapauden teemaa minkä tahansa luovan ilmaisun kautta. \n\nNäyttelyn kuraattoreina toimii nuorten ryhmä. \n\nAvoin näyttelyhaku 15.8-10.9\n\nNäyttely esillä 1.10-1.11.2026 Kulttuurilabra, Untuvaisentie 2\n\nTiedustelut ja vapaamuotoinen hakemus kulttuurilabra@hel.fi","df":"Nuoria taiteentekijöitä, 15-29 v, kutsutaan tutkimaan vapauden teemaa minkä tahansa luovan ilmaisun kautta. \n\nNäyttelyn kuraattoreina toimii nuorten ryhmä. \n\nAvoin näyttelyhaku 15.8-10.9\n\nNäyttely esillä 1.10-1.11.2026 Kulttuurilabra, Untuvaisentie 2\n\nTiedustelut ja vapaamuotoinen hakemus kulttuurilabra@hel.fi","c":"Dance","cs":["Työpajat"," Performance","dance (performing arts)","music","photography","performance art"],"img":"https://api.hel.fi/linkedevents/media/images/kuva_linkkariin_sVuiMYz.png","u":"https://nuorten.hel.fi/nuorisotalot/kulttuurilabra/","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agp7vadtle","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp7vadtle","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpwao3wg4","t":"Toinen tasavalta","te":"Toinen tasavalta","v":"Suomen Kansallisteatteri","ve":"Finnish National Theatre","a":"Läntinen Teatterikuja 1","la":60.17249,"ln":24.94384,"s":720,"e":1200,"d":"Tarinoita pelon ja toivon vuosikymmeniltä\n\nEsa Leskisen Toinen tasavalta kertoo Suomen ponnisteluista säilyttää demokraattinen valtiomuotonsa Neuvostoliiton painostuksen, kansainvälisten konfliktien ja sisäisten poliittisten ristiriitojen puristuksessa. \n\nEsitys on Leskisen demokratia-aiheisen esityssarjan itsenäinen neljäs osa, jonka edeltäjä oli huippusuosittu Ensimmäinen tasavalta (2022). \n\nToinen tasavalta on älykäs, viihdyttävä ja elävän ajankuvan värittämä esitys, joka vyöryttää kansalliselle päänäyttämölle historian äkkikäänteitä ja henkilöitä sodanjälkeisistä vaaran vuosista 1980-luvun juppiaikaan ja neuvostoimperiumin romahdukseen.\n\nSe on tarina kansakunnasta, joka vastoin kaikkia todennäköisyyksiä kykeni torjumaan itseensä kohdistuneet uhat, sopimaan keskinäiset riitansa ja samalla rakentamaan tasa-arvoisen, kaikki kansalaiset huomioon ottavan hyvinvointiyhteiskunnan. Esityksen keskushenkilönä ja aikakautensa itseoikeutettuna symbolina toimii Urho Kekkonen. \n\nNuoremman Kekkosen roolissa nähdään Janne Reinikainen, vanhempaa valtiomiestä esittää Vesa Vierikko.\n\nKansallisteatteri, Suuri näyttämö\n15.8.-16.12.2026\nEnsi-ilta 12.2.2026\n\nEsitykset \n\nLiput 22-62€ Kansallisteatterista ja Lippupisteestä\n\nEsitys on suomenkielinen, kesto 2 h 45 min","df":"Tarinoita pelon ja toivon vuosikymmeniltä\n\nEsa Leskisen Toinen tasavalta kertoo Suomen ponnisteluista säilyttää demokraattinen valtiomuotonsa Neuvostoliiton painostuksen, kansainvälisten konfliktien ja sisäisten poliittisten ristiriitojen puristuksessa. \n\nEsitys on Leskisen demokratia-aiheisen esityssarjan itsenäinen neljäs osa, jonka edeltäjä oli huippusuosittu Ensimmäinen tasavalta (2022). \n\nToinen tasavalta on älykäs, viihdyttävä ja elävän ajankuvan värittämä esitys, joka vyöryttää kansalliselle päänäyttämölle historian äkkikäänteitä ja henkilöitä sodanjälkeisistä vaaran vuosista 1980-luvun juppiaikaan ja neuvostoimperiumin romahdukseen.\n\nSe on tarina kansakunnasta, joka vastoin kaikkia todennäköisyyksiä kykeni torjumaan itseensä kohdistuneet uhat, sopimaan keskinäiset riitansa ja samalla rakentamaan tasa-arvoisen, kaikki kansalaiset huomioon ottavan hyvinvointiyhteiskunnan. Esityksen keskushenkilönä ja aikakautensa itseoikeutettuna symbolina toimii Urho Kekkonen. \n\nNuoremman Kekkosen roolissa nähdään Janne Reinikainen, vanhempaa valtiomiestä esittää Vesa Vierikko.\n\nKansallisteatteri, Suuri näyttämö\n15.8.-16.12.2026\nEnsi-ilta 12.2.2026\n\nEsitykset \n\nLiput 22-62€ Kansallisteatterista ja Lippupisteestä\n\nEsitys on suomenkielinen, kesto 2 h 45 min","c":"Theatre","cs":["theatre events","theatre (art forms)","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/54898817180_52335284f2_k.jpg","u":"https://www.kansallisteatteri.fi/esitys/toinen-tasavalta","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agpwao3wg4","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpwao3wg4","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:68226","t":"Elävät kuvat 4 - Non-stop videonäytös Pohjoisgalleriassa","te":"Moving Pictures 4 - Non-stop video screening in the North Gallery","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":1200,"d":"The gallery on the second floor of Annantalo will be transformed into a cinema, screening a collection of videos, animations and short films created during the autumn 2025 and spring 2026 period.\n\nThe works in the exhibition are made by pupils of Annantalo’s 5x2 groups. The artists are primary school pupils in grades 3–6.\n\nThe videos will be screened non-stop in the gallery space.\n\nStop by for a moment or stay for longer – get comfortable on the sofa and enjoy!","df":"Annantalon toisen kerroksen galleria muuttuu elokuvasaliksi, jossa nähdään kokoelma syksyn 2025 ja kevään 2026 kauden aikana syntyneitä videoita, animaatioita ja lyhytelokuvia.\n\nNäyttelyn teokset ovat Annantalon 5x2‑ryhmien oppilaiden tekemiä. Oppilaat ovat 3.–6.-luokkalaisia alakoululaisia.\n\nVideot pyörivät nonstoppina galleriatilassa.\n\nMukana näytöksessä: Helsingin ranskalais-suomalainen koulu 5B, Vuoniityn peruskoulu 4E, Helsingin saksalainen koulu 3lk, Jätkäsaaren peruskoulu 4O ja 4A, Oulunkylän ala-asteen koulu 6E, Malmin peruskoulu 3BC sekä Hertsikan ala-aste 3CD.\n\nTule vaikka hetkeksi tai viivy pidempään - ota mukava asento sohvalta ja nauti!\n\nAlle kouluikäiset yhdessä aikuisen kanssa.\nLyhytelokuvien yhteiskesto noin 23 minuuttia.","c":"Cinema","cs":["Lastentapahtumat","Elokuva ja media","Elokuvat","Annantalo","Näyttelyt","Suomi"],"img":"http://www.annantalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_786385.jpg","u":"http://www.annantalo.fi/fi/tapahtumat/event/8AA22C6CD6133FCEDE319EEFCFBE8CD5/Elavat_kuvat_4","ue":"http://www.annantalo.fi/en/events/event/8AA22C6CD6133FCEDE319EEFCFBE8CD5/Moving_Pictures_4","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:68226","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:69554","t":"Seniorikorttelin asemakaavamuutos","te":"Seniorikorttelin asemakaavamuutos","v":"Vuotalo","ve":"Vuosaari House","a":"Mosaiikkitori 2","la":60.20885,"ln":25.14335,"s":720,"e":1200,"d":"Tervetuloa tutustumaan Vuosaaren Seniorikorttelin kaavamuutokseen Vuotalon aulaan.\n\nAsemakaavamuutoksen esittely ja pienoismalli ovat esillä aulassa 17.8.–4.9., ja aiheesta järjestetään avoin keskustelutilaisuus 26.8. klo 15.30–18.00 .\n\nVuosaari on asukasmäärältään Helsingin suurimpia kaupunginosia. Alueen ikääntyvä väestörakenne edellyttää omaa, keskustan yhteyksien ja palveluiden ääreen sijoittuvaa seniorikeskusta. Kaavaratkaisun tavoitteena on sijoittaa pääosin 6-kerroksinen seniorikeskus Vuosaaren keskusaukio Mosaiikkitorin reunaan kaupunkikuvallisesti ja toiminnallisesti onnistuneella tavalla.\n\nSeniorikeskuksen suunnittelusta ja toteuttamisesta järjestetään kilpailutus syksyllä 2026. Korttelin länsi- ja itäpäätyihin sijoittuvat yleiset alueet tarjoavat kortteliin maanvaraista, istutettavaa pintaa sekä Mosaiikkitorin ja Tyynylaavantien yhdistävän porrasyhteyden.\n\nTyynylaavantie 15 tilapäinen velvoitepysäköinti sijaitsee seniorikeskuksen osoitetun kaavarajauksen sisällä. Asemakaavan laatimisajan erityisasumisen pysäköintivelvoitteet ovat keventyneet, mikä vähentää korttelin velvoitepysäköintipaikkatarvetta. Asemakaavan tavoite on mahdollistaa korttelin autopaikkojen sijoittuminen omalle tontille ajantasaisen pysäköinnin laskentaohjeen soveltamisen kautta.\n\nTervetuloa keskustelemaan Seniorikorttelin kaavamuutoksesta Vuotalon aulaan 26.8. kello 15:30-18:00!","df":"Tervetuloa tutustumaan Vuosaaren Seniorikorttelin kaavamuutokseen Vuotalon aulaan.\n\nAsemakaavamuutoksen esittely ja pienoismalli ovat esillä aulassa 17.8.–4.9., ja aiheesta järjestetään avoin keskustelutilaisuus 26.8. klo 15.30–18.00 .\n\nVuosaari on asukasmäärältään Helsingin suurimpia kaupunginosia. Alueen ikääntyvä väestörakenne edellyttää omaa, keskustan yhteyksien ja palveluiden ääreen sijoittuvaa seniorikeskusta. Kaavaratkaisun tavoitteena on sijoittaa pääosin 6-kerroksinen seniorikeskus Vuosaaren keskusaukio Mosaiikkitorin reunaan kaupunkikuvallisesti ja toiminnallisesti onnistuneella tavalla.\n\nSeniorikeskuksen suunnittelusta ja toteuttamisesta järjestetään kilpailutus syksyllä 2026. Korttelin länsi- ja itäpäätyihin sijoittuvat yleiset alueet tarjoavat kortteliin maanvaraista, istutettavaa pintaa sekä Mosaiikkitorin ja Tyynylaavantien yhdistävän porrasyhteyden.\n\nTyynylaavantie 15 tilapäinen velvoitepysäköinti sijaitsee seniorikeskuksen osoitetun kaavarajauksen sisällä. Asemakaavan laatimisajan erityisasumisen pysäköintivelvoitteet ovat keventyneet, mikä vähentää korttelin velvoitepysäköintipaikkatarvetta. Asemakaavan tavoite on mahdollistaa korttelin autopaikkojen sijoittuminen omalle tontille ajantasaisen pysäköinnin laskentaohjeen soveltamisen kautta.\n\nTervetuloa keskustelemaan Seniorikorttelin kaavamuutoksesta Vuotalon aulaan 26.8. kello 15:30-18:00!","c":"Literature","cs":["Vuotalo","Näyttelyt","Suomi","Ruotsi","Englanti","Luennot ja keskustelut"],"img":"http://www.vuotalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_795881.jpg","u":"http://www.vuotalo.fi/fi/tapahtumat/event/0C3CC7C4DBC7374726F505957E9DF2CA/Seniorikorttelin_asemakaavamuutos","ue":"http://www.vuotalo.fi/en/events/event/0C3CC7C4DBC7374726F505957E9DF2CA/Seniorikorttelin_asemakaavamuutos","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:69554","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:69137","t":"Kohti tuntematonta -työpaja - Kuva- ja sanataidepajat koululaisille","te":"Kohti tuntematonta - Pasi Pitkänen's illustrations of thrilling adventures - Art and literary art workshops for schoolchildren","v":"Vuotalo","ve":"Vuosaari House","a":"Mosaiikkitori 2","la":60.20885,"ln":25.14335,"s":720,"e":1200,"d":"The Kohti tuntematonta (‘Towards the Unknown’) exhibition and workshop invites schoolchildren to embark on adventures in imaginative worlds.\n\nThe workshops are intended for children in grades 3–6. The workshops utilise literary and visual art to explore an exhibition consisting of Pasi Pitkänen’s skilful illustrations and the worlds that they present. The aim is to inspire the attendees to experience books and reading from a fresh, participatory and multidisciplinary perspective. \n\nIn the workshop, the class is split in two, with half taking part in the literary art workshop and the other half in the art workshop, and then vice versa. This way, everyone gets to work with both words and images. \n\nThe workshop is held in Finnish and lasts 1.5 hours in total.  \n\nYou can register for the workshops at kultus.hel.fi . \n\nMatka käärmejunassa literary art session \nIn the Matka käärmejunassa (‘Journey on the Snake Train’) session, we explore Silja Sillanpää and Pasi Pitkänen’s book Ouroboros, perform some literary art exercises and solve riddles.\n\nDuring the session, we think about matters such as what sort of equipment the pupils would take with them on an adventure, look for our own snake friends, and write a short travelogue. Escape room style activities punctuate the session and encourage pupils to participate.\n\nSateenkaarikäärme visual art session \nIn the Sateenkaarikäärme (‘Rainbow","df":"Kohti tuntematonta -näyttely ja työpaja kutsuu koululaiset hyppäämään seikkailuihin mielikuvituksellisissa maailmoissa.\n\nTyöpajat ovat suunnattuja 3.–6.-luokkalaisille. Työpajoissa tutustutaan sana- ja kuvataiteen keinoin Pasi Pitkäsen taidokkaista kuvituksista koostettuun näyttelyyn ja sen kautta avautuviin maailmoihin. Tarkoituksena on innostaa kokemaan kirja ja lukeminen uudesta, osallistavasta ja monitaiteisesta näkökulmasta.\n\nTyöpajassa koululuokka jaetaan puoliksi niin, että puolet osallistuvat sanataidepajaan ja puolet kuvataidepajaan ja sitten vaihdetaan osia. Näin kaikki pääsevät työskentelemään sekä sanallisesti että kuvallisesti.\n\nTyöpajan ohjauskieli on suomi, ja kokonaiskesto 1,5 tuntia.\n\nTyöpajat maanantaisin\n17.8. 9–10:30 ja 11–12:30 \n24.8. 9–10:30 ja 11–12:30\n31.8. 9–10:30 ja 11–12:30\n7.9. 9–10:30 ja 11–12:30\n14.9. 9–10:30 ja 11–12:30\n21.9. 9–10:30 ja 11–12:30\n\nTyöpajoihin ilmoittaudutaan osoitteessa kultus.hel.fi . \n\nMatka käärmejunassa -sanataidetuokio \nMatka käärmejunassa -tuokiossa tutustutaan Silja Sillanpään ja Pasi Pitkäsen Ouroboros-kirjaan, tehdään sanataidetehtäviä ja ratkaistaan arvoituksia.\n\nTuokiossa pohditaan muun muassa, minkälaisia varusteita oppilaat ottaisivat mukaan seikkailuun, etsitään omat käärmeystävät ja kirjoitetaan pieni matkakertomus. Pakopelihenkinen toiminnallisuus rytmittää tuokion kulkua ja innostaa oppilaita osallistumaan.\n\nSateen","c":"Visual arts","cs":["Monitaide","Vuotalo","Suomi","Ruotsi","Englanti","Työpajat"],"img":"http://www.vuotalo.fi/instancedata/prime_product_resurssivaraus/kulke/embeds/EventPic_786168.jpg","u":"http://www.vuotalo.fi/fi/tapahtumat/event/A6D5C2D1D2AF2A4589AE3328CFB36A6D/Kohti_tuntematonta_-tyopaja","ue":"http://www.vuotalo.fi/en/events/event/A6D5C2D1D2AF2A4589AE3328CFB36A6D/Kohti_tuntematonta_Pasi_Pitkanen_s_illustrations_of_thrilling_adventures_","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:69137","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:69138","t":"Taidepaja Kipinä: Vauvojen värikylpy - 4-24 kk","te":"Taidepaja Kipinä: Baby's color bath - 4-24 months old","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":1200,"d":"Taidepaja Kipinä. Are you looking for an experiential, shared art moment with your child using safe, edible colors?\n\nBaby's Color Bath is a multisensory art workshop designed for families with babies, where participants explore and wonder together with an adult. At the beginning of the session, participants tune into the theme of the day by exploring different materials, light, and colors, before moving on to creating their own artwork.\n\nThe workshops use safe, food-based painting materials, and children can paint using their whole body. Please come prepared with clothes that can get messy (for both the child and the adult) and bring a towel.\n\nAt the end of the workshop, you will receive the artwork created during the session, carefully packaged to take home. Each workshop accommodates up to 9 child–adult pairs.\n\nThe workshop is intended for children aged 4 months to 2 years, and one ticket is valid for one adult–child pair. Both single workshop sessions and four-session courses (lasting 4 weeks) are available.\n\nPrice:\nSingle workshop: €27.50 per participating adult–child pair\n4-session course: €85 per participating adult–child pair\n\nThe workshop is led by a trained instructor, Ruusu-Maria Lappalainen.","df":"Taidepaja Kipinä. Etsinnässä elämyksellinen, yhteinen taidehetki lapsen kanssa turvallisilla syötävillä väreillä?\n\nVauvojen värikylpy vauvaperheille suunnattu moniaistinen taidetyöpaja, jossa tutkitaan ja ihmetellään yhdessä aikuisen kanssa. Työskentelyn alussa virittäydytään päivän teemaan erilaisia materiaaleja, valoa ja värejä tutkien, mistä edetään itse tuotettuun jälkeen.\n\nTyöpajoissa maaliaineina käytetään turvallisia elintarvikepohjaisia aineita ja maalamiseen lapsi voi käyttää koko kehoa. Varauduthan siis työpajaan sotkun kestävin vaattein (myös aikuiselle) sekä pyyhkeen kanssa. Työpajassa syntyneen taideteoksen saa lopuksi mukaan pakattuna. Yhteen työpajaan mahtuu 9 lapsi-aikuinen paria.\n\nTyöpaja on suunnattu 4 kk – 2 vuotta täyttäneille ja yksi lippu on tarkoitettu yhdelle aikuinen ja lapsi parille. Tarjolla on yksittäisiä työpajakertoja sekä neljän kerran kursseja (kesto 4 viikkoa).\n\nHinta: Yksittäisen työpaja: 27,5 € /työpajaan osallistuva aikuinen ja lapsi.\n4 kerran kurssi: 85€ /työpajaan osallistuva aikuinen ja lapsi.\n\nTyöpajaa ohjaa koulutettu ohjaaja Ruusu-Maria Lappalainen.\n\nIlmoittautuminen Taidepaja Kipinän nettisivujen kautta. Tarkemmat kurssien sisällöt ja päivämäärät Taidepaja Kipinän nettisivuilta: www.taidepajakipina.fi","c":"Visual arts","cs":["Kuvataide","Kurssit","Annantalo","Suomi","Ruotsi","Englanti"],"img":"","u":"http://www.annantalo.fi/fi/tapahtumat/event/CCF37600DA81D791D993ABA51A02EA48/Taidepaja_Kipina_Vauvojen_varikylpy","ue":"http://www.annantalo.fi/en/events/event/CCF37600DA81D791D993ABA51A02EA48/Taidepaja_Kipina_Baby_s_color_bath","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:69138","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp7wkofmu","t":"Kielikahvila","te":"Kielikahvila","v":"Stadin yhteisötalo Oulunkylän Seurahuone","ve":"Community house Oulunkylän Seurahuone","a":"Larin Kyöstin tie 7","la":60.2276,"ln":24.96906,"s":720,"e":1200,"d":"Aloita viikonloppu mukavasti yhdessä jutellen. Tule harjoittelemaan suomen kieltä rennossa ilmapiirissä.\n\nKaiken tasoiset suomen kielen oppijat ovat tervetulleita.\n\nLämpimästi tervetuloa!","df":"Aloita viikonloppu mukavasti yhdessä jutellen. Tule harjoittelemaan suomen kieltä rennossa ilmapiirissä.\n\nKaiken tasoiset suomen kielen oppijat ovat tervetulleita.\n\nLämpimästi tervetuloa!","c":"Literature","cs":["participation","conversation","games"],"img":"https://api.hel.fi/linkedevents/media/images/JPG-2_kirjasto_kielikahvila_kuvitus_lille_santanen_2024_vaaka_0h71s4R.jpg","u":"https://tapahtumat.hel.fi/fi/events/helsinki:agp7wkofmu","ue":"https://tapahtumat.hel.fi/en/events/helsinki:agp7wkofmu","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp7wkofmu","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agnosttzky","t":"Modernit klassikot: Elga Sesemann","te":"Modern Classics: Elga Sesemann","v":"Ateneumin taidemuseo","ve":"Ateneum Art Museum","a":"Kaivokatu 2","la":60.17009,"ln":24.9441,"s":720,"e":1200,"d":"The Modern Classics series of exhibitions presents 20th-century artists from the Finnish National Gallery collections. The first artist to be featured in the series is Elga Sesemann.\n\nElga Sesemann’s (1922–2007) life story is an exceptional and interesting example of a professional woman artist making a career for herself in Finland. \n\nThe artist’s very first solo exhibition in Helsinki, in 1945, already drew the attention of critics and the art audience to her expressive style. \n\nSesemann’s artistic oeuvre is extensive, and she enjoyed an active career, with her expression constantly evolving, until the mid-1990s. \n\nAteneum Art Museum\n\n18.8.2026-8.8.2027","df":"Modernit klassikot -näyttelysarja esittää Kansallisgallerian kokoelmien taiteilijoita 1900-luvulta. Sarjan ensimmäinen taiteilija on Elga Sesemann.\n\nElga Sesemannin (1922–2007) elämäntarina on poikkeuksellinen ja kiinnostava esimerkki naistaiteilijan ammattiurasta Suomessa. \n\nJo taiteilijan ensimmäinen yksityisnäyttely Helsingissä vuonna 1945 kiinnitti kriitikkojen ja taideyleisön huomion hänen ekspressiiviseen tyyliinsä. \n\nSesemannin taiteellinen tuotanto on mittava – ura jatkui aktiivisena ja ilmaisultaan monesti uudistuen 1990-luvun puoliväliin asti. \n\nAteneumin taidemuseo\n\n18.8.2026-8.8.2027","c":"Visual arts","cs":["fine arts","art","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/1ce6234a-d38a-4ddb-b962-2bc28dc0ab7a.jpg","u":"https://ateneum.fi/nayttelyt/modernit-klassikot-elga-sesemann/","ue":"https://ateneum.fi/en/exhibitions/modernit-klassikot-elga-sesemann/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agnosttzky","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp7wsfb3e","t":"Tanssii Elämän Kanssa","te":"Dancing with Life","v":"Galleria Kookos","ve":"Galleria Kookos","a":"Pohjoinen Rautatiekatu 17","la":60.1706,"ln":24.92979,"s":720,"e":1200,"d":"Life is an invitation to a grand ball, where both the music and the rhythms change. Life takes turns and sometimes the person who lives.\nEverybody is involved in this circular game in their own way and everything you do affects how life moves you.\nArt is part of this performance and in the field of visual arts, visualised dance and interactions are created.\nMay I have your permission!\n\nArtists:\nElviira Elo\nSusanna Honkanen\nAnnu Niskanen\nHannu Oksanen\nJari Paloheimo\n\nGalleria Kookos\n\n18.8.-5.9.2026\nVernissage 18.8. at 18.00-20.00\n\nTue-Fri 13.00-18.00\n\nSat 13.00-17.00\n\nFree entry","df":"Elämä on kutsu suuriin tanssiaisiin, jossa vaihtuvat niin musiikki kuin rytmitkin. Vuoroin viejänä on elämä ja taas toisinaan eläjä.\nJokainen omalta osaltaan on mukana tässä piirileikissä ja kaikki mitä ihmiset tekevät vaikuttaa siihen kuinka elämä heitä pyörittää.\nTaide on osa tätä performanssia ja kuvataiteen alueella syntyy visualisoitua tanssia ja vuorovaikutuksia.\n\nSaanko luvan!\n\nTaiteilijat:\nElviira Elo\nSusanna Honkanen\nAnnu Niskanen\nHannu Oksanen\nJari Paloheimo\n\nGalleria Kookos\n\n18.8.-5.9.2026\nAvajaiset 18.8. klo 18.00-20.00\n\nTi-pe 13.00-18.00\n\nLa 13.00-17.00\n\nVapaa pääsy","c":"Dance","cs":["fine arts","art","cultural events","exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/poster_80p2HHo.jpg","u":"http://www.galleriakookos.fi","ue":"http://www.galleriakookos.fi","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp7wsfb3e","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agqbrmvhxi","t":"Maunula Unplugged -artistihaku","te":"Maunula Unplugged -artistihaku","v":"Maunulan nuorisotalo, Maunula-talo","ve":"Maunula Youth Centre","a":"Metsäpurontie 4","la":60.23091,"ln":24.93304,"s":720,"e":1200,"d":"Maunula Unplugged -esiintyjähaku: \n\nHaemme alle 25-vuotiaita esiintyjiä kahteen tunnelmalliseen akustiseen iltaan Maunula-talon Metsäpurosalissa.\n\nPerjantai 29.1.2027 klo 18, illan pääesiintyjä tba\nPerjantai 19.3.2027 klo 18, illan pääesiintyjä tba\n\nTärkeintä on hyvä fiilis ja oman näköinen musiikki, joka soveltuu unplugged-tyyliseen iltaan.\n\nKokoonpanot voivat olla sooloja, duoja tai yhtyeitä. Tärkeintä on hyvä fiilis ja oman näköinen musiikki, joka soveltuu unplugged-tyyliseen iltaan.\n\nEsiintymisaika n. 45 min. Maunula-talo maksaa keikasta esiintymiskorvauksen, joka on 150€ per esiintyjä, kuitenkin maksimissaan 500€ per yhtye. \n\nTekniikka: Maunula-talossa ei ole backlinea, eli omat soittimet ja vahvistimet pitää tuoda mukana. PA-laitteisto ja ääniteknikko on talon puolesta. \n\nLisätietoa tuottajilta: \n\nrita.tuohimaa@hel.fi \n\nja \n\nami.vuorinen@hel.fi \n\n/ Maunula- uilding environment. Both English learners & native speakers are warmly welcome.\n\nUsing inspiring cultural objects, books and even music, we learn about topics like Australian Aboriginal dot painting and Mexican artist Frida Kahlo’s love for exotic animals.\nWe paint, draw, and build with quality art materials and try out fun techniques and tools.\n\nThis class is kept small & cozy to ensure a personalized and specially curated experience–each child gets plenty of attention. Kids help plan our future travels by suggesting destinations they are curious about exploring. Finnish is used as necessary.\n\nLet’s see where in the world our artful trip takes us!\n\n*Rushan of Seed Art Studio is a native Californian and TEFL certified instructor with over 25 years of experience nurturing children’s creativity\n\nFall term 450€\nSpring term 500€\n\nRegister for the autumn and spring semesters on Seed Art Studio's website by August 13, 2026: https://www.seedartstudio.com/classes-at-annantalo.html","df":"Ota passi ja seikkailumieli mukaan! Lähdemme unohtumattomalle matkalle ympäri maailma luomaan upeaa taidetta eri kulttuurien ja kiehtovien maisemien inspiroimina. Samalla opimme & harjoittelemme englantia lämpimässä ja itseluottamusta vahvistavassa ympäristössä. Sekä englannin kielen oppijat että sitä äidinkielenään puhuvat ovat tervetulleita.\n\nKulttuuriesineiden, kirjojen ja musiikin avulla opimme aiheista, kuten Australian aboriginaalien pistemaalauksesta ja meksikolaisen taiteilijan Frida Kahlon rakkaudesta eksoottisiin eläimiin.\n\nMaalaamme, piirrämme ja luomme laadukkailla taidemateriaaleilla ja kokeilemme hauskoja tekniikoita.\n\nRyhmä pidetään pienenä ja viihtyisänä, jotta jokainen lapsi saa yksilöllistä huomiota. Lapset auttavat suunnittelemaan matkoja ehdottamalla kohteita, joita he ovat kiinnostuneita tutkimaan. Suomea käytetään tarvittaessa.\n\nKatsotaan, minne taiteellinen matkamme vie – tule mukaan!\n\n*Rushan Seed Art Studiosta on Kaliforniasta kotoisin ja TEFL-sertifioitu opettaja, jolla on yli 25 vuoden kokemus lasten luovuuden tukemisesta.\n\nSyyslukukausi 450€\nKevätlukukausi 500€\n\nIlmoittaudu sekä syys- että kevätlukukaudelle Seed Art Studion verkkosivujen kautta viimeistään 13.08.2026 https://www.seedartstudio.com/classes-at-annantalo.html","c":"Visual arts","cs":["Kuvataide","Kurssit","Annantalo","Suomi","Ruotsi","Englanti"],"img":"","u":"http://www.annantalo.fi/fi/tapahtumat/event/54A5AED6BD7F15140C619D9D5069D008/Seed_Art_Studio_Taide_ympari_maailmaa_taidetta_englanniksi_","ue":"http://www.annantalo.fi/en/events/event/54A5AED6BD7F15140C619D9D5069D008/Seed_Art_Studio_Taide_ympari_maailmaa_taidetta_englanniksi_Art_Around_the_World_Art_in_English_","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:68430","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agqdqiuixu","t":"Taideperformanssi: Yliaktiivinen Televisio","te":"Art performance: Overactiv Television","v":"Kauppakeskus Citycenter","ve":"Shopping centre Citycenter","a":"Kaivokatu 8, Makkaratalo","la":60.16995,"ln":24.94232,"s":720,"e":1200,"d":"An art performance in which a man carries a television into and across a public space. The video art and the digital art graphics displayed on the TV screen suggest that this time, after all, it might not be an advertisement display or a social movement.\n\nCentre of Helsinki\n\n20.8.-2.10.2026\n\nFree admission","df":"Taideperformanssi, jossa mies kantaa televisiota julkiseen tilaan ja julkisen tilan halki. Televisioruudusta esille tuleva videotaide ja digitaalinen taidegrafiikka antaa ymmärtää ettei kyseessä taida sittenkään olla tällä kertaa mainosruutu tai kansanliike. \n\nHelsingin keskusta\n\n20.8.-2.10.2026\n\nVapaa pääsy","c":"Visual arts","cs":["art","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/mo26_myhelsinki_esite.jpg","u":"https://www.terotakala.com/mo26.html","ue":"https://www.terotakala.com/mo26.html","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agqdqiuixu","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agp7bla6fu","t":"The World Has Already Ended So Many Times","te":"The World Has Already Ended So Many Times","v":"The Blue Verve","ve":"The Blue Verve","a":"Neitsytpolku 8","la":60.15774,"ln":24.94923,"s":720,"e":1200,"d":"“The World Has Already Ended So Many Times” takes us back six years to the summer of 2020, when the world came to a standstill. \n\nIn a time shaped by pandemic, fear and isolation, Helsinki’s youth found moments of connection and hope in underground raves held in forests and along the shorelines. \n\nThrough mixed media, textiles, ceramics, light, sound and video, the exhibition rebuilds a piece of that world within The Blue Verve, exploring how communities reinvent togetherness in times of uncertainty.\n\nThe Blue Verve\n\n20.-30.8.2026\n\nTue-Sat 14.00-18.00\n\nSun 13.00-17.00 \n\nFree entry","df":"Kenen?Collectiven näyttely vie katsojat kuusi vuotta taaksepäin kesään 2020, jolloin maailma pysähtyi ja tuntui loppuvan pandemian aikaan.\n\n“The World Has Already Ended So Many Times” (suom. ”Maailma on jo päättynyt niin monta kertaa”) vie meidät takaisin kuuden vuoden takaiseen kesään 2020, jolloin maailma pysähtyi. \n\nPandemian, pelon ja eristyneisyyden leimaamana aikana Helsingin nuoret löysivät yhteyden ja toivon hetkiä metsissä ja rannoilla järjestetyistä underground-reiveistä. \n\nSekatekniikan, tekstiilien, keramiikan, valon, äänen ja videoteosten avulla näyttely rakentaa The Blue Verveen palan tuosta maailmasta ja tarkastelee sitä, kuinka yhteisöt luovat yhdessä uudenlaisia tapoja olla yhteydessä toisiinsa epävarmoina aikoina.\n\nThe Blue Verve\n\n20.-30.8.2026\n\nTi-la 14.00-18.00\n\nSu 13.00-17.00 \n\nVapaa pääsy","c":"Visual arts","cs":["fine arts","art","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/Screenshot_2026-08-11_at_14.42.57.png","u":"https://www.theblueverve.com/","ue":"https://www.theblueverve.com/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agp7bla6fu","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpzfvf6ru","t":"Daniel Kruger: Tulevaisuuden palasia","te":"Daniel Kruger: Fragments of the Future","v":"Galleria GAo ShAn","ve":"Gallery GAo ShAn","a":"Snellmaninkatu 15","la":60.17207,"ln":24.95355,"s":720,"e":1200,"d":"The first solo exhibition in Helsinki by internationally acclaimed South African-born artist Daniel Kruger (b. 1951) presents his distinctive jewellery and ceramic works. Kruger’s art brings together influences from his upbringing in South Africa and Namibia with decades of working in Germany – creating a dialogue between nature and culture, history and the present, and the precious and the everyday.\n\nKruger is known for his fearless combinations of materials and techniques. Precious metals, gemstones and pearls may appear alongside glass, paper, textiles, pigments and found objects. His sculptural jewellery is at once made to adorn the body, to be touched and handled, and to exist as an autonomous work of art. In his ceramics, history, ornament and contemporary culture often take on unexpected and playful forms.\n\nFragments of the Future explores memory, material and the layers of time. For Kruger, the past is not a closed archive but a living reservoir from which objects, forms and memories can enter new contexts and move towards the future. The exhibition invites us to look at familiar materials and objects from a new perspective – with sensuality, curiosity and an open mind.\n\nGallery GAo ShAn\n21.8.-24.10.2026\n\nTue-Fri 12.00-18.00\nSat 12.00-16.00\n\nFree entry","df":"Krugerin teoksissa kohtaavat Etelä-Afrikassa ja Namibiassa vietetyn nuoruuden vaikutteet sekä vuosikymmenten työskentely Saksassa – luonnon ja kulttuurin, historian ja nykyhetken, arvokkaan ja arkisen välinen vuoropuhelu.\n\nKruger tunnetaan ennakkoluulottomasta materiaalien ja tekniikoiden yhdistelystä. Jalometallit, jalokivet ja helmet voivat saada rinnalleen lasia, paperia, tekstiilejä, pigmenttejä ja löydettyjä esineitä. Hänen veistokselliset korunsa ovat samanaikaisesti kehoa koristavia, kosketeltavia esineitä ja itsenäisiä taideteoksia, kun taas keramiikassa historia, ornamentti ja nykykulttuuri saavat usein yllättäviä ja leikkisiä muotoja.\n\nTulevaisuuden palasia -näyttely tarkastelee muistia, materiaalia ja ajan kerrostumia. Krugerille menneisyys ei ole suljettu arkisto vaan elävä varanto, josta esineet, muodot ja muistot voivat siirtyä uusiin yhteyksiin ja kohti tulevaisuutta. Näyttely kutsuu katsomaan tuttuja materiaaleja ja esineitä uudesta näkökulmasta – aistillisesti, uteliaasti ja ennakkoluulottomasti.\n\nGalleria GAo ShAn\n21.8.-24.10.2026\n\nti-pe 12.00-18.00\nla 12.00-16.00\n\nVapaa pääsy","c":"Visual arts","cs":["art","cultural events","exhibitions","art exhibitions"],"img":"https://api.hel.fi/linkedevents/media/images/daniel_exhibition_2.jpg","u":"https://www.gaoshanhelsinki.com/","ue":"https://www.gaoshanhelsinki.com/","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpzfvf6ru","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"helsinki:agpw64aggq","t":"Joutsenlampi","te":"Swan Lake","v":"Suomen kansallisooppera ja -baletti","ve":"Finnish National Opera and Ballet","a":"Helsinginkatu 58","la":60.18161,"ln":24.92971,"s":720,"e":1200,"d":"Swan Lake is the world’s most famous ballet, which combined Tchaikovsky’s magnificent music with a visual world of iconic beauty. \n\nIt also has a long history at the Finnish National Ballet, where it was performed as its first production a hundred years ago. \n\nDavid McAllister’s new version, commissioned for the centenary of the Finnish National Ballet in 2022, honours the rich tradition of the ballet.\n\nFinnish National Opera and Ballet\n\n21.8.-11.9.2026\n\nPerformances:\n\n21.8. / 22.8. / 25.8. / 27.8. at 19.00\n\n29.8. at 14.00 & 19.00\n\n1.9. / 3.9. / 5.9. / 9.9. / 11.9. at 19.00\n\nTickets 31-130€, duration 2 h 45 min, age recommendation 7+","df":"Pelätty velho Rothbart on taikonut kaukaisen maan prinsessa Odetten joutseneksi. Prinssi Siegfried kohtaa lammella joutsenparven ja Odetten, johon hän ihastuu. Pystyykö prinssi purkamaan taian vai saako Rothbart juonittua Odetten ikuiseen kiroukseen?\n\nJoutsenlampi on maailman kuuluisin baletti, jossa yhdistyvät Tšaikovskin loistelias musiikki ja ikonisen kaunis visuaalinen maailma. \n\nTeoksella on pitkä historia myös Suomen kansallisbaletissa, joka esitti sen ensimmäisenä teoksenaan vuonna 1922. Kansallisbaletin 100-vuotisjuhlavuonna 2022 ensi-iltansa saanut David McAllisterin uusi versio kunnioittaa teoksen pitkiä perinteitä.\n\nSuomen kansallisooppera ja -baletti\n\n21.8.-11.9.2026\n\nEsitykset:\n\n21.8. / 22.8. / 25.8. / 27.8. klo 19.00\n\n29.8. klo 14.00 & 19.00\n\n1.9. / 3.9. / 5.9. / 9.9. / 11.9. klo 19.00\n\nLiput 31-130€, kesto 2 h 45 min, ikäsuositus 7+","c":"Dance","cs":["ballet (art forms)","dance (performing arts)","music","cultural events"],"img":"https://api.hel.fi/linkedevents/media/images/_DSC8605_1.jpg","u":"https://oopperabaletti.fi/ohjelmisto/joutsenlampi/","ue":"https://oopperabaletti.fi/sv/repertoar/svansjon/","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"helsinki:agpw64aggq","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"espoo_le:agp5ocopra","t":"Sukellus itämereen","te":"A Dive into the Baltic Sea","v":"Ison Omenan kirjasto","ve":"Iso Omena Library","a":"Suomenlahdentie 1","la":60.16007,"ln":24.74019,"s":720,"e":1200,"d":"In the library's Vox space, you can dive into a virtual Baltic Sea using a tablet and explore the organisms that live there. The event is part of the Baltic Sea Day celebrations.\n\nWelcome!","df":"Kirjaston Vox-tilassa voit sukeltaa itämereen virtuaalisesti tabletin avulla ja tutkia merestä löytyviä eliöitä. Tapahtuma on osa itämeripäivän viettoa. \n\nTervetuloa!","c":"Participate","cs":["Matinkylä","Finnoo","Olari","Suurpelto","Niittykumpu","Haukilahti"],"img":"https://tapahtumasyotto.espoo.fi/media/images/5015adf8-e448-4d42-abf0-329cad2decaf.png","u":"https://tapahtumat.hel.fi/fi/events/espoo_le:agp5ocopra","ue":"https://tapahtumat.hel.fi/en/events/espoo_le:agp5ocopra","price":"free","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":1,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"espoo_le:agp5ocopra","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:68399","t":"Sydkustens ordkonstskola: Gestaltningsgänget - 9-10-vuotiaat, 2016-2017 syntyneet","te":"Sydkustens ordkonstskola: Gestaltningsgänget - 9-10-year-olds, born 2016-2017","v":"Annantalo","ve":"Annantalo Arts Centre","a":"Annankatu 30","la":60.16785,"ln":24.93472,"s":720,"e":1200,"d":"Do you like to work magic with text? Do you enjoy crafting exciting prose? Is your imagination overflowing? Did you answer yes to the questions? Then creative writing is for you!\n\nSydkustens ordkonstskola arranges creative writing as basic arts education according to the advanced syllabus. During lessons, you get to create your own stories and produce poetry, prose, and drama. You'll receive support for your creative ideas, feedback on your texts, and get to develop at your own pace. The teaching follows the school’s curriculum, which can be found at ordkonst.fi. The language of instruction is Swedish.\n\n​The groups have 14 lessons during the autumn semester and 16 lessons during the spring semester. The fee is 140 €/semester for 60-minute lessons and 180 €/semester for 90-minute lessons. An optional literature course is included in the fee. Registration opens April 27, 2026, at sydkusten.eepos.fi.","df":"Tykkäätkö leikkiä kielellä? Luotko mielelläsi jännittäviä tekstejä? Kuplivatko sinussa tarinat? Vastasitko kysymyksiin myöntävästi? Silloin sanataide on sinulle!\n\nSydkustens ordkonstskola järjestää sanataidetta laaja oppimäärän mukaisena taiteen perusopetuksena. Tunneilla saat keksiä omia tarinoita, luoda ja kirjoittaa sekä runoutta, proosaa että draamaa. Saat tukea luoville ideoillesi, palautetta teksteistäsi ja mahdollisuuden kehittyä omaan tahtiisi. Opetus noudattaa sanataidekoulun opetussuunnitelmaa, joka löytyy osoitteesta ordkonst.fi. Opetuskieli ruotsi.\n\nRyhmissä on 14 oppituntia syyslukukaudella ja 16 oppituntia kevätlukukaudella. Hinta on 140 €/lukukausi 60 minuutin oppitunneille ja 180 €/lukukausi 90 minuutin oppitunneille. Hintaan sisältyy valinnainen kirjallisuuskurssi. Ilmoittautuminen avautuu 27.4.2026 osoitteessa sydkusten.eepos.fi","c":"Visual arts","cs":["Monitaide","Kurssit","Annantalo","Suomi","Ruotsi","Englanti"],"img":"","u":"http://www.annantalo.fi/fi/tapahtumat/event/D18B7782830B3204DC68C08E90C692B2/Sydkustens_ordkonstskola_Gestaltningsganget","ue":"http://www.annantalo.fi/en/events/event/D18B7782830B3204DC68C08E90C692B2/Sydkustens_ordkonstskola_Gestaltningsganget","price":"","r":0,"io":"both","x":0,"bk":0,"lim":0,"op":0,"ex":1,"rr":0,"tl":"12:00-20:00","n":0,"nn":0,"i":"kulke:68399","qe":"","qf":"","qz":"","vp":0},{"src":"le","eid":"kulke:69341","t":"UrbanApa x Stoa: movement & currents / liike ja virtaukset","te":"UrbanApa X Stoa festival","v":"Stoa","ve":"Cultural Centre Stoa","a":"Turunlinnantie 1","la":60.2121,"ln":25.07989,"s":720,"e":1200,"d":"UrbanApa returns to Stoa with the UrbanApa x Stoa festival in August.\n\nThe event will bring together the full spectrum of urban contemporary art, and at Stoa Cultural Centre, anyone can enjoy surprising, multi-artistic and playful performances by professional artists and other cultural influencers from a variety of backgrounds.\n\nThe final programme will be published in August.\n\nFree entry","df":"UrbanApa palaa Stoaan elokuussa järjestettävän UrbanApa x Stoa -festivaalin myötä.\n\nTapahtuma kokoaa yhteen urbaanin nykyta
