<style>
/* ============================================================
   TOKENS — Festarri M3 language, extended with a rank scale.
   Light is the Festarri canvas; dark is the Art Night purple.
   ============================================================ */
:root{
  --corner-xs:4px;--corner-s:6px;--corner-m:10px;--corner-l:12px;
  --corner-l-inc:14px;--corner-xl:18px;--corner-xl-inc:22px;--corner-full:999px;
  --ease-emphasized:cubic-bezier(.2,0,0,1);
  --ease-emph-decel:cubic-bezier(.05,.7,.1,1);
  --ease-emph-accel:cubic-bezier(.3,0,.8,.15);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --dur-short2:100ms;--dur-short3:150ms;--dur-short4:200ms;
  --dur-med1:250ms;--dur-med2:300ms;--dur-med4:400ms;--dur-long1:450ms;--dur-long2:500ms;
  --font:"Roboto Flex","Roboto","Helvetica Neue",Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --elev-1:0 1px 2px rgba(41,28,67,.07),0 1px 3px 1px rgba(41,28,67,.05);
  --elev-2:0 2px 6px 2px rgba(41,28,67,.09),0 1px 2px rgba(41,28,67,.10);
  --elev-3:0 -4px 24px 4px rgba(41,28,67,.14),0 2px 4px rgba(41,28,67,.10);
  --tl-h:118px;

  /* Built from five given colours: blush pop #FFB8D1, soft blossom #E4B4C2,
     thistle #E7CEE3, ghost white #E0E1E9, light cyan #DDFDFE.
     Blush pop is the most saturated of the five and light cyan is the furthest
     from it in hue, so those two carry the top two ranks and stay apart at a
     glance; thistle takes the third and ghost white the rest. Each pastel is a
     ground or a fill only — none can carry text — and is paired with an ink
     deepened from its own hue. Two category fills are derived from the family
     where five colours could not cover seven. */
  --primary:#4A5170;--on-primary:#FFFFFF;
  --primary-container:#E0E1E9;--on-primary-container:#232842;
  --surface:#FFFFFF;--on-surface:#24262F;
  --surface-container-low:#FBFBFC;--surface-container:#F4F5F8;
  --surface-container-high:#ECEDF2;--surface-container-highest:#E0E1E9;
  --on-surface-variant:#585B68;
  --outline:#9295A4;--outline-variant:#E4E5EC;
  --inverse-surface:#24262F;--inverse-on-surface:#F4F5F8;--inverse-primary:#BFC6E4;
  --scrim:#1B1D25;
  --glass:rgba(255,255,255,.92);
  --c-visual-bg:#E7CEE3;--c-visual-ink:#704D76;
  --c-music-bg:#FFB8D1;--c-music-ink:#992753;
  --c-dance-bg:#DDFDFE;--c-dance-ink:#1B6B72;
  --c-part-bg:#D9EAF5;--c-part-ink:#245A7A;
  --c-lit-bg:#E4B4C2;--c-lit-ink:#7A384B;
  --c-theatre-bg:#F5D9CE;--c-theatre-ink:#8B513D;
  --c-film-bg:#E0E1E9;--c-film-ink:#4A5170;
  --r3:#992753;--r3-bg:#FFB8D1;
  --r2:#1B6B72;--r2-bg:#DDFDFE;
  --r1:#704D76;--r1-bg:#E7CEE3;
  --r0:#5F626E;--r0-bg:#E0E1E9;
  --warn-bg:#F5D9CE;--warn-ink:#8B513D;
  --tiles:none;--map-tint:rgba(36,38,47,0);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#BFC6E4;--on-primary:#262C46;
  --primary-container:#3A4160;--on-primary-container:#E0E1E9;
  --surface:#17181E;--on-surface:#E8E9EF;
  --surface-container-low:#1C1E25;--surface-container:#22242C;
  --surface-container-high:#292C35;--surface-container-highest:#32353F;
  --on-surface-variant:#C0C2CE;
  --outline:#9295A4;--outline-variant:#353843;
  --inverse-surface:#E8E9EF;--inverse-on-surface:#22242C;--inverse-primary:#4A5170;
  --scrim:#000000;--glass:rgba(23,24,30,.88);
  --c-visual-bg:#3A2A3A;--c-visual-ink:#E7CEE3;
  --c-music-bg:#4A2032;--c-music-ink:#FFB8D1;
  --c-dance-bg:#14383C;--c-dance-ink:#DDFDFE;
  --c-part-bg:#17323D;--c-part-ink:#D9EAF5;
  --c-lit-bg:#432630;--c-lit-ink:#E4B4C2;
  --c-theatre-bg:#432F26;--c-theatre-ink:#F5D9CE;
  --c-film-bg:#2C3048;--c-film-ink:#E0E1E9;
  --r3:#FFB8D1;--r3-bg:#4A2032;
  --r2:#9FE9EC;--r2-bg:#14383C;
  --r1:#E7CEE3;--r1-bg:#3A2A3A;
  --r0:#9598A6;--r0-bg:#2B2E37;
  --warn-bg:#432F26;--warn-ink:#F5D9CE;
  --tiles:none;--map-tint:rgba(23,24,30,.18);
}}
:root[data-theme="dark"]{
  --primary:#BFC6E4;--on-primary:#262C46;
  --primary-container:#3A4160;--on-primary-container:#E0E1E9;
  --surface:#17181E;--on-surface:#E8E9EF;
  --surface-container-low:#1C1E25;--surface-container:#22242C;
  --surface-container-high:#292C35;--surface-container-highest:#32353F;
  --on-surface-variant:#C0C2CE;
  --outline:#9295A4;--outline-variant:#353843;
  --inverse-surface:#E8E9EF;--inverse-on-surface:#22242C;--inverse-primary:#4A5170;
  --scrim:#000000;--glass:rgba(23,24,30,.88);
  --c-visual-bg:#3A2A3A;--c-visual-ink:#E7CEE3;
  --c-music-bg:#4A2032;--c-music-ink:#FFB8D1;
  --c-dance-bg:#14383C;--c-dance-ink:#DDFDFE;
  --c-part-bg:#17323D;--c-part-ink:#D9EAF5;
  --c-lit-bg:#432630;--c-lit-ink:#E4B4C2;
  --c-theatre-bg:#432F26;--c-theatre-ink:#F5D9CE;
  --c-film-bg:#2C3048;--c-film-ink:#E0E1E9;
  --r3:#FFB8D1;--r3-bg:#4A2032;
  --r2:#9FE9EC;--r2-bg:#14383C;
  --r1:#E7CEE3;--r1-bg:#3A2A3A;
  --r0:#9598A6;--r0-bg:#2B2E37;
  --warn-bg:#432F26;--warn-ink:#F5D9CE;
  --tiles:none;--map-tint:rgba(23,24,30,.18);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
img{display:block;max-width:100%}

/* ============================================================
   SHELL — mobile is one column: map behind, sheet over it,
   timeline docked to the bottom. Desktop splits into rail + map.
   ============================================================ */
.app{position:fixed;inset:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr}
.mapwrap{position:relative;grid-area:1/1;overflow:hidden;background:var(--surface-container-low)}
#map{position:absolute;inset:0;z-index:0}
#map .leaflet-tile-pane{filter:var(--tiles)}
.maptint{position:absolute;inset:0;z-index:399;pointer-events:none;background:var(--map-tint)}
.leaflet-container{background:var(--surface-container-low);font-family:var(--font)}
.leaflet-control-zoom{display:none}
.leaflet-bottom{margin-bottom:0}
.leaflet-control-attribution{font-size:10px;background:var(--glass) !important;
  color:var(--on-surface-variant) !important;padding:1px 5px}
.leaflet-control-attribution a{color:var(--primary) !important}

/* ---- top chrome: one 42px row, nothing stacked on top of it ---- */
.topbar{position:absolute;z-index:500;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;
  display:flex;gap:8px;align-items:center;pointer-events:none;height:42px}
.topbar>*{pointer-events:auto}
.pillrow{flex:1 1 auto;min-width:0;display:flex;gap:8px;align-items:center;
  overflow-x:auto;scrollbar-width:none;padding:7px 2px;margin:-7px -2px;
  -webkit-mask:linear-gradient(to right,#000 calc(100% - 18px),#0000);
  mask:linear-gradient(to right,#000 calc(100% - 18px),#0000)}
.pillrow::-webkit-scrollbar{display:none}
.pill{height:42px;padding:0 14px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1);
  display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
  font:600 14px/20px var(--font);white-space:nowrap;
  transition:background var(--dur-short3),color var(--dur-short3),transform var(--dur-short4) var(--spring)}
.pill:active{transform:scale(.94)}
.pill svg{width:18px;height:18px;flex:0 0 18px}
.pill[data-active="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.pill .n{min-width:18px;height:18px;padding:0 5px;border-radius:var(--corner-full);
  background:var(--on-surface);color:var(--surface);font:700 11px/18px var(--font);text-align:center}
.pill[data-active="true"] .n{background:var(--on-primary-container);color:var(--primary-container)}
.circle-btn{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:var(--corner-full);
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1);
  display:grid;place-items:center;cursor:pointer;font:800 12px/1 var(--mono);letter-spacing:-.3px;
  transition:transform var(--dur-short4) var(--spring),background var(--dur-short2)}
.circle-btn:active{transform:scale(.9)}
.circle-btn svg{width:20px;height:20px}

/* ---- base-map switch, second row, left side, clear of everything ---- */
.mapchrome{position:absolute;z-index:500;left:12px;top:calc(62px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:8px}
/* Where Google Maps keeps it: bottom right, riding just above the sheet, so it
   stays reachable by the thumb whatever height the list is at. */
.locate{position:absolute;z-index:505;right:12px;width:44px;height:44px;
  top:calc(var(--sheet-y,60%) - 56px);
  transition:top var(--dur-long2) var(--ease-emph-decel)}
.locate svg{width:20px;height:20px}
.locate[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.locate[data-busy="1"] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* the blue dot everyone already knows */
.mypos{border-radius:50%;background:var(--primary);
  box-shadow:0 0 0 3px var(--surface),0 1px 6px rgba(0,0,0,.35)}
.seg{position:relative;display:flex;padding:3px;border-radius:var(--corner-full);
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1)}
.seg button{border:0;background:none;cursor:pointer;height:30px;padding:0 12px;
  border-radius:var(--corner-full);color:var(--on-surface-variant);
  font:600 12px/16px var(--font);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  transition:background var(--dur-short3),color var(--dur-short3)}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}

/* ---- markers ---- */
.mk{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk[data-on="0"]{display:none}
.mk .bub{border-radius:var(--corner-full);display:grid;place-items:center;
  box-shadow:var(--elev-2);border:2px solid currentColor;
  transition:transform var(--dur-med2) var(--spring)}
.mk .bub svg{width:60%;height:60%}
.mk-r3{color:var(--r3)}
.mk-r3 .bub{width:38px;height:38px;background:var(--r3-bg)}
.mk-r2{color:var(--r2)}
.mk-r2 .bub{width:29px;height:29px;background:var(--r2-bg)}
.mk-r1{color:var(--r1)}
.mk-r1 .bub{width:22px;height:22px;background:var(--r1-bg)}
.mk-r0{color:var(--r0)}
.mk-r0 .bub{width:13px;height:13px;border-width:2px;background:var(--r0-bg)}
.mk-r0 .bub svg{display:none}
/* A cluster wears the highest rank inside it, so a group holding something
   unmissable still reads as unmissable before you open it. These follow the
   rank rules so they win the size on equal specificity. */
.mk-cl .bub{width:100%;height:32px;padding:0 9px;border-radius:var(--corner-full);
  font:800 13px/1 var(--mono);color:currentColor;letter-spacing:.2px}
.mk-cl .bub svg{display:none}
.mk-cl .lab{display:none}
.mk-cl.has-plan{color:var(--primary)}
.mk-cl.has-plan .bub{background:var(--primary-container)}
.mk .lab{margin-bottom:3px;order:-1;max-width:160px;padding:2px 7px;border-radius:var(--corner-s);
  background:var(--surface);box-shadow:var(--elev-1);border:1px solid currentColor;
  color:var(--on-surface);font:700 10px/14px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-r1 .lab,.mk-r0 .lab{display:none}
#map:not([data-close="1"]) .mk-r2 .lab{display:none}
/* In the plan: the pin takes the plan's own colour and wears its stop number,
   so the route reads as 1 → 2 → 3 without opening anything. */
.mk.in-plan{color:var(--primary)}
.mk.in-plan .bub{background:var(--primary-container);
  box-shadow:var(--elev-2),0 0 0 3px var(--surface)}
.mk.in-plan .bub svg{display:none}
.mk.in-plan .bub::after{content:attr(data-n);font:800 12px/1 var(--mono)}
.mk-r0.in-plan .bub{opacity:1}
.mk-r0.in-plan .bub::after{content:none}
.mk.sel .bub{transform:scale(1.3)}
.mk.sel::after{content:"";position:absolute;left:50%;bottom:0;width:66px;height:66px;
  margin:0 0 -16px -33px;border-radius:50%;background:currentColor;opacity:.28;
  animation:ping 2.4s ease-out infinite;pointer-events:none;z-index:-1}
.mk-r3.sel{color:var(--r3)}.mk-r2.sel{color:var(--r2)}.mk-r1.sel{color:var(--r1)}
@keyframes ping{0%{transform:scale(.5);opacity:.38}70%{transform:scale(1.45);opacity:0}100%{opacity:0}}
.planline{stroke-dasharray:2 7;stroke-linecap:round}

/* Bloom motion, from design/patterns/festarri-bloom-icons.html.
   Two grades, and the choice is not taste: bi-pop is one <use> and one
   scale and goes everywhere; the six staggered petals are the hero
   moment only, which here is the detail panel's own button. Running
   six staggered animations on every row of a list is the thing that
   rule exists against. */
@keyframes bi-pop      {0%{transform:scale(.72)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes bi-fade     {from{opacity:0}to{opacity:1}}
@keyframes bi-petal-in {from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bi-centre-in{from{transform:scale(0)}to{transform:none}}
.bi--sel{transform-box:view-box;transform-origin:12px 12px;
  animation:bi-pop var(--dur-med2) var(--ease-emph-decel) both}
.bi--unsel{animation:bi-fade var(--dur-short4) var(--ease-standard) both}
.bi--bloom>g,.bi--bloom>circle{transform-box:view-box;transform-origin:12px 12px}
.bi--bloom>g{animation:bi-petal-in 400ms var(--ease-emph-decel) both}
.bi--bloom>g:nth-child(2){animation-delay:40ms}
.bi--bloom>g:nth-child(3){animation-delay:80ms}
.bi--bloom>g:nth-child(4){animation-delay:120ms}
.bi--bloom>g:nth-child(5){animation-delay:160ms}
.bi--bloom>g:nth-child(6){animation-delay:200ms}
.bi--bloom>circle{animation:bi-centre-in var(--dur-med2) var(--ease-emph-decel) 260ms both}

/* The favourite blast, ported keyframe for keyframe from Festarri's own
   (scripts/home.html): two rings, then waves of streaks, sparks and petals
   thrown out of the pressed control into a fixed layer, so nothing clips
   them and nothing reflows. Putting an event in your plan here is the same
   act as starring a festival there, so it is the same blast. */
@keyframes fp-fav-ring{
  0%{transform:scale(.2);opacity:0;border-width:12px}
  10%{opacity:.85}
  100%{transform:scale(2.9);opacity:0;border-width:1px}}
@keyframes fp-fav-spark{
  0%{transform:rotate(var(--a)) translateX(calc(var(--fs) * .1)) scale(.35);opacity:0}
  12%{opacity:1}72%{opacity:1}
  100%{transform:rotate(var(--a)) translateX(calc(var(--fs) * var(--d))) scale(.12);opacity:0}}
@keyframes fp-fav-petal{
  0%{transform:rotate(var(--a)) translateX(calc(var(--fs) * .1)) scale(.2) rotate(0deg);opacity:0}
  14%{opacity:1}70%{opacity:1}
  100%{transform:rotate(var(--a)) translateX(calc(var(--fs) * var(--d))) scale(1) rotate(300deg);opacity:0}}
.fp-blast{position:fixed;z-index:940;width:40px;height:40px;pointer-events:none}
.fp-blast i{display:block}

/* ============================================================
   TIMELINE — fixed height, three fixed rows. Nothing here wraps.
   ============================================================ */
.timeline{position:absolute;z-index:505;left:0;right:0;bottom:auto;
  top:calc(62px + env(safe-area-inset-top));
  display:flex;justify-content:flex-end;pointer-events:none;padding:0 12px}
.tl-inner{pointer-events:auto;width:100%;overflow:hidden;
  transition:box-shadow var(--dur-med2);
  background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--elev-2);
  border:1px solid var(--outline-variant);border-radius:var(--corner-xl);
  padding:6px 14px 8px}
.tl-head{display:flex;align-items:center;gap:10px;height:34px}
.tl-clock{flex:0 0 auto;border:0;background:none;padding:0 2px;cursor:pointer;
  color:inherit;font:700 24px/26px var(--mono);letter-spacing:-1.2px}
.tl-clock[data-off="1"]{color:var(--primary)}
.tl-sub{flex:1 1 auto;min-width:0;color:var(--on-surface-variant);
  font:400 12px/16px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-sub b{color:var(--on-surface);font-weight:700}
.tl-nudge{flex:0 0 auto;display:flex;gap:6px}
.tl-nudge button{width:30px;height:30px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--surface-container);display:grid;place-items:center}
.tl-nudge button svg{width:16px;height:16px}
.tl-track{position:relative;height:44px;touch-action:none;cursor:ew-resize;user-select:none;
  margin-top:2px}
#tlsvg{display:block;width:100%;height:44px}
.tl-ticks{display:flex;justify-content:space-between;height:14px;
  color:var(--on-surface-variant);font:500 10px/14px var(--mono)}
#tlReset{color:var(--primary)}
.timeline[data-collapsed="1"] #tlReset{display:none}
#tlToggle svg{transition:transform var(--dur-med2) var(--ease-emphasized)}
#tlToggle[aria-expanded="false"] svg{transform:rotate(180deg)}
/* collapsed: the card shrinks to a pill that still scrubs, and gives the list its space back */
.timeline[data-collapsed="1"] .tl-inner{width:auto;border-radius:var(--corner-full);
  padding:2px 5px 2px 13px}
/* expanded, the card takes the whole row, so what it grew next to steps aside */
.mapwrap.tl-open .mapchrome{opacity:0;pointer-events:none;transition:opacity var(--dur-short3)}
/* The list outranks the map's own controls: they sit below it and are simply
   covered as it rises, rather than floating over the thing being read. */
.mapwrap.sheet-full .mapchrome,
.mapwrap.sheet-full .locate{opacity:0;pointer-events:none}
.mapwrap .mapchrome,.mapwrap .locate{transition:opacity var(--dur-short4) var(--ease-standard)}
.timeline[data-collapsed="1"] .tl-sub,
.timeline[data-collapsed="1"] .tl-track,
.timeline[data-collapsed="1"] .tl-ticks{display:none}
.timeline[data-collapsed="1"] .tl-head{height:32px;gap:6px}
.timeline[data-collapsed="1"] .tl-clock{font-size:18px;line-height:20px}
.timeline[data-collapsed="1"] .tl-nudge button{width:26px;height:26px}
.timeline[data-collapsed="1"] .tl-nudge button svg{width:14px;height:14px}

/* ============================================================
   SHEET — the list, the detail and the plan all live here
   ============================================================ */
.sheet{position:absolute;z-index:510;left:0;right:0;top:0;height:calc(100% - var(--nav-h) - env(safe-area-inset-bottom));
  background:var(--surface);border-radius:var(--corner-xl) var(--corner-xl) 0 0;
  box-shadow:var(--elev-3);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(var(--y,62%));touch-action:none;
  transition:transform var(--dur-long2) var(--ease-emph-decel)}
.sheet.dragging{transition:none}
.grab{flex:0 0 auto;padding:0 16px 8px;cursor:grab;user-select:none}
.grab:active{cursor:grabbing}
.handle{height:22px;display:grid;place-items:center;padding-top:8px}
.handle i{width:36px;height:4px;border-radius:var(--corner-full);background:var(--outline-variant)}
.brand{display:flex;align-items:center;gap:10px;padding:0 2px 8px;
  color:var(--on-surface-variant);font:700 10px/14px var(--font);letter-spacing:1.15px;
  text-transform:uppercase}
.brand .bm{display:inline-flex;align-items:center;gap:6px;color:var(--primary)}
.brand .bm svg{width:17px;height:17px}
.brand .bt{margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  padding:2px 9px;border-radius:var(--corner-full);
  background:var(--r3-bg);color:var(--r3)}

.sheet-head{display:flex;align-items:center;gap:10px;min-height:38px}
/* peeking, the sheet is a handle and a line - so the line carries the count */
.sheet[data-peek="1"] .brand{padding-bottom:4px}
.sheet[data-peek="1"] .sheet-head b{font-size:18px;line-height:23px}
.sheet-head .ht{flex:1;min-width:0}
.sheet-head b{display:block;font:800 20px/25px var(--font);letter-spacing:-.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head span{display:block;color:var(--on-surface-variant);font:400 12px/16px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .circle-btn{background:var(--surface-container);box-shadow:none;backdrop-filter:none;
  width:38px;height:38px;flex:0 0 38px}
.searchbar{display:flex;align-items:center;gap:9px;margin-top:8px;padding:0 12px;height:46px;
  border-radius:var(--corner-full);background:var(--surface-container)}
.searchbar>svg{width:19px;height:19px;flex:0 0 19px;color:var(--on-surface-variant)}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;color:inherit;
  font:500 15px/20px var(--font)}
.searchbar input::-webkit-search-cancel-button{display:none}
.searchbar button{width:30px;height:30px;flex:0 0 30px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface-container-highest);color:var(--on-surface-variant);
  display:grid;place-items:center}
.searchbar button svg{width:15px;height:15px}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:0 14px calc(28px + var(--sheet-y,0px));scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.sbody.locked{overflow:hidden}

/* ---- list rows: image, rank badge on the image, then the facts ---- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:11px;padding:8px;cursor:pointer;text-align:left;
  border:0;width:100%;background:var(--surface-container);border-radius:var(--corner-l);
  transition:transform var(--dur-short4) var(--spring),box-shadow var(--dur-short3)}
/* The whole programme is 423 rows. Off-screen ones are skipped for layout and
   paint entirely; the remembered height keeps the scrollbar and any restored
   scroll position honest. One animation on the panel replaced 423 on the rows. */
.rows>.row{content-visibility:auto;contain-intrinsic-size:auto 97px}
.row:active{transform:scale(.985)}
.row.sel{box-shadow:inset 0 0 0 2px var(--primary)}
.row .thumb{position:relative;width:66px;height:66px;flex:0 0 66px;border-radius:var(--corner-m);
  overflow:hidden;background:var(--cat-bg);display:grid;place-items:center}
.thumb .ph{width:26px;height:26px;color:var(--cat-ink);opacity:.55}
.row .thumb img{position:absolute;inset:0}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.row .thumb .rkb{position:absolute;left:4px;top:4px;height:17px;padding:0 5px;border-radius:5px;
  background:var(--rk-ink);color:var(--surface);font:800 10px/17px var(--mono);
  display:inline-flex;align-items:center;gap:3px;box-shadow:var(--elev-1)}
.row .thumb .rkb svg{width:9px;height:9px}
.row .thumb .rkb[data-r="0"]{display:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font:700 15px/19px var(--font);letter-spacing:-.15px}
.row .txt .when{margin:3px 0 0;font:600 13px/17px var(--mono)}
.row .txt .where{margin:2px 0 0;display:flex;align-items:center;gap:6px;
  color:var(--on-surface-variant);font:400 13px/17px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--cat-ink)}
.row .fav{flex:0 0 38px;width:38px;height:38px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--cat-bg);color:var(--cat-ink);display:grid;place-items:center;
  transition:transform var(--dur-med2) var(--spring),background var(--dur-short2)}
.row .fav:active{transform:scale(.85)}
.row .fav svg{width:18px;height:18px}
.row .fav .f{display:none}
.row .fav[aria-pressed="true"]{background:var(--cat-ink);color:var(--surface)}
.row .fav[aria-pressed="true"] .f{display:block}
.row .fav[aria-pressed="true"] .o{display:none}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.bdg{padding:2px 7px;border-radius:var(--corner-xs);font:700 10px/14px var(--font);letter-spacing:.3px}
.bdg.warn{background:var(--warn-bg);color:var(--warn-ink)}
.bdg.rain{background:var(--c-dance-bg);color:var(--c-dance-ink)}
.bdg.live{background:var(--r3-bg);color:var(--r3)}
.bdg.soon{background:var(--r2-bg);color:var(--r2)}
.bdg.gone{background:var(--surface-container-highest);color:var(--on-surface-variant)}
.bdg.door{background:var(--surface-container-highest);color:var(--on-surface-variant)}
.bdg.rare{background:var(--surface-container-highest);color:var(--on-surface-variant)}
.bdg.ex{background:var(--surface-container-highest);color:var(--on-surface-variant)}
.dflags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dflag{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 10px;
  border-radius:var(--corner-full);font:700 12px/16px var(--font)}
.dflag svg{width:16px;height:16px;flex:0 0 16px}
.dflag.door{background:var(--c-part-bg);color:var(--c-part-ink)}
.dflag.rare{background:var(--c-visual-bg);color:var(--c-visual-ink)}
.bdg.sess{background:var(--surface-container-highest);color:var(--on-surface-variant);font-family:var(--mono)}

.group-h{display:flex;align-items:center;gap:8px;padding:16px 2px 8px}
.group-h.time{position:sticky;top:0;z-index:2;margin:0 -14px;padding:10px 16px 8px;
  background:linear-gradient(var(--surface) 74%,transparent)}
.group-h.time b{font:700 15px/20px var(--mono);letter-spacing:-.4px;text-transform:none;
  color:var(--on-surface)}
.group-h.time span{color:var(--on-surface-variant)}
.group-h.time.now b{color:var(--r3)}
.group-h.time.now::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--r3)}
.group-h i{width:9px;height:9px;border-radius:50%;background:var(--rk-ink)}
.group-h b{font:700 12px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.group-h span{color:var(--on-surface-variant);font:400 12px/16px var(--font)}
.empty{margin:28px 0;padding:30px 22px;text-align:center;border-radius:var(--corner-xl);
  background:var(--surface-container)}
.empty h3{margin:0 0 4px;font:700 17px/23px var(--font)}
.empty p{margin:0;color:var(--on-surface-variant);font:400 14px/20px var(--font)}

/* ---- detail ---- */
.dhero{position:relative;margin:0 -14px 14px;height:172px;overflow:hidden;
  background:var(--cat-bg);display:grid;place-items:center}
.dhero .ph{width:58px;height:58px;color:var(--cat-ink);opacity:.45}
.dhero img{position:absolute;inset:0}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhero .grad{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(11,21,24,.86),rgba(11,21,24,.15) 58%,rgba(11,21,24,0))}
.dhero:not(:has(img)) .grad{background:linear-gradient(to top,var(--cat-bg),transparent 62%)}
.dhero:not(:has(img)) .chips .chip.cat{background:var(--surface);color:var(--cat-ink)}
.dhero .chips{position:absolute;left:14px;bottom:12px;right:14px;display:flex;flex-wrap:wrap;gap:6px}
.dhero .vpnote{position:absolute;right:12px;top:10px;padding:3px 9px;border-radius:var(--corner-full);
  background:rgba(0,0,0,.46);color:#fff;font:600 10px/14px var(--font);letter-spacing:.5px;
  backdrop-filter:blur(4px)}
.chip{padding:4px 10px;border-radius:var(--corner-s);font:700 10px/14px var(--font);
  letter-spacing:.9px;text-transform:uppercase}
.chip.rank{background:var(--rk-ink);color:var(--surface)}
.chip.cat{background:var(--cat-bg);color:var(--cat-ink)}
.dtitle{margin:0;font:800 23px/28px var(--font);letter-spacing:-.6px;text-wrap:balance}
.dalt{margin:4px 0 0;color:var(--on-surface-variant);font:400 14px/20px var(--font)}
.dmeta{margin:9px 0 0;color:var(--on-surface-variant);font:400 14px/20px var(--font);
  display:flex;align-items:flex-start;gap:8px}
.dmeta svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px}
.dmeta b{color:var(--on-surface);font:700 14px/20px var(--mono)}
.why{margin:14px 0 0;padding:13px 14px;border-radius:var(--corner-l);
  background:var(--rk-bg);color:var(--on-surface)}
.why h4{margin:0 0 5px;color:var(--rk-ink);font:700 10px/14px var(--font);
  letter-spacing:1.1px;text-transform:uppercase}
.why p{margin:0;font:400 14px/21px var(--font)}
.dactions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-accent{flex:1 1 160px;height:48px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--primary-container);color:var(--on-primary-container);
  font:700 15px/20px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:border-radius var(--dur-short3) var(--spring),background var(--dur-short2)}
.btn-accent:active{border-radius:var(--corner-m)}
.btn-accent svg{width:19px;height:19px}
.btn-accent[aria-pressed="true"]{background:var(--rk-ink);color:var(--surface)}
.btn-tonal{flex:0 0 auto;height:48px;padding:0 18px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface-container);color:var(--on-surface);text-decoration:none;
  font:600 15px/20px var(--font);display:inline-flex;align-items:center;gap:8px}
.btn-tonal svg{width:18px;height:18px}
.dsec{margin-top:20px}
.dsec h3{margin:0 0 8px;color:var(--on-surface-variant);
  font:700 11px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.dsec p{margin:0;font:400 15px/23px var(--font);white-space:pre-wrap}
/* Opening an event is a forward move and going back is the same move reversed,
   so the panel travels on one axis. The photograph settles rather than appears,
   which is what says the thing you tapped is the thing that opened. */
@keyframes body-in{from{opacity:0;transform:translateX(var(--from,18px))}to{opacity:1;transform:none}}
@keyframes hero-in{from{opacity:.35;transform:scale(1.07)}to{opacity:1;transform:none}}
.sbody.entering{animation:body-in 300ms var(--ease-emph-decel) both}
.dhero img{animation:hero-in 520ms var(--ease-emph-decel) both}
.desc{position:relative;overflow:hidden;max-height:92px;
  transition:max-height var(--dur-med4) var(--ease-emphasized)}
.desc.open{max-height:6000px}
.readmore{margin-top:8px;height:38px;padding:0 14px;border:0;border-radius:var(--corner-full);
  background:var(--surface-container);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font:600 14px/20px var(--font)}
.readmore svg{width:18px;height:18px;transition:transform var(--dur-med2) var(--ease-emphasized)}
.readmore[aria-expanded="true"] svg{transform:rotate(180deg)}
.info{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.info+.info{border-top:1px solid var(--outline-variant)}
.info .ic{width:36px;height:36px;flex:0 0 36px;border-radius:var(--corner-full);
  background:var(--surface-container);display:grid;place-items:center}
.info .ic svg{width:18px;height:18px}
.info .tx{flex:1;min-width:0}
.info .tx b{display:block;font:600 14px/20px var(--font)}
.info .tx span{display:block;color:var(--on-surface-variant);font:400 13px/19px var(--font)}

/* ---- plan ---- */
.plan-item{position:relative;padding-left:26px}
.plan-item::before{content:"";position:absolute;left:11px;top:0;bottom:-8px;width:2px;
  background:var(--outline-variant)}
.plan-item:last-child::before{display:none}
.plan-item{padding-bottom:2px}
.plan-item .num{position:absolute;left:2px;top:24px;width:20px;height:20px;border-radius:50%;
  background:var(--primary);color:var(--on-primary);display:grid;place-items:center;
  font:700 11px/1 var(--mono);z-index:1}
.at{display:flex;align-items:center;gap:8px;margin:6px 0 0;padding:6px 8px 6px 12px;
  border-radius:var(--corner-full);background:var(--surface-container)}
.at .lb{color:var(--on-surface-variant);font:700 10px/14px var(--font);
  letter-spacing:.9px;text-transform:uppercase}
.at b{font:700 14px/18px var(--mono);min-width:46px;text-align:center}
.at button{width:28px;height:28px;flex:0 0 28px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface);color:var(--on-surface);
  font:700 16px/1 var(--font);display:grid;place-items:center}
.at .hint{flex:1;min-width:0;text-align:right;color:var(--on-surface-variant);
  font:500 12px/16px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at.bad{background:var(--warn-bg)}.at.bad .hint{color:var(--warn-ink);font-family:var(--font);font-weight:700}
.leg{display:flex;align-items:center;gap:7px;padding:6px 0 6px 26px;
  color:var(--on-surface-variant);font:500 12px/16px var(--font)}
.leg svg{width:14px;height:14px;flex:0 0 14px}
.leg.bad{color:var(--warn-ink)}
.share-plan{width:100%;margin-top:20px;margin-bottom:4px;background:var(--rk-bg);color:var(--rk-ink)}
.presets{display:flex;flex-direction:column;gap:8px}
.preset{display:flex;gap:11px;align-items:flex-start;padding:12px;border:0;cursor:pointer;
  text-align:left;width:100%;background:var(--surface-container);border-radius:var(--corner-l);
  transition:transform var(--dur-short4) var(--spring)}
.preset:active{transform:scale(.985)}
.preset .pi{width:34px;height:34px;flex:0 0 34px;border-radius:var(--corner-m);
  display:grid;place-items:center;background:var(--rk-bg);color:var(--rk-ink)}
.preset .pi svg{width:18px;height:18px}
.preset .pt{flex:1;min-width:0}
.preset b{display:block;font:700 15px/20px var(--font)}
.preset span{display:block;margin-top:2px;color:var(--on-surface-variant);font:400 13px/18px var(--font)}

/* ---- overlays ---- */
:root{--nav-h:64px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:530;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--outline-variant);
  display:flex;align-items:center;justify-content:space-around}
.nav-item{border:0;background:none;cursor:pointer;width:33%;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--on-surface-variant);font:600 11px/14px var(--font)}
.nav-ind{position:relative;width:56px;height:30px;border-radius:var(--corner-full);
  display:grid;place-items:center}
.nav-ind::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--primary-container);transform:scale(.4);opacity:0;
  transition:transform var(--dur-med1) var(--ease-emphasized),opacity var(--dur-short3)}
.nav-item[aria-selected="true"] .nav-ind::after{transform:none;opacity:1}
.nav-ind svg{width:22px;height:22px;position:relative;z-index:1}
.nav-item[aria-selected="true"]{color:var(--on-surface)}
.nav-item[aria-selected="true"] .nav-ind{color:var(--on-primary-container)}
.nav-ind .badge{position:absolute;top:-2px;right:8px;min-width:17px;height:17px;padding:0 5px;
  border-radius:var(--corner-full);background:var(--r3);color:var(--surface);
  font:700 10px/17px var(--mono);text-align:center;z-index:2;box-shadow:0 0 0 2px var(--surface)}
.snack{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));z-index:900;
  padding:13px 8px 13px 16px;border-radius:var(--corner-l);
  background:var(--inverse-surface);color:var(--inverse-on-surface);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font:400 14px/20px var(--font);box-shadow:var(--elev-2);
  transform:translateY(16px);opacity:0;visibility:hidden;
  transition:transform var(--dur-med2) var(--ease-emph-decel),opacity var(--dur-short4),visibility var(--dur-med2)}
.snack.show{transform:none;opacity:1;visibility:visible}
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;z-index:800;
  transition:opacity var(--dur-med2),visibility var(--dur-med2)}
.scrim.show{opacity:.4;visibility:visible}
.fsheet{position:fixed;left:0;right:0;bottom:0;z-index:810;max-height:82%;
  display:flex;flex-direction:column;background:var(--surface);
  border-radius:var(--corner-xl) var(--corner-xl) 0 0;transform:translateY(101%);
  opacity:0;visibility:hidden;pointer-events:none;box-shadow:var(--elev-3);
  transition:transform var(--dur-med4) var(--ease-emph-accel),
             opacity var(--dur-short3),visibility var(--dur-med4)}
.fsheet.show{transform:none;opacity:1;visibility:visible;pointer-events:auto;
  transition:transform var(--dur-long2) var(--ease-emph-decel),opacity var(--dur-short3)}
.fsheet.dragging{transition:none}
.fsheet .handle{cursor:grab;touch-action:none}
.fsheet .handle:active{cursor:grabbing}
.fsheet h2{margin:0;padding:8px 22px 4px;font:700 19px/25px var(--font);letter-spacing:-.4px}
.fbody{overflow-y:auto;padding:0 18px 12px;scrollbar-width:none}
.fbody::-webkit-scrollbar{display:none}
.fbody h3{margin:14px 0 9px;color:var(--on-surface-variant);
  font:700 11px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:2px}
.opt{height:40px;padding:0 15px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--surface-container);font:600 14px/20px var(--font);
  display:inline-flex;align-items:center;gap:7px;
  transition:background var(--dur-short2),color var(--dur-short2)}
.opt .ck{width:0;overflow:hidden;transition:width var(--dur-short3) var(--ease-emphasized)}
.opt .ck svg{width:15px;height:15px}
.opt>svg{width:17px;height:17px;flex:0 0 17px}
.opt[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.opt[aria-pressed="true"] .ck{width:15px}
.opt i{width:10px;height:10px;border-radius:50%;background:var(--sw,var(--outline))}
.linkrow{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 14px;
  border:0;border-radius:var(--corner-full);cursor:pointer;text-align:left;
  background:var(--surface-container);color:var(--on-surface)}
.linkrow>svg{width:17px;height:17px;flex:0 0 17px;color:var(--on-surface-variant)}
.linkrow .u{flex:1;min-width:0;display:flex;align-items:baseline;
  font:500 13px/18px var(--mono)}
.linkrow .u .p{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--on-surface-variant)}
.linkrow .u .q{flex:0 0 auto;color:var(--on-surface);font-weight:700}
.linkrow .cp{flex:0 0 auto;color:var(--primary);font:700 12px/16px var(--font);
  letter-spacing:.6px;text-transform:uppercase}
.ffoot{display:flex;gap:10px;padding:10px 18px calc(18px + env(safe-area-inset-bottom));align-items:center}
.btn-ghost{height:46px;padding:0 18px;border:0;border-radius:var(--corner-full);background:none;
  color:var(--on-surface-variant);cursor:pointer;font:600 14px/20px var(--font)}

/* ============================================================
   DESKTOP — the sheet stops being a sheet and becomes a rail
   ============================================================ */
@media (min-width:901px){
  /* The map runs the full window and the list floats over it as one card:
     the sheet is its body, the tab bar its foot. Nothing is flush to an edge,
     so the map reads as the page rather than as a panel beside the list. */
  .app{grid-template-columns:1fr}
  .mapwrap{grid-area:1/1}
  .sheet{left:16px;right:auto;top:16px;width:404px;
    height:calc(100% - 32px - var(--nav-h));
    border-radius:var(--corner-xl) var(--corner-xl) 0 0;
    border:1px solid var(--outline-variant);border-bottom:0;
    transform:none !important;touch-action:auto}
  .nav{left:16px;right:auto;bottom:16px;width:404px;height:var(--nav-h);
    padding-bottom:0;border:1px solid var(--outline-variant);
    border-radius:0 0 var(--corner-xl) var(--corner-xl);
    box-shadow:var(--elev-3);overflow:hidden}
  .grab{cursor:default;padding-top:10px}
  .handle{display:none}
  .sbody{overflow-y:auto !important;padding-bottom:16px}
  .dhero{margin-left:-14px;margin-right:-14px}
  /* everything that floats on the map clears the card's 436px column */
  .topbar{left:436px;right:24px}
  .mapchrome{left:448px}
  .timeline{left:436px;right:0;padding:0 24px;top:calc(62px + env(safe-area-inset-top))}
  .locate{top:auto;bottom:16px;right:16px}
  .snack{left:auto;right:24px;width:340px;bottom:24px}
  .fsheet{left:auto;right:24px;bottom:24px;width:410px;
    border-radius:var(--corner-xl);max-height:66%}
  .leaflet-control-zoom{display:block}
  .leaflet-top.leaflet-right{margin-top:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  /* asking for no motion usually means the device is also glad to skip these */
  .pill,.circle-btn,.seg,.tl-inner,.mk .lab{backdrop-filter:none;background:var(--surface)}
}
</style>

function regroup(){
  const on=new Set(visible().map(e=>e.i));

  EV.forEach((e,idx)=>{if(on.has(e.i)){h=(h*31+idx)|0;n++}});
  const key=[z,h,n,lang,plan.length,sel].join('|');

  const cells=new Map();
  EV.forEach(e=>{
    if(!on.has(e.i))return;
    const p=map.project([e.la,e.ln],z);
    const k=((p.x/CELL)|0)+':'+((p.y/CELL)|0);
    let g=cells.get(k);
    if(!g){g={items:[],x:0,y:0};cells.set(k,g)}

  cells.forEach((g,k)=>{
    const c=g.items.length;
    const ll=c===1?L.latLng(g.items[0].la,g.items[0].ln)
                  :map.unproject(L.point(g.x/c,g.y/c),z);

let badgeAt=new Map(),rowEls=new Map();
function badgesFor(e){
  const live=e.s<=T&&e.e>T,rain=wxAt(e.s)[2];
  const b=[];
  if(e.x)b.push(`<span class="bdg gone">${t('cancelled')}</span>`);
  if(e.nn)b.push(`<span class="bdg sess">${t('sittingBadge',{n:e.n,m:e.nn})}</span>`);
  if(live&&mode!=='now')b.push(`<span class="bdg live">${t('onNowBadge')}</span>`);
  else if(!live&&e.s>T&&e.s-T<=90)b.push(`<span class="bdg soon">${t('startsIn',{n:e.s-T})}</span>`);
  if(e.bk)b.push(`<span class="bdg warn">${t('bookingShort')}</span>`);
  else if(e.lim)b.push(`<span class="bdg warn">${t('limitedShort')}</span>`);
  if(e.ex)b.push(`<span class="bdg ex">${t('exhibition')}</span>`);
  if(e.op)b.push(`<span class="bdg door">${t('openShort')}</span>`);
  if(e.rr)b.push(`<span class="bdg rare">${t('rareShort')}</span>`);
  if(e.io==='out'&&rain>=50)b.push(`<span class="bdg rain">${t('outBadge',{p:rain})}</span>`);
  return b.join('');
}
function patchBadges(list){
  if(!rowEls.size)return;
  for(const e of list){
    const bh=badgesFor(e);
    if(badgeAt.get(e.i)===bh)continue;
    badgeAt.set(e.i,bh);
    const el=rowEls.get(e.i);if(el)el.innerHTML=bh;
  }
  const cur=Math.floor(T/60);
  const was=$('#sbody .group-h.now');if(was)was.classList.remove('now');
  const now=$(`#sbody .group-h[data-h="${cur}"]`);if(now)now.classList.add('now');
}
function indexRows(){

let listSig=null;
/* Grouped by the hour a thing starts, because that is the question being asked
   at half past three. The rank still travels with each row as its badge.
   Multi-day runs have no start of their own - 12:00 is a stand-in - so they sit
   in one group at the end instead of burying an hour under 133 of them. */
function listHTML(list){
  const timed=list.filter(e=>!e.ex).sort((a,b)=>a.s-b.s||b.r-a.r);
  const allday=list.filter(e=>e.ex).sort((a,b)=>b.r-a.r||a.te.localeCompare(b.te));
  const per=new Map();
  timed.forEach(e=>{const h=Math.floor(e.s/60);per.set(h,(per.get(h)||0)+1)});
  let out='',hour=null;
  timed.forEach(e=>{
    const h=Math.floor(e.s/60);
    if(h!==hour){
      if(hour!==null)out+='</div>';
      hour=h;
      const isNow=h===Math.floor(T/60);
      out+=`<div class="group-h time ${isNow?'now':''}" data-h="${h}"><b>${String(h%24).padStart(2,'0')}:00</b>`+
           `<span>${per.get(h)}</span></div><div class="rows">`;
    }
    out+=rowHTML(e);
  });
  if(hour!==null)out+='</div>';
  if(allday.length)
    out+=`<div class="group-h time"><b>${t('allDay')}</b><span>${allday.length}</span></div>`+
         `<div class="rows">${allday.map(rowHTML).join('')}</div>`;

function renderList(){

  $('#backBtn').hidden=true;$('#clearPlan').hidden=true;

    listSig='empty';
    $('#sbody').innerHTML=`<div class="empty"><h3>${t('nothing')}</h3><p>${t('nothingSub')}</p></div>`;return}
  /* The clock is deliberately not in this signature. Dragging it does not
     change which rows exist -- in the full list it never does -- so the DOM is
     rebuilt only when the set of rows or their order actually changes, and the
     badges are brought up to date afterwards without touching anything else.
     Hashing the ids also catches two different filters that happen to yield the

  let h=0;for(const e of list)h=(h*31+e._x)|0;

function walk(a,b){
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLa=rad(b.la-a.la),dLn=rad(b.ln-a.ln);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.la))*Math.cos(rad(b.la))*Math.sin(dLn/2)**2;
  return Math.max(2,Math.round(2*R*Math.asin(Math.sqrt(h))/75)+2);   /* 75 m/min + friction */
}
/* A stop is a visit, not the whole run of the event.
   A fixed performance ends when it ends and you plan around that.
   An open-all-evening venue is elastic: you stay until you have to leave for
   the next stop, so the only thing that can go wrong is having no time there. */
const FLEXIBLE=75;                                    /* longer than this is a venue you drop into, not a show you sit through */
function buildPlan(){
  const stops=plan.map(p=>({p,e:byId[p.i]})).filter(x=>x.e)
                  .sort((a,b)=>a.p.at-b.p.at||a.e.s-b.e.s);
  stops.forEach((v,k)=>{
    const e=v.e,next=stops[k+1];
    v.flex=(e.e-e.s)>FLEXIBLE;
    v.arrive=v.p.at;
    v.walkNext=next?walk(e,next.e):0;
    const mustLeave=next?next.p.at-v.walkNext:Infinity;
    v.depart=v.flex
      ? Math.max(v.arrive,Math.min(e.e,mustLeave===Infinity?Math.min(e.e,v.arrive+90):mustLeave))
      : e.e;
    v.stay=Math.max(0,v.depart-Math.max(v.arrive,e.s));
    v.missed=v.arrive>=e.e;
    v.early=v.arrive<e.s;
  });
  stops.forEach((v,k)=>{
    if(!k){v.walk=0;v.slack=null;return}
    const prev=stops[k-1];
    v.walk=prev.walkNext;
    v.slack=prev.flex?null:v.arrive-(prev.e.e+v.walk);   /* only a fixed show can be cut short */
  });
  return stops;
}

   throws magenta and a green "normally closed" throws green. */
function burstParts(pal){
  const rnd=(a,b)=>a+Math.random()*(b-a),parts=[];
  [[0,560],[90,620]].forEach(pair=>parts.push({
    position:'absolute',width:'100%',height:'100%',borderRadius:'50%',
    border:'3px solid currentColor',opacity:0,willChange:'transform, opacity',
    animation:`fp-fav-ring ${pair[1]}ms cubic-bezier(.12,.78,.26,1) ${pair[0]}ms forwards`}));
  const wave=(count,o)=>{
    const spread=360/count;
    for(let i=0;i<count;i++){
      const sz=rnd(o.size[0],o.size[1]);
      const st={position:'absolute',opacity:0,willChange:'transform, opacity',
        '--a':((o.offset||0)+spread*i+rnd(-spread/4,spread/4)).toFixed(1)+'deg',
        '--d':rnd(o.dist[0],o.dist[1]).toFixed(3),'--fs':'40px',
        width:'calc(40px * '+sz.toFixed(4)+(o.kind==='streak'?' * 3.4':'')+')',
        height:'calc(40px * '+sz.toFixed(4)+')',
        borderRadius:'999px',
        background:pal[Math.floor(rnd(0,pal.length))],
        animation:`fp-fav-${o.kind==='petal'?'petal':'spark'} ${o.dur}ms `+
          `cubic-bezier(.08,.72,.2,1) ${(o.delay+rnd(0,70)).toFixed(0)}ms forwards`};
      /* A lobe with one corner brought to a point: the mark's own petal at
         confetti size. The box already travels along its line, so the point
         is the trailing corner and the petals fly tip-last. */
      if(o.kind==='petal')st.borderRadius='50% 50% 50% 0';
      parts.push(st);
    }
  };
  wave(14,{dist:[1.15,1.75],size:[.045,.07],delay:0,dur:640,kind:'streak'});
  wave(10,{dist:[.75,1.15],size:[.04,.065],delay:70,dur:580,offset:14});
  wave(6,{dist:[.95,1.45],size:[.10,.16],delay:130,dur:760,offset:28,kind:'petal'});
  return parts;
}
function favBurst(host){
  if(!host)return;
  const rect=host.getBoundingClientRect();
  if(!rect.width)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cs=getComputedStyle(host);
  const pal=['--rk-ink','--cat-ink','--primary','--cat-bg','--rk-ink']
    .map(v=>cs.getPropertyValue(v).trim()).filter(Boolean);
  const layer=document.createElement('div');
  layer.className='fp-blast';layer.setAttribute('aria-hidden','true');
  layer.style.color=pal[0]||'currentColor';
  layer.style.left=(rect.left+rect.width/2-20).toFixed(1)+'px';
  layer.style.top=(rect.top+rect.height/2-20).toFixed(1)+'px';
  burstParts(pal.length?pal:['#888']).forEach(st=>{
    const el=document.createElement('i');
    Object.keys(st).forEach(k=>{
      if(k.charAt(0)==='-')el.style.setProperty(k,st[k]);else el.style[k]=st[k]});
    layer.appendChild(el)});
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(),1300);
}
let toastT=null;
function toast(msg){
  $('#snackText').textContent=msg;$('#snack').classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>$('#snack').classList.remove('show'),2400);
}
$('#backBtn').onclick=()=>{
  if(view==='detail'&&returnTo){
    const r=returnTo;returnTo=null;
    view=r.view;lastView=view;          /* not a view change, so keep the scroll */
    render();
    $('#sbody').scrollTop=r.scroll;     /* rows are a fixed height, so this lands */
    enterBody(-1);
    return;
  }
  view='list';sel=null;query='';$('#searchInput').value='';returnTo=null;render()};
$('#searchBtn').onclick=()=>{
  view='search';sel=null;render();setSnap(2);
  $('#searchInput').placeholder=t('searchPh');
  setTimeout(()=>$('#searchInput').focus(),120);
};
$('#searchInput').addEventListener('input',e=>{query=e.target.value.trim();render()});
$('#searchClear').onclick=()=>{query='';$('#searchInput').value='';render();$('#searchInput').focus()};
/* Three sections, and the rank filter follows the one you picked - Highlights
   is the same list with the floor raised, not a different list. */
function setTab(tab){
  sel=null;query='';$('#searchInput').value='';returnTo=null;
  if(tab==='plan'){view='plan'}
  else{view='list';minRank=tab==='top'?2:0}
  syncPills();render();
  if(tab==='plan'&&plan.length)fitTo(plan.map(p=>byId[p.i]));
}
$$('.nav-item').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function syncNav(){
  const tab=view==='plan'?'plan':(minRank>=2?'top':'all');
  $$('.nav-item').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  const n=$('#planN');n.hidden=!plan.length;n.textContent=plan.length;
  const on=view==='plan';
  $('.nav-item[data-tab="plan"] .nav-ind svg use')
    .setAttribute('href',on?'#i-bloom':'#i-bloom-o');
}

/* ---------------- filter sheets ---------------- */
const FILTERS={
  when:{title:()=>t('whenQ'),render:()=>`<div class="wrap">${
    [['now','onNow'],['soon','soon'],['all','all']].map(([v,k])=>
      `<button class="opt" data-when="${v}" aria-pressed="${mode===v}">
        <span class="ck"><svg><use href="#i-check"/></svg></span>${t(k)}</button>`).join('')}</div>
    ${[['now','onNow','whenNowSub'],['soon','soon','whenSoonSub'],['all','all','whenAllSub']].map(([v,k,sub])=>
      `<div class="info"><span class="ic"><svg><use href="#i-clock"/></svg></span>
       <span class="tx"><b>${t(k)}</b><span>${t(sub)}</span></span></div>`).join('')}`},
  rank:{title:()=>t('rankQ'),render:()=>`<h3>${t('rank')}</h3><div class="wrap">${
    [3,2,1,0].map(v=>`<button class="opt" data-rank="${v}" aria-pressed="${minRank===v}" style="--sw:var(--r${v})">
      <span class="ck"><svg><use href="#i-check"/></svg></span><i></i>${t('rankPill')[v]}</button>`).join('')}</div>
    <h3>${t('rankWhat')}</h3>${[3,2,1].map(r=>
      `<div class="info"><span class="ic" style="background:var(--r${r}-bg);color:var(--r${r})">
        <svg><use href="#${r>=2?'i-interested':'i-pin'}"/></svg></span>
        <span class="tx"><b>R${r} · ${t('rankGroup')[r]}</b><span>${t('rankWhy')[r]}</span></span></div>`).join('')}`},
  type:{title:()=>t('typeQ'),render:()=>`<h3>${t('showOnly')}</h3><div class="wrap">${
    Object.keys(CATV).map(c=>`<button class="opt" data-cat="${c}" aria-pressed="${cats.has(c)}" style="${cv(c)};--sw:var(--cat-ink)">
      <span class="ck"><svg><use href="#i-check"/></svg></span><i></i>${esc(catName(c))}</button>`).join('')}</div>`},
  special:{title:()=>t('specialQ'),render:()=>`<div class="wrap">
    <button class="opt" data-only="open" aria-pressed="${onlyOpen}" style="--sw:var(--c-part-ink)">
      <span class="ck"><svg><use href="#i-check"/></svg></span><i></i>${t('openDoors')}</button>
    <button class="opt" data-only="rare" aria-pressed="${onlyRare}" style="--sw:var(--c-visual-ink)">
      <span class="ck"><svg><use href="#i-check"/></svg></span><i></i>${t('rareLong')}</button></div>
    <div class="info"><span class="ic" style="background:var(--c-part-bg);color:var(--c-part-ink)">
      <svg><use href="#i-door"/></svg></span><span class="tx"><b>${t('openDoors')}</b><span>${t('openDoorsSub')}</span></span></div>
    <div class="info"><span class="ic" style="background:var(--c-visual-bg);color:var(--c-visual-ink)">
      <svg><use href="#i-petal"/></svg></span><span class="tx"><b>${t('rareLong')}</b><span>${t('rareSub')}</span></span></div>`},
  where:{title:()=>t('shelterQ'),render:()=>`<h3>${t('shelterNote')}</h3><div class="wrap">${
    [['any','anywhere'],['in','indoors'],['out','outdoors']].map(([v,k])=>
      `<button class="opt" data-shelter="${v}" aria-pressed="${shelter===v}">
        <span class="ck"><svg><use href="#i-check"/></svg></span>${t(k)}</button>`).join('')}</div>
    <h3>${t('hourly')}</h3>${WX.filter(x=>x[0]>=14&&x[0]<=27).map(x=>
      `<div class="info" style="padding:7px 0"><span class="ic" style="background:var(--c-dance-bg);color:var(--c-dance-ink)">
        <svg><use href="#i-rain"/></svg></span>
        <span class="tx"><b>${String(x[0]%24).padStart(2,'0')}:00 · ${x[2]}%</b>
        <span>${x[1]}°C · ${t('wind')} ${x[3]} km/h${x[0]===20?' · '+t('sunset'):''}</span></span></div>`).join('')}`},
  lang:{title:()=>t('language')+' · '+t('theme'),render:()=>`<div class="wrap">${
    Object.keys(STR).map(L=>`<button class="opt" data-lang="${L}" aria-pressed="${lang===L}">
      <span class="ck"><svg><use href="#i-check"/></svg></span>${STR[L].name}</button>`).join('')}</div>
    <h3>${t('theme')}</h3><div class="wrap">${
    [['light','light'],['dark','dark']].map(([v,k])=>
      `<button class="opt" data-theme="${v}" aria-pressed="${(isDark()?'dark':'light')===v}">
        <span class="ck"><svg><use href="#i-check"/></svg></span>${t(k)}</button>`).join('')}</div>
    <h3>${t('shareLink')}</h3>
    ${(()=>{const u=shareURL(false).replace(/^https?:\/\//,'');
      const cut=u.search(/(\?|\/(en|fi|zh|ch)\/?$)/i);
      const head=cut<0?u:u.slice(0,cut),tail=cut<0?'':u.slice(cut);
      return `<button class="linkrow" data-share="lang">
        <svg><use href="#i-share"/></svg>
        <span class="u"><span class="p">${esc(head)}</span><span class="q">${esc(tail)}</span></span>
        <span class="cp">${t('copyWord')}</span></button>`})()}`}
};
function openSheet(k){
  openKey=k;$('#fTitle').textContent=FILTERS[k].title();
  $('#fbody').innerHTML=FILTERS[k].render();
  $('#fsheet').classList.add('show');$('#scrim').classList.add('show');
}
function closeSheet(){
  const f=$('#fsheet');
  f.style.transform='';f.classList.remove('dragging');
  f.classList.remove('show');$('#scrim').classList.remove('show');
}
/* Every sheet in the app answers to the same downward drag, so the filter panel
   should not be the one that ignores your thumb. */
(function(){
  const f=$('#fsheet');let y0=null,dy=0,t0=0,v=0;
  const grabbable=e=>!e.target.closest('button,input,a')||e.target.closest('.handle');
  f.addEventListener('pointerdown',e=>{
    const body=$('#fbody');
    if(body.contains(e.target)&&body.scrollTop>0)return;   /* let it scroll first */
    if(!grabbable(e))return;
    y0=e.clientY;dy=0;t0=performance.now();v=0;f.classList.add('dragging');
  });
  f.addEventListener('pointermove',e=>{
    if(y0===null)return;
    const now=performance.now();
    dy=Math.max(0,e.clientY-y0);
    v=dy/Math.max(1,now-t0);
    f.style.transform=`translateY(${dy}px)`;
  });
  const end=()=>{
    if(y0===null)return;
    const far=dy>90||v>0.6;
    y0=null;f.classList.remove('dragging');
    if(far)closeSheet();else f.style.transform='';
  };
  f.addEventListener('pointerup',end);
  f.addEventListener('pointercancel',end);
})();
$$('[data-sheet]').forEach(p=>p.onclick=()=>openSheet(p.dataset.sheet));
$('#langBtn').onclick=()=>openSheet('lang');
$('#scrim').onclick=closeSheet;$('#applyBtn').onclick=closeSheet;
$('#clearSheet').onclick=()=>{
  if(openKey==='rank')minRank=0;
  if(openKey==='type')cats.clear();
  if(openKey==='where')shelter='any';
  if(openKey==='when')mode='now';
  if(openKey==='special'){onlyOpen=false;onlyRare=false}
  openSheet(openKey);syncPills();render();
};
$('#fbody').addEventListener('click',ev=>{
  const b=ev.target.closest('.opt');if(!b)return;
  if(b.dataset.rank!==undefined)minRank=+b.dataset.rank;
  if(b.dataset.cat){cats.has(b.dataset.cat)?cats.delete(b.dataset.cat):cats.add(b.dataset.cat)}
  if(b.dataset.shelter)shelter=b.dataset.shelter;
  if(b.dataset.only==='open')onlyOpen=!onlyOpen;
  if(b.dataset.only==='rare')onlyRare=!onlyRare;
  if(b.dataset.when)mode=b.dataset.when;
  if(b.dataset.lang){lang=b.dataset.lang;applyLang()}
  if(b.dataset.theme){setTheme(b.dataset.theme)}
  if(view==='detail'&&!b.dataset.lang){view='list';sel=null}
  openSheet(openKey);syncPills();render();
});
function syncPills(){
  $('#rankLbl').textContent=t('rankPill')[minRank];
  $('[data-sheet="rank"]').dataset.active=minRank>0;
  $('#whenLbl').textContent=t(mode==='now'?'onNow':mode==='soon'?'soon':'all');
  $('[data-sheet="when"]').dataset.active=mode!=='all';
  const rst=$('#tlReset');
  rst.hidden=mode==='all';
  rst.setAttribute('aria-label',t('all'));
  rst.title=t('whenAllSub');
  const ty=$('[data-sheet="type"]');ty.dataset.active=cats.size>0;
  const n=$('.n',ty);n.hidden=!cats.size;n.textContent=cats.size;
  $('[data-sheet="where"]').dataset.active=shelter!=='any';
  $('#specialLbl').textContent=t('special');
  const sp=$('[data-sheet="special"]'),spn=(onlyOpen?1:0)+(onlyRare?1:0);
  sp.dataset.active=spn>0;
  const spb=$('.n',sp);spb.hidden=!spn;spb.textContent=spn;
  $('#themeLbl').textContent=t(isDark()?'dark':'light');
  $('#themeIcon').innerHTML=`<use href="#${isDark()?'i-moon':'i-sun'}"/>`;
}
$('#themePill').onclick=()=>setTheme(isDark()?'light':'dark');
function setTheme(v){
  document.documentElement.setAttribute('data-theme',v);
  try{localStorage.setItem('ty26theme',v)}catch(e){}
  applyBase();syncPills();if(tlOpen)drawTimeline();
}

/* ---------------- sheet drag (mobile only) ---------------- */
const sheet=$('#sheet'),grab=$('#grab'),sbody=$('#sbody');
let snaps=[],snapIdx=1,dragging=false,startY=0,startTop=0,lastY=0,lastT=0,vel=0;
const mobile=()=>window.matchMedia('(max-width:900px)').matches;
function calcSnaps(){
  const h=window.innerHeight-parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue('--nav-h'),10)-(window.visualViewport?0:0);
  snaps=[Math.max(180,h-124),Math.round(h*0.42),72];
}
function setSnap(i,animate=true){
  if(!mobile()){sbody.classList.remove('locked');
    document.documentElement.style.setProperty('--sheet-y','0px');return}
  calcSnaps();snapIdx=Math.max(0,Math.min(2,i));
  sheet.classList.toggle('dragging',!animate);
  sheet.style.setProperty('--y',snaps[snapIdx]+'px');
  sheet.dataset.peek=snapIdx===0?'1':'0';
  $('.mapwrap').classList.toggle('sheet-full',snapIdx===2);
  document.documentElement.style.setProperty('--sheet-y',snaps[snapIdx]+'px');
  sbody.classList.toggle('locked',snapIdx===0);
  if(!animate)requestAnimationFrame(()=>sheet.classList.remove('dragging'));
}
grab.addEventListener('pointerdown',e=>{
  if(!mobile()||e.target.closest('button,input,.searchbar'))return;
  calcSnaps();dragging=true;sheet.classList.add('dragging');
  startY=e.clientY;startTop=parseFloat(sheet.style.getPropertyValue('--y'))||snaps[1];
  lastY=e.clientY;lastT=performance.now();vel=0;grab.setPointerCapture?.(e.pointerId)});
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const now=performance.now();vel=(e.clientY-lastY)/Math.max(1,now-lastT);
  lastY=e.clientY;lastT=now;
  sheet.style.setProperty('--y',Math.max(snaps[2]-16,Math.min(snaps[0]+70,startTop+e.clientY-startY))+'px');
  e.preventDefault()},{passive:false});
function endDrag(){
  if(!dragging)return;dragging=false;sheet.classList.remove('dragging');
  const y=parseFloat(sheet.style.getPropertyValue('--y'));
  let target;
  if(vel<-0.55)target=snapIdx===0?1:2;
  else if(vel>0.55)target=snapIdx===2?1:0;
  else target=snaps.indexOf(snaps.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a));
  setSnap(target);
}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
grab.addEventListener('click',e=>{
  if(!e.target.closest('button')&&Math.abs(vel)<.05&&snapIdx<2)setSnap(snapIdx+1)});
sbody.addEventListener('pointerdown',e=>{sbody.dataset.top=sbody.scrollTop<=0?e.clientY:''});
sbody.addEventListener('pointermove',e=>{
  if(sbody.dataset.top&&e.clientY-(+sbody.dataset.top)>26&&snapIdx===2){sbody.dataset.top='';setSnap(1)}});
sbody.addEventListener('pointerup',()=>sbody.dataset.top='');
window.addEventListener('resize',()=>{measureChrome();setSnap(snapIdx)});

/* ---------------- boot ---------------- */
try{const th=localStorage.getItem('ty26theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
if(urlPlan)view='plan';   /* look at it; the first edit is what adopts it */
applyBase();applyLang();setTimeline(tlOpen,false);setSnap(1,false);render();
map.whenReady(()=>setTimeout(()=>{
  map.invalidateSize();syncMarkers();
  /* somebody else's evening arrives framed, so the list and the map agree */
  if(urlPlan&&plan.length){calcSnaps();fitTo(plan.map(p=>byId[p.i]))}
},80));
map.on('zoomend moveend',syncMarkers);
</script>
